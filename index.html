ction": "强化周训练 · 教材 p.94-96", "def": "① 位错密度是单位体积内位错线的总长度，单位为m-2；变形中既有位错逸出或湮灭，也有新位错形成，净变化取决于二者竞争。\n② 在切应力作用下，两端固定的位错段逐渐弓出并向外扩展；绕回的部分相遇后可形成一个脱离原段的闭合位错环。\n③ 原固定段恢复后可再次弓出，循环产生新位错环。当增殖超过消失时，总位错线长度增加，所以强烈冷变形后的密度通常显著高于充分退火状态。 p.94-96。", "keyPoints": "① 位错密度是单位体积内位错线的总长度，单位为m-2；变形中既有位错逸出或湮灭，也有新位错形成，净变化取决于二者竞争；② 在切应力作用下，两端固定的位错段逐渐弓出并向外扩展；绕回的部分相遇后可形成一个脱离原段的闭合位错环；③ 原固定段恢复后可再次弓出，循环产生新位错环。当增殖超过消失时，总位错线长度增加，所以强烈冷变形后的密度通常显著高于充分退火状态。 p.94-96", "mnemonic": "【冲刺抓手】围绕“位错增殖与变形过程”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_16", "num": "QH-16", "chapter": "ch_qianghua", "name": "QH-16 晶界结构与界面能比较", "title": "晶界结构与界面能比较", "section": "强化周训练 · 教材 p.99-107", "def": "① 小角度对称倾转晶界可由规则排列的平行刃型位错描述；一般大角度晶界错配较大、原子排列较不规则，通常不能视为稀疏位错阵列。\n② 共格孪晶两侧具有特定镜像位向关系，界面原子匹配好、错排少，因此常有较低界面能；不能把所有大角度晶界都视为同样高能。\n③ 共格相界使两相晶格在界面处保持对应，减少键合失配；但点阵间距不完全相同时，邻近区域需发生弹性伸缩以维持共格，因而产生共格应变能。 p.99-107 第4章扩散。", "keyPoints": "① 小角度对称倾转晶界可由规则排列的平行刃型位错描述；一般大角度晶界错配较大、原子排列较不规则，通常不能视为稀疏位错阵列；② 共格孪晶两侧具有特定镜像位向关系，界面原子匹配好、错排少，因此常有较低界面能；不能把所有大角度晶界都视为同样高能；③ 共格相界使两相晶格在界面处保持对应，减少键合失配；但点阵间距不完全相同时，邻近区域需发生弹性伸缩以维持共格，因而产生共格应变能。 p.99-107 第4章扩散", "mnemonic": "【冲刺抓手】围绕“晶界结构与界面能比较”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_17", "num": "QH-17", "chapter": "ch_qianghua", "name": "QH-17 扩散机制与原子迁移", "title": "扩散机制与原子迁移", "section": "强化周训练 · 教材 p.190-191、193", "def": "① 空位扩散是正常晶格位置的原子与相邻空位交换，常见于置换溶质扩散和金属自扩散；速率受空位浓度与原子跃迁频率共同影响。\n② 间隙扩散是较小原子在相邻间隙位之间跃迁，碳、氮、氢等常通过该机制迁移，不需要先获得正常晶格位置的空位。\n③ 在许多金属中，间隙扩散可用位置较多、迁移能垒较低，因而较快；比较应限定基体、温度和具体扩散机制，不能把该趋势当作任意材料间的绝对规律。 p.190-191、193 主要参考：叶飞、刘玮书主编，化学工业出版社，2025 14 / 18 <<", "keyPoints": "① 空位扩散是正常晶格位置的原子与相邻空位交换，常见于置换溶质扩散和金属自扩散；速率受空位浓度与原子跃迁频率共同影响；② 间隙扩散是较小原子在相邻间隙位之间跃迁，碳、氮、氢等常通过该机制迁移，不需要先获得正常晶格位置的空位；③ 在许多金属中，间隙扩散可用位置较多、迁移能垒较低，因而较快；比较应限定基体、温度和具体扩散机制，不能把该趋势当作任意材料间的绝对规律。 p.190-191、193 主要参考：叶飞、刘玮书主编，化学工业出版社，2025 14 / 18 <<", "mnemonic": "【冲刺抓手】围绕“扩散机制与原子迁移”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall" “物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_21", "num": "QH-21", "chapter": "ch_qianghua", "name": "QH-21 力学指标的联合判断", "title": "力学指标的联合判断", "section": "强化周训练 · 教材 p.114-119、136-137、152-153", "def": "① 弹性模量为线弹性段斜率；屈服强度反映开始明显塑性变形的应力，无明显屈服点时可用规定塑性延伸强度。\n② 静态拉伸韧性可由曲线至断裂点下的面积表征，取决于整个吸能过程，不能仅看屈服应力。\n③ 初始斜率近似不变，说明材料弹性模量基本不变；强度虽升高，塑性却下降，是否更韧须比较两条完整曲线的面积。 p.114-119、136-137、152-153 第5章材料力学性能（续）。", "keyPoints": "① 弹性模量为线弹性段斜率；屈服强度反映开始明显塑性变形的应力，无明显屈服点时可用规定塑性延伸强度；② 静态拉伸韧性可由曲线至断裂点下的面积表征，取决于整个吸能过程，不能仅看屈服应力；③ 初始斜率近似不变，说明材料弹性模量基本不变；强度虽升高，塑性却下降，是否更韧须比较两条完整曲线的面积。 p.114-119、136-137、152-153 第5章材料力学性能（续）", "mnemonic": "【冲刺抓手】围绕“力学指标的联合判断”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_22", "num": "QH-22", "chapter": "ch_qianghua", "name": "QH-22 颈缩前后的应力判断", "title": "颈缩前后的应力判断", "section": "强化周训练 · 教材 p.117、119-120", "def": "① 工程应力以原始截面积计算，真应力以瞬时实际截面积计算。颈缩后载荷下降使工程应力降低，而局部截面积减小得更快时，平均真应力仍可升高。\n② 在均匀单轴变形、体积近似不变时，可用σT=σ(1+ε) 及εT=ln(1+ε)。\n③ 颈缩后变形不均匀，不能直接用整体工程应变作上述换算；应测局部截面积和变形，且F/A仅给出截面平均轴向应力。 p.117、119-120。", "keyPoints": "① 工程应力以原始截面积计算，真应力以瞬时实际截面积计算。颈缩后载荷下降使工程应力降低，而局部截面积减小得更快时，平均真应力仍可升高；② 在均匀单轴变形、体积近似不变时，可用σT=σ(1+ε) 及εT=ln(1+ε)；③ 颈缩后变形不均匀，不能直接用整体工程应变作上述换算；应测局部截面积和变形，且F/A仅给出截面平均轴向应力。 p.117、119-120", "mnemonic": "【冲刺抓手】围绕“颈缩前后的应力判断”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_23", "num": "QH-23", "chapter": "ch_qianghua", "name": "QH-23 屈服平台与规定强度", "title": "屈服平台与规定强度", "section": "强化周训练 · 教材 p.81、117、151-153", "def": "① 碳、氮等间隙原子在位错附近偏聚，可形成钉扎作用；初始位错挣脱障碍需较高应力，出现上屈服点。\n② 位错解钉并增殖后，继续塑性变形所需应力降低，出现下屈服点；局部塑性区扩展，使试样在近恒定应力下继续伸长。\n③ 无明显屈服平台时，常以0.2%规定塑性延伸强度表示：作与弹性段平行、沿应变轴偏移0.002的直线，其与曲线交点对应应力即为该指标。 p.81、117、151-153。", "keyPoints": "① 碳、氮等间隙原子在位错附近偏聚，可形成钉扎作用；初始位错挣脱障碍需较高应力，出现上屈服点；② 位错解钉并增殖后，继续塑性变形所需应力降低，出现下屈服点；局部塑性区扩展，使试样在近恒定应力下继续伸长；③ 无明显屈服平台时，常以0.2%规定塑性延伸强度表示：作与弹性段平行、沿应变轴偏移0.002的直线，其与曲线交点对应应力即为该指标。 p.81、117、151-153", "mnemonic": "【冲刺抓手】围绕“屈服平台与规定强度”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_24", "num": "QH-24", "chapter": "ch_qianghua", "name": "QH-24 弹性拉伸与尺寸变化", "title": "弹性拉伸与尺寸变化", "section": "强化周训练 · 教材 p.110-111、114-115、119、136、145", "def": "① 轴向应变εz=σ/E，横向应变εx=εy=-νεz；普通正泊松比金属受拉时伸长、直径减小。尺寸变化分别由相应应变乘以初始尺寸求得。\n② 小应变体积应变近似为三个正应变之和，即 ΔV/V≈(1-2ν)σ/E；在不可压缩极限ν趋于0.5时，体积应变才趋于零。\n③ 金属塑性流动常作近似不可压缩处理，但弹性变形涉及原子间距变化，不能因此认定其体积也不变。", "keyPoints": "① 轴向应变εz=σ/E，横向应变εx=εy=-νεz；普通正泊松比金属受拉时伸长、直径减小。尺寸变化分别由相应应变乘以初始尺寸求得；② 小应变体积应变近似为三个正应变之和，即 ΔV/V≈(1-2ν)σ/E；在不可压缩极限ν趋于0.5时，体积应变才趋于零；③ 金属塑性流动常作近似不可压缩处理，但弹性变形涉及原子间距变化，不能因此认定其体积也不变。 p.110-111、114-115、119、136、145 第6章变形及增强机理", "mnemonic": "【冲刺抓手】围绕“弹性拉伸与尺寸变化”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_25", "num": "QH-25", "chapter": "ch_qianghua", "name": "QH-25 晶体取向与滑移启动", "title": "晶体取向与滑移启动", "section": "强化周训练 · 教材 p.139-140", "def": "① 滑移由滑移面内、沿滑移方向的分切应力驱动。单轴拉伸时τ=σcosφcosλ，φ为拉伸轴与滑移面法线夹角，λ为其与滑移方向夹角。\n② 在施密特定律适用条件下，某滑移系的分切应力绝对值达到τc时启动；同一τc下，取向因子绝对值越大，所需轴向屈服应力越低。\n③ 等价且τc相同的滑移系中，分切应力大小最大的先启动；因子绝对值上限为0.5，对应两个夹角均为45°。 p.139-140。", "keyPoints": "① 滑移由滑移面内、沿滑移方向的分切应力驱动。单轴拉伸时τ=σcosφcosλ，φ为拉伸轴与滑移面法线夹角，λ为其与滑移方向夹角；② 在施密特定律适用条件下，某滑移系的分切应力绝对值达到τc时启动；同一τc下，取向因子绝对值越大，所需轴向屈服应力越低；③ 等价且τc相同的滑移系中，分切应力大小最大的先启动；因子绝对值上限为0.5，对应两个夹角均为45°。 p.139-140", "mnemonic": "【冲刺抓手】围绕“晶体取向与滑移启动”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_26", "num": "QH-26", "chapter": "ch_qianghua", "name": "QH-26 位错受阻与主要强化", "title": "位错受阻与主要强化", "section": "强化周训练 · 教材 p.150-157", "def": "① 固溶强化利用溶质原子引起的晶格畸变及其与位错的相互作用，提高位错运动阻力。\n② 加工硬化来自塑性变形中的位错增殖、缠结等；弥散强化来自细小第二相颗粒阻碍位错切割或绕过。\n③ 这些方法虽可提高强度、硬度，却常牺牲塑性，具体效果还取决于组织状态。粗大或沿晶界连续分布的脆性第二相甚至可能促使开裂，因此应同时评价塑性、韧性和服役条件。 p.150-157 主要参考：叶飞、刘玮书主编，化学工业出版社，2025 15 / 18 <<", "keyPoints": "① 固溶强化利用溶质原子引起的晶格畸变及其与位错的相互作用，提高位错运动阻力；② 加工 判断”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_49", "num": "QH-49", "chapter": "ch_qianghua", "name": "QH-49 耐火陶瓷与玻璃对比", "title": "耐火陶瓷与玻璃对比", "section": "强化周训练 · 教材 p.46-47", "def": "① 晶态氧化物具有长程有序结构，强离子或共价结合有利于高温稳定；普通硅酸盐玻璃为短程有序、长程无序的网络结构。\n② 玻璃受热经历黏度下降与软化，没有像纯晶体那样明确的平衡熔点；耐火陶瓷也不能仅凭高熔点判断使用温度。\n③ 炉衬需综合耐火度、荷重软化、热震及抗介质侵蚀能力；观察窗还要求透光性和热稳定性。实际选择取决于温度、载荷、介质及温差，普通玻璃不能直接替代耐火炉衬。 p.46-47 · SCHOTT玻璃资料 · RHI耐火材料。", "keyPoints": "① 晶态氧化物具有长程有序结构，强离子或共价结合有利于高温稳定；普通硅酸盐玻璃为短程有序、长程无序的网络结构；② 玻璃受热经历黏度下降与软化，没有像纯晶体那样明确的平衡熔点；耐火陶瓷也不能仅凭高熔点判断使用温度；③ 炉衬需综合耐火度、荷重软化、热震及抗介质侵蚀能力；观察窗还要求透光性和热稳定性。实际选择取决于温度、载荷、介质及温差，普通玻璃不能直接替代耐火炉衬。 p.46-47 · SCHOTT玻璃资料 · RHI耐火材料", "mnemonic": "【冲刺抓手】围绕“耐火陶瓷与玻璃对比”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_50", "num": "QH-50", "chapter": "ch_qianghua", "name": "QH-50 碳纳米纤维制备应用", "title": "碳纳米纤维制备应用", "section": "强化周训练 · 教材 叶飞·刘玮书《材料科学与工程基础》", "def": "① 先电纺PAN前驱体纳米纤维，再在含氧环境中稳定化，最后于惰性气氛中碳化；稳定化促进环化等反应，使纤维在后续热处理中保持形态。\n② 碳纳米纤维的高长径比、碳骨架及可调结构可用于导电、界面等功能改性，但效果取决于分散、取向及与基体的结合。\n③ 所指纳米纤维毡的取向、孔隙和有效承载路径与常规连续碳纤维束不同；主承力用途还需验证载荷传递、疲劳和耐久性，不能由纳米尺寸推定更强或直接替代。", "keyPoints": "① 先电纺PAN前驱体纳米纤维，再在含氧环境中稳定化，最后于惰性气氛中碳化；稳定化促进环化等反应，使纤维在后续热处理中保持形态；② 碳纳米纤维的高长径比、碳骨架及可调结构可用于导电、界面等功能改性，但效果取决于分散、取向及与基体的结合；③ 所指纳米纤维毡的取向、孔隙和有效承载路径与常规连续碳纤维束不同；主承力用途还需验证载荷传递、疲劳和耐久性，不能由纳米尺寸推定更强或直接替代。", "mnemonic": "【冲刺抓手】围绕“碳纳米纤维制备应用”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_bl_01", "num": "BL-01", "chapter": "ch_blue", "name": "BL-01 一些聚合物既可能是热塑性又可能是热固性的原因", "title": "一些聚合物既可能是热塑性又可能是热固性的原因", "section": "针对蓝皮书强化题集", "def": "某些聚合物在加工初期为线型或低交联结构，受热能软化熔融流动，表现出热塑性；在成型加工后期通过进一步加热、催化剂作用或辐射发生剧烈交联反应，形成三维不可逆交联网络，转化为热固性高分子（如热固性酚醛树脂在甲阶阶段为热塑性，经加热加压最终交联成不溶不熔的丙阶酚醛塑料）。", "keyPoints": "某些聚合物在加工初期为线型或低交联结构，受热能软化熔融流动，表现出热塑性；在成型加工后期通过进一步加热、催化剂作用或辐射发生剧烈交联反应，形成三维不可逆交联网络，转化为热固性高分子（如热固性酚醛树脂在甲阶阶段为热塑性，经加热加压最终交联成不", "mnemonic": "【真题抓手】针对蓝皮书真题“一些聚合物既可能是热塑性又可能是热固性的原因”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_02", "num": "BL-02", "chapter": "ch_blue", "name": "BL-02 对比金属和高分子的结晶态特征", "title": "对比金属和高分子的结晶态特征", "section": "针对蓝皮书强化题集", "def": "①金属：为完全结晶体系，微观以原子为单元规则排列，晶粒间通过晶界连接，结晶过程包含均匀/非均匀形核和三维长大，受过冷度控制，可获得100%结晶度。\n②高分子材料：属于部分结晶（半结晶）体系，微观以长链分子通过有序折叠形成片晶，片晶聚集成球晶，片晶之间夹杂着大量的无序无定形非晶区；结晶度通常在10%~80%之间，受链规整度、分子链柔顺性及冷却速率强烈制约。", "keyPoints": "①金属：为完全结晶体系，微观以原子为单元规则排列，晶粒间通过晶界连接，结晶过程包含均匀/非均匀形核和三维长大，受过冷度控制，可获得100%结晶度；②高分子材料：属于部分结晶（半结晶）体系，微观以长链分子通过有序折叠形成片晶，片晶聚集成球晶，片晶之间夹杂着大量的无序无定形非晶区；结晶度通常在10%~80%之间，受链规整度、分子链柔顺性及冷却速率强烈制约。", "mnemonic": "【真题抓手】针对蓝皮书真题“对比金属和高分子的结晶态特征”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_03", "num": "BL-03", "chapter": "ch_blue", "name": "BL-03 分子量、结晶度、拉拔变形及退火如何影响半结晶聚合物的拉伸模量？", "title": "分子量、结晶度、拉拔变形及退火如何影响半结晶聚合物的拉伸模量？", "section": "针对蓝皮书强化题集", "def": "①分子量增加：高分子链增长，链缠结密度增大，分子间作用力增加，拉伸模量有所提高。\n②结晶度提高：致密紧密的片晶所占比例增大，分子链紧密排布且分子间作用力强，抵抗弹性变形能力提高，拉伸模量显著增大。\n③拉拔变形（定向拉伸）：使分子链段和片晶沿拉伸方向发生高度择优取向，平行取向方向的分子主链强共价键承受载荷，显著提高该方向的拉伸模量。\n④无形变材料退火：若退火促进片晶增厚、完善晶区并提高结晶度，拉伸模量上升；若退火主要释放非晶区内应力则使材料更趋柔软。", "keyPoints": "①分子量增加：高分子链增长，链缠结密度增大，分子间作用力增加，拉伸模量有所提高；②结晶度提高：致密紧密的片晶所占比例增大，分子链紧密排布且分子间作用力强，抵抗弹性变形能力提高，拉伸模量显著增大；③拉拔变形（定向拉伸）：使分子链段和片晶沿拉伸方向发生高度择优取向，平行取向方向的分子主链强共价键承受载荷，显著提高该方向的拉伸模量；④无形变材料退火：若退火促进片晶增厚、完善晶区并提高结晶度，拉伸模量上升；若退火主要释放非晶区内应力则使材料更趋柔软。", "mnemonic": "【真题抓手】针对蓝皮书真题“分子量、结晶度、拉拔变形及退火如何影响半结晶聚合物的拉伸模量”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_04", "num": "BL-04", "chapter": "ch_blue", "name": "BL-04 为什么单晶表面能随密排面密度的增加而下降？", "title": "为什么单晶表面能随密排面密度的增加而下降？", "section": "针对蓝皮书强化题集", "def": "① 表面能的微观本质是表面原子由于处于截断状态而丢失邻近原子所产生的不饱和悬挂键能（断键能）。\n② 晶面原子面密度越大，面内原子排列越紧密，面内原子间形成的强结合键越多，而垂直于该晶面指向外侧的不饱和断键数相对越少，导致表面过剩自由能越低。\n③ 因此最密排面的表面能最低，在晶体平衡生长形态中优先暴露。", "keyPoints": "表面能的微观本质是表面原子由于处于截断状态而丢失邻近原子所产生的不饱和悬挂键能（断键能）。晶面原子面密度越大，面内原子排列越紧密，面内原子间形成的强结合键越多，而垂直于该晶面指向外侧的不饱和断键数相对越少，导致表面过剩自由能越低。因此最密排", "mnemonic": "【真题抓手】针对蓝皮书真题“为什么单晶表面能随密排面密度的增加而下降”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_05", "num": "BL-05", "chapter": "ch_blue", "name": "BL-05 综合阐述间隙原子、置换原子、位错和晶界对金属力学性能的影响", "title": "综合阐述间隙原子、置换原子、位错和晶界对金属力学性能的影响", "section": "针对蓝皮书强化题集", "def": "①间隙原子与置换原子（固溶强化）：溶质原子溶入基体引起点阵畸变并产生弹性应力场，阻碍位错滑移，提高屈服强度和硬度，但通常使塑韧性下降；间隙原子的非对称畸变强化效果大于置换原子。\n②位错：塑性变形的载体；单个位错在低密度下易于开动滑移导致屈服，但大量位错增殖、交割与缠结（加工硬化）会急剧增大运动阻力，显著提高强度而降低塑性。\n③晶界（细晶强化）：阻碍位错在晶粒间连续滑移塞积，同时分散局部应力集中并阻碍裂纹扩展，是唯一能同时提高强度和韧性的微观组织结构。", "keyPoints": "①间隙原子与置换原子（固溶强化）：溶质原子溶入基体引起点阵畸变并产生弹性应力场，阻碍位错滑移，提高屈服强度和硬度，但通常使塑韧性下降；间隙原子的非对称畸变强化效果大于置换原子；②位错：塑性变形的载体；单个位错在低密度下易于开动滑移导致屈服，但大量位错增殖、交割与缠结（加工硬化）会急剧增大运动阻力，显著提高强度而降低塑性；③晶界（细晶强化）：阻碍位错在晶粒间连续滑移塞积，同时分散局部应力集中并阻碍裂纹扩展，是唯一能同时提高强度和韧性的微观组织结构。", "mnemonic": "【真题抓手】针对蓝皮书真题“综合阐述间隙原子、置换原子、位错和晶界对金属力学性能的影响”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_06", "num": "BL-06", "chapter": "ch_blue", "name": "BL-06 金属中固态扩散与离子晶体中离子扩散哪一个更难？为什么？", "title": "金属中固态扩散与离子晶体中离子扩散哪一个更难？为什么？", "section": "针对蓝皮书强化题集", "def": "离子晶体中的离子扩散通常比金属扩散更难。原因：。\n①严格的电中性约束：离子扩散时必须同时保持晶体的电中性，空位通常以肖特基缺陷（阴阳离子空位成对）或弗仑克尔缺陷存在，不能像金属中那样单独形成单号空位；\n②强烈的静电库仑排斥力：离子在迁移跃迁穿过鞍点晶格瓶颈时，会受到同号近邻离子的强大静电排斥力，使扩散迁移活化能垒显著高于金属原子；\n③离子半径与扩散通道限制：许多阴离子（如O²⁻、S²⁻）半径较大，晶格间隙阻力巨大。", "keyPoints": "①严格的电中性约束：离子扩散时必须同时保持晶体的电中性，空位通常以肖特基缺陷（阴阳离子空位成对）或弗仑克尔缺陷存在，不能像金属中那样单独形成单号空位；②强烈的静电库仑排斥力：离子在迁移跃迁穿过鞍点晶格瓶颈时，会受到同号近邻离子的强大静电排斥力，使扩散迁移活化能垒显著高于金属原子；③离子半径与扩散通道限制：许多阴离子（如O²⁻、S²⁻）半径较大，晶格间隙阻力巨大。", "mnemonic": "【真题抓手】针对蓝皮书真题“金属中固态扩散与离子晶体中离子扩散哪一个更难为什么”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_07", "num": "BL-07", "chapter": "ch_blue", "name": "BL-07 金属材料与橡胶材料的杨氏模量在升温时各如何变化？解释微观机理", "title": "金属材料与橡胶材料的杨氏模量在升温时各如何变化？解释微观机理", "section": "针对蓝皮书强化题集", "def": "①金属材料：随温度升高，杨氏模量单调下降。微观机理：金属弹性模量取决于原子间结合键的势能曲线曲率，升温加剧晶格热振动，平均原子间距增大，原子间势阱曲率减小、结合力减弱，抵抗弹性变形刚度下降。\n②橡胶材料（橡胶弹性）：随温度升高，杨氏模量反而升高（表现出反常弹性）。微观机理：橡胶弹性本质是“熵弹性”；拉伸时卷曲的高分子链被强行拉直成取向有序态，构型熵降低，外力撤去后热运动驱使其自发恢复最大混乱度的卷曲态；温度越高，链段微布朗热运动越剧烈，回弹收缩力越大，宏观表现为拉伸模量随绝对温度 T 成正比上升。", "keyPoints": "①金属材料：随温度升高，杨氏模量单调下降。微观机理：金属弹性模量取决于原子间结合键的势能曲线曲率，升温加剧晶格热振动，平均原子间距增大，原子间势阱曲率减小、结合力减弱，抵抗弹性变形刚度下降；②橡胶材料（橡胶弹性）：随温度升高，杨氏模量反而升高（表现出反常弹性）。微观机理：橡胶弹性本质是“熵弹性”；拉伸时卷曲的高分子链被强行拉直成取向有序态，构型熵降低，外力撤去后热运动驱使其自发恢复最大混乱度的卷曲态；温度越高，链段微布朗热运动越剧烈，回弹收缩力越大，宏观表现为拉伸模量随绝对温度 T 成正比上升。", "mnemonic": "【真题抓手】针对蓝皮书真题“金属材料与橡胶材料的杨氏模量在升温时各如何变化解释微观机理”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_08", "num": "BL-08", "chapter": "ch_blue", "name": "BL-08 阐述晶态陶瓷与非晶态陶瓷的塑性变形特征及机理", "title": "阐述晶态陶瓷与非晶态陶瓷的塑性变形特征及机理", "section": "针对蓝皮书强化题集", "def": "①晶态陶瓷：室温下几乎不发生宏观塑性形变，极难滑移。离子晶体受电中性严格制约且异号离子相间排列，切应力滑移极易引发同号离子相遇排斥导致沿晶裂开；共价晶体中共价键键能极大且具有严格方向性与饱和性，位错运动的Peierls晶格阻力极高，且独立滑移系不足5个，受力时在位错开动前便发生脆性解理。\n②非晶陶瓷（玻璃）：无周期点阵和位错，其塑性变形依赖于在玻璃化转变温度 Tg 以上的高温黏性流动，黏度随温度降低指数增加，在常温下表现为纯脆性断裂。", "keyPoints": "①晶态陶瓷：室温下几乎不发生宏观塑性形变，极难滑移。离子晶体受电中性严格制约且异号离子相间排列，切应力滑移极易引发同号离子相遇排斥导致沿晶裂开；共价晶体中共价键键能极大且具有严格方向性与饱和性，位错运动的Peierls晶格阻力极高，且独立滑移系不足5个，受力时在位错开动前便发生脆性解理；②非晶陶瓷（玻璃）：无周期点阵和位错，其塑性变形依赖于在玻璃化转变温度 Tg 以上的高温黏性流动，黏度随温度降低指数增加，在常温下表现为纯脆性断裂。", "mnemonic": "【真题抓手】针对蓝皮书真题“阐述晶态陶瓷与非晶态陶瓷的塑性变形特征及机理”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_09", "num": "BL-09", "chapter": "ch_blue", "name": "BL-09 对比柯氏气团和铃木气团在金属强化中的微观机制与应用结构", "title": "对比柯氏气团和铃木气团在金属强化中的微观机制与应用结构", "section": "针对蓝皮书强化题集", "def": "①柯氏气团（Cottrell气团）：发生在体心立方（BCC）等晶体中，小尺寸间隙溶质原子（如C、N）偏聚于刃型位错的受拉膨胀区以松弛弹性应变能，强烈钉扎位错，宏观产生屈服齿、屈服平台和应变时效现象。\n②铃木气团（Suzuki气团）：发生在面心立方（FCC）等低层错能金属中，扩展位错的层错区（堆垛层错）具有与基体不同的晶体结构（类似HCP薄层），溶质原子在该层错区发生化学偏聚（化学交互作用），降低层错能，使扩展位错宽度增大、束集与交滑移阻力剧增，从而显著提高合金强度。", "keyPoints": "①柯氏气团（Cottrell气团）：发生在体心立方（BCC）等晶体中，小尺寸间隙溶质原子（如C、N）偏聚于刃型位错的受拉膨胀区以松弛弹性应变能，强烈钉扎位错，宏观产生屈服齿、屈服平台和应变时效现象；②铃木气团（Suzuki气团）：发生在面心立方（FCC）等低层错能金属中，扩展位错的层错区（堆垛层错）具有与基体不同的晶体结构（类似HCP薄层），溶质原子在该层错区发生化学偏聚（化学交互作用），降低层错能，使扩展位错宽度增大、束集与交滑移阻力剧增，从而显著提高合金强度。", "mnemonic": "【真题抓手】针对蓝皮书真题“对比柯氏气团和铃木气团在金属强化中的微观机制与应用结构”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_10", "num": "BL-10", "chapter": "ch_blue", "name": "BL-10 位错在金属晶体中运动滑移时主要受到哪些微观阻力？", "title": "位错在金属晶体中运动滑移时主要受到哪些微观阻力？", "section": "针对蓝皮书强化题集", "def": "①晶格点阵固有的摩擦阻力（Peierls-Nabarro应力，派-纳力）；\n②弹性应力场与位错交互阻力：包含林位错交割、割阶与扭折的自能阻力以及高密度位错缠结阻力（加工硬化）；\n③溶质原子弹性应力场与化学偏聚阻力（固溶强化、柯氏气团钉扎）；\n④第二相析出硬质微粒对位错切过或绕过的阻力（Orowan绕过机制与沉淀强化）；\n⑤晶界与相界的几何阻断与位错塞积阻力（细晶强化）。", "keyPoints": "①晶格点阵固有的摩擦阻力（Peierls-Nabarro应力，派-纳力）；②弹性应力场与位错交互阻力：包含林位错交割、割阶与扭折的自能阻力以及高密度位错缠结阻力（加工硬化）；③溶质原子弹性应力场与化学偏聚阻力（固溶强化、柯氏气团钉扎）；④第二相析出硬质微粒对位错切过或绕过的阻力（Orowan绕过机制与沉淀强化）；⑤晶界与相界的几何阻断与位错塞积阻力（细晶强化）。", "mnemonic": "【真题抓手】针对蓝皮书真题“位错在金属晶体中运动滑移时主要受到哪些微观阻力”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_11", "num": "BL-11", "chapter": "ch_blue", "name": "BL-11 简述提高铁碳合金强度的四大具体工程方法及其微观物理机制", "title": "简述提高铁碳合金强度的四大具体工程方法及其微观物理机制", "section": "针对蓝皮书强化题集", "def": "①淬火马氏体强化：加热至奥氏体区后快速水淬，通过切变无扩散相变形成碳在α-Fe中的过饱和固溶体（高密度位错板条马氏体或细小孪晶片状马氏体），获得极高硬度和屈服强度。\n②表面形变喷丸强化：高速弹丸轰击工件表面使表层发生强烈塑性形变，引入超高密度位错网络与细化胞状组织，并在表层形成残留压应力层，兼顾强度与疲劳极限。\n③细化奥氏体晶粒（细晶强化）：通过控轧控冷或微合金化元素（Nb、V、Ti）钉扎晶界细化晶粒，使位错滑移塞积群减小并分散应力集中，同时提升强度与冲击韧性。\n④调质热处理（索氏体沉淀强化）：淬火后高温回火，在保持铁素体基体较高韧性的同时，析出大量均匀弥散的微细球状粒状渗碳体，强烈钉扎位错。", "keyPoints": "①淬火马氏体强化：加热至奥氏体区后快速水淬，通过切变无扩散相变形成碳在α-Fe中的过饱和固溶体（高密度位错板条马氏体或细小孪晶片状马氏体），获得极高硬度和屈服强度；②表面形变喷丸强化：高速弹丸轰击工件表面使表层发生强烈塑性形变，引入超高密度位错网络与细化胞状组织，并在表层形成残留压应力层，兼顾强度与疲劳极限；③细化奥氏体晶粒（细晶强化）：通过控轧控冷或微合金化元素（Nb、V、Ti）钉扎晶界细化晶粒，使位错滑移塞积群减小并分散应力集中，同时提升强度与冲击韧性；④调质热处理（索氏体沉淀强化）：淬火后高温回火，在保持铁素体基体较高韧性的同时，析出大量均匀弥散的微细球状粒状渗碳体，强烈钉扎位错。", "mnemonic": "【真题抓手】针对蓝皮书真题“简述提高铁碳合金强度的四大具体工程方法及其微观物理机制”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_12", "num": "BL-12", "chapter": "ch_blue", "name": "BL-12 在室温下多晶陶瓷材料是否会产生应变强化（加工硬化）？为什么？", "title": "在室温下多晶陶瓷材料是否会产生应变强化（加工硬化）？为什么？", "section": "针对蓝皮书强化题集", "def": "不会。原因：应变强化（加工硬化）的前提是材料必须能够产生大量均匀的宏观塑性形变，在此过程中位错大量增殖、交割并在晶格中剧烈缠结造成滑移抗力持续升高。而在室温下，多晶陶瓷因离子键/共价键极强、滑移系严重不足（少于冯·米塞斯准则要求的5个独立滑移系），位错运动阻力极大；在受到外力时，裂纹在达到位错开动应力前便已在内部微缺 素体总是优先依附在原奥氏体晶界处形核与生长”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_20", "num": "BL-20", "chapter": "ch_blue", "name": "BL-20 解释为什么过冷奥氏体以中等冷却速度通过共析线形成细珠光体，而极缓慢冷却却形成粗珠光体？", "title": "解释为什么过冷奥氏体以中等冷却速度通过共析线形成细珠光体，而极缓慢冷却却形成粗珠光体？", "section": "针对蓝皮书强化题集", "def": "珠光体片层厚度与粗细主要取决于共析转变时的形核率 N 与长大速率 G 以及相变过冷度 ΔT：。\n①在相对极缓慢冷却时，转变过冷度 ΔT 较小，相变热力学驱动力较弱，渗碳体和铁素体的形核率 N 极低，但温度较高使碳原子扩散系数 D 极大，新相晶核易于以较宽的碳扩散层距长大，形成片层间距宽大的粗珠光体。\n②在以中等冷却速度降温时，转变过冷度 ΔT 较大，热力学形核驱动力急剧增大，形核率 N 暴增，且由于温度较低碳扩散距离受限，铁素体与渗碳体只能以极窄的侧向碳扩散波长密集交替形核长大，导致片层间距极大缩短，形成片层极其致密的细珠光体（索氏体）。", "keyPoints": "①在相对极缓慢冷却时，转变过冷度 ΔT 较小，相变热力学驱动力较弱，渗碳体和铁素体的形核率 N 极低，但温度较高使碳原子扩散系数 D 极大，新相晶核易于以较宽的碳扩散层距长大，形成片层间距宽大的粗珠光体；②在以中等冷却速度降温时，转变过冷度 ΔT 较大，热力学形核驱动力急剧增大，形核率 N 暴增，且由于温度较低碳扩散距离受限，铁素体与渗碳体只能以极窄的侧向碳扩散波长密集交替形核长大，导致片层间距极大缩短，形成片层极其致密的细珠光体（索氏体）。", "mnemonic": "【真题抓手】针对蓝皮书真题“解释为什么过冷奥氏体以中等冷却速度通过共析线形成细珠光体而极缓慢冷却却形成粗珠光体”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_21", "num": "BL-21", "chapter": "ch_blue", "name": "BL-21 为获得最佳的力学性能结合（强度与韧性），可热处理沉淀强化合金应先进行冷应变硬化还是先沉淀硬化？为什么？", "title": "为获得最佳的力学性能结合（强度与韧性），可热处理沉淀强化合金应先进行冷应变硬化还是先沉淀硬化？为什么？", "section": "针对蓝皮书强化题集", "def": "通常应采用“固溶淬火 → 适当冷应变变形 → 人工沉淀时效（沉淀硬化）”的工艺路线。原因：。\n①冷变形引入高密度位错骨架：在固溶后引入适量冷加工变形，在基体内部形成均匀弥散的高密度位错网络与缠结；\n②提供极其密集的非均匀形核点：这些位错线在后续时效加热时成为析出相的优先非均匀形核通道，大幅度降低析出相形核势垒，使强化相颗粒析出数量更多、尺寸更加超细化、空间分布更加均匀弥散；\n③避免粗化聚集：位错快速管扩散促进溶质早期脱溶，缩短达到峰值硬度所需的时效时间，有效避免晶界粗大无析出带（PFZ）产生，从而在获得极高沉淀强度的同时最大程度保留基体的延韧性。", "keyPoints": "①冷变形引入高密度位错骨架：在固溶后引入适量冷加工变形，在基体内部形成均匀弥散的高密度位错网络与缠结；②提供极其密集的非均匀形核点：这些位错线在后续时效加热时成为析出相的优先非均匀形核通道，大幅度降低析出相形核势垒，使强化相颗粒析出数量更多、尺寸更加超细化、空间分布更加均匀弥散；③避免粗化聚集：位错快速管扩散促进溶质早期脱溶，缩短达到峰值硬度所需的时效时间，有效避免晶界粗大无析出带（PFZ）产生，从而在获得极高沉淀强度的同时最大程度保留基体的延韧性。", "mnemonic": "【真题抓手】针对蓝皮书真题“为获得最佳的力学性能结合（强度与韧性）可热处理沉淀强化合金应先进行冷应变硬化还是先沉淀硬化为什么”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}, {"id": "qa_bl_22", "num": "BL-22", "chapter": "ch_blue", "name": "BL-22 在固态相变恒温形核速率—温度关系曲线中，为什么随着温度降低形核速率呈现先增大后减小的“C”形曲线？", "title": "在固态相变恒温形核速率—温度关系曲线中，为什么随着温度降低形核速率呈现先增大后减小的“C”形曲线？", "section": "针对蓝皮书强化题集", "def": "形核速率由两大关键物理驱动力的相互制约与竞争决定：I ∝ exp(-ΔG*/[kT]) · exp(-Q/[kT])。\n①热力学相变驱动力项（exp[-ΔG*/kT]）：随着温度从平衡相变点降低，过冷度增大，体积自由能差 |ΔG_v| 急剧增加，临界形核功势垒 ΔG* 与过冷度平方成反比急剧下降，促使形核速率随温度降低而暴增；\n②动力学扩散活化项（exp[-Q/kT]）：随着温度进一步降低，原子的热激活跳跃能力急剧减弱，扩散系数按阿伦尼乌斯定律指数衰减，原子越过相界迁移极其困难，抑制形核进行。在较高温度区热力学势垒下降占主导，形核率随降温剧增；在较低温度区扩散冻结阻力占主导，形核率迅速衰减，二者乘积导致形核速率随降温呈现峰值的“C”形曲线。", "keyPoints": "①热力学相变驱动力项（exp[-ΔG*/kT]）：随着温度从平衡相变点降低，过冷度增大，体积自由能差 |ΔG_v| 急剧增加，临界形核功势垒 ΔG* 与过冷度平方成反比急剧下降，促使形核速率随温度降低而暴增；②动力学扩散活化项（exp[-Q/kT]）：随着温度进一步降低，原子的热激活跳跃能力急剧减弱，扩散系数按阿伦尼乌斯定律指数衰减，原子越过相界迁移极其困难，抑制形核进行。在较高温度区热力学势垒下降占主导，形核率随降温剧增；在较低温度区扩散冻结阻力占主导，形核率迅速衰减，二者乘积导致形核速率随降温呈现峰值的“C”形曲线。", "mnemonic": "【真题抓手】针对蓝皮书真题“在固态相变恒温形核速率—温度关系曲线中为什么随着温度降低形核速率呈现先增大后减小的“C”形曲线”，牢记微观成因与机理推导", "pitfall": "【答题避坑】严格对照物理图像答题，切忌将经验现象当成普遍规律。", "freq": "蓝皮书经典简答"}]}, {"id": "mod_sustech_804", "title": "南方科技大学 804《材料科学基础》名词解释核对版", "subtitle": "叶飞、刘玮书主编教材核对版 · 408个编号条目＋14条大纲补齐与勘误", "school": "南方科技大学", "code": "804", "category": "材料类考研", "author": "官方精校题库", "coverGradient": "from-indigo-600 via-blue-600 to-cyan-500", "badge": "422词条 · 双页码核对", "defaultUnlocked": true, "chapters": [{"id": "ch1", "num": "第一章", "title": "原子结构与化学键", "bookRef": "教材第2章（正文P18–31｜30条）"}, {"id": "ch2", "num": "第二章", "title": "金属、陶瓷和高分子结构", "bookRef": "教材第3、4章（正文P32–78｜84条）"}, {"id": "ch3", "num": "第三章", "title": "固体中的缺陷", "bookRef": "教材第5章（正文P79–108｜41条）"}, {"id": "ch4", "num": "第四章", "title": "扩散", "bookRef": "教材第9章（正文P186–195｜23条）"}, {"id": "ch5", "num": "第五章", "title": "材料力学性能", "bookRef": "教材第6章（正文P110–134｜40条）"}, {"id": "ch6", "num": "第六章", "title": "变形及增强机理", "bookRef": "教材第7章（正文P136–167｜40条）"}, {"id": "ch7", "num": "第七章", "title": "失效", "bookRef": "教材第8章（正文P168–184｜35条）"}, {"id": "ch8", "num": "第八章", "title": "相图与相变", "bookRef": "教材第10、11章（正文P196–264｜77条）"}, {"id": "ch9", "num": "第九章", "title": "电学性能", "bookRef": "教材第12章（正文P266–277｜29条）"}, {"id": "ch10", "num": "第十章", "title": "材料种类、性质及应用", "bookRef": "教材分散章节（9条核实＋大纲补齐）"}, {"id": "ch_app", "num": "附录与补齐", "title": "大纲缺省补齐·教材勘误·背诵准则", "bookRef": "附录一/二/三及跨章考纲补齐（15条）"}], "terms": [{"id": "item_001", "num": "001", "chapter": "ch1", "name": "001 原子", "section": "教材第 18 页｜原教材 PDF 第 35 页", "def": "由带正电的原子核和核外带负电的电子构成的基本结构单元；中性原子中核电荷数与电子数相等。", "keyPoints": "1个质子或电子电量均为 1.60×10⁻¹⁹ C；1 amu 定义为 ¹²C 中性原子质量的 1/12（≈1.6605×10⁻²⁴ g）；原子量为同位素质量的丰度加权平均值。", "mnemonic": "【速记】由带正电的原子核和核外带负电的电子构成的基本结构单元；中性原子中核电荷数与电子数相等 ｜ 💡口诀：质子定序数(Z)，质中加和定质量(A)，同质异中称同位", "freq": "基础必背", "origDef": "原子是构成物质的基本单元，其尺度为 10⁻¹ nm 量级。原子由位于其中心的带正电荷的原子核以及分布在其周围的带等量负电荷的电子构成。（教材 p.18）"}, {"id": "item_002", "num": "002", "chapter": "ch1", "name": "002 原子核", "section": "教材第 18 页｜原教材 PDF 第 35 页", "def": "位于原子中心、由质子和中子组成的部分，集中了原子的绝大部分质量。", "keyPoints": "答题抓分要素：位于原子中心、由质子和中子组成的部分，集中了原子的绝大部分质量。", "mnemonic": "【速记】位于原子中心、由质子和中子组成的部分，集中了原子的绝大部分质量", "freq": "核心考点", "origDef": "原子核位于原子中心，由带正电荷的质子和不带电荷的中子构成。原子的大部分质量集中在原子核的质子和中子上，二者质量几乎相等，均约为 1.67×10⁻²⁴ g，而电子的质量仅为质子或中子质量的 1/1833。（教材 p.18）"}, {"id": "item_003", "num": "003", "chapter": "ch1", "name": "003 原子序数", "section": "教材第 18 页｜原教材 PDF 第 35 页", "def": "原子核中的质子数；对中性原子，也等于核外电子数。", "keyPoints": "1个质子或电子电量均为 1.60×10⁻¹⁹ C；1 amu 定义为 ¹²C 中性原子质量的 1/12（≈1.6605×10⁻²⁴ g）；原子量为同位素质量的丰度加权平均值。", "mnemonic": "【速记】原子核中的质子数；对中性原子，也等于核外电子数 ｜ 💡口诀：质子定序数(Z)，质中加和定质量(A)，同质异中称同位", "freq": "基础必背", "origDef": "任何一种化学元素都可以用原子核中的质子数或原子序数（Z）来表征。对于一个电中性或完整的原子，原子序数等于电子数。（教材 p.18）"}, {"id": "item_004", "num": "004", "chapter": "ch1", "name": "004 能级（能态）", "section": "教材第 19 页｜原教材 PDF 第 36 页", "def": "电子允许具有的离散能量状态；电子在不同能级之间跃迁时吸收或释放相应的能量。", "keyPoints": "【固体四种电子能带结构（图12-4）】①金属a（如 Cu, Ag）：最外层价带仅半满（无带隙，E_F 位于能带内部）；②金属b（如 Mg，准金属）：满价带与空导带发生交叠（无带隙）；③绝缘体（如 SiO₂, 金刚石）：满价带与空导带之间存在很宽的禁带（E_g > 2–5 eV，如 SiO₂ 为 8.9 eV）；④半导体（如 Si, Ge）：满价带与空导带之间存在较窄的禁带（E_g < 2 eV，Si 为 1.11 eV，Ge 为 0.67 eV）。", "mnemonic": "【速记】电子允许具有的离散能量状态；电子在不同能级之间跃迁时吸收或释放相应的能量 ｜ 💡口诀：原子靠近轨道分裂成能带；金属半满或带交叠(无带隙)，半导窄带隙(<2eV)，绝缘宽带隙；0K最高填充费米面 E_F", "freq": "超高频考点", "origDef": "量子力学原理认为，电子的能量是量子化的，也就是说，电子有特定的能量值。在电子跃迁到一个允许存在的更高或更低的能量状态时，伴随着能量的吸收或者释放。这些电子的能量状态被称为能级或能态。（教材 p.19）"}, {"id": "item_005", "num": "005", "chapter": "ch1", "name": "005 电子云", "section": "教材第 20 页｜原教材 PDF 第 37 页", "def": "用电子在原子核周围不同位置出现的概率描述其空间分布的图像，不是电子运动的确定轨道。", "keyPoints": "答题抓分要素：用电子在原子核周围不同位置出现的概率描述其空间分布的图像，不是电子运动的确定轨道。", "mnemonic": "【速记】用电子在原子核周围不同位置出现的概率描述其空间分布的图像，不是电子运动的确定轨道", "freq": "核心考点", "origDef": "在波动力学模型中，电子被认为同时具有波动性和粒子性。电子不再被看作是一个在离散轨道中运动的粒子，相反，电子的位置被描述成电子在原子核周围出现的概率，电子位置由概率分布或者电子云来描述。（教材 p.20）"}, {"id": "item_006", "num": "006", "chapter": "ch1", "name": "006 量子数", "section": "教材第 20-21 页｜原教材 PDF 第 37-38 页", "def": "描述原子中电子状态的四个参数，包括主量子数、角量子数、磁量子数和自旋量子数。", "keyPoints": "第 n 主壳层含 n 个亚壳层、n² 个轨道，最多容纳 2n² 个电子；s、p、d、f 亚壳层分别有 1、3、5、7 个轨道，最多容纳 2、6、10、14 个电子。", "mnemonic": "【速记】描述原子中电子状态的四个参数，包括主量子数、角量子数、磁量子数和自旋量子数 ｜ 💡口诀：主n定层看大小，角l定亚看形状，磁m_l取向2l+1，自旋正负半方向", "freq": "超高频考点", "origDef": "在波动力学模型中，原子中的每个电子都可以用四个参数表征，这四个参数被称为量子数（主量子数 n、角量子数 l、磁量子数 m_l、自旋量子数 m_s）。电子概率密度分布的形状和空间位向可以用这四个参数中的三个来表示。（教材 p.20）"}, {"id": "item_007", "num": "007", "chapter": "ch1", "name": "007 主量子数", "section": "教材第 20 页｜原教材 PDF 第 37 页", "def": "表征电子所在主壳层、与轨道尺寸和能量有关的量子数，取正整数。", "keyPoints": "答题抓分要素：表征电子所在主壳层、与轨道尺寸和能量有关的量子数，取正整数。", "mnemonic": "【速记】表征电子所在主壳层、与轨道尺寸和能量有关的量子数，取正整数", "freq": "核心考点", "origDef": "通常用主量子数 n 来表示电子壳层，n 取整数，并且从 1 开始。主量子数描述的电子壳层与玻尔原子模型的电子轨道对应，决定了电子轨道的尺寸，即电子与原子核的平均距离。（教材 p.20）"}, {"id": "item_008", "num": "008", "chapter": "ch1", "name": "008 角量子数", "section": "教材第 20 页｜原教材 PDF 第 37 页", "def": "表征电子亚壳层和轨道形状的量子数；同一主壳层中依次对应 s、p、d、f 等亚壳层。", "keyPoints": "答题抓分要素：表征电子亚壳层和轨道形状的量子数；注意区分：同一主壳层中依次对应 s、p、d、f 等亚壳层。", "mnemonic": "【速记】表征电子亚壳层和轨道形状的量子数；同一主壳层中依次对应 s、p、d、f 等亚壳层", "freq": "核心考点", "origDef": "角量子数 l 表示电子亚壳层。l 受主量子数 n 的限制，是 0 到 n-1 范围内的整数值。l 值还决定了电子轨道的形状。（教材 p.20）"}, {"id": "item_009", "num": "009", "chapter": "ch1", "name": "009 磁量子数", "section": "教材第 20 页｜原教材 PDF 第 37 页", "def": "表征原子轨道空间取向的量子数，给定角量子数后可取从其负值到正值的整数。", "keyPoints": "答题抓分要素：表征原子轨道空间取向的量子数，给定角量子数后可取从其负值到正值的整数。", "mnemonic": "【速记】表征原子轨道空间取向的量子数，给定角量子数后可取从其负值到正值的整数", "freq": "核心考点", "origDef": "磁量子数 m_l 决定了每个电子轨道亚壳层的数量。m_l 可以取 -l 到 +l 之间的整数。当加入外磁场后，这些亚壳层能级分开，每个轨道的能量略有不同。（教材 p.20）"}, {"id": "item_010", "num": "010", "chapter": "ch1", "name": "010 自旋量子数", "section": "教材第 21 页｜原教材 PDF 第 38 页", "def": "描述电子自旋状态的量子数，有正二分之一和负二分之一两种取值。", "keyPoints": "答题抓分要素：描述电子自旋状态的量子数，有正二分之一和负二分之一两种取值。", "mnemonic": "【速记】描述电子自旋状态的量子数，有正二分之一和负二分之一两种取值", "freq": "核心考点", "origDef": "自旋量子数 m_s 与电子的自旋运动相关。电子自身会进行自旋运动，自旋方向定义为向上或者向下，相应地，m_s 可取值为 +1/2 或 -1/2。（教材 p.21）"}, {"id": "item_011", "num": "011", "chapter": "ch1", "name": "011 泡利不相容原理", "section": "教材第 21 页｜原教材 PDF 第 38 页", "def": "同一原子中不能有两个电子的四个量子数完全相同；每个原子轨道最多容纳两个自旋相反的电子。", "keyPoints": "答题抓分要素：同一原子中不能有两个电子的四个量子数完全相同；注意区分：每个原子轨道最多容纳两个自旋相反的电子。", "mnemonic": "【速记】同一原子中不能有两个电子的四个量子数完全相同；每个原子轨道最多容纳两个自旋相反的电子", "freq": "核心考点", "origDef": "泡利不相容原理规定，每个电子轨道最多可容纳两个自旋相反的电子。同一原子中不能有两个电子具有完全相同的四个量子数。（教材 p.21）"}, {"id": "item_012", "num": "012", "chapter": "ch1", "name": "012 基态", "section": "教材第 21-22 页｜原教材 PDF 第 38-39 页", "def": "电子在满足量子规则的前提下占据尽可能低的能量状态时，原子所处的最低能量状态。", "keyPoints": "答题抓分要素：电子在满足量子规则的前提下占据尽可能低的能量状态时，原子所处的最低能量状态。", "mnemonic": "【速记】电子在满足量子规则的前提下占据尽可能低的能量状态时，原子所处的最低能量状态", "freq": "核心考点", "origDef": "当所有的电子按照能量最低和泡利不相容原理等限制占据最低能量轨道后，可以认为这个原子处于基态。（教材 p.21-22）"}, {"id": "item_013", "num": "013", "chapter": "ch1", "name": "013 电子排布", "section": "教材第 21-22 页｜原教材 PDF 第 38-39 页", "def": "电子在原子的各个允许能级和轨道上的占据方式，遵循低能级优先填充等规则。", "keyPoints": "能级交错填充顺序：1s→2s→2p→3s→3p→4s→3d→4p；洪特规则特例：Cr (3d⁵4s¹ 半满)、Cu (3d¹⁰4s¹ 全满)。", "mnemonic": "【速记】电子在原子的各个允许能级和轨道上的占据方式，遵循低能级优先填充等规则 ｜ 💡口诀：泡利一轨反旋二，能量最低4s先，洪特单占自旋同", "freq": "超高频考点", "origDef": "为表示一个原子的电子排布或结构，即电子占据轨道的方式，通常是在依次写出电子壳层和亚壳层后，在亚壳层的右上角书写每个亚壳层的电子数目。（教材 p.22）"}, {"id": "item_014", "num": "014", "chapter": "ch1", "name": "014 价电子", "section": "教材第 22 页｜原教材 PDF 第 39 页", "def": "参与原子成键、对材料物理和化学性质具有重要影响的外层电子；教材以最外壳层电子引入此概念。", "keyPoints": "答题抓分要素：参与原子成键、对材料物理和化学性质具有重要影响的外层电子；注意区分：教材以最外壳层电子引入此概念。", "mnemonic": "【速记】参与原子成键、对材料物理和化学性质具有重要影响的外层电子；教材以最外壳层电子引入此概念", "freq": "核心考点", "origDef": "占据最外壳层的电子被称为价电子，固体材料的许多物理和化学性能都跟价电子有关，它们参与原子成键，形成原子和分子聚集体。（教材 p.22）"}, {"id": "item_015", "num": "015", "chapter": "ch1", "name": "015 元素周期表", "section": "教材第 22-24 页｜原教材 PDF 第 39-41 页", "def": "按原子序数和电子结构的周期性排列元素的表；横行为周期，纵向各列按性质联系归为族。", "keyPoints": "答题抓分要素：按原子序数和电子结构的周期性排列元素的表；注意区分：横行为周期，纵向各列按性质联系归为族。", "mnemonic": "【速记】按原子序数和电子结构的周期性排列元素的表；横行为周期，纵向各列按性质联系归为族", "freq": "核心考点", "origDef": "元素周期表是根据原子核电荷数从小至大排序的化学元素列表。它揭示了元素性质与结构之间的内在规律，清晰地呈现了元素的性质、电离能、亲和能和电负性的差异及周期性变化。（教材 p.22）"}, {"id": "item_016", "num": "016", "chapter": "ch1", "name": "016 电负性", "section": "教材第 24 页｜原教材 PDF 第 41 页", "def": "原子在分子或化合物中吸引成键电子的相对能力；数值越大，吸引成键电子的能力越强。", "keyPoints": "周期表规律：同周期从左到右电负性递增（金属性减弱、非金属性增强），同主族自上而下电负性递减。混合键离子特征百分数 = {1 - exp[-0.25(X_A - X_B)²]} × 100%。", "mnemonic": "【速记】原子在分子或化合物中吸引成键电子的相对能力；数值越大，吸引成键电子的能力越强 ｜ 💡口诀：失电电离得亲和，鲍林电负吸电子；同周右增同族减，差大离子差小共", "freq": "超高频考点", "origDef": "1932年，鲍林（Linus Pauling）提出电负性的概念，它以一组数值的相对大小表示原子在分子中对成键电子的吸引能力。同一周期从左到右电负性增大，同一主族从上到下电负性减小。（教材 p.24）"}, {"id": "item_017", "num": "017", "chapter": "ch1", "name": "017 结合键（键合）", "section": "教材第 24-25 页｜原教材 PDF 第 41-42 页", "def": "原子或分子之间使其稳定结合的相互作用，包括主价键和次价键。", "keyPoints": "答题抓分要素：原子或分子之间使其稳定结合的相互作用，包括主价键和次价键。", "mnemonic": "【速记】原子或分子之间使其稳定结合的相互作用，包括主价键和次价键", "freq": "核心考点", "origDef": "当原子相互接近时，由于电子的相互作用，原子间便产生了作用力，使原子结合在一起，形成结合键（键合）。分为主价键（化学键）和次价键（物理键）两大类。（教材 p.24）"}, {"id": "item_018", "num": "018", "chapter": "ch1", "name": "018 主价键（一次键）", "section": "教材第 24-25 页｜原教材 PDF 第 41-42 页", "def": "与价电子作用密切相关的较强结合键，包括离子键、共价键和金属键。", "keyPoints": "答题抓分要素：与价电子作用密切相关的较强结合键，包括离子键、共价键和金属键。", "mnemonic": "【速记】与价电子作用密切相关的较强结合键，包括离子键、共价键和金属键", "freq": "核心考点", "origDef": "化学键也被称为主价键或一次键，包括离子键、共价键和金属键。化学键的形成必然涉及价电子，本质上取决于组成原子的电子结构。（教材 p.24-25）"}, {"id": "item_019", "num": "019", "chapter": "ch1", "name": "019 次价键（二次键）", "section": "教材第 29-30 页｜原教材 PDF 第 46-47 页", "def": "主要起源于原子或分子间偶极相互作用的结合键，通常弱于主价键。", "keyPoints": "答题抓分要素：主要起源于原子或分子间偶极相互作用的结合键，通常弱于主价键。", "mnemonic": "【速记】主要起源于原子或分子间偶极相互作用的结合键，通常弱于主价键", "freq": "核心考点", "origDef": "物理键也被称为次价键、二次键、分子键或范德瓦耳斯键。这些键的作用力比主价键要弱很多，但它们同样影响着材料的一些物理性能。（教材 p.24-25）"}, {"id": "item_020", "num": "020", "chapter": "ch1", "name": "020 平衡原子间距", "section": "教材第 25-26 页｜原教材 PDF 第 42-43 页", "def": "相邻原子间吸引力与排斥力相平衡、合力为零时的距离，对应原子间势能的极小值。", "keyPoints": "答题抓分要素：相邻原子间吸引力与排斥力相平衡、合力为零时的距离，对应原子间势能的极小值。", "mnemonic": "【速记】相邻原子间吸引力与排斥力相平衡、合力为零时的距离，对应原子间势能的极小值", "freq": "核心考点", "origDef": "当吸引力 F_A 和排斥力 F_R 大小相等、方向相反时，净力 F_N = 0。这时原子处于平衡态，体系能量最低，也最稳定，对应的两个原子的平衡间距为 r_0。（教材 p.25）"}, {"id": "item_021", "num": "021", "chapter": "ch1", "name": "021 结合能（键能）", "section": "教材第 25-26 页｜原教材 PDF 第 42-43 页", "def": "把处于平衡间距的相结合原子分离到无穷远所需的能量，反映原子间结合的强弱。取无穷远势能为零时，其大小等于势阱深度。", "keyPoints": "势能公式 E_N = -A/r^m + B/r^n (n > m)，F_N = -dE_N/dr。键能 |E₀| 越大→熔点越高、热膨胀系数越小；r₀ 处力曲线斜率 (dF/dr)_r₀ 越大（势能谷越陡）→弹性模量 E 越大。", "mnemonic": "【速记】把处于平衡间距的相结合原子分离到无穷远所需的能量，反映原子间结合的强弱；取无穷远势能为零时，其大小等于势阱深度 ｜ 💡口诀：吸斥相等定间距(r₀)，势能谷深即键能(E₀)；键强高熔低热胀，谷陡斜率定模量", "freq": "超高频考点", "origDef": "净能量的最小值被称为结合能，记为 E_0，对应着平衡间距 r_0，表示将两个原子分开到无穷远处所需要的能量。结合能反映了原子间键合的强弱，因此也被称为键能。（教材 p.25）"}, {"id": "item_022", "num": "022", "chapter": "ch1", "name": "022 离子键", "section": "教材第 26-27 页｜原教材 PDF 第 43-44 页", "def": "原子转移价电子形成正、负离子后，由异号离子间静电吸引而形成的结合键，无方向性和饱和性。", "keyPoints": "特点：无方向性、无饱和性；键能大（600–1500 kJ/mol），高熔点、高硬度、高强度、低热膨胀、脆性大（同号离子滑移相遇排斥解理）；固态不导电，高温或熔融态离子导电。代表材料：NaCl、MgO、Al₂O₃、ZrO₂。", "mnemonic": "【速记】原子转移价电子形成正、负离子后，由异号离子间静电吸引而形成的结合键 ｜ 💡口诀：电子转移库仑吸，无向无饱配位高；高熔高硬脆绝缘，高温熔融离子导", "freq": "超高频考点", "origDef": "正电性原子失去外层电子变成正离子，负电性原子获得电子变成负离子。正、负离子通过静电库仑引力互相吸引形成稳定的离子键，基本特点是以离子为结合单元，无方向性和饱和性。（教材 p.27）"}, {"id": "item_023", "num": "023", "chapter": "ch1", "name": "023 共价键", "section": "教材第 27-28 页｜原教材 PDF 第 44-45 页", "def": "原子通过共用价电子对形成的结合键，具有方向性和饱和性。", "keyPoints": "特点：具有强烈的方向性和饱和性（配位数遵循 8-N 规则）；键能极高、高硬度、高熔点、脆性大、绝缘或半导体。代表材料：金刚石(sp³)、单晶硅(Si)、SiC、GaAs、高分子长链主链。", "mnemonic": "【速记】原子通过共用价电子对形成的结合键，具有方向性和饱和性 ｜ 💡口诀：共用电子成共价，有向有饱8-N；sp³四面109.5°，金刚硅碳超硬脆", "freq": "超高频考点", "origDef": "同种元素的原子或者电负性相差不大的不同元素的原子相互作用时，原子通过共用电子对来达到稳定的电子结构，从而形成共价键。（教材 p.27）"}, {"id": "item_024", "num": "024", "chapter": "ch1", "name": "024 共价键的方向性", "section": "教材第 27 页｜原教材 PDF 第 44 页", "def": "共价成键要求原子轨道沿适当方向重叠，因此结合键具有确定空间取向的性质。", "keyPoints": "答题抓分要素：共价成键要求原子轨道沿适当方向重叠，因此结合键具有确定空间取向的性质。", "mnemonic": "【速记】共价成键要求原子轨道沿适当方向重叠，因此结合键具有确定空间取向的性质", "freq": "核心考点", "origDef": "在两个原子结合的区域存在电子轨道的重叠，为使电子云达到最大限度的重叠，共价键就有了方向性。（教材 p.27）"}, {"id": "item_025", "num": "025", "chapter": "ch1", "name": "025 共价键的饱和性", "section": "教材第 27 页｜原教材 PDF 第 44 页", "def": "原子能够参与共价成键的电子数有限，使其可形成的共价键数目受到限制的性质。", "keyPoints": "答题抓分要素：原子能够参与共价成键的电子数有限，使其可形成的共价键数目受到限制的性质。", "mnemonic": "【速记】原子能够参与共价成键的电子数有限，使其可形成的共价键数目受到限制的性质", "freq": "核心考点", "origDef": "当一个电子和另一个电子配对以后，就不再和第三个电子配对了，成键的共用电子对数目是一定的，即共价键具有饱和性。（教材 p.27）"}, {"id": "item_026", "num": "026", "chapter": "ch1", "name": "026 金属键", "section": "教材第 28-29 页｜原教材 PDF 第 45-46 页", "def": "金属中的正离子实与共有自由电子之间的静电吸引所形成的结合键，无明显方向性和饱和性。", "keyPoints": "特点：无方向性、无饱和性（倾向形成高配位数密堆积结构）；优良的导电性与导热性；良好的延展性/塑性（滑移后正离子实仍被自由电子包围，键不破裂）；不透明且有金属光泽。代表材料：Cu, Al, Fe, Ti 等所有金属。", "mnemonic": "【速记】金属中的正离子实与共有自由电子之间的静电吸引所形成的结合键，无明显方向性和饱和性 ｜ 💡口诀：正离子实浸电子气，无向无饱密堆积；导电导热有光泽，滑移不裂塑性好", "freq": "超高频考点", "origDef": "金属原子的外层电子脱离原子成为自由电子（电子气），其余部分形成带正电的离子实。金属原子通过正离子和自由电子之间的库仑引力相互结合，不具有方向性和饱和性。（教材 p.28）"}, {"id": "item_027", "num": "027", "chapter": "ch1", "name": "027 电偶极子", "section": "教材第 29 页｜原教材 PDF 第 46 页", "def": "正、负电荷中心不重合所形成的电荷分布；可分为瞬时、诱导和永久偶极子等情况。", "keyPoints": "答题抓分要素：正、负电荷中心不重合所形成的电荷分布；注意区分：可分为瞬时、诱导和永久偶极子等情况。", "mnemonic": "【速记】正、负电荷中心不重合所形成的电荷分布；可分为瞬时、诱导和永久偶极子等情况", "freq": "核心考点", "origDef": "当一个原子或分子的正电中心和负电中心之间存在一定的距离（或不重合）时就会产生电偶极子。（教材 p.29）"}, {"id": "item_028", "num": "028", "chapter": "ch1", "name": "028 范德瓦耳斯键", "section": "教材第 29-30 页｜原教材 PDF 第 46-47 页", "def": "由原子或分子的偶极相互作用产生的较弱结合；教材在次价键体系中讨论。", "keyPoints": "答题抓分要素：由原子或分子的偶极相互作用产生的较弱结合；注意区分：教材在次价键体系中讨论。", "mnemonic": "【速记】由原子或分子的偶极相互作用产生的较弱结合；教材在次价键体系中讨论", "freq": "核心考点", "origDef": "由原子或分子偶极相互作用产生的较弱结合被称为范德瓦耳斯力或范德瓦耳斯键。（教材 p.29-30）"}, {"id": "item_029", "num": "029", "chapter": "ch1", "name": "029 氢键", "section": "教材第 29-30 页｜原教材 PDF 第 46-47 页", "def": "氢与强电负性原子成键后，又与邻近强电负性原子产生的较强次价键，是极性结合的一种特殊情况。", "keyPoints": "特点：是所有次价键中键能最强的一种（高达 10–50 kJ/mol），且具有方向性和饱和性；使水结冰时形成敞开结构发生体积膨胀（冰密度小于水）、沸点反常高。代表材料：水/冰、HF、NH₃、尼龙(PA)、蛋白质、纤维素。", "mnemonic": "【速记】氢与强电负性原子成键后，又与邻近强电负性原子产生的较强次价键 ｜ 💡口诀：氢连氟氧氮，裸质架氢桥；次价它最强，有向又有饱(水结冰膨胀)", "freq": "高频考点", "origDef": "氢键是最强的次价键，是极性分子结合的一种特殊情况。氢与强电负性原子（F、O、N）共价结合时，氢原子基本成为无电子屏蔽的裸露质子，强烈吸引相邻分子的负电荷端。（教材 p.29）"}, {"id": "item_030", "num": "030", "chapter": "ch1", "name": "030 混合键", "section": "教材第 30 页｜原教材 PDF 第 47 页", "def": "同一材料的原子结合同时具有两种或多种键合特征的情况，例如陶瓷中常见的离子键与共价键混合。", "keyPoints": "答题抓分要素：同一材料的原子结合同时具有两种或多种键合特征的情况，例如陶瓷中常见的离子键与共价键混合。", "mnemonic": "【速记】同一材料的原子结合同时具有两种或多种键合特征的情况，例如陶瓷中常见的离子键与共价键混合", "freq": "核心考点", "origDef": "实际材料中的结合键往往具有混合的性质，如共价-离子键、共价-金属键等。两种类型的键所占比例取决于组成原子在元素周期表中的相对位置或者它们的电负性差别。（教材 p.30）"}, {"id": "item_031", "num": "031", "chapter": "ch2", "name": "031 晶体", "section": "教材第 32 页｜原教材 PDF 第 50 页", "def": "内部原子、离子或原子团在三维空间中具有规则周期排列、呈长程有序的固体。", "keyPoints": "单晶体呈真各向异性；非晶体无固定熔点（有玻璃化温度 T_g），呈真各向同性；多晶体因大量细小晶粒随机取向而在宏观上表现为【伪各向同性（假各向同性）】。", "mnemonic": "【速记】内部原子、离子或原子团在三维空间中具有规则周期排列、呈长程有序的固体 ｜ 💡口诀：晶体三维长程有序具五特征（自范、均一、各向异、对称、固定熔点最小能）；非晶长程无序短程有序", "freq": "超高频考点", "origDef": "晶体的本质特征是构成结构的原子或原子团在空间中呈有规则的周期排列，即长程有序。（教材 p.32）"}, {"id": "item_032", "num": "032", "chapter": "ch2", "name": "032 非晶体", "section": "教材第 32、47 页｜原教材 PDF 第 50、65 页", "def": "内部结构缺少长程周期性排列、但可具有短程有序的固体。", "keyPoints": "单晶体呈真各向异性；非晶体无固定熔点（有玻璃化温度 T_g），呈真各向同性；多晶体因大量细小晶粒随机取向而在宏观上表现为【伪各向同性（假各向同性）】。", "mnemonic": "【速记】内部结构缺少长程周期性排列、但可具有短程有序的固体 ｜ 💡口诀：晶体三维长程有序具五特征（自范、均一、各向异、对称、固定熔点最小能）；非晶长程无序短程有序", "freq": "超高频考点", "origDef": "与晶体规则排列相对的是原子混乱排列，不具有长程的周期性排列，形成非晶体。结构特点是原子排列呈长程无序、短程有序。（教材 p.32, 46）"}, {"id": "item_033", "num": "033", "chapter": "ch2", "name": "033 单晶体", "section": "教材第 32 页｜原教材 PDF 第 50 页", "def": "整体具有连续一致晶体学取向的晶体，不由多个取向不同的晶粒拼合而成。", "keyPoints": "答题抓分要素：整体具有连续一致晶体学取向的晶体，不由多个取向不同的晶粒拼合而成。", "mnemonic": "【速记】整体具有连续一致晶体学取向的晶体，不由多个取向不同的晶粒拼合而成", "freq": "核心考点", "origDef": "只由一种周期性排列方式构成的晶体，称为单晶体。（教材 p.32）"}, {"id": "item_034", "num": "034", "chapter": "ch2", "name": "034 多晶体", "section": "教材第 32-33 页｜原教材 PDF 第 50-51 页", "def": "由许多晶粒组成的晶体材料，各晶粒具有各自的晶体学取向，晶粒之间由晶界隔开。", "keyPoints": "横截面上只有一个晶粒的试样称为【竹节晶】，缺乏横向晶粒约束，变形行为介于单晶与多晶之间。", "mnemonic": "【速记】由许多晶粒组成的晶体材料，各晶粒具有各自的晶体学取向 ｜ 💡口诀：多晶协调五独立滑移系；冷变拉长成纤维，晶粒择优成织构(深冲制耳)，位错缠结成胞，储能八九成在点阵畸变", "freq": "高频考点", "origDef": "许多小的单晶体结合在一起形成多晶体，多晶体中的每个小单晶体称为晶粒，它们之间的界面被称为晶界。（教材 p.32）"}, {"id": "item_035", "num": "035", "chapter": "ch2", "name": "035 晶粒", "section": "教材第 32 页｜原教材 PDF 第 50 页", "def": "多晶体中具有基本一致晶体学取向的单晶区域。", "keyPoints": "【临界变形度】使再结晶后晶粒异常粗大的小冷变形量（约 2%–10%），工业生产必须避开！【冷加工 vs 热加工】以再结晶温度 T_R 为界：T < T_R 变形为冷加工（伴随加工硬化），T > T_R 变形为热加工（伴随动态回复与动态再结晶）。", "mnemonic": "【速记】多晶体中具有基本一致晶体学取向的单晶区域 ｜ 💡口诀：回复去应力多边化成亚晶，再结晶生无畸变等轴晶(T_R≈0.4T_m，避开2%–10%临界变形度)，晶界向曲率中心移致长大", "freq": "超高频考点", "origDef": "多晶体是由大量单晶组成的，这些具有基本一致晶体学取向的单晶被称为晶粒。（教材 p.32）"}, {"id": "item_036", "num": "036", "chapter": "ch2", "name": "036 长程有序与短程有序", "section": "教材第 32、47 页｜原教材 PDF 第 50、65 页", "def": "长程有序指原子排列规律可延伸到远大于原子间距的尺度；短程有序指主要在近邻范围内存在一定配位规律。", "keyPoints": "单晶体呈真各向异性；非晶体无固定熔点（有玻璃化温度 T_g），呈真各向同性；多晶体因大量细小晶粒随机取向而在宏观上表现为【伪各向同性（假各向同性）】。", "mnemonic": "【速记】长程有序指原子排列规律可延伸到远大于原子间距的尺度；短程有序指主要在近邻范围内存在一定配位规律 ｜ 💡口诀：晶体三维长程有序具五特征（自范、均一、各向异、对称、固定熔点最小能）；非晶长程无序短程有序", "freq": "超高频考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 32、47 页）：长程有序指原子排列规律可延伸到远大于原子间距的尺度；短程有序指主要在近邻范围内存在一定配位规律。"}, {"id": "item_037", "num": "037", "chapter": "ch2", "name": "037 晶体的均匀性", "section": "教材第 33 页｜原教材 PDF 第 51 页", "def": "理想晶体不同位置的原子结构因周期性重复而等同，使其宏观性质具有空间均匀性的特征。", "keyPoints": "答题抓分要素：理想晶体不同位置的原子结构因周期性重复而等同，使其宏观性质具有空间均匀性的特征。", "mnemonic": "【速记】理想晶体不同位置的原子结构因周期性重复而等同，使其宏观性质具有空间均匀性的特征", "freq": "核心考点", "origDef": "晶体的本质特征是构成结构的原子或原子团在空间中呈有规则的周期排列，即长程有序。（教材 p.32）"}, {"id": "item_038", "num": "038", "chapter": "ch2", "name": "038 晶体的对称性", "section": "教材第 33、36 页｜原教材 PDF 第 51、54 页", "def": "晶体经过某种几何操作后与原结构重合、无法区分的性质。", "keyPoints": "答题抓分要素：晶体经过某种几何操作后与原结构重合、无法区分的性质。", "mnemonic": "【速记】晶体经过某种几何操作后与原结构重合、无法区分的性质", "freq": "核心考点", "origDef": "晶体的本质特征是构成结构的原子或原子团在空间中呈有规则的周期排列，即长程有序。（教材 p.32）"}, {"id": "item_039", "num": "039", "chapter": "ch2", "name": "039 各向异性", "section": "教材第 33 页｜原教材 PDF 第 51 页", "def": "同一材料沿不同方向具有不同物理或力学性质的现象，与不同方向的原子排列有关。", "keyPoints": "答题抓分要素：同一材料沿不同方向具有不同物理或力学性质的现象，与不同方向的原子排列有关。", "mnemonic": "【速记】同一材料沿不同方向具有不同物理或力学性质的现象，与不同方向的原子排列有关", "freq": "核心考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 33 页）：同一材料沿不同方向具有不同物理或力学性质的现象，与不同方向的原子排列有关。"}, {"id": "item_040", "num": "040", "chapter": "ch2", "name": "040 各向同性", "section": "教材第 33 页｜原教材 PDF 第 51 页", "def": "材料沿各个方向的性质相同的特征；取向随机且统计均匀的多晶体通常表现为宏观各向同性。", "keyPoints": "答题抓分要素：材料沿各个方向的性质相同的特征；注意区分：取向随机且统计均匀的多晶体通常表现为宏观各向同性。", "mnemonic": "【速记】材料沿各个方向的性质相同的特征；取向随机且统计均匀的多晶体通常表现为宏观各向同性", "freq": "核心考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 33 页）：材料沿各个方向的性质相同的特征；取向随机且统计均匀的多晶体通常表现为宏观各向同性。"}, {"id": "item_041", "num": "041", "chapter": "ch2", "name": "041 空间点阵", "section": "教材第 34 页｜原教材 PDF 第 52 页", "def": "从晶体结构中抽象出的、由环境完全等同的几何点周期排列构成的三维点的集合。", "keyPoints": "布拉维选胞三原则：①最高对称性；②直角（及相等棱角）最多；③体积最小。仅顶角有阵点（含1个阵点）为初基晶胞(P)，含体心(I,2)、底心(C,2)、面心(F,4)为复式晶胞。", "mnemonic": "【速记】从晶体结构中抽象出的、由环境完全等同的几何点周期排列构成的三维点的集合 ｜ 💡口诀：结构等于点阵加基元；选胞对称高、直角多、体积小；三棱三角点阵常数", "freq": "超高频考点", "origDef": "为了便于分析晶体中的原子或原子团在三维空间周期排列规律，可以将原子或原子团抽象为一个几何点，原子的三维周期排列就被简化为这些几何点的三维周期排列，构成空间点阵。（教材 p.34）"}, {"id": "item_042", "num": "042", "chapter": "ch2", "name": "042 阵点（结点）", "section": "教材第 34 页｜原教材 PDF 第 52 页", "def": "空间点阵中代表相同结构基元、具有相同周围环境的等价几何点。", "keyPoints": "答题抓分要素：空间点阵中代表相同结构基元、具有相同周围环境的等价几何点。", "mnemonic": "【速记】空间点阵中代表相同结构基元、具有相同周围环境的等价几何点", "freq": "核心考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 34 页）：空间点阵中代表相同结构基元、具有相同周围环境的等价几何点。"}, {"id": "item_043", "num": "043", "chapter": "ch2", "name": "043 结构基元", "section": "教材第 34 页｜原教材 PDF 第 52 页", "def": "与每个阵点对应的一个原子或一组原子；点阵与结构基元共同构成实际晶体结构。", "keyPoints": "布拉维选胞三原则：①最高对称性；②直角（及相等棱角）最多；③体积最小。仅顶角有阵点（含1个阵点）为初基晶胞(P)，含体心(I,2)、底心(C,2)、面心(F,4)为复式晶胞。", "mnemonic": "【速记】与每个阵点对应的一个原子或一组原子；点阵与结构基元共同构成实际晶体结构 ｜ 💡口诀：结构等于点阵加基元；选胞对称高、直角多、体积小；三棱三角点阵常数", "freq": "超高频考点", "origDef": "阵点代表的一个或多个原子通常称为结构基元。晶体结构 = 点阵 + 结构基元。（教材 p.34）"}, {"id": "item_044", "num": "044", "chapter": "ch2", "name": "044 晶格", "section": "教材第 34 页｜原教材 PDF 第 52 页", "def": "将点阵中的阵点按一定方式连接而形成的空间网格，用于表示点阵的周期性。", "keyPoints": "答题抓分要素：将点阵中的阵点按一定方式连接而形成的空间网格，用于表示点阵的周期性。", "mnemonic": "【速记】将点阵中的阵点按一定方式连接而形成的空间网格，用于表示点阵的周期性", "freq": "核心考点", "origDef": "为了描述空间点阵模型，常用直线将所有阵点连接起来，形成三维空间网格，称为晶格。（教材 p.34）"}, {"id": "item_045", "num": "045", "chapter": "ch2", "name": "045 晶胞", "section": "教材第 35 页｜原教材 PDF 第 53 页", "def": "能够通过平移重复构成整个晶体点阵的基本几何单元，通常选为平行六面体。", "keyPoints": "布拉维选胞三原则：①最高对称性；②直角（及相等棱角）最多；③体积最小。仅顶角有阵点（含1个阵点）为初基晶胞(P)，含体心(I,2)、底心(C,2)、面心(F,4)为复式晶胞。", "mnemonic": "【速记】能够通过平移重复构成整个晶体点阵的基本几何单元，通常选为平行六面体 ｜ 💡口诀：结构等于点阵加基元；选胞对称高、直角多、体积小；三棱三角点阵常数", "freq": "超高频考点", "origDef": "空间点阵中选择非共面、非共线的三个方向上的最近邻阵点矢量 a、b、c 构成的平行六面体称为晶胞，点阵由晶胞周期性堆积构成。（教材 p.35）"}, {"id": "item_046", "num": "046", "chapter": "ch2", "name": "046 初基晶胞（原胞）", "section": "教材第 35 页｜原教材 PDF 第 53 页", "def": "只含一个阵点的最小体积重复单元；“一个阵点”不一定等于“一个原子”。", "keyPoints": "答题抓分要素：只含一个阵点的最小体积重复单元；注意区分：“一个阵点”不一定等于“一个原子”。", "mnemonic": "【速记】只含一个阵点的最小体积重复单元；“一个阵点”不一定等于“一个原子”", "freq": "核心考点", "origDef": "只包含一个阵点的晶胞称为初基晶胞（P）。（教材 p.35, 37）"}, {"id": "item_047", "num": "047", "chapter": "ch2", "name": "047 复式晶胞", "section": "教材第 35 页｜原教材 PDF 第 53 页", "def": "包含多于一个阵点的重复单元，常为更清楚显示晶体对称性而选取。", "keyPoints": "答题抓分要素：包含多于一个阵点的重复单元，常为更清楚显示晶体对称性而选取。", "mnemonic": "【速记】包含多于一个阵点的重复单元，常为更清楚显示晶体对称性而选取", "freq": "核心考点", "origDef": "包含两个或两个以上阵点的晶胞称为复式晶胞（如体心 I、面心 F、底心 C）。（教材 p.35, 37）"}, {"id": "item_048", "num": "048", "chapter": "ch2", "name": "048 点阵常数（晶格参数）", "section": "教材第 35 页｜原教材 PDF 第 53 页", "def": "描述晶胞形状和大小的参数，包括三个边长和三个棱间夹角。", "keyPoints": "布拉维选胞三原则：①最高对称性；②直角（及相等棱角）最多；③体积最小。仅顶角有阵点（含1个阵点）为初基晶胞(P)，含体心(I,2)、底心(C,2)、面心(F,4)为复式晶胞。", "mnemonic": "【速记】描述晶胞形状和大小的参数，包括三个边长和三个棱间夹角 ｜ nts": "六方晶系四轴指数 (hkil) 满足 h + k + i = 0，晶向 [uvtw] 满足 u=[2U-V]/3, v=[2V-U]/3, t=-(u+v), w=W。立方晶系面间距公式 d_hkl = a / √(h²+k²+l²)，同指数 [hkl] ⊥ (hkl)。", "mnemonic": "【速记】晶向是晶体中阵点连线所代表的方向；晶向指数用该方向相对于晶体基矢的最简整数比例表示 ｜ 💡口诀：晶向终减起方括[uvw]，晶面截距倒圆括(hkl)；对称等价归族晶向族⟨uvw⟩与晶面族{hkl}，六方前三和为零", "freq": "超高频考点", "origDef": "点阵中任何两个阵点的连线称为晶向。将矢量按基轴分量简化成互质整数 u、v、w，写进方括号内，即 [uvw]，称为晶向指数。（教材 p.39）"}, {"id": "item_054", "num": "054", "chapter": "ch2", "name": "054 晶向族", "section": "教材第 40 页｜原教材 PDF 第 58 页", "def": "由晶体对称操作相互关联、在晶体学上等价的一组晶向。", "keyPoints": "六方晶系四轴指数 (hkil) 满足 h + k + i = 0，晶向 [uvtw] 满足 u=[2U-V]/3, v=[2V-U]/3, t=-(u+v), w=W。立方晶系面间距公式 d_hkl = a / √(h²+k²+l²)，同指数 [hkl] ⊥ (hkl)。", "mnemonic": "【速记】由晶体对称操作相互关联、在晶体学上等价的一组晶向 ｜ 💡口诀：晶向终减起方括[uvw]，晶面截距倒圆括(hkl)；对称等价归族晶向族⟨uvw⟩与晶面族{hkl}，六方前三和为零", "freq": "超高频考点", "origDef": "由于晶体具有对称性，晶体中存在的等价方向的集合被称为晶向族，用尖括号表示，记为 ⟨uvw⟩。（教材 p.40）"}, {"id": "item_055", "num": "055", "chapter": "ch2", "name": "055 晶面与晶面指数", "section": "教材第 40 页｜原教材 PDF 第 58 页", "def": "晶面是晶体中由阵点构成的平面；晶面指数由其对晶轴截距的倒数化为最简整数得到。", "keyPoints": "六方晶系四轴指数 (hkil) 满足 h + k + i = 0，晶向 [uvtw] 满足 u=[2U-V]/3, v=[2V-U]/3, t=-(u+v), w=W。立方晶系面间距公式 d_hkl = a / √(h²+k²+l²)，同指数 [hkl] ⊥ (hkl)。", "mnemonic": "【速记】晶面是晶体中由阵点构成的平面；晶面指数由其对晶轴截距的倒数化为最简整数得到 ｜ 💡口诀：晶向终减起方括[uvw]，晶面截距倒圆括(hkl)；对称等价归族晶向族⟨uvw⟩与晶面族{hkl}，六方前三和为零", "freq": "超高频考点", "origDef": "点阵中由阵点组成的平面称为晶面。取三个轴截距的倒数，并按比例简化为互质整数 h、k、l，写进圆括号内，即 (hkl)，称为晶面指数。（教材 p.40）"}, {"id": "item_056", "num": "056", "chapter": "ch2", "name": "056 晶面族", "section": "教材第 40 页｜原教材 PDF 第 58 页", "def": "由晶体对称操作相互关联、在晶体学上等价的一组晶面，不是仅指一组相互平行的晶面。", "keyPoints": "六方晶系四轴指数 (hkil) 满足 h + k + i = 0，晶向 [uvtw] 满足 u=[2U-V]/3, v=[2V-U]/3, t=-(u+v), w=W。立方晶系面间距公式 d_hkl = a / √(h²+k²+l²)，同指数 [hkl] ⊥ (hkl)。", "mnemonic": "【速记】由晶体对称操作相互关联、在晶体学上等价的一组晶面，不是仅指一组相互平行的晶面 ｜ 💡口诀：晶向终减起方括[uvw]，晶面截距倒圆括(hkl)；对称等价归族晶向族⟨uvw⟩与晶面族{hkl}，六方前三和为零", "freq": "超高频考点", "origDef": "晶体学上等价晶面的集合称为晶面族，用大括号表示，记为 {hkl}。（教材 p.40）"}, {"id": "item_057", "num": "057", "chapter": "ch2", "name": "057 四轴指数（六方晶系）", "section": "教材第 41-42 页｜原教材 PDF 第 59-60 页", "def": "以基面内三个互成一百二十度的轴和垂直基面的轴表示晶面、晶向的方法，可直观反映六方对称性。", "keyPoints": "答题抓分要素：以基面内三个互成一百二十度的轴和垂直基面的轴表示晶面、晶向的方法，可直观反映六方对称性。", "mnemonic": "【速记】以基面内三个互成一百二十度的轴和垂直基面的轴表示晶面、晶向的方法，可直观反映六方对称性", "freq": "核心考点", "origDef": "六方晶系在 a1、a2 轴基础上增加 a3 = -(a1 + a2)，采用四轴坐标系，晶向表示为 [uvtw] 且 u+v+t=0，晶面表示为 (hkil) 且 h+k+i=0。（教材 p.41-42）"}, {"id": "item_058", "num": "058", "chapter": "ch2", "name": "058 晶面间距", "section": "教材第 42-43 页｜原教材 PDF 第 60-61 页", "def": "同一组相邻平行晶面之间的垂直距离，与晶面指数和晶格参数有关。", "keyPoints": "答题抓分要素：同一组相邻平行晶面之间的垂直距离，与晶面指数和晶格参数有关。", "mnemonic": "【速记】同一组相邻平行晶面之间的垂直距离，与晶面指数和晶格参数有关", "freq": "核心考点", "origDef": "相邻平行晶面之间的垂直垂直距离称为晶面间距 d。对于立方晶系，d = a/√(h² + k² + l²)。（教材 p.42-43）"}, {"id": "item_059", "num": "059", "chapter": "ch2", "name": "059 面密度与线密度", "section": "教材第 53 页｜原教材 PDF 第 71 页", "def": "面密度为单位晶面面积上的原子数；线密度为沿某晶向单位长度上的原子数，边界原子须按共享比例计数。", "keyPoints": "答题抓分要素：面密度为单位晶面面积上的原子数；注意区分：线密度为沿某晶向单位长度上的原子数，边界原子须按共享比例计数。", "mnemonic": "【速记】面密度为单位晶面面积上的原子数；线密度为沿某晶向单位长度上的原子数，边界原子须按共享比例计数", "freq": "核心考点", "origDef": "面密度指单位面积晶面上的原子数；线密度指单位长度晶向上的原子数。（教材 p.53）"}, {"id": "item_060", "num": "060", "chapter": "ch2", "name": "060 配位数", "section": "教材第 51、61-62 页｜原教材 PDF 第 69、79-80 页", "def": "某原子最近邻原子的数目；离子晶体中通常指某离子最近邻异号离子的数目。", "keyPoints": "公式 ρ = NA / (V_C·N_A)，N 为晶胞原子数，A 为原子量，N_A = 6.022×10²³ mol⁻¹。等径球最密堆积最大配位数为 12，最大致密度为 74%。", "mnemonic": "【速记】某原子最近邻原子的数目；离子晶体中通常指某离子最近邻异号离子的数目 ｜ 💡口诀：近邻等距配位数，球体除胞致密度；理论密度 ρ = NA / (V_C·N_A)", "freq": "超高频考点", "origDef": "晶体结构每个原子都有相同的邻近原子数或接触的原子数，这就是配位数（CN）。（教材 p.51）"}, {"id": "item_061", "num": "061", "chapter": "ch2", "name": "061 致密度（紧密系数）", "section": "教材第 51 页｜原教材 PDF 第 69 页", "def": "按原子硬球模型计算，晶胞内实际包含的原子球总体积与晶胞体积之比。", "keyPoints": "公式 ρ = NA / (V_C·N_A)，N 为晶胞原子数，A 为原子量，N_A = 6.022×10²³ mol⁻¹。等径球最密堆积最大配位数为 12，最大致密度为 74%。", "mnemonic": "【速记】按原子硬球模型计算，晶胞内实际包含的原子球总体积与晶胞体积之比 ｜ 💡口诀：近邻等距配位数，球体除胞致密度；理论密度 ρ = NA / (V_C·N_A)", "freq": "超高频考点", "origDef": "致密度（APF）定义为一个晶胞中按照原子硬球模型计算所有原子球体积的总和与晶胞体积的比值（APF = N·v / V）。（教材 数，A 为原子量，N_A = 6.022×10²³ mol⁻¹。等径球最密堆积最大配位数为 12，最大致密度为 74%。", "mnemonic": "【速记】根据晶胞中实际包含的原子质量与晶胞体积之比求得的密度，而非直接测量得到的密度 ｜ 💡口诀：近邻等距配位数，球体除胞致密度；理论密度 ρ = NA / (V_C·N_A)", "freq": "超高频考点", "origDef": "根据晶胞中原子数 N、原子量 A、晶胞体积 V 及阿伏伽德罗常数 N_A 计算得出的密度称为理论密度（ρ = N·A / [V·N_A]）。（教材 p.52-53）"}, {"id": "item_067", "num": "067", "chapter": "ch2", "name": "067 原子堆垛", "section": "教材第 54 页｜原教材 PDF 第 72 页", "def": "晶体中原子层按照一定顺序在空间中重复堆积的方式。", "keyPoints": "答题抓分要素：晶体中原子层按照一定顺序在空间中重复堆积的方式。", "mnemonic": "【速记】晶体中原子层按照一定顺序在空间中重复堆积的方式", "freq": "核心考点", "origDef": "原子是构成物质的基本单元，其尺度为 10⁻¹ nm 量级。原子由位于其中心的带正电荷的原子核以及分布在其周围的带等量负电荷的电子构成。（教材 p.18）"}, {"id": "item_068", "num": "068", "chapter": "ch2", "name": "068 晶体间隙", "section": "教材第 54-55 页｜原教材 PDF 第 72-73 页", "def": "晶体原子之间由几何排列自然形成的空隙，不等同于正常结点缺失原子形成的空位。", "keyPoints": "FCC（N=4）：八面体间隙 4 个（体心+12棱心，r/R=0.414），四面体间隙 8 个（小立方中心，r/R=0.225）；BCC（N=2）：扁八面体间隙 6 个（面心+棱心，r/R=0.155），扁四面体间隙 12 个（晶面 (1/2,1/4,0)，r/R=0.291）。解释了 γ-Fe 溶碳能力（2.11%）远大于 α-Fe（0.022%）。", "mnemonic": "【速记】晶体原子之间由几何排列自然形成的空隙，不等同于正常结点缺失原子形成的空位 ｜ 💡口诀：四面个数八面倍；面心八4(0.414)四8(0.225)，体心扁隙八6(0.155)四12(0.291)", "freq": "超高频考点", "origDef": "晶体的本质特征是构成结构的原子或原子团在空间中呈有规则的周期排列，即长程有序。（教材 p.32）"}, {"id": "item_069", "num": "069", "chapter": "ch2", "name": "069 四面体间隙", "section": "教材第 54-55 页｜原教材 PDF 第 72-73 页", "def": "由四个近邻原子围成的四面体所包围的间隙，间隙中心相对于周围原子的配位数为四。", "keyPoints": "FCC（N=4）：八面体间隙 4 个（体心+12棱心，r/R=0.414），四面体间隙 8 个（小立方中心，r/R=0.225）；BCC（N=2）：扁八面体间隙 6 个（面心+棱心，r/R=0.155），扁四面体间隙 12 个（晶面 (1/2,1/4,0)，r/R=0.291）。解释了 γ-Fe 溶碳能力（2.11%）远大于 α-Fe（0.022%）。", "mnemonic": "【速记】由四个近邻原子围成的四面体所包围的间隙，间隙中心相对于周围原子的配位数为四 ｜ 💡口诀：四面个数八面倍；面心八4(0.414)四8(0.225)，体心扁隙八6(0.155)四12(0.291)", "freq": "超高频考点", "origDef": "四个原子所组成的四面体中间的空隙称为四面体间隙，最大容纳硬球半径比为 r/R = 0.225。（教材 p.55）"}, {"id": "item_070", "num": "070", "chapter": "ch2", "name": "070 八面体间隙", "section": "教材第 54-55 页｜原教材 PDF 第 72-73 页", "def": "由六个近邻原子围成的八面体所包围的间隙，其几何形状在某些晶体中可发生畸变。", "keyPoints": "FCC（N=4）：八面体间隙 4 个（体心+12棱心，r/R=0.414），四面体间隙 8 个（小立方中心，r/R=0.225）；BCC（N=2）：扁八面体间隙 6 个（面心+棱心，r/R=0.155），扁四面体间隙 12 个（晶面 (1/2,1/4,0)，r/R=0.291）。解释了 γ-Fe 溶碳能力（2.11%）远大于 α-Fe（0.022%）。", "mnemonic": "【速记】由六个近邻原子围成的八面体所包围的间隙，其几何形状在某些晶体中可发生畸变 ｜ 💡口诀：四面个数八面倍；面心八4(0.414)四8(0.225)，体心扁隙八6(0.155)四12(0.291)", "freq": "超高频考点", "origDef": "六个原子所组成的八面体中间的空隙称为八面体间隙，FCC 中最大容纳硬球半径比为 r/R = 0.414。（教材 p.55）"}, {"id": "item_071", "num": "071", "chapter": "ch2", "name": "071 合金", "section": "教材第 55-56 页｜原教材 PDF 第 73-74 页", "def": "以金属为基础，由金属与其他金属或非金属组元组成并具有金属特征的材料，可含固溶体、金属间化合物等相。", "keyPoints": "随含碳量 w_C 从 0 增加到 6.69%：渗碳体相含量线性增加，室温硬度持续升高；而抗拉强度在 w_C ≈ 0.9%–1.0% 达到最大值后下降（因过共析钢中二次渗碳体沿晶界呈连续脆性网状分布，可用正火消除）。", "mnemonic": "【速记】以金属为基础，由金属与其他金属或非金属组元组成并具有金属特征的材料 ｜ 💡口诀：0.022分纯铁与钢，0.77共析，2.11分钢与铸铁，4.30共晶；液析一次、奥析二次(网状致脆)、铁析三次", "freq": "超高频考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 55-56 页）：以金属为基础，由金属与其他金属或非金属组元组成并具有金属特征的材料，可含固溶体、金属间化合物等相。"}, {"id": "item_072", "num": "072", "chapter": "ch2", "name": "072 固溶体", "section": "教材第 56 页｜原教材 PDF 第 74 页", "def": "由两种或多种组元形成、仍保持其中一种组元晶体结构的固相。", "keyPoints": "【休姆-罗瑟里 (Hume-Rothery) 固溶度影响因素】①原子半径差 Δr < 15% 固溶度大；②电负性差小（差大易成化合物）；③晶体结构相同（无限互溶必要条件）；④化合价因素与极限电子浓度（FCC e/a=1.36，BCC e/a=1.48）。", "mnemonic": "【速记】由两种或多种组元形成、仍保持其中一种组元晶体结构的固相 ｜ 💡口诀：溶质入格保晶型；Hume-Rothery五要素：同晶型、径差<15%、电负近、电子浓度1.36/1.48", "freq": "超高频考点", "origDef": "合金的晶体结构与组成元素之一的晶体结构相同的固相称为固溶体。（教材 p.56）"}, {"id": "item_073", "num": "073", "chapter": "ch2", "name": "073 溶剂与溶质", "section": "教材第 56 页｜原教材 PDF 第 74 页", "def": "固溶体中提供其基本晶体结构的组元为溶剂，溶入其中的其他组元为溶质。", "keyPoints": "答题抓分要素：固溶体中提供其基本晶体结构的组元为溶剂，溶入其中的其他组元为溶质。", "mnemonic": "【速记】固溶体中提供其基本晶体结构的组元为溶剂，溶入其中的其他组元为溶质", "freq": "核心考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 56 页）：固溶体中提供其基本晶体结构的组元为溶剂，溶入其中的其他组元为溶质。"}, {"id": "item_074", "num": "074", "chapter": "ch2", "name": "074 置换固溶体", "section": "教材第 56 页｜原教材 PDF 第 74 页", "def": "溶质原子占据溶剂晶格正常结点、取代部分溶剂原子而形成的固溶体。", "keyPoints": "答题抓分要素：溶质原子占据溶剂晶格正常结点、取代部分溶剂原子而形成的固溶体。", "mnemonic": "【速记】溶质原子占据溶剂晶格正常结点、取代部分溶剂原子而形成的固溶体", "freq": "核心考点", "origDef": "溶质原子占据溶剂晶格某些结点位置而形成的固溶体称为置换固溶体。（教材 p.56）"}, {"id": "item_075", "num": "075", "chapter": "ch2", "name": "075 间隙固溶体", "section": "教材第 57 页｜原教材 PDF 第 75 页", "def": "溶质原子进入溶剂晶格间隙而形成的固溶体；通常由较小的非金属原子溶入金属形成。", "keyPoints": "答题抓分要素：溶质原子进入溶剂晶格间隙而形成的固溶体；注意区分：通常由较小的非金属原子溶入金属形成。", "mnemonic": "【速记】溶质原子进入溶剂晶格间隙而形成的固溶体；通常由较小的非金属原子溶入金属形成", "freq": "核心考点", "origDef": "溶质原子嵌入溶剂晶格间隙所形成的固溶体称为间隙固溶体。（教材 p.57）"}, {"id": "item_076", "num": "076", "chapter": "ch2", "name": "076 固溶度", "section": "教材第 56-57 页｜原教材 PDF 第 74-75 页", "def": "在给定条件下，溶质在固溶体中的极限溶解度；受原子尺寸、结构、电负性、电子因素和温度等影响。", "keyPoints": "答题抓分要素：在给定条件下，溶质在固溶体中的极限溶解度；注意区分：受原子尺寸、结构、电负性、电子因素和温度等影响。", "mnemonic": "【速记】给定条件下，溶质在固溶体中的极限溶解度；受原子尺寸、结构、电负性、电子因素和温度等影响", "freq": "核心考点", "origDef": "溶质原子在固溶体中的极限溶解度称为固溶度。（教材 p.56）"}, {"id": "item_077", "num": "077", "chapter": "ch2", "name": "077 有限固溶体与无限固溶体", "section": "教材第 56-57 页｜原教材 PDF 第 74-75 页", "def": "溶质溶解度有一定限度者为有限固溶体；组元在全部成分范围内能形成同一固溶体者为无限固溶体。", "keyPoints": "答题抓分要素：溶质溶解度有一定限度者为有限固溶体；注意区分：组元在全部成分范围内能形成同一固溶体者为无限固溶体。", "mnemonic": "【速记】溶质溶解度有一定限度者为有限固溶体；组元在全部成分范围内能形成同一固溶体者为无限固溶体", "freq": "核心考点", "origDef": "合金的晶体结构与组成元素之一的晶体结构相同的固相称为固溶体。（教材 p.56）"}, {"id": "item_078", "num": "078", "chapter": "ch2", "name": "078 金属间化合物（中间相）", "section": "教材第 57-60 页｜原教材 PDF 第 75-78 页", "def": "金属与金属或准金属等形成的、晶体结构不同于各组成组元的相；不能与保持溶剂结构的固溶体混淆。", "keyPoints": "间隙固溶体（保持溶剂晶格）vs 间隙相（新简单晶格，r_X/r_M < 0.59）vs 间隙化合物（新复杂晶格，r_X/r_M > 0.59，如 Fe₃C）是804必考辨析题！", "mnemonic": "【速记】金属与金属或准金属等形成的、晶体结构不同于各组成组元的相；不能与保持溶剂结构的固溶体混淆 ｜ 💡口诀：正常遵化价，电子看e/a(3/2,21/13,7/4)，0.59分界简单间隙相(TiC)与复杂间隙化(Fe₃C)，TCP拉弗斯AB₂", "freq": "超高频考点", "origDef": "金属与金属或准金属之间可以形成与组元晶体结构均不相同的新相，被称为金属间化合物（中间相）。（教材 p.57）"}, {"id": "item_079", "num": "079", "chapter": "ch2", "name": "079 正常价化合物", "section": "教材第 58 页｜原教材 PDF 第 76 页", "def": "主要按组成元素通常化合价规律形成的化合物，其形成和稳定性与电负性因素密切相关。", "keyPoints": "间隙固溶体（保持溶剂晶格）vs 间隙相（新简单晶格，r_X/r_M < 0.59）vs 间隙化合物（新复杂晶格，r_X/r_M > 0.59，如 Fe₃C）是804必考辨析题！", "mnemonic": "【速记】主要按组成元素通常化合价规律形成的化合物，其形成和稳定性与电负性因素密切相关 ｜ 💡口诀：正常遵化价，电子看e/a(3/2,21/13,7/4)，0.59分界简单间隙相(TiC)与复杂间隙化(Fe₃C)，TCP拉弗斯AB₂", "freq": "超高频考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 58 页）：主要按组成元素通常化合价规律形成的化合物，其形成和稳定性与电负性因素密切相关。"}, {"id": "item_080", "num": "080", "chapter": "ch2", "name": "080 电子化合物", "section": "教材第 58 页｜原教材 PDF 第 76 页", "def": "晶体结构主要与价电子数和原子数之比即电子浓度相关的一类金属间化合物，不一定满足通常的化合价规则。", "keyPoints": "间隙固溶体（保持溶剂晶格）vs 间隙相（新简单晶格，r_X/r_M < 0.59）vs 间隙化合物（新复杂晶格，r_X/r_M > 0.59，如 Fe₃C）是804必考辨析题！", "mnemonic": "【速记】晶体结构主要与价电子数和原子数之比即电子浓度相关的一类金属间化合物，不一定满足通常的化合价规则 ｜ 💡口诀：正常遵化价，电子看e/a(3/2,21/13,7/4)，0.59分界简单间隙相(TiC)与复杂间隙化(Fe₃C)，TCP拉弗斯AB₂", "freq": "超高频考点", "origDef": "电子化合物（Hume-Rothery相）是以电子浓度（e/a）为决定晶体结构主要因素的金属间化合物。（教材 p.58）"}, {"id": "item_081", "num": "081", "chapter": "ch2", "name": "081 间隙化合物（间隙相）", "section": "教材第 58-59 页｜原教材 PDF 第 76-77 页", "def": "较小非金属原子与过渡金属形成的化合物，具有自己的晶体结构，不是原金属点阵中的间隙固溶体。", "keyPoints": "间隙固溶体（保持溶剂晶格）vs 间隙相（新简单晶格，r_X/r_M < 0.59）vs 间隙化合物（新复杂晶格，r_X/r_M > 0.59，如 Fe₃C）是804必考辨析题！", "mnemonic": "【速记】较小非金属原子与过渡金属形成的化合物，具有自己的晶体结构 ｜ 💡口诀：正常遵化价，电子看e/a(3/2,21/13,7/4)，0.59分界简单间隙相(TiC)与复杂间隙化(Fe₃C)，TCP拉弗斯AB₂", "freq": "超高频考点", "origDef": "由原子半径较大的过渡金属和半径较小的非金属（H、B、C、N）形成的金属间化合物称为间隙相或间隙化合物。（教材 p.58-59）"}, {"id": "item_082", "num": "082", "chapter": "ch2", "name": "082 拓扑密堆相", "section": "教材第 59-60 页｜原教材 PDF 第 77-78 页", "def": "由不同尺寸金属原子通过较复杂配位多面体组合而成、空间利用率和配位数较高的一类中间相。", "keyPoints": "答题抓分要素：由不同尺寸金属原子通过较复杂配位多面体组合而成、空间利用率和配位数较高的一类中间相。", "mnemonic": "【速记】由不同尺寸金属原子通过较复杂配位多面体组合而成、空间利用率和配位数较高的一类中间相", "freq": "核心考点", "origDef": "拓扑密堆相（TCP相）是由两种大小不同的金属原子所构成的一类高配位数复杂中间相（如 Laves 相）。（教材 p.59-60）"}, {"id": "item_083", "num": "083", "chapter": "ch2", "name": "083 离子晶体", "section": "教材第 60-62 页｜原教材 PDF 第 78-80 页", "def": "主要由正、负离子通过离子键构成的晶体，结构需满足电中性及局部几何配位等要求。", "keyPoints": "离子晶体电导率与扩散系数成正比（能斯特-爱因斯坦关系）；聚合物中小分子、化学惰性分子在非晶态区域扩散最快。", "mnemonic": "【速记】主要由正、负离子通过离子键构成的晶体，结构需满足电中性及局部几何配位等要求 ｜ 💡口诀：半导一步预沉积(余误差)二步驱入(高斯解)；陶瓷同号空位电中性慢离子控速；高分子钻非晶链间自由体积", "freq": "高频考点", "origDef": "晶体的本质特征是构成结构的原子或原子团在空间中呈有规则的周期排列，即长程有序。（教材 p.32）"}, {"id": "item_084", "num": "084", "chapter": "ch2", "name": "084 氯化钠型结构", "se 要由金属与非金属元素等通过离子键、共价键形成的无机非金属材料，既包括晶态也包括非晶态及其组合。"}, {"id": "item_402", "num": "402", "chapter": "ch10", "name": "402 玻璃", "section": "教材第 47 页｜原教材 PDF 第 65 页", "def": "以非晶态结构为主要特征的固体材料，典型硅酸盐玻璃具有短程有序、长程无序的网络结构。", "keyPoints": "【钢化玻璃】将玻璃加热至接近软化点后表面急速风冷（或通过离子交换），使表面形成强大的【残余压应力】、内部形成拉应力，从而大幅提高抗弯与抗冲击强度的安全玻璃。【微晶玻璃（玻璃陶瓷）】在玻璃中加入成核剂（TiO₂、ZrO₂），经受控晶化热处理析出大量微米/纳米级均匀微晶的复相材料（零孔隙、极低热膨胀系数、高强耐热冲击）。", "mnemonic": "【速记】以非晶态结构为主要特征的固体材料，典型硅酸盐玻璃具有短程有序、长程无序的网络结构 ｜ 💡口诀：SiO₂成网、Na₂O/CaO断网降黏度(修饰体)；过冷固化转折点 T_g；表面压应力成钢化玻璃，受控晶化成微晶玻璃", "freq": "超高频考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 47 页）：以非晶态结构为主要特征的固体材料，典型硅酸盐玻璃具有短程有序、长程无序的网络结构。"}, {"id": "item_403", "num": "403", "chapter": "ch10", "name": "403 玻璃网络生成体", "section": "教材第 47 页｜原教材 PDF 第 65 页", "def": "能够形成连续非晶网络的组分，例如二氧化硅通过硅氧四面体连接构成玻璃网络。", "keyPoints": "答题抓分要素：能够形成连续非晶网络的组分，例如二氧化硅通过硅氧四面体连接构成玻璃网络。", "mnemonic": "【速记】能够形成连续非晶网络的组分，例如二氧化硅通过硅氧四面体连接构成玻璃网络", "freq": "核心考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 47 页）：能够形成连续非晶网络的组分，例如二氧化硅通过硅氧四面体连接构成玻璃网络。"}, {"id": "item_404", "num": "404", "chapter": "ch10", "name": "404 玻璃网络修饰剂", "section": "教材第 47 页｜原教材 PDF 第 65 页", "def": "本身不形成连续玻璃网络、加入后改变网络连接状态的组分，例如某些碱金属和碱土金属氧化物。", "keyPoints": "答题抓分要素：本身不形成连续玻璃网络、加入后改变网络连接状态的组分，例如某些碱金属和碱土金属氧化物。", "mnemonic": "【速记】本身不形成连续玻璃网络、加入后改变网络连接状态的组分，例如某些碱金属和碱土金属氧化物", "freq": "核心考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 47 页）：本身不形成连续玻璃网络、加入后改变网络连接状态的组分，例如某些碱金属和碱土金属氧化物。"}, {"id": "item_405", "num": "405", "chapter": "ch10", "name": "405 玻璃中间体", "section": "教材第 47 页｜原教材 PDF 第 65 页", "def": "在特定玻璃组成中可进入并稳定网络、但单独形成玻璃网络能力有限的组分，教材以氧化铝、氧化钛等说明。", "keyPoints": "答题抓分要素：在特定玻璃组成中可进入并稳定网络、但单独形成玻璃网络能力有限的组分，教材以氧化铝、氧化钛等说明。", "mnemonic": "【速记】特定玻璃组成中可进入并稳定网络、但单独形成玻璃网络能力有限的组分，教材以氧化铝、氧化钛等说明", "freq": "核心考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 47 页）：在特定玻璃组成中可进入并稳定网络、但单独形成玻璃网络能力有限的组分，教材以氧化铝、氧化钛等说明。"}, {"id": "item_406", "num": "406", "chapter": "ch10", "name": "406 金属玻璃（非晶合金）", "section": "教材第 47、166 页｜原教材 PDF 第 65、184 页", "def": "原子排列缺少长程周期性的金属或合金，可通过抑制结晶等方式获得，不能与普通多晶合金混同。", "keyPoints": "【非晶合金（金属玻璃）的特点与应用】内部完全【没有晶界、位错和成分偏析】等晶体缺陷！因此：①不会发生位错滑移，通过局部剪切带变形，具有极高的断裂强度、高硬度和高达 ~2% 的超高弹性极限（优异的弹性储能材料，如高尔夫球杆头、精密弹簧）；②无晶界磁畴壁钉扎阻碍，矫顽力极低、磁导率极高、铁损极小，是极为优异的【软磁材料】（用于高效配电变压器铁芯）；③无晶界电化学原电池腐蚀，具有极佳的耐腐蚀性和耐磨性。", "mnemonic": "【速记】原子排列缺少长程周期性的金属或合金，可通过抑制结晶等方式获得 ｜ 💡口诀：晶态长程有序含位错晶界；金属玻璃急冷长程无序，无位错无晶界推进至超高强、高弹极限、优软磁(变压器铁芯)、极耐蚀", "freq": "超高频考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 47、166 页）：原子排列缺少长程周期性的金属或合金，可通过抑制结晶等方式获得，不能与普通多晶合金混同。"}, {"id": "item_407", "num": "407", "chapter": "ch10", "name": "407 碳纤维", "section": "教材第 75 页｜原教材 PDF 第 93 页", "def": "以碳为主要组成的纤维材料，兼具低密度、高比强度、高比模量等特点，常作复合材料增强体；此页不是完整的制备工艺讲解。", "keyPoints": "【主要特性】密度极低（~1.75–1.80 g/cm³，不到钢的 1/4），沿纤维轴向具有极高的比强度和比模量（sp² 共价键沿轴向择优取向），耐超高温（非氧化气氛下 >2000°C 强度不降）、热膨胀系数极小、耐腐蚀、导电导热性好；但径向（横向）靠范德华力结合，抗剪切性能较差、抗氧化需涂层保护。【石墨烯】单层二维六角蜂窝状 sp² 碳片；【碳纳米管】石墨烯卷曲而成的无缝一维纳米管。", "mnemonic": "【速记】以碳为主要组成的纤维材料，兼具低密度、高比强度、高比模量等特点；此页不是完整的制备工艺讲解 ｜ 💡口诀：PAN前驱体三步法：空气200–300°C预氧化(环化不熔)推进至惰气1000–1500°C碳化(除杂高强)推进至2000–3000°C石墨化(择优取向高模)；轻质高比强比模耐高温", "freq": "超高频考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 75 页）：以碳为主要组成的纤维材料，兼具低密度、高比强度、高比模量等特点，常作复合材料增强体；此页不是完整的制备工艺讲解。"}, {"id": "item_408", "num": "408", "chapter": "ch10", "name": "408 碳／碳复合材料", "section": "教材第 14 页｜原教材 PDF 第 31 页", "def": "以碳纤维或其织物增强碳基体的复合材料，具有低密度、耐高温和良好尺寸稳定性等特点，可用于高温构件。", "keyPoints": "答题抓分要素：以碳纤维或其织物增强碳基体的复合材料，具有低密度、耐高温和良好尺寸稳定性等特点，可用于高温构件。", "mnemonic": "【速记】以碳纤维或其织物增强碳基体的复合材料，具有低密度、耐高温和良好尺寸稳定性等特点", "freq": "核心考点", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（教材第 14 页）：以碳纤维或其织物增强碳基体的复合材料，具有低密度、耐高温和良好尺寸稳定性等特点，可用于高温构件。"}, {"id": "app_01", "num": "补01", "chapter": "ch_app", "name": "补01 高熵合金（大纲第十章要求·附录一补齐）", "section": "附录一说明（教材第409页仅提及名称，此处按804考纲补齐标准定义）", "def": "由5种或5种以上主要元素以等原子比或近等原子比（每种主元原子分数在5%～35%之间）熔合而成的合金；因混合构型熵极高（ΔS_mix ≥ 1.5R），高温下显著降低自由能并抑制复杂脆性金属间化合物析出，倾向于形成简单的FCC、BCC或HCP单相固溶体。", "keyPoints": "高熵合金四大核心效应：①热力学高熵效应（稳定简单固溶体相）；②结构严重晶格畸变效应（高固溶强化）；③动力学迟滞扩散效应（抗高温蠕变与晶粒粗化）；④性能鸡尾酒效应。", "mnemonic": "【速记】五种以上主元近等比(5%–35%)，高构型熵成简单固溶体；四大效应：高熵、晶格畸变、迟滞扩散、鸡尾酒", "freq": "考纲补齐", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（附录一说明（教材第409页仅提及名称，此处按804考纲补齐标准定义））：由5种或5种以上主要元素以等原子比或近等原子比（每种主元原子分数在5%～35%之间）熔合而成的合金；因混合构型熵极高（ΔS_mix ≥ 1.5R），高温下显著降低自由能并抑制复杂脆性金属间化合物析出，倾向于形成简单的FCC、BCC或HCP单相固溶体。"}, {"id": "app_02", "num": "补02", "chapter": "ch_app", "name": "补02 铁合金与有色金属的系统分类（大纲第十章要求·附录一补齐）", "section": "附录一说明（教材第11–12、217–228页分散涉及，按804考纲补齐）", "def": "金属材料按成分分为【铁合金（黑色金属）】与【有色金属（非铁金属）】两大类。铁合金是以铁为基的合金，主要包括钢（含碳量 0.022%～2.11%）、铸铁（含碳量 > 2.11%）及铁合金添加剂；有色金属是指除铁、铬、锰以外的所有金属及其合金（分轻金属Al/Mg/Ti、重金属Cu/Zn/Ni、贵金属Au/Ag/Pt、稀有难熔金属W/Mo/Nb等）。", "keyPoints": "铁碳相图分界：工业纯铁（w_C < 0.022%）、碳钢（0.022%～2.11%）、白口铸铁（2.11%～6.69%）。", "mnemonic": "【速记】铁铬锰属黑色金属(钢与铸铁以2.11%C分界)，其余全归有色金属(轻/重/贵/难熔)", "freq": "考纲补齐", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（附录一说明（教材第11–12、217–228页分散涉及，按804考纲补齐））：金属材料按成分分为【铁合金（黑色金属）】与【有色金属（非铁金属）】两大类。铁合金是以铁为基的合金，主要包括钢（含碳量 0.022%～2.11%）、铸铁（含碳量 > 2.11%）及铁合金添加剂；有色金属是指除铁、铬、锰以外的所有金属及其合金（分轻金属Al/Mg/Ti、重金属Cu/Zn/Ni、贵金属Au/Ag/Pt、稀有难熔金属W/Mo/Nb等）。"}, {"id": "app_03", "num": "补03", "chapter": "ch_app", "name": "补03 低碳钢、中碳钢与高碳钢的分类及主要应用（大纲第十章要求·附录一补齐）", "section": "附录一说明（教材多处提及名称但无完整分类清单，按804考纲补齐）", "def": "碳素钢按含碳量分为：①【低碳钢】（w_C ≤ 0.25%）：组织为铁素体加少量珠光体，强度硬度低但塑性和韧性极好，易于冷冲压成形和焊接，主要用于汽车车身薄板、桥梁、建筑工程结构件；②【中碳钢】（0.25% < w_C ≤ 0.60%）：经淬火+高温回火（调质处理）获得回火索氏体，具有优异的综合力学性能，用于曲轴、连杆、齿轮、传动轴；③【高碳钢】（w_C > 0.60%）：经淬火+低温回火获得高硬耐磨的回火马氏体，主要用于切削刀具、量具、模具、高强弹簧及滚动轴承。（注意：不能把亚共析钢直接当作低碳钢的同义词！）", "keyPoints": "亚共析钢（0.022%–0.77%C）按相图共析点划分，而低碳/中碳/高碳钢按工程含碳量 0.25% 和 0.60% 划分。", "mnemonic": "【速记】0.25%与0.60%分低中高碳钢：低碳软韧冲压焊接板材，中碳调质轴齿，高碳淬火刀模轴承", "freq": "考纲补齐", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（附录一说明（教材多处提及名称但无完整分类清单，按804考纲补齐））：碳素钢按含碳量分为：①【低碳钢】（w_C ≤ 0.25%）：组织为铁素体加少量珠光体，强度硬度低但塑性和韧性极好，易于冷冲压成形和焊接，主要用于汽车车身薄板、桥梁、建筑工程结构件；②【中碳钢】（0.25% < w_C ≤ 0.60%）：经淬火+高温回火（调质处理）获得回火索氏体，具有优异的综合力学性能，用于曲轴、连杆、齿轮、传动轴；③【高碳钢】（w_C > 0.60%）：经淬火+低温回火获得高硬耐磨的回火马氏体，主要用于切削刀具、量具、模具、高强弹簧及滚动轴承。（注意：不能把亚共析钢直接当作低碳钢的同义词！）"}, {"id": "app_04", "num": "补04", "chapter": "ch_app", "name": "补04 不锈钢的主要成分、分类与应用（大纲第十章要求·附录一补齐）", "section": "附录一说明（教材第390–391页仅在生物材料提及，按804考纲补齐）", "def": "不锈钢是以铬（Cr 质量分数 ≥ 10.5%～12%）为主要合金元素，并常添加 Ni、Mo、Ti 等元素的耐大气、酸碱盐腐蚀合金钢。其耐蚀机理是 Cr 在钢表面与氧反应形成一层极薄、致密且稳定的富铬钝化氧化膜（Cr₂O₃），使钢发生【钝化现象】而隔绝腐蚀介质。", "keyPoints": "按室温组织分为：①奥氏体不锈钢（如 18Cr-8Ni 即 304，FCC结构，无磁性、塑韧性与耐蚀性极好、生物相容性优，用于化工、医疗植入物、食品设备）；②铁素体不锈钢（BCC，含Cr 12%–30%无Ni）；③马氏体不锈钢（如 1Cr13–4Cr13，可淬火强化，用于手术刀、涡轮叶片）。", "mnemonic": "【速记】含铬超12%生Cr₂O₃钝化膜防锈；奥氏体18Cr-8Ni无磁耐蚀，马氏体可淬火做刀刃", "freq": "考纲补齐", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（附录一说明（教材第390–391页仅在生物材料提及，按804考纲补齐））：不锈钢是以铬（Cr 质量分数 ≥ 10.5%～12%）为主要合金元素，并常添加 Ni、Mo、Ti 等元素的耐大气、酸碱盐腐蚀合金钢。其耐蚀机理是 Cr 在钢表面与氧反应形成一层极薄、致密且稳定的富铬钝化氧化膜（Cr₂O₃），使钢发生【钝化现象】而隔绝腐蚀介质。"}, {"id": "app_05", "num": "补05", "chapter": "ch_app", "name": "补05 轻质高强度有色金属（铝合金、镁合金、钛合金）的种类、成分、结构及应用（附录一补齐）", "section": "附录一说明（教材第49–52、118页部分涉及，按804考纲补齐）", "def": "①【铝合金】以 Al（FCC，密度 2.7 g/cm³）为基，添加 Cu、Mg、Zn、Si、Mn 等元素，通过固溶处理+时效析出细小共格第二相（如 CuAl₂、Mg₂Si）实现显著沉淀强化，比强度高、耐蚀，用于飞机蒙皮、机身框架及新能源汽车；②【镁合金】以 Mg（HCP，最轻结构金属 1.74 g/cm³）为基，添加 Al、Zn、Mn、稀土等，比强度和比刚度高、减震吸能与电磁屏蔽性好，用于航空航天与3C轻量化壳体；③【钛合金】以 Ti 为基（低温 α 相为 HCP，882°C 以上高温 β 相为 BCC，密度 4.5 g/cm³），分为 α型、β型和 α+β型（如经典 TC4 即 Ti-6Al-4V），具有极高比强度、优异耐高温与耐海水腐蚀性及良好生物相容性，用于航空发动机压气机盘/叶片、深海潜器与人工关节。", "keyPoints": "铝合金靠时效沉淀强化；镁合金 HCP 室温滑移系少（仅3个）故常在升温下塑性加工；钛合金利用 α(HCP)-β(BCC) 同素异构相变调控组织。", "mnemonic": "【速记】铝FCC(2.7)时效沉淀强，镁HCP(1.74)最轻减震好，钛α-HCP/β-BCC(4.5, Ti-6Al-4V)比强冠绝航发与骨科", "freq": "考纲补齐", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（附录一说明（教材第49–52、118页部分涉及，按804考纲补齐））：①【铝合金】以 Al（FCC，密度 2.7 g/cm³）为基，添加 Cu、Mg、Zn、Si、Mn 等元素，通过固溶处理+时效析出细小共格第二相（如 CuAl₂、Mg₂Si）实现显著沉淀强化，比强度高、耐蚀，用于飞机蒙皮、机身框架及新能源汽车；②【镁合金】以 Mg（HCP，最轻结构金属 1.74 g/cm³）为基，添加 Al、Zn、Mn、稀土等，比强度和比刚度高、减震吸能与电磁屏蔽性好，用于航空航天与3C轻量化壳体；③【钛合金】以 Ti 为基（低温 α 相为 HCP，882°C 以上高温 β 相为 BCC，密度 4.5 g/cm³），分为 α型、β型和 α+β型（如经典 TC4 即 Ti-6Al-4V），具有极高比强度、优异耐高温与耐海水腐蚀性及良好生物相容性，用于航空发动机压气机盘/叶片、深海潜器与人工关节。"}, {"id": "app_06", "num": "补06", "chapter": "ch_app", "name": "补06 铸造合金与锻造（变形）合金的区别（大纲第十章要求·附录一补齐）", "section": "附录一说明（教材第229页提及共晶铸造性，按804考纲补齐完整对比）", "def": "根据二元相图中合金成分与组织特征对加工工艺的适用性，有色及铁基合金分为两类：①【变形合金（锻造合金）】成分位于相图固溶度极限点以内的单相固溶体区（或加热时能进入单相固溶区），结晶温区窄、组织均匀、无粗大脆性共晶组织，具有优良的塑性，适于通过轧制、锻造、挤压、冲压等压力加工成形（且可通过冷加工硬化或固溶时效热处理强化）；②【铸造合金】成分靠近相图的【共晶点】附近，熔点低、液固相线温度间距小、液态流动性极好、凝固收缩集中不易产生分散缩松和热裂，但组织中含有较多硬脆共晶相而不宜塑性变形，适合直接通过砂型、压铸或精密铸造成形复杂构件。", "keyPoints": "相图位置口诀：固溶极限内单相区→塑性好→锻造（变形）合金；共晶点附近→结晶温区窄、流动性好→铸造合金。", "mnemonic": "【速记】单相固溶区塑性好做锻造(变形)合金；共晶点附近温差小、流动性好做铸造合金", "freq": "考纲补齐", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（附录一说明（教材第229页提及共晶铸造性，按804考纲补齐完整对比））：根据二元相图中合金成分与组织特征对加工工艺的适用性，有色及铁基合金分为两类：①【变形合金（锻造合金）】成分位于相图固溶度极限点以内的单相固溶体区（或加热时能进入单相固溶区），结晶温区窄、组织均匀、无粗大脆性共晶组织，具有优良的塑性，适于通过轧制、锻造、挤压、冲压等压力加工成形（且可通过冷加工硬化或固溶时效热处理强化）；②【铸造合金】成分靠近相图的【共晶点】附近，熔点低、液固相线温度间距小、液态流动性极好、凝固收缩集中不易产生分散缩松和热裂，但组织中含有较多硬脆共晶相而不宜塑性变形，适合直接通过砂型、压铸或精密铸造成形复杂构件。"}, {"id": "app_07", "num": "补07", "chapter": "ch_app", "name": "补07 高温耐火陶瓷材料的种类与应用（大纲第十章要求·附录一补齐）", "section": "附录一说明（教材第60–65页讲陶瓷结构，按804考纲补齐耐火陶瓷分类）", "def": "高温耐火陶瓷是指耐火度不低于 1580°C、在高温环境下能承受热负荷、机械应力及化学炉渣侵蚀的无机非金属材料。按化学矿物组成与酸碱性分为：①【酸性耐火材料】以 SiO₂ 为主（如硅砖、石英玻璃制品，抗酸性渣强）；②【中性耐火材料】以高铝质 Al₂O₃（刚玉）、莫来石（3Al₂O₃·2SiO₂）、碳质（石墨、SiC）和铬质为主，抗热震与抗酸碱渣稳定；③【碱性耐火材料】以 MgO（方镁石）、CaO（白云石）、镁铝尖晶石（MgAl₂O₄）为主，耐火度极高（>2000°C），抗碱性渣侵蚀极强；④【特种超高温耐火陶瓷】如氧化锆（ZrO₂，熔点 2700°C）、硼化物（ZrB₂）、碳化物（TaC、HfC）。", "keyPoints": "广泛应用于冶金炼钢转炉/电炉内衬、玻璃熔窑、水泥回转窑、航空发动机热障涂层（YSZ 氧化钇稳定氧化锆）及航天器防热瓦。", "mnemonic": "【速记】耐火度≥1580°C；分酸性硅质(SiO₂)、中性高铝莫来石刚玉(Al₂O₃)、碱性镁质(MgO)与特种氧化锆(ZrO₂)", "freq": "考纲补齐", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（附录一说明（教材第60–65页讲陶瓷结构，按804考纲补齐耐火陶瓷分类））：高温耐火陶瓷是指耐火度不低于 1580°C、在高温环境下能承受热负荷、机械应力及化学炉渣侵蚀的无机非金属材料。按化学矿物组成与酸碱性分为：①【酸性耐火材料】以 SiO₂ 为主（如硅砖、石英玻璃制品，抗酸性渣强）；②【中性耐火材料】以高铝质 Al₂O₃（刚玉）、莫来石（3Al₂O₃·2SiO₂）、碳质（石墨、SiC）和铬质为主，抗热震与抗酸碱渣稳定；③【碱性耐火材料】以 MgO（方镁石）、CaO（白云石）、镁铝尖晶石（MgAl₂O₄）为主，耐火度极高（>2000°C），抗碱性渣侵蚀极强；④【特种超高温耐火陶瓷】如氧化锆（ZrO₂，熔点 2700°C）、硼化物（ZrB₂）、碳化物（TaC、HfC）。"}, {"id": "app_08", "num": "补08", "chapter": "ch_app", "name": "补08 航空用碳纤维/碳纳米纤维的制备原理与主要特性（大纲第十章要求·附录一补齐）", "section": "附录一说明（教材第14、75页讲特性与复合，按804考纲补齐制备原理）", "def": "航空用高性能碳纤维（及静电纺丝基碳纳米纤维）主要以聚丙烯腈（PAN，另有沥青基、黏胶基）原丝为前驱体，通过三步热化学转化制备：①【预氧化（稳定化，200～300°C 空气中牵引加热）】使热塑性线型 PAN 分子链发生氰基环化、脱氢与氧化交联，形成耐热不熔的梯形芳环结构；②【碳化（1000～1500°C 高纯氮气中）】热裂解脱除 H、N、O 等非碳原子，缩聚形成含碳量 >90% 的乱层石墨微晶结构（获得高强型碳纤维）；③【石墨化（2000～3000°C 氩气中高温牵引）】使乱层石墨片层沿纤维轴向高度择优取向生长（获得高模型碳纤维）。（气相生长碳纳米纤维 VGCNF 则利用过渡金属催化剂在高温下催化裂解气态碳氢化合物 CVD 生长而成）。", "keyPoints": "主要特性：低密度（~1.75 g/cm³）、极高的轴向比强度与比模量（sp²碳碳共价键沿轴向排列）、耐超高温（惰性气氛 >2000°C 强度不降）、抗疲劳、低热膨胀、导电导热好；广泛用于航空航天主承力结构复合材料。", "mnemonic": "【速记】PAN原丝三步法：200–300°C空气预氧化(环化不熔)推进至1000–1500°C氮气碳化(除杂高强)推进至2000–3000°C氩气石墨化(取向高模)", "freq": "考纲补齐", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（附录一说明（教材第14、75页讲特性与复合，按804考纲补齐制备原理））：航空用高性能碳纤维（及静电纺丝基碳纳米纤维）主要以聚丙烯腈（PAN，另有沥青基、黏胶基）原丝为前驱体，通过三步热化学转化制备：①【预氧化（稳定化，200～300°C 空气中牵引加热）】使热塑性线型 PAN 分子链发生氰基环化、脱氢与氧化交联，形成耐热不熔的梯形芳环结构；②【碳化（1000～1500°C 高纯氮气中）】热裂解脱除 H、N、O 等非碳原子，缩聚形成含碳量 >90% 的乱层石墨微晶结构（获得高强型碳纤维）；③【石墨化（2000～3000°C 氩气中高温牵引）】使乱层石墨片层沿纤维轴向高度择优取向生长（获得高模型碳纤维）。（气相生长碳纳米纤维 VGCNF 则利用过渡金属催化剂在高温下催化裂解气态碳氢化合物 CVD 生长而成）。"}, {"id": "app_09", "num": "补09", "chapter": "ch_app", "name": "补09 退火、正火、淬火、回火（调质、回火马氏体/屈氏体/索氏体、淬硬性）（大纲第八章补齐）", "section": "附录一说明（教材第249–263页涉及淬火/回火/球化，按804考纲补齐完整热处理体系）", "def": "钢的“四把火”基本热处理工艺：①【退火】将钢加热至临界温度以上或以下保温后【随炉缓慢冷却】，以获得近平衡组织、降低硬度利切削、消除内应力或细化均匀组织（完全退火、球化退火、扩散退火、去应力退火）；②【正火】将钢加热至 Ac₃ 或 Accm 以上 30～50°C 保温后【在空气中冷却】，获得较细片层珠光体（索氏体），提高低碳钢硬度利切削，或消除过共析钢网状二次渗碳体；③【淬火】加热奥氏体化后以大于临界冷却速率【快速冷却（水冷/油冷）】，抑制扩散分解以获得高硬度马氏体组织；④【回火】将淬火钢重新加热到 A₁ 以下某温度保温后冷却，消除淬火内应力、降低脆性并稳定组织。", "keyPoints": "【三类回火组织与调质】①低温回火（150–250°C）：得【回火马氏体】（极细 ε 碳化物+低正方度马氏体，高硬耐磨，用于刀具轴承）；②中温回火（350–500°C）：得【回火屈氏体】（铁素体针片内弥散极细颗粒状渗碳体，高弹性极限，用于弹簧模具）；③高温回火（500–650°C）：得【回火索氏体】（等轴铁素体内均匀分布细球状渗碳体，强韧性配合最佳）；【淬火+高温回火】称为【调质处理】。【淬透性 vs 淬硬性】淬透性是获马氏体深度的能力（取决于临界冷却速率/合金元素）；淬硬性是淬火能达到的最高硬度（仅取决于含碳量）。", "mnemonic": "【速记】炉冷退火、空冷正火、快冷淬火；低回马(150–250°C刀轴)、中回屈(350–500°C弹簧)、高回索(500–650°C调质)；淬透看深度，淬硬看碳量", "freq": "考纲补齐", "origDef": "奥氏体迅速过冷至 Ms 点以下通过非扩散切变方式形成的碳在 α-Fe 中的过饱和固溶体称为马氏体。（教材 p.253-254）"}, {"id": "app_10", "num": "补10", "chapter": "ch_app", "name": "补10 凝固生长中的温度梯度、成分过冷、平面生长与树枝状生长（大纲第八章补齐）", "section": "附录一说明（教材第244–245页讲晶核长大速率，按804考纲补齐界面形态控制机理）", "def": "液态金属结晶时，晶体生长形态取决于液-固界面微观结构（粗糙界面垂直连续生长、光滑界面台阶侧向生长）与界面前沿液相的【温度梯度 dT/dx】：①【正温度梯度与平面状生长】当液相温度随离开界面距离增加而升高（dT/dx > 0，结晶潜热通过已凝固固相向型壁导出）时，若界面偶然凸入高温液相会立即停滞或重熔，界面保持平整推进，呈【平面状生长】；②【负温度梯度与树枝状生长】当界面前沿液相处于过冷状态、温度随距离增加而降低（dT/dx < 0，潜热向过冷液相导出）时，偶然凸起伸入过冷度更大的液相中生长更快，并向侧面分叉出二次、三次枝晶臂，呈【树枝状生长（枝晶生长）】；③【成分过冷】固溶体凝固时，即使在正温度梯度下，因界面前沿排出的溶质富集导致理论凝固温度随距离增加而升高，当实际液相温度低于溶质分布决定的理论凝固温度时产生的过冷称为成分过冷，使生长形态由平面晶依次转为胞状晶和树枝晶。", "keyPoints": "纯金属在正温度梯度下只能平面状生长，在负温度梯度下树枝状生长；固溶体合金因存在成分过冷，在正温度梯度下也能发生树枝状生长。", "mnemonic": "【速记】正温梯纯金属平界面生长；负温梯或固溶体成分过冷凸起加速分叉成树枝状生长", "freq": "考纲补齐", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（附录一说明（教材第244–245页讲晶核长大速率，按804考纲补齐界面形态控制机理））：液态金属结晶时，晶体生长形态取决于液-固界面微观结构（粗糙界面垂直连续生长、光滑界面台阶侧向生长）与界面前沿液相的【温度梯度 dT/dx】：①【正温度梯度与平面状生长】当液相温度随离开界面距离增加而升高（dT/dx > 0，结晶潜热通过已凝固固相向型壁导出）时，若界面偶然凸入高温液相会立即停滞或重熔，界面保持平整推进，呈【平面状生长】；②【负温度梯度与树枝状生长】当界面前沿液相处于过冷状态、温度随距离增加而降低（dT/dx < 0，潜热向过冷液相导出）时，偶然凸起伸入过冷度更大的液相中生长更快，并向侧面分叉出二次、三次枝晶臂，呈【树枝状生长（枝晶生长）】；③【成分过冷】固溶体凝固时，即使在正温度梯度下，因界面前沿排出的溶质富集导致理论凝固温度随距离增加而升高，当实际液相温度低于溶质分布决定的理论凝固温度时产生的过冷称为成分过冷，使生长形态由平面晶依次转为胞状晶和树枝晶。"}, {"id": "app_11", "num": "勘01", "chapter": "ch_app", "name": "勘01 【附录二必看防错】结合能符号、伪各向同性条件、CsCl配位数与四配位半径比", "section": "附录二｜教材第25、33、63、77页简写或笔误勘误（答题避坑指南）", "def": "①【第25页·结合能符号】结合能用于“分离处于平衡间距原子所需能量”时应取正值（势阱深度）；若相互作用势能以无穷远为零，平衡处势能为负值，答题时须区分正负号含义。②【第33页·多晶体各向同性条件】多晶体宏观各向同性必须以“晶粒取向随机且统计均匀”为前提；有变形织构的多晶体表现为各向异性（见第147页）。③【第63页·CsCl配位数笔误】教材正文将氯化铯型结构配位数误印为6，与图4-12(b)中心离子被8个异号顶角离子包围不符，考试务必答【配位数为 8，属简单立方布拉维点阵（非体心立方点阵）】！④【第77页习题6·四配位半径比笔误】习题将四配位最小半径比误写为0.414，应以第61–62页表4-6为准：【四面体四配位下限为 0.225，八面体六配位下限为 0.414，立方体八配位下限为 0.732】。", "keyPoints": "这四处是叶飞教材第一次印刷中的典型印刷笔误或简写，阅卷标准以正确晶体学原理为准，切勿照抄错字！", "mnemonic": "【速记】结合能正值势能负值；多晶无织构才伪同性；CsCl简单立方配位是8(非6非BCC)；四配位下限0.225、六配位0.414", "freq": "防错必看", "origDef": "净能量的最小值被称为结合能，记为 E_0，对应着平衡间距 r_0，表示将两个原子分开到无穷远处所需要的能量。结合能反映了原子间键合的强弱，因此也被称为键能。（教材 p.25）"}, {"id": "app_12", "num": "勘02", "chapter": "ch_app", "name": "勘02 【附录二必看防错】肖特基缺陷、伯氏回路约定、临界分切应力与再结晶驱动力", "section": "附录二｜教材第80–89、140、158–164、171页简写或笔误勘误", "def": "①【第80–82页·离子晶体肖特基缺陷】应以“保持电中性和化学计量比例”定义阳、阴离子空位组合；“1个正离子空位配1个负离子空位”仅适用于1:1等价电荷的 AX 型晶体（如 CaCl₂ 中则是1个 Ca²⁺ 空位配2个 Cl⁻ 空位）。②【第87–89页·伯氏回路约定】右手方向与从终点到起点（RH/FS）约定必须前后统一，正文出现 RH/FS 与 RH/SF 字母次序混印，答题直接写清“实际晶体作右手闭合回路→理想晶体同样步数从终点指向起点”文字即可。③【第140页·临界分切应力条件】“临界分切应力是材料常数”是指在给定材料状态和温度下不随单晶加载取向（φ, λ）改变而变化；若改变温度、纯度或发生加工硬化，其数值会改变。④【第158–164页·驱动力区分】回复与初次再结晶以【冷变形储能降低】为主要驱动力；再结晶完成后的晶粒长大（及二次再结晶/异常长大）以【晶界能降低】为驱动力。⑤【第171页·解理面】解理沿特定低指数晶面（解理面，如 BCC 的 {100}）发生，不要答成“一律沿最密排面断裂”。", "keyPoints": "区分驱动力：回复/再结晶驱动力 = 形变储能（点阵畸变能+位错能）；晶粒长大驱动力 = 界面能（晶界能）。", "mnemonic": "【速记】肖特基保电中性按化合价配空位；伯氏回路文字写清终指起；回复再结晶靠形变储能，晶粒长大靠晶界能", "freq": "防错必看", "origDef": "使晶体中某个滑移系开始开动滑移所必须克服的最小分切应力称为临界分切应力（τ_CRSS）。它由晶体本质及内部运动障碍决定，不随外力加载取向改变。（教材 p.140）"}, {"id": "app_13", "num": "勘03", "chapter": "ch_app", "name": "勘03 【附录二必看防错】杠杆法则、渗碳体形成温区、相变速率与半导体能带笔误", "section": "附录二｜教材第207、218、244、251–253、270、273页简写或笔误勘误", "def": "①【第207页·杠杆法则公式】正文式(10-11)移项配对有印刷不一致，背诵杠杆法则牢记“某平衡相质量分数 = 对侧成分线段长度 ÷ 联结线总长度”。②【第218页·渗碳体生成温度】切勿将渗碳体定义为“仅在727°C以下生成的化合物”——第223–226页明确包含从高温液相直接结晶的一次渗碳体（Fe₃C_Ⅰ）、1148°C共晶渗碳体和1148～727°C从奥氏体析出的二次渗碳体（Fe₃C_Ⅱ）。③【第244页·相变速率】形核率与长大速率量纲不同，不能理解为数值直接相加，应表述为“相变总体速率受形核率和长大速率共同控制”。④【第270页·零温硅能带与费米能级】正文写零温硅反键带“半满”系笔误，应按图12-4(d)答“理想本征半导体在0K时价带全满、导带全空”；且半导体费米能级位于禁带内（代表电子占据概率1/2的参考能级，禁带中并无被电子占据的允许能级）。⑤【第273页·施主电离笔误】N型半导体中施主能级上的电子受热激发是跃迁到【导带】（正文一处误印为“到价带”，应按图12-9能带图作答）。", "keyPoints": "特别是第270页（0K本征半导体价带满、导带空）和第273页（施主能级电子跃迁至导带，受主能级接受价带跃迁来的电子在价带留空穴），答题时务必写准确！", "mnemonic": "【速记】杠杆取对侧线段除总长；渗碳体液相奥氏体铁素体皆可析出；0K本征价带全满导带全空；N型施主电子跃迁入导带", "freq": "防错必看", "origDef": "铁与碳形成的具有复杂斜方结构的金属间化合物 Fe3C 称为渗碳体（含碳量固定为 6.69%C）。（教材 p.216）"}, {"id": "app_14", "num": "准01", "chapter": "ch_app", "name": "准01 【附录三满分答题准则】名词解释“三要素公式”与易混概念层次辨析", "section": "附录三｜背诵时必须保留的限定条件与铁碳相图标准数据口径", "def": "①【名词解释满分三要素】作答时优先写清“研究对象 + 本质特征/物理过程 + 必要限定条件/结果”（例如答“再结晶”必须包含：冷变形金属、加热到一定温度以上、通过形核长大形成无畸变新等轴晶粒取代变形晶粒）。②【分清结构、相与组织层次】空间点阵（几何抽象点）≠ 实际晶体结构（点阵+基元）；珠光体（α+Fe₃C）与莱氏体（γ+Fe₃C 或 P+Fe₃C）是两相混合【组织】，绝不是一种独立的【相】！③【分清力学与热处理性能指标】强度（抗塑变/断裂）≠ 刚度（弹性模量，抗弹性变形）；韧性（断前吸能）≠ 塑性/延展性（断前永久变形量）；疲劳极限（无限次循环不断）≠ 条件疲劳强度（给定循环次数）；淬透性（获马氏体深度）≠ 淬硬性（最高硬度）。④【叶飞教材铁碳相图统一数据口径】共析点 0.77%C（727°C）、共晶点 4.30%C（1148°C）、包晶点 0.17%C（1495°C，液相0.53%C，δ相0.09%C）、奥氏体最大溶碳量 2.11%C（1148°C）、铁素体最大溶碳量 0.022%C（727°C）、渗碳体 6.69%C。", "keyPoints": "考试若题目未另外指定数据，一律采用叶飞教材上述铁碳相图特征成分与温度数据。", "mnemonic": "【速记】答题写清“对象+特征+条件”；点阵非结构、珠莱是组织非单相；铁碳关键数：0.022、0.77(727°C)、2.11、4.30(1148°C)、6.69", "freq": "防错必看", "origDef": "依据叶飞、刘玮书《材料科学与工程基础》（附录三）：①【名词解释满分三要素】作答时优先写清“研究对象 + 本质特征/物理过程 + 必要限定条件/结果”（例如答“再结晶”必须包含：冷变形金属、加热到一定温度以上、通过形核长大形成无畸变新等轴晶粒取代变形晶粒）。②【分清结构、相与组织层次】空间点阵（几何抽象点）≠ 实际晶体结构（点阵+基元）；珠光体（α+Fe₃C）与莱氏体（γ+Fe₃C 或 P+Fe₃C）是两相混合【组织】，绝不是一种独立的【相】！③【分清力学与热处理性能指标】强度（抗塑变/断裂）≠ 刚度（弹性模量，抗弹性变形）；韧性（断前吸能）≠ 塑性/延展性（断前永久变形量）；疲劳极限（无限次循环不断）≠ 条件疲劳强度（给定循环次数）；淬透性（获马氏体深度）≠ 淬硬性（最高硬度）。④【叶飞教材铁碳相图统一数据口径】共析点 0.77%C（727°C）、共晶点 4.30%C（1148°C）、包晶点 0.17%C（1495°C，液相0.53%C，δ相0.09%C）、奥氏体最大溶碳量 2.11%C（1148°C）、铁素体最大溶碳量 0.022%C（727°C）、渗碳体 6.69%C。"}]}, {"id": "mod_sustech_804_hw", "title": "叶飞教材原版课后习题答案（第1–13章）", "subtitle": "严格对应云盘《叶飞课后习题答案(1).pdf》原章节题号（129题）", "school": "南方科技大学", "code": "804", "category": "教材原版课后习题对照", "author": "叶飞课后习题答案(1).pdf 原版收录", "defaultUnlocked": true, "badge": "教材原章 · 129题全对照", "chapters": [{"id": "hw_ch1", "num": "第1章", "title": "走进材料科学与工程", "desc": "教材第1章课后习题原解（p.16）"}, {"id": "hw_ch2", "num": "第2章", "title": "原子结构与结合键", "desc": "教材第2章课后习题原解（p.31）"}, {"id": "hw_ch3", "num": "第3章", "title": "晶体结构基础", "desc": "教材第3章课后习题原解（p.48）"}, {"id": "hw_ch4", "num": "第4章", "title": "固体结构", "desc": "教材第4章课后习题原解（pp.77–78）"}, {"id": "hw_ch5", "num": "第5章", "title": "晶体缺陷", "desc": "教材第5章课后习题原解（p.108）"}, {"id": "hw_ch6", "num": "第6章", "title": "材料力学性能", "desc": "教材第6章课后习题原解（p.135）"}, {"id": "hw_ch7", "num": "第7章", "title": "变形和强化机制", "desc": "教材第7章课后习题原解（p.167）"}, {"id": "hw_ch8", "num": "第8章", "title": "材料的失效", "desc": "教材第8章课后习题原解（p.184）"}, {"id": "hw_ch9", "num": "第9章", "title": "固体中的扩散", "desc": "教材第9章课后习题原解（p.195）"}, {"id": "hw_ch10", "num": "第10章", "title": "相图", "desc": "教材第10章课后习题原解（pp.235–236）"}, {"id": "hw_ch11", "num": "第11章", "title": "相变", "desc": "教材第11章课后习题原解（p.264）"}, {"id": "hw_ch12", "num": "第12章", "title": "电学性能", "desc": "教材第12章课后习题原解（p.288）"}, {"id": "hw_ch13", "num": "第13章", "title": "热学性能", "desc": "教材第13章课后习题原解（p.307）"}], "terms": [{"id": "hw_1_1"
