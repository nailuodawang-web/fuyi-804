到的温度决定，而不是靠恒温延长时间完成一般扩散型转变。", "freq": "高频必背"}, {"id": "qa_08_45", "num": "08-45", "chapter": "ch8", "name": "08-45 板条马氏体与片状马氏体如何区分？", "title": "板条马氏体与片状马氏体如何区分？", "section": "叶 pp.254–256；第11章习题8。", "def": "板条马氏体常见于较低碳钢，呈成束板条，内部高位错密度；片状马氏体常见于较高碳钢，呈片状或透镜状，内部常有孪晶等亚结构。\n【教材第11章第8题】板条状马氏体（低碳马氏体）形成温度较高，尺寸大致相同的细马氏体条定向平行排列，组成马氏体束或马氏体区； 针状马氏体（片状/高碳马氏体）形成温度较低，大小不一，分布无规则。", "keyPoints": "板条马氏体常见于较低碳钢，呈成束板条，内部高位错密度；片状马氏体常见于较高碳钢，呈片状或透镜状，内部常有孪晶等亚结构；实际可混合存在，形态与含碳量及转变温度有关，不能简单按某一固定碳量把所有合金绝对分开", "mnemonic": "【答题抓手】扣准板条马氏体与、片状马氏体区，紧扣物理机制与适用条件展开", "pitfall": "实际可混合存在，形态与含碳量及转变温度有关，不能简单按某一固定碳量把所有合金绝对分开。", "freq": "高频必背"}, {"id": "qa_08_46", "num": "08-46", "chapter": "ch8", "name": "08-46 马氏体为什么具有高硬度、高强度？", "title": "马氏体为什么具有高硬度、高强度？", "section": "叶 pp.261–263；第11章习题10。", "def": "① 过饱和碳的作用：马氏体转变时碳来不及按平衡扩散分配，保留在铁晶格中，引起强烈的非均匀晶格畸变并阻碍位错运动，是碳钢马氏体高硬度的重要来源。\n② 亚结构与界面：转变形成高密度位错、孪晶等缺陷以及细小板条、片及其边界，使塑性变形需要跨越更多障碍；转变形变和各区域相互约束还会形成内应力。\n③ 性能边界：高强高硬不自动等于高韧；高碳片状马氏体和较大淬火内应力可增加脆裂风险，工程中常需回火调整。\n【教材第11章第10题】① 相变强化：晶格切变与塑性变形产生大量位错、孪晶和层错等缺陷。 ② 固溶强化：过饱和间隙碳原子引起强烈点阵畸变与应力场钉扎位错。 ③ 时效强化：淬火过程或室温停留发生“自回火”，产生超显微结构不均匀性。 ④ 亚结构强化：马氏体亚结构中的孪晶界阻碍位错运动。 ⑤ 细晶强化：马氏体束尺寸越细小，强度越高。", "keyPoints": "过饱和碳的作用：马氏体转变时碳来不及按平衡扩散分配，保留在铁晶格中，引起强烈的非均匀晶格畸变并阻碍位错运动，是碳钢马氏体高硬度的重要来源；亚结构与界面：转变形成高密度位错、孪晶等缺陷以及细小板条、片及其边界，使塑性变形需要跨越更多障碍；转变形变和各区域相互约束还会形成内应力；性能边界：高强高硬不自动等于高韧；高碳片状马氏体和较大淬火内应力可增加脆裂风险，工程中常需回火调整...", "mnemonic": "【答题抓手】扣准马氏体具有高、硬度、高强度，紧扣物理机制与适用条件展开", "pitfall": "实际试样硬度还受马氏体比例、残余奥氏体及其他组织影响，不能把名义含碳量直接当作唯一硬度决定量。", "freq": "高频必背"}, {"id": "qa_08_47", "num": "08-47", "chapter": "ch8", "name": "08-47 马氏体硬度与含碳量如何相关？为什么高碳钢不一定淬后更韧？", "title": "马氏体硬度与含碳量如何相关？为什么高碳钢不一定淬后更韧？", "section": "叶 pp.261–263；第11章习题11。", "def": "碳增多通常增强过饱和固溶畸变，使马氏体硬度升高，但增幅可逐渐减弱；同时片状组织、内应力及脆性增加，韧性往往下降，残余奥氏体也可增多。\n【教材第11章第11题】马氏体的硬度随着碳含量的增加而升高，但当含碳量超过 0.6% 时，硬度增加的趋势会减缓。", "keyPoints": "碳增多通常增强过饱和固溶畸变，使马氏体硬度升高，但增幅可逐渐减弱；同时片状组织、内应力及脆性增加，韧性往往下降，残余奥氏体也可增多；实测淬火硬度还取决于马氏体比例、奥氏体化及冷却条件，不能只用名义含碳量判断", "mnemonic": "【答题抓手】扣准马氏体硬度与、含碳量相关高、碳钢不一定淬，紧扣物理机制与适用条件展开", "pitfall": "实测淬火硬度还取决于马氏体比例、奥氏体化及冷却条件，不能只用名义含碳量判断。", "freq": "高频必背"}, {"id": "qa_08_48", "num": "08-48", "chapter": "ch8", "name": "08-48 为什么淬火后可能存在残余奥氏体？是不是所有钢都必然残留很多？", "title": "为什么淬火后可能存在残余奥氏体？是不是所有钢都必然残留很多？", "section": "叶 pp.255–256、262–263；第11章习题9。", "def": "① 转变逐步进行，随着剩余奥氏体受约束及驱动力条件变化，可能需要继续降温才转变；当终了温度低于室温，冷至室温便可能保留奥氏体。\n② 含碳量和合金化可降低转变温度。\n【教材第11章第9题】大部分钢的 M_s 在室温以上，而 M_f 在室温以下，所以当淬火冷却到室温时将保留相当数量的未转变残余奥氏体。", "keyPoints": "转变逐步进行，随着剩余奥氏体受约束及驱动力条件变化，可能需要继续降温才转变；当终了温度低于室温，冷至室温便可能保留奥氏体；含碳量和合金化可降低转变温度；课后题用了“总是”，考试宜解释常见条件，不能理解为所有钢在任何冷却温度下都必定残留同样数量", "mnemonic": "【答题抓手】扣准淬火后可能存、在残余奥氏体、是不是所有钢，紧扣物理机制与适用条件展开", "pitfall": "课后题用了“总是”，考试宜解释常见条件，不能理解为所有钢在任何冷却温度下都必定残留同样数量。", "freq": "高频必背"}, {"id": "qa_08_49", "num": "08-49", "chapter": "ch8", "name": "08-49 CCT 图与 TTT 图有什么区别？为什么不能直接互换？", "title": "CCT 图与 TTT 图有什么区别？为什么不能直接互换？", "section": "叶 pp.256–257；第11章习题6。", "def": "CCT 描述持续冷却过程的转变，TTT 描述快速降至固定温度后的等温转变。连续冷却中温度及孕育过程不断变化，转变区常相对等温图发生移动；应沿给定冷却曲线判断。\n【教材第11章第6题】连续冷却转变图。CCT 图反映了在连续冷却条件下发生转变的规律，可用于预估实际热处理后零件的组织和性能，确定淬火临界冷却速率，从而选择淬火介质。", "keyPoints": "CCT 描述持续冷却过程的转变，TTT 描述快速降至固定温度后的等温转变；连续冷却中温度及孕育过程不断变化，转变区常相对等温图发生移动；应沿给定冷却曲线判断；不能把连续冷却在各温度的停留时间直接当作独立等温试验时间", "mnemonic": "【答题抓手】扣准图与、图有什么区别、不能直接互换，紧扣物理机制与适用条件展开", "pitfall": "不能把连续冷却在各温度的停留时间直接当作独立等温试验时间。", "freq": "高频必背"}, {"id": "qa_08_50", "num": "08-50", "chapter": "ch8", "name": "08-50 什么是淬火临界冷却速率？淬透性与淬硬性有什么区别？", "title": "什么是淬火临界冷却速率？淬透性与淬硬性有什么区别？", "section": "叶 pp.256–263；第11章习题7衍生。", "def": "临界冷却速率是在给定条件下避免指定扩散型转变、获得要求马氏体组织的最低冷却速率，常由与转变开始曲线相切的路径判断。\n【教材第11章第7题】CCT 图中不发生珠光体、贝氏体转变的最小冷却速率称为淬火临界冷却速率。它是保证奥氏体在连续冷却过程中不发生分解而全部过冷到马氏体区的最小冷却速率，可指导生产中获得高硬度高强度的马氏体。", "keyPoints": "临界冷却速率是在给定条件下避免指定扩散型转变、获得要求马氏体组织的最低冷却速率，常由与转变开始曲线相切的路径判断；淬透性强调一定冷却下形成硬化层的深度能力，淬硬性强调可获得的硬度水平；后者尤其与含碳量有关，两者不能互换", "mnemonic": "【答题抓手】扣准什么是淬火临、界冷却速率淬、透性与淬硬性，紧扣物理机制与适用条件展开", "pitfall": "淬透性强调一定冷却下形成硬化层的深度能力，淬硬性强调可获得的硬度水平；后者尤其与含碳量有关，两者不能互换。", "freq": "高频必背"}, {"id": "qa_08_51", "num": "08-51", "chapter": "ch8", "name": "08-51 “绕开珠光体区”是否等于不发生任何转变？", "title": "“绕开珠光体区”是否等于不发生任何转变？", "section": "叶 pp.247–257；正文衍生。", "def": "不等于。路径可绕开珠光体开始线后进入贝氏体区等温，形成贝氏体；也可继续快速冷却到以下形成马氏体。", "keyPoints": "不等于；路径可绕开珠光体开始线后进入贝氏体区等温，形成贝氏体；也可继续快速冷却到以下形成马氏体；必须跟踪整条温度—时间路径及剩余奥氏体，不能仅凭第一段没有碰到珠光体曲线就认定最终全马氏体", "mnemonic": "【答题抓手】扣准绕开珠光体区、是否等于不发、生任何转变，紧扣物理机制与适用条件展开", "pitfall": "必须跟踪整条温度—时间路径及剩余奥氏体，不能仅凭第一段没有碰到珠光体曲线就认定最终全马氏体。", "freq": "高频必背"}, {"id": "qa_08_52", "num": "08-52", "chapter": "ch8", "name": "08-52 分段等温处理时怎样计算最终组织？时间能否随意重新归零？", "title": "分段等温处理时怎样计算最终组织？时间能否随意重新归零？", "section": "叶 pp.247–257；正文衍生。", "def": "① 先算第一阶段已转变量，再将后续转变作用于剩余奥氏体。\n② 如先形成40%珠光体，后续“剩余奥氏体一半转贝氏体”只增加30%贝氏体。是否重置孕育计时取决于题目假设及适用动力学模型，真实前段热历史一般不能无条件抹去。\n③ 单条 TTT 图并不自动提供任意多段处理的完整信息。", "keyPoints": "先算第一阶段已转变量，再将后续转变作用于剩余奥氏体；如先形成40%珠光体，后续“剩余奥氏体一半转贝氏体”只增加30%贝氏体；是否重置孕育计时取决于题目假设及适用动力学模型，真实前段热历史一般不能无条件抹去；单条 TTT 图并不自动提供任意多段处理的完整信息", "mnemonic": "【答题抓手】扣准分段等温处理、时怎样计算最、终组织时间能，紧扣物理机制与适用条件展开", "pitfall": "是否重置孕育计时取决于题目假设及适用动力学模型，真实前段热历史一般不能无条件抹去。", "freq": "高频必背"}, {"id": "qa_08_53", "num": "08-53", "chapter": "ch8", "name": "08-53 退火、正火、淬火和回火的目的怎样联系组织变化？", "title": "退火、正火、淬火和回火的目的怎样联系组织变化？", "section": "叶 pp.157–164、247–263；综合衍生。", "def": "① 退火用于降低硬度、消除应力或调整组织，具体制度依对象而异。\n② 正火通过奥氏体化后空气冷却，通常得到较细的扩散型转变组织。\n③ 淬火抑制不希望的扩散转变以获得马氏体等。\n④ 回火使淬火组织发生分解与回复，降低内应力、调整强韧性。完整工艺规范在本书并非系统专题，本题是考纲热处理要求的基础补充。", "keyPoints": "退火用于降低硬度、消除应力或调整组织，具体制度依对象而异；正火通过奥氏体化后空气冷却，通常得到较细的扩散型转变组织；淬火抑制不希望的扩散转变以获得马氏体等；回火使淬火组织发生分解与回复，降低内应力、调整强韧性；完整工艺规范在本书并非系统专题，本题是考纲热处理要求的基础补充", "mnemonic": "【答题抓手】扣准退火、正火、淬火和回火的，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_54", "num": "08-54", "chapter": "ch8", "name": "08-54 如何为“强度与韧性兼顾”选择组织，而不是只比较硬度？", "title": "如何为“强度与韧性兼顾”选择组织，而不是只比较硬度？", "section": "叶 pp.257–263；正文衍生。", "def": "先明确载荷、温度和缺陷敏感性，再综合组织尺度、脆性相分布、残余应力与强度。", "keyPoints": "先明确载荷、温度和缺陷敏感性，再综合组织尺度、脆性相分布、残余应力与强度；细珠光体较粗珠光体强，适宜下贝氏体可兼顾强韧，未经回火的高碳马氏体虽硬但脆；不能按“马氏体最硬”直接认定它适合所有零件", "mnemonic": "【答题抓手】扣准强度与韧性兼、选择组织而不、是只硬度，紧扣物理机制与适用条件展开", "pitfall": "细珠光体较粗珠光体强，适宜下贝氏体可兼顾强韧，未经回火的高碳马氏体虽硬但脆；不能按“马氏体最硬”直接认定它适合所有零件。", "freq": "高频必背"}, {"id": "qa_08_55", "num": "08-55", "chapter": "ch8", "name": "08-55 Fe–0.45%C 合金从液态缓冷到室温的完整路径怎样写？", "title": "Fe–0.45%C 合金从液态缓冷到室温的完整路径怎样写？", "section": "叶 pp.217–223；第10章习题8。", "def": "① 平衡冷却凝固与固态相变路径：按 Fe–Fe3C 相图，液态合金冷至液相线先进入 L + δ 两相区，在 1495℃ 发生包晶反应（L + δ → γ）；之后经历 L + γ 两相区并完全凝固为单相奥氏体 γ；继续冷却越过 GS 线析出先共析铁素体 α，冷至 727℃ 时剩余 γ 发生共析反应形成珠光体 P（α + Fe3C）。\n② 室温平衡组织与相组成：室温下的主要组织组成物为 先共析 α + 珠光体 P，平衡相组成为 铁素体 α + 渗碳体 Fe3C。\n【教材第10章第8题】冷却路径：L → L+δ → L+γ → γ → γ+α → α+P（α + Fe3C_共析 + P）。 室温相分数：α 相 = (6.69 - 0.45) / (6.69 - 0) = 93.3%；Fe3C 相 = 1 - 93.3% = 6.7%。", "keyPoints": "先进入 L+δ 区，1495℃ 发生包晶反应；经 L+γ 凝固为 γ；越过 GS 析出先共析 α，727℃ 剩余 γ 共析为珠光体 P；室温组织为 先共析 α + P，相组成为 α + Fe3C", "mnemonic": "【答题抓手】扣准合金从液态缓、冷到室温的完、整路径怎样写，紧扣物理机制与适用条件展开", "pitfall": "不能跳过高温包晶阶段，或把全部 γ 都当作纯铁那样在 912℃ 转变；同时注意区分“组织（先共析α+P）”与“相（α+Fe3C）”。", "freq": "高频必背"}, {"id": "qa_08_56", "num": "08-56", "chapter": "ch8", "name": "08-56 如何说明教材第10章第5题“莱氏体、珠光体、共析渗碳体”的分类歧义？", "title": "如何说明教材第10章第5题“莱氏体、珠光体、共析渗碳体”的分类歧义？", "section": "叶 pp.235–236；第10章习题5。", "def": "① 低温莱氏体本身包含珠光体和渗碳体，而珠光体内部又包含共析渗碳体，三者并非天然互斥的统计类别。\n② 必须先明确问的是“莱氏体区域+莱氏体外珠光体+二次渗碳体”等组织分类，还是各相总量。\n【教材第10章第5题】原答案文件列式结果：莱氏体占比 40.6%，珠光体占比 45.9%，共析渗碳体占比 5.2%。", "keyPoints": "低温莱氏体本身包含珠光体和渗碳体，而珠光体内部又包含共析渗碳体，三者并非天然互斥的统计类别；必须先明确问的是“莱氏体区域+莱氏体外珠光体+二次渗碳体”等组织分类，还是各相总量；未澄清前不能把重叠类别相加为100%，也不能擅自将“共析”改成“二次”后不作说明", "mnemonic": "【答题抓手】扣准说明教材第、章第、莱氏体，紧扣物理机制与适用条件展开", "pitfall": "未澄清前不能把重叠类别相加为100%，也不能擅自将“共析”改成“二次”后不作说明。", "freq": "高频必背"}, {"id": "qa_08_D01", "num": "08-57", "chapter": "ch8", "name": "08-57 两相区内“相的成分”和“合金总成分”为什么不是同一数值？", "title": "两相区内“相的成分”和“合金总成分”为什么不是同一数值？", "section": "叶 pp.205–209；正文读图细分。", "def": "① 固定温度平衡态关系：两相区水平连接线的两端点给出相互平衡的两相各自成分（如 C_L 与 C_α）；合金总成分 C_0 位于两端点之间，是按两相质量分数加权的平均值。\n② 质量守恒方程组：\n   - 组元质量守恒式：w_L·C_L + w_α·C_α = C_0；\n   - 相分数总和约束：w_L + w_α = 1。\n③ 杠杆定则推论：由以上两式联立即可推出杠杆定则。总成分 C_0 越靠近某一相端点成分，该相所占相对质量比例就越大。", "keyPoints": "连接线端点为平衡相成分，C_0 为加权平均；守恒式 w_L·C_L + w_α·C_α = C_0 且 w_L + w_α = 1，由此推出杠杆定则", "mnemonic": "【答题抓手】扣准两相区内、相的成分、合金总成分，紧扣物理机制与适用条件展开", "pitfall": "不能把整块0.45%C钢里每个铁素体晶粒都写成含0.45%C；不能只从总成分的竖线位置读取两相的各自成分。冷却时总成分通常保持不变，但各相成分和相量会沿相图变化。", "freq": "考纲深度细化"}, {"id": "qa_08_D02", "num": "08-58", "chapter": "ch8", "name": "08-58 二元三相反应自由度为零，为什么仍能有不同总成分的合金在同温度反应？", "title": "二元三相反应自由度为零，为什么仍能有不同总成分的合金在同温度反应？", "section": "叶 pp.197、209–215；正文相律理解。", "def": "① 自由度指什么：二元定压三相平衡时，温度和三个平衡相的成分不能独立任意改变；这不等于每块试样的总体成分必须完全相同。\n② 原因：不同总体成分可以由相同平衡相以不同数量组成。相律通常不把各相数量作为决定平衡状态的独立强度变量计入，所以相量不同并不与自由度为零矛盾。\n③ 例子：多种亚共晶与过共晶合金的剩余液体都可能在同一共晶温度完成共晶反应，但初生相多少和共晶组织量不同。", "keyPoints": "不同总体成分可以由相同平衡相以不同数量组成", "mnemonic": "【答题抓手】扣准二元三相反应、自由度为零仍、能有不同总成，紧扣物理机制与适用条件展开", "pitfall": "自由度指什么：二元定压三相平衡时，温度和三个平衡相的成分不能独立任意改变；不要把“发生共晶反应”误说成“整块材料必是共晶成分”。", "freq": "考纲深度细化"}, {"id": "qa_08_D03", "num": "08-59", "chapter": "ch8", "name": "08-59 为什么初生相与共晶中的同名相属于同一个相，却要算成不同组织组成物？", "title": "为什么初生相与共晶中的同名相属于同一个相，却要算成不同组织组成物？", "section": "叶 pp.209–214；正文组织细分。", "def": "① 相按状态分：若两部分具有同种晶体结构和对应平衡成分，可以属于同一个α相。\n② 组织按历史分：初生α在共晶反应前由液相首先析出；共晶α与β在剩余液体共晶反应中协同形成，形貌、分布及来源不同。\n③ 计算后果：求α相总量时，要把初生α和共晶组织内部α相加；求共晶组织量则先求共晶反应前剩余液体量，不能只用最终α总量代表。\n④ 进一步条件：若降温后固溶度下降还发生二次析出，各组织内部的相量也会调整。必须明确是刚完成凝固还是最终室温状态。", "keyPoints": "相按状态分：若两部分具有同种晶体结构和对应平衡成分，可以属于同一个α相；组织按历史分：初生α在共晶反应前由液相首先析出；共晶α与β在剩余液体共晶反应中协同形成，形貌、分布及来源不同；计算后果：求α相总量时，要把初生α和共晶组织内部α相加；求共晶组织量则先求共晶反应前剩余液体量，不能只用最终α总量代表...", "mnemonic": "【答题抓手】扣准初生相与共晶、中的同名相属、于同一个相却，紧扣物理机制与适用条件展开", "pitfall": "求共晶组织量则先求共晶反应前剩余液体量，不能只用最终α总量代表。", "freq": "考纲深度细化"}, {"id": "qa_08_D04", "num": "08-60", "chapter": "ch8", "name": "08-60 奥氏体晶粒变粗为什么可能提高淬透性，却损害最终韧性？", "title": "奥氏体晶粒变粗为什么可能提高淬透性，却损害最终韧性？", "section": "叶 p.249、pp.174–176、256–263；正文关联。", "def": "① 提高淬透性的机制：珠光体等扩散型转变常在奥氏体晶界形核；奥氏体变粗后单位体积晶界面积减少，有效形核位置减少，转变开始可推迟，TTT曲线上半部向较长时间方向移动，较慢冷却也更容易避开该转变。\n② 韧性代价：粗大原奥氏体及其转变产物的尺度、裂纹路径和局部协调条件可能不利于韧性。因此“更容易淬出马氏体”和“淬后综合性能更好”不是一回事。\n③ 答题条件：需保持成分与奥氏体化等条件可比，不能据此建议无限提高加热温度使晶粒越粗越好。", "keyPoints": "珠光体等扩散型转变常在奥氏体晶界形核", "mnemonic": "【答题抓手】扣准奥氏体晶粒变、粗可能提高淬、透性却损害最，紧扣物理机制与适用条件展开", "pitfall": "因此“更容易淬出马氏体”和“淬后综合性能更好”不是一回事。", "freq": "考纲深度细化"}, {"id": "qa_08_D05", "num": "08-61", "chapter": "ch8", "name": "08-61 温度降低使碳扩散变慢，为什么珠光体长大速率还能先增大？", "title": "温度降低使碳扩散变慢，为什么珠光体长大速率还能先增大？", "section": "叶 pp.249–251；正文直接设问。", "def": "① 不能只看D：原子扩散系数随降温降低，但相变驱动力、局部浓度梯度及扩散距离也同时变化。\n② 教材解释要点：在相应珠光体温区，过冷增大使片层间距减小，碳从铁素体侧到渗碳体侧的传输距离缩短，配合增大的转变驱动力，可使实际协同长大加快；降温到更低范围后，原子迁移能力不足又会限制转变。", "keyPoints": "珠光体长大速率取决于碳扩散与相变驱动力的共同作用。温度刚低于共析点时驱动力随过冷度增加而增大；但温度过低时碳原子扩散系数D剧烈下降。二者相乘导致珠光体长大速率随过冷度呈现先增大后减小的“C”形曲线。", "mnemonic": "【记忆口诀】过冷度增驱动大，过冷度深扩散慢；两相竞争出峰值，C曲线鼻尖显最快。", "pitfall": "扩散速率单调随降温下降，但形核和生长驱动力随过冷单调上升，二者竞争是相变C曲线成因；长大速率与扩散系数不是同一个量，不能把两条温度曲线画成必然完全同形；也不能把“先加快”的区间趋势扩展成温度越低长大越快。", "freq": "考纲深度细化"}, {"id": "qa_08_D06", "num": "08-62", "chapter": "ch8", "name": "08-62 恒温转变量—时间曲线为什么呈S形？为什么与C曲线不是一回事？", "title": "恒温转变量—时间曲线为什么呈S形？为什么与C曲线不是一回事？", "section": "叶 pp.246–249；正文图线细分。", "def": "① S形过程：早期有效晶核少、产物总体积小，转变较慢；中期晶核数量与生长界面增多，转变量快速增加；后期母相减少、已长大区域相互碰撞，继续生长受限，转变又减慢。\n② 坐标区别： S形曲线在一个固定温度下画转变量随时间或对数时间的变化；C曲线把多个温度下达到指定转变量的时间汇总在温度—时间图上。前者说明一个等温过程，后者比较不同温度。\n③ 公式：教材以描述适用条件下的动力学。", "keyPoints": "S形过程：早期有效晶核少、产物总体积小，转变较慢；中期晶核数量与生长界面增多，转变量快速增加；后期母相减少、已长大区域相互碰撞，继续生长受限，转变又减慢；坐标区别： S形曲线在一个固定温度下画转变量随时间或对数时间的变化；C曲线把多个温度下达到指定转变量的时间汇总在温度—时间图上；前者说明一个等温过程，后者比较不同温度...", "mnemonic": "【答题抓手】扣准恒温转变量、时间曲线呈、形与，紧扣物理机制与适用条件展开", "pitfall": "系数与形核、生长方式及温度相关，不是给所有转变通用的一组常数。", "freq": "考纲深度细化"}, {"id": "qa_08_D07", "num": "08-63", "chapter": "ch8", "name": "08-63 马氏体转变与再结晶都能形成新形貌，为什么只有前者属于这里讨论的相变？", "title": "马氏体转变与再结晶都能形成新形貌，为什么只有前者属于这里讨论的相变？", "section": "叶 pp.159–160、253–256；跨章节比较。", "def": "① 马氏体：母相奥氏体的晶格经协同位移改变，形成具有不同结构特征及过饱和含碳状态的新相；碳长程扩散受到抑制，但仍属于固态相变。\n② 再结晶：变形晶粒被缺陷密度较低的新晶粒替代，主要变化在位错、形貌和取向，通常不改变原有相的晶格类型与化学成分。\n③ 核心区别： “出现新晶粒”和“生成新相”不能等同；是否有长程扩散也不是区分相变与非相变的唯一标准。不能因马氏体不需要碳长程扩散就否认它是相变。", "keyPoints": "马氏体：母相奥氏体的晶格经协同位移改变，形成具有不同结构特征及过饱和含碳状态的新相；碳长程扩散受到抑制，但仍属于固态相变；再结晶：变形晶粒被缺陷密度较低的新晶粒替代，主要变化在位错、形貌和取向，通常不改变原有相的晶格类型与化学成分；核心区别： “出现新晶粒”和“生成新相”不能等同；是否有长程扩散也不是区分相变与非相变的唯一标准...", "mnemonic": "【答题抓手】扣准马氏体转变与、再结晶都能形、成新形貌只有，紧扣物理机制与适用条件展开", "pitfall": "核心区别： “出现新晶粒”和“生成新相”不能等同。", "freq": "考纲深度细化"}, {"id": "qa_08_D08", "num": "08-64", "chapter": "ch8", "name": "08-64 为什么固态新相常呈片状或针状，而不是总选择表面积最小的球形？", "title": "为什么固态新相常呈片状或针状，而不是总选择表面积最小的球形？", "section": "叶 pp.245–246；正文机制细分。", "def": "① 完整能量：固态新相的形成不仅增加界面能，还可能因新旧相晶格与体积不匹配产生弹性应变能；界面能也可能随晶面取向不同。\n② 形貌选择：球形在各向同性、固定体积模型中表面积最小，但片状或针状可能沿低界面能或较易容纳应变的特定方向发展，使界面能与应变能之和更低。因此新相与母相常具有一定晶体学位向关系。", "keyPoints": "固态相变伴随相变体积差与切变，产生弹性应变能。球形表面积最小但弹性应变能极大；片状或针状结构虽然增加了界面面积，但可通过共格界面和几何位向大幅度松弛应变能，使系统总自由能(界面能+应变能)达到最小。", "mnemonic": "【记忆口诀】球形比表面积小，应变能巨不可消；片针共格应变释，总自由能最小招。", "pitfall": "液-固相变通常呈球形(应变能可松弛)，固-固相变必须考虑弹性应变能的强烈主导作用；液态球形均匀形核模型是便于推导的模型，不能要求所有固态析出物和马氏体片都呈球形；“球表面积最小”不是完整的固态相变能量论证。", "freq": "考纲深度细化"}, {"id": "qa_08_65_yf", "num": "08-65", "title": "二元平衡相图的相区接触与相界有哪些基本规律？", "name": "08-65 二元平衡相图的相区接触与相界有哪些基本规律？", "chapter": "ch8", "section": "教材p.205｜正文原标号：①—④（正文分条）", "freq": "叶飞正文分条", "def": "① 相界给出相变温度及平衡相成分，平衡相成分随温度沿相界变化。\n② 相邻区域的相数一般相差1：两个单相区之间有两相区，两个两相区由单相区或三相等温线隔开。\n③ 定压二元系三相平衡为水平线，其上三个成分点分别对应三个平衡相；最多三相平衡。\n④ 单相区与两相区的边界在三相等温线上相交时，其延长线应进入另一两相区。", "keyPoints": "① 相界给出相变温度及平衡相成分，平衡相成分随温度沿相界变化；② 相邻区域的相数一般相差1：两个单相区之间有两相区，两个两相区由单相区或三相等温线隔开；③ 定压二元系三相平衡为水平线，其上三个成分点分别对应三个平衡相；最多三相平衡；④ 单相区与两相区的边界在三相等温线上相交时，其延长线应进入另一两相区。", "pitfall": "本题按教材普通定压二元相图讨论；不要脱离相律条件机械推广至任意多元、变压图。", "mnemonic": ""}, {"id": "qa_08_66_yf", "num": "08-66", "title": "分析二元相图应获得哪三类信息？怎样确定？", "name": "08-66 分析二元相图应获得哪三类信息？怎样确定？", "chapter": "ch8", "section": "教材p.206—207｜正文原标号：①—③（正文分条）", "freq": "叶飞正文分条", "def": "① 存在的相：定位给定温度与合金总成分所对应的相区。\n② 各相成分：单相时等于合金总成分；两相时作等温连线，读取与相界交点的成分。\n③ 各相含量：依据总成分及连线端点成分，用杠杆定律计算。", "keyPoints": "① 存在的相：定位给定温度与合金总成分所对应的相区；② 各相成分：单相时等于合金总成分；两相时作等温连线，读取与相界交点的成分；③ 各相含量：依据总成分及连线端点成分，用杠杆定律计算。", "pitfall": "相成分回答“这个相里面含多少某元素”；相含量回答“整个合金有多少这个相”。二者不可互换。", "mnemonic": ""}, {"id": "qa_08_67_yf", "num": "08-67", "title": "典型二元共晶相图有哪些相区、特征线与特征点？", "name": "08-67 典型二元共晶相图有哪些相区、特征线与特征点？", "chapter": "ch8", "section": "教材p.209｜正文原标号：①—③（正文分条）", "freq": "叶飞正文分条", "def": "① 相区：液相及两种固相构成三个单相区；其两两组合形成三个两相区；共晶水平线表示三相平衡。\n② 特征线：液相线表示开始凝固，固相线表示凝固结束，固溶度线表示固态溶解度极限，共晶线对应三相反应。\n③ 特征点：两端为纯组元熔点，两固溶体端点给出共晶温度下的极限固溶度，共晶点给出发生共晶反应的液相成分。", "keyPoints": "① 相区：液相及两种固相构成三个单相区；其两两组合形成三个两相区；共晶水平线表示三相平衡；② 特征线：液相线表示开始凝固，固相线表示凝固结束，固溶度线表示固态溶解度极限，共晶线对应三相反应；③ 特征点：两端为纯组元熔点，两固溶体端点给出共晶温度下的极限固溶度，共晶点给出发生共晶反应的液相成分。", "pitfall": "原文用Pb-Sn图的A—G字母标点。换一幅图时应按物理意义识别，不能只背字母位置。", "mnemonic": ""}, {"id": "qa_08_68_yf", "num": "08-68", "title": "按成分位置，共晶体系合金可分为哪四类？", "name": "08-68 按成分位置，共晶体系合金可分为哪四类？", "chapter": "ch8", "section": "教材p.210｜正文原标号：①—④（正文分条）", "freq": "叶飞正文分条", "def": "① 端部固溶体合金：在共晶温度下两端固溶度极限以外、靠近纯组元的一侧。\n② 亚共晶合金：处于左侧固溶度极限与共晶成分之间。\n③ 共晶合金：成分等于共晶点成分。\n④ 过共晶合金：处于共晶成分与右侧固溶度极限之间。", "keyPoints": "① 端部固溶体合金：在共晶温度下两端固溶度极限以外、靠近纯组元的一侧；② 亚共晶合金：处于左侧固溶度极限与共晶成分之间；③ 共晶合金：成分等于共晶点成分；④ 过共晶合金：处于共晶成分与右侧固溶度极限之间。", "pitfall": "“共晶点左边”还包含端部固溶体合金，不能把整个左半边一律当作发生共晶反应的亚共晶合金。", "mnemonic": ""}, {"id": "qa_08_69_yf", "num": "08-69", "title": "以教材Pb-Sn端部固溶体合金为例，缓冷经过哪三个阶段？", "name": "08-69 以教材Pb-Sn端部固溶体合金为例，缓冷经过哪三个阶段？", "chapter": "ch8", "section": "教材p.210—211｜正文原标号：①—③（正文分条）", "freq": "叶飞正文分条", "def": "① 凝固区间：从液相析出α固溶体，α增多、液相减少，至凝固结束形成单相α。\n② 固态单相区：继续降温，尚未越过固溶度线时不发生析出转变。\n③ 越过固溶度线：固溶度随温度下降，过饱和α中析出二次β相，形成α与β两相。", "keyPoints": "① 凝固区间：从液相析出α固溶体，α增多、液相减少，至凝固结束形成单相α；② 固态单相区：继续降温，尚未越过固溶度线时不发生析出转变；③ 越过固溶度线：固溶度随温度下降，过饱和α中析出二次β相，形成α与β两相。", "pitfall": "教材示例为15%Sn合金。并非所有极低溶质的端部成分在所考察温区都会越过固溶度线。", "mnemonic": ""}, {"id": "qa_08_70_yf", "num": "08-70", "title": "亚共晶合金缓冷的三个主要阶段是什么？", "name": "08-70 亚共晶合金缓冷的三个主要阶段是什么？", "chapter": "ch8", "section": "教材p.211—212｜正文原标号：①—③（正文分条）", "freq": "叶飞正文分条", "def": "① 共晶前：优先析出初生α，剩余液相成分沿液相线趋近共晶点。\n② 共晶温度：剩余液相发生共晶反应，形成α与β的共晶组织，最终含初生α和共晶体。\n③ 共晶以后：固态溶解度变化使两种固溶体继续析出二次相；这些细小析出物常不易在共晶体中单独分辨。", "keyPoints": "① 共晶前：优先析出初生α，剩余液相成分沿液相线趋近共晶点；② 共晶温度：剩余液相发生共晶反应，形成α与β的共晶组织，最终含初生α和共晶体；③ 共晶以后：固态溶解度变化使两种固溶体继续析出二次相；这些细小析出物常不易在共晶体中单独分辨。", "pitfall": "计算共晶组织含量用“刚到共晶温度时的剩余液相量”；不能直接拿室温全部α或β的含量替代。", "mnemonic": ""}, {"id": "qa_08_71_yf", "num": "08-71", "title": "分析复杂二元相图的四个步骤是什么？", "name": "08-71 分析复杂二元相图的四个步骤是什么？", "chapter": "ch8", "section": "教材p.215—216｜正文原标号：①—④（正文分条）", "freq": "叶飞正文分条", "def": "① 判断稳定中间化合物：固定成分、稳定熔化的化合物可作为中间组元分割相图；不能对所有化合物垂线都这样处理。\n② 应用相区接触法则：确定各相区包含的相，注意三相平衡对应水平线。\n③ 判断三相反应：沿水平线识别有关单相，区分一相分解为两相或两相合成为一相。\n④ 确定相与组织组成物：继续沿冷却路径分析形成顺序，再按需要计算比例。", "keyPoints": "① 判断稳定中间化合物：固定成分、稳定熔化的化合物可作为中间组元分割相图；不能对所有化合物垂线都这样处理；② 应用相区接触法则：确定各相区包含的相，注意三相平衡对应水平线；③ 判断三相反应：沿水平线识别有关单相，区分一相分解为两相或两相合成为一相；④ 确定相与组织组成物：继续沿冷却路径分析形成顺序，再按需要计算比例。", "pitfall": "组织组成物包含生成历史，不能只看终态相区就直接确定所有组织名称。", "mnemonic": ""}, {"id": "qa_08_72_yf", "num": "08-72", "title": "铁碳体系中教材列出的基本固相有哪些？", "name": "08-72 铁碳体系中教材列出的基本固相有哪些？", "chapter": "ch8", "section": "教材p.217—218｜正文原标号：（1）—（4）（正文分条）", "freq": "叶飞正文分条", "def": "① 铁素体：碳在体心立方铁中的间隙固溶体，低温α铁素体溶碳量很小，塑性较好。\n② 奥氏体：碳在面心立方γ铁中的间隙固溶体，溶碳能力较强。\n③ 渗碳体：铁与碳的化合物，教材采用6.69%的碳质量分数，硬而脆。\n④ 石墨：碳的稳定晶体形式，与亚稳Fe-Fe3C体系中的渗碳体区分。", "keyPoints": "① 铁素体：碳在体心立方铁中的间隙固溶体，低温α铁素体溶碳量很小，塑性较好；② 奥氏体：碳在面心立方γ铁中的间隙固溶体，溶碳能力较强；③ 渗碳体：铁与碳的化合物，教材采用6.69%的碳质量分数，硬而脆；④ 石墨：碳的稳定晶体形式，与亚稳Fe-Fe3C体系中的渗碳体区分。", "pitfall": "题目若专问Fe-Fe3C相图，不应把石墨当作其中平衡相；高温δ铁素体同属BCC结构但温区不同。", "mnemonic": ""}, {"id": "qa_08_73_yf", "num": "08-73", "title": "Fe-Fe3C相图有哪些单相、两相与三相平衡区？", "name": "08-73 Fe-Fe3C相图有哪些单相、两相与三相平衡区？", "chapter": "ch8", "section": "教材p.219｜正文原标号：①—③（正文分条）", "freq": "叶飞正文分条", "def": "① 单相区：L、δ、γ、α以及固定成分的Fe3C。\n② 两相区：L+δ、L+γ、L+Fe3C、δ+γ、α+γ、γ+Fe3C、α+Fe3C。\n③ 三相平衡：L+δ+γ对应包晶；L+γ+Fe3C对应共晶；α+γ+Fe3C对应共析。", "keyPoints": "① 单相区：L、δ、γ、α以及固定成分的Fe3C；② 两相区：L+δ、L+γ、L+Fe3C、δ+γ、α+γ、γ+Fe3C、α+Fe3C；③ 三相平衡：L+δ+γ对应包晶；L+γ+Fe3C对应共晶；α+γ+Fe3C对应共析。", "pitfall": "珠光体与莱氏体是组织名称，不是新增单相；三相平衡在定压二元图中是等温线。", "mnemonic": ""}, {"id": "qa_08_74_yf", "num": "08-74", "title": "教材工业纯铁示例缓冷的七个阶段是什么？", "name": "08-74 教材工业纯铁示例缓冷的七个阶段是什么？", "chapter": "ch8", "section": "教材p.220｜正文原标号：①—⑦（正文分条）", "freq": "叶飞正文分条", "def": "① 液相开始结晶出δ，直至凝固完成。\n② δ单相降温。\n③ δ逐步转变成γ，直至完成。\n④ γ单相降温。\n⑤ γ逐步转变成α，直至完成。\n⑥ α单相继续降温。\n⑦ 低于相应固溶度线后，从α中析出少量三次渗碳体。", "keyPoints": "① 液相开始结晶出δ，直至凝固完成；② δ单相降温；③ δ逐步转变成γ，直至完成；④ γ单相降温；⑤ γ逐步转变成α，直至完成；⑥ α单相继续降温；⑦ 低于相应固溶度线后，从α中析出少量三次渗碳体。", "pitfall": "核对提醒：教材第⑥点误写“γ单相区”，按前一步已全部变为α及同页式(10-24)，应为α。此处描述的是书中含碳工业纯铁示例；严格纯铁不会凭空析出渗碳体。", "mnemonic": ""}, {"id": "qa_08_75_yf", "num": "08-75", "title": "教材0.45%C亚共析钢示例缓冷的七个阶段是什么？", "name": "08-75 教材0.45%C亚共析钢示例缓冷的七个阶段是什么？", "chapter": "ch8", "section": "教材p.222｜正文原标号：①—⑦（正文分条）", "freq": "叶飞正文分条", "def": "① 先从液相析出δ铁素体。\n② 到包晶温度发生L+δ→γ，示例中有液相剩余。\n③ 剩余液相继续凝固为γ，最终形成奥氏体单相。\n④ 奥氏体单相降温。\n⑤ 越过相界后析出先共析铁素体，剩余奥氏体逐渐富碳。\n⑥ 727℃时，剩余奥氏体达到共析成分，转变为珠光体。\n⑦ 继续冷却，铁素体中可析出少量三次渗碳体。", "keyPoints": "① 先从液相析出δ铁素体；② 到包晶温度发生L+δ→γ，示例中有液相剩余；③ 剩余液相继续凝固为γ，最终形成奥氏体单相；④ 奥氏体单相降温；⑤ 越过相界后析出先共析铁素体，剩余奥氏体逐渐富碳；⑥ 727℃时，剩余奥氏体达到共析成分，转变为珠光体；⑦ 继续冷却，铁素体中可析出少量三次渗碳体。", "pitfall": "室温主要组织为先共析铁素体+珠光体；若要求细致组织还可注明三次渗碳体。前几步包晶路径针对书中0.45%C示例，不代表所有亚共析成分完全相同。", "mnemonic": ""}, {"id": "qa_08_76_yf", "num": "08-76", "title": "过共析钢缓冷的四个阶段及组织是什么？", "name": "08-76 过共析钢缓冷的四个阶段及组织是什么？", "chapter": "ch8", "section": "教材p.223｜正文原标号：①—④（正文分条）", "freq": "叶飞正文分条", "def": "① 液相凝固为奥氏体。\n② 奥氏体单相降温。\n③ 进入γ+Fe3C区后，析出先共析渗碳体，也称二次渗碳体；常沿原奥氏体晶界形成。\n④ 到共析温度，剩余奥氏体转变为珠光体，随后整体冷却。", "keyPoints": "① 液相凝固为奥氏体；② 奥氏体单相降温；③ 进入γ+Fe3C区后，析出先共析渗碳体，也称二次渗碳体；常沿原奥氏体晶界形成；④ 到共析温度，剩余奥氏体转变为珠光体，随后整体冷却。", "pitfall": "室温主要组织为珠光体+二次渗碳体。网状渗碳体会损害性能，但不能把一切二次渗碳体均断言为连续网状。", "mnemonic": ""}, {"id": "qa_08_77_yf", "num": "08-77", "title": "共晶白口铸铁缓冷的三个阶段是什么？", "name": "08-77 共晶白口铸铁缓冷的三个阶段是什么？", "chapter": "ch8", "section": "教材p.223—224｜正文原标号：①—③（正文分条）", "freq": "叶飞正文分条", "def": "① 1148℃时，4.30%C液相发生共晶反应，形成奥氏体与渗碳体组成的高温莱氏体。\n② 1148℃至727℃，共晶奥氏体溶碳量下降，析出二次渗碳体，常依附共晶渗碳体。\n③ 727℃时，共晶奥氏体转变为珠光体，高温莱氏体变为低温或变态莱氏体。", "keyPoints": "① 1148℃时，4.30%C液相发生共晶反应，形成奥氏体与渗碳体组成的高温莱氏体；② 1148℃至727℃，共晶奥氏体溶碳量下降，析出二次渗碳体，常依附共晶渗碳体；③ 727℃时，共晶奥氏体转变为珠光体，高温莱氏体变为低温或变态莱氏体。", "pitfall": "不能把“莱氏体中的奥氏体量”视为在1148℃到727℃之间恒定；二次渗碳体析出使其质量发生变化。", "mnemonic": ""}, {"id": "qa_08_78_yf", "num": "08-78", "title": "亚共晶白口铸铁缓冷的五个阶段是什么？", "name": "08-78 亚共晶白口铸铁缓冷的五个阶段是什么？", "chapter": "ch8", "section": "教材p.224—225｜正文原标号：①—⑤（正文分条）", "freq": "叶飞正文分条", "def": "① 共晶前先析出初生奥氏体，剩余液相成分向4.30%C变化。\n② 1148℃时剩余液相形成高温莱氏体。\n③ 继续降温，初生及共晶奥氏体均析出二次渗碳体。\n④ 727℃时，初生奥氏体变成珠光体，共晶奥氏体也变为珠光体，使莱氏体转成变态莱氏体。\n⑤ 继续降温还有微量三次渗碳体析出，通常不改变可辨的总体组织形态。", "keyPoints": "① 共晶前先析出初生奥氏体，剩余液相成分向4.30%C变化；② 1148℃时剩余液相形成高温莱氏体；③ 继续降温，初生及共晶奥氏体均析出二次渗碳体；④ 727℃时，初生奥氏体变成珠光体，共晶奥氏体也变为珠光体，使莱氏体转成变态莱氏体；⑤ 继续降温还有微量三次渗碳体析出，通常不改变可辨的总体组织形态。", "pitfall": "室温常记P+二次渗碳体+变态莱氏体。做组织含量计算时，莱氏体内部组分不能再作为外部独立组织重复计数。", "mnemonic": ""}, {"id": "qa_08_79_yf", "num": "08-79", "title": "过共晶白口铸铁缓冷的五个阶段是什么？", "name": "08-79 过共晶白口铸铁缓冷的五个阶段是什么？", "chapter": "ch8", "section": "教材p.225—226｜正文原标号：①—⑤（正文分条）", "freq": "叶飞正文分条", "def": "① 从液相先结晶出一次渗碳体。\n② 1148℃时，剩余液相共晶转变为高温莱氏体。\n③ 继续降温，高温莱氏体中的奥氏体析出二次渗碳体。\n④ 727℃时，莱氏体中的奥氏体发生共析转变，形成变态莱氏体。\n⑤ 继续降温，微量三次渗碳体不易单独分辨，总体组织形态保持。", "keyPoints": "① 从液相先结晶出一次渗碳体；② 1148℃时，剩余液相共晶转变为高温莱氏体；③ 继续降温，高温莱氏体中的奥氏体析出二次渗碳体；④ 727℃时，莱氏体中的奥氏体发生共析转变，形成变态莱氏体；⑤ 继续降温，微量三次渗碳体不易单独分辨，总体组织形态保持。", "pitfall": "室温主要组织是一次渗碳体+变态莱氏体；一次渗碳体来自液相，二次来自奥氏体，三次来自铁素体。", "mnemonic": ""}, {"id": "qa_08_80_yf", "num": "08-80", "title": "教材从哪四方面解释固态相变形核通常较困难？", "name": "08-80 教材从哪四方面解释固态相变形核通常较困难？", "chapter": "ch8", "section": "教材p.246｜正文原标号：①—④（正文分条）", "freq": "叶飞正文分条", "def": "① 固体中扩散慢，原子迁移与重新排列较困难。\n② 固—固界面能可能较高，增加形核能垒。\n③ 教材所比较条件下，体积自由能驱动力较小，导致临界形核功较大。\n④ 固体不能像液体那样通过流动轻易适应体积变化，附加应变能增加形核阻力。", "keyPoints": "① 固体中扩散慢，原子迁移与重新排列较困难；② 固—固界面能可能较高，增加形核能垒；③ 教材所比较条件下，体积自由能驱动力较小，导致临界形核功较大；④ 固体不能像液体那样通过流动轻易适应体积变化，附加应变能增加形核阻力。", "pitfall": "这是教材概括的常见比较，界面能和驱动力的大小仍取决于具体相、共格性与温度，不能无条件排序。", "mnemonic": ""}, {"id": "qa_08_81_yf", "num": "08-81", "title": "决定贝氏体强度的三类因素是什么？", "name": "08-81 决定贝氏体强度的三类因素是什么？", "chapter": "ch8", "section": "教材p.259—260｜正文原标号：（1）—（3）（正文分条）", "freq": "叶飞正文分条", "def": "① 铁素体条、片的粗细：形成温度降低通常使条片细化，细晶作用增强。\n② 碳化物尺寸与分散度：颗粒越细小、分布越弥散，阻碍位错作用通常越强。\n③ 固溶强化和位错强化：较低形成温度可提高铁素体碳过饱和度与位错密度，进一步强化。", "keyPoints": "① 铁素体条、片的粗细：形成温度降低通常使条片细化，细晶作用增强；② 碳化物尺寸与分散度：颗粒越细小、分布越弥散，阻碍位错作用通常越强；③ 固溶强化和位错强化：较低形成温度可提高铁素体碳过饱和度与位错密度，进一步强化。", "pitfall": "解释下贝氏体强韧性时还应联系碳化物分布和有效晶粒尺寸；不能只说“碳多所以强”。", "mnemonic": ""}, {"id": "qa_08_82_yf", "num": "08-82", "title": "马氏体的五种强化因素是什么？", "name": "08-82 马氏体的五种强化因素是什么？", "chapter": "ch8", "section": "教材p.261—262｜正文原标号：①—⑤（正文分条）", "freq": "叶飞正文分条", "def": "① 相变强化：转变产生大量位错、孪晶、层错等缺陷，阻碍进一步变形。\n② 固溶强化：过饱和碳引起强烈点阵畸变，与位错相互作用。\n③ 时效强化：碳原子聚集、偏聚或细小碳化物析出，形成进一步的障碍。\n④ 亚结构强化：位错亚结构及孪晶界等阻碍位错运动。\n⑤ 细晶强化：原奥氏体晶粒、马氏体束等细化可提高强度。", "keyPoints": "① 相变强化：转变产生大量位错、孪晶、层错等缺陷，阻碍进一步变形；② 固溶强化：过饱和碳引起强烈点阵畸变，与位错相互作用；③ 时效强化：碳原子聚集、偏聚或细小碳化物析出，形成进一步的障碍；④ 亚结构强化：位错亚结构及孪晶界等阻碍位错运动；⑤ 细晶强化：原奥氏体晶粒、马氏体束等细化可提高强度。", "pitfall": "按教材五项顺序作答。相变强化和亚结构强化存在机制联系，不宜将它们当作必然可简单相加的五个独立数值。低碳板条马氏体并非必然硬脆。", "mnemonic": ""}, {"id": "qa_09_01", "num": "09-01", "chapter": "ch9", "name": "09-01 经典自由电子模型如何解释电导率？", "title": "经典自由电子模型如何解释电导率？", "section": "叶 pp.266–268；第12章习题1衍生。", "def": "① 物理模型图像：金属中价电子脱离母体原子成为自由电子气，在外加电场作用下沿逆电场方向产生定向加速漂移；同时电子不断与晶格热振动（声子）、杂质原子及晶体缺陷发生碰撞散射，形成流动阻力。\n② 经典德鲁德公式推导：\n   - 自由电子定向漂移产生的电导率：σ = n·e·μ；\n   - 电子迁移率表达式：μ = e·τ / m（其中 e 为元电荷，m 为电子质量，τ 为相邻两次碰撞间的平均自由散射时间 / 弛豫时间）；\n   - 综合电导率公式：σ = n·e²·τ / m。\n③ 决定因素分析：电导率正比于自由电子浓度 n 与弛豫时间 τ，反比于电子质量 m。金属电导率主要受晶格与杂质对电子的散射频率控制。\n【教材第12章第1题】载流子浓度：7.625 × 10^28 m^-3；迁移率：55.67 cm²/(V·s)（或 5.567 × 10^-3 m²/(V·s)）。", "keyPoints": "自由电子受电场漂移受晶格缺陷散射；电导率 σ = n·e·μ，迁移率 μ = e·τ/m，综合公式 σ = n·e²·τ/m；n 为电子浓度，τ 为弛豫时间；宏观电流由微小定向漂移速度产生", "mnemonic": "【记忆口诀】原子靠近能级分，连续区间成能带；价带填满导带空，禁带宽度判导体。", "pitfall": "电子的无规热运动速度高达 10⁶ m/s 但宏观电流为零；只有外电场驱动的微小定向漂移速度（10⁻⁴ ~ 10⁻³ m/s 级）才贡献电导，二者物理含义不可混淆。", "freq": "核心考点"}, {"id": "qa_09_02", "num": "09-02", "chapter": "ch9", "name": "09-02 能带如何形成？价带、导带和禁带分别是什么？", "title": "能带如何形成？价带、导带和禁带分别是什么？", "section": "叶 pp.268–271；正文。", "def": "① 大量原子靠近时，原子能级相互作用并分裂成密集能级，形成允许能带。\n② 禁止电子能态存在的能量区间称禁带。价带与成键价电子状态有关，导带中有可参与传导的电子状态。\n③ 导电还要求在外场作用下存在可转移到的邻近空态。", "keyPoints": "大量原子靠近时，原子能级相互作用并分裂成密集能级，形成允许能带；禁止电子能态存在的能量区间称禁带；价带与成键价电子状态有关，导带中有可参与传导的电子状态；导电还要求在外场作用下存在可转移到的邻近空态", "mnemonic": "【记忆口诀】电导虽看载流乘，电子漂移轻盈行；硅中电子迁移率，三倍空穴贡献赢。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_09_03", "num": "09-03", "chapter": "ch9", "name": "09-03 用四类典型能带结构解释金属、半导体和绝缘体导电差异。", "title": "用四类典型能带结构解释金属、半导体和绝缘体导电差异。", "section": "叶 pp.268–271；正文。", "def": "① 金属可以是最高占据能带未满，也可以是满带与空带重叠，费米能级附近有可用态。\n② 半导体价带与导带间有较小禁带，热激发或掺杂能产生载流子。\n③ 绝缘体禁带较大，常温载流子极少。", "keyPoints": "金属可以是最高占据能带未满，也可以是满带与空带重叠，费米能级附近有可用态；半导体价带与导带间有较小禁带，热激发或掺杂能产生载流子；绝缘体禁带较大，常温载流子极少；四种结构图通常指两种金属型、半导体型和绝缘体型，不能漏掉金属的两种情况", "mnemonic": "【记忆口诀】热激发电子空穴生，本征载流随温增；施主施电N型立，受主得电P型成。", "pitfall": "四种结构图通常指两种金属型、半导体型和绝缘体型，不能漏掉金属的两种情况。", "freq": "核心考点"}, {"id": "qa_09_04", "num": "09-04", "chapter": "ch9", "name": "09-04 什么是费米能级？“最高占据能级”在什么条件下成立？", "title": "什么是费米能级？“最高占据能级”在什么条件下成立？", "section": "叶 pp.268–271；第12章习题2；补充 S3。", "def": "① 费米能级可视为热平衡电子的化学势。\n② 0 K 的简化图像中对应电子填充的边界，常说最高占据能级。有限温度时占据分布变为费米—狄拉克函数，在处占据概率为1/2。\n③ 若在禁带内，不表示那里实际存在电子能态。\n【教材第12章第2题】在固体材料中，电子填充状态从低能级到高能级依次进行，电子填充的最高能级称为费米能级。绝缘体中，费米能级处于带隙接近正中间的位置。", "keyPoints": "费米能级可视为热平衡电子的化学势；0 K 的简化图像中对应电子填充的边界，常说最高占据能级；有限温度时占据分布变为费米—狄拉克函数，在处占据概率为1/2；若在禁带内，不表示那里实际存在电子能态", "mnemonic": "【记忆口诀】低温电离浓度升，中温耗尽载流恒；高温本征激发暴，费米能级移向中。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_09_05", "num": "09-05", "chapter": "ch9", "name": "09-05 半导体和绝缘体的费米能级通常位于哪里？", "title": "半导体和绝缘体的费米能级通常位于哪里？", "section": "叶 pp.268–275；第12章习题2。", "def": "本征半导体在禁带中部附近；常见绝缘体理想模型亦位于禁带内。N 型费米能级相对本征位置向导带靠近，P 型向价带靠近。\n【教材第12章第2题】在固体材料中，电子填充状态从低能级到高能级依次进行，电子填充的最高能级称为费米能级。绝缘体中，费米能级处于带隙接近正中间的位置。", "keyPoints": "本征半导体在禁带中部附近；常见绝缘体理想模型亦位于禁带内； N 型费米能级相对本征位置向导带靠近，P 型向价带靠近；不能说所有材料的费米能级恰好在禁带中央，杂质、缺陷及有效态密度差异都会影响位置", "mnemonic": "【记忆口诀】洛伦兹力偏电荷，横向电势霍尔生；正负符号定导型，载流浓度霍尔求。", "pitfall": "不能说所有材料的费米能级恰好在禁带中央，杂质、缺陷及有效态密度差异都会影响位置。", "freq": "核心考点"}, {"id": "qa_09_06", "num": "09-06", "chapter": "ch9", "name": "09-06 金属电阻率为什么随温度升高通常增加？马西森定则是什么？", "title": "金属电阻率为什么随温度升高通常增加？马西森定则是什么？", "section": "叶 pp.271–272；第12章习题3衍生。", "def": "常规金属的自由电子浓度随温度变化较小，升温使晶格振动增强、散射增多、迁移率下降，因此电阻率通常增大。\n【教材第12章第3题】随温度升高，金属的电导率下降，本征半导体的电导率上升。", "keyPoints": "常规金属的自由电子浓度随温度变化较小，升温使晶格振动增强、散射增多、迁移率下降，因此电阻率通常增大；近似可把晶格热散射、杂质及缺陷等贡献相加，即马西森定则；其适用是近似独立散射条件，不是任意温度和材料的严格定律", "mnemonic": "【答题抓手】扣准金属电阻率随、温度升高通常、增加马西森定，紧扣物理机制与适用条件展开", "pitfall": "近似可把晶格热散射、杂质及缺陷等贡献相加，即马西森定则；其适用是近似独立散射条件，不是任意温度和材料的严格定律。", "freq": "核心考点"}, {"id": "qa_09_07", "num": "09-07", "chapter": "ch9", "name": "09-07 合金化、冷加工和退火怎样影响金属电阻率？", "title": "合金化、冷加工和退火怎样影响金属电阻率？", "section": "叶 pp.271–272、157–164；正文。", "def": "溶质及变形缺陷破坏周期性，增加电子散射，通常使电阻率上升；回复、再结晶可减少部分缺陷散射。合金中有序化、析出导致溶质浓度变化，也会改变电阻率。应区分电子浓度改变与散射改变，普通金属中后者常更关键。", "keyPoints": "溶质及变形缺陷破坏周期性，增加电子散射，通常使电阻率上升；回复、再结晶可减少部分缺陷散射；合金中有序化、析出导致溶质浓度变化，也会改变电阻率；应区分电子浓度改变与散射改变，普通金属中后者常更关键", "mnemonic": "【答题抓手】扣准合金化、冷加工和退火、怎样影响金属，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_09_08", "num": "09-08", "chapter": "ch9", "name": "09-08 本征半导体的载流子是什么？为什么电子与空穴浓度相等？", "title": "本征半导体的载流子是什么？为什么电子与空穴浓度相等？", "section": "叶 pp.272–273；正文。", "def": "① 本征载流子成对产生机制：在纯净半导体中，价带电子受热激发越过禁带跃迁到导带成为自由电子，同时在价带留下共价键断裂的空位状态（空穴）。因此本征载流子必须成对产生，自由电子浓度 n 严格等于价带空穴浓度 p，即 n = p = n_i。\n② 电导率双载流子贡献：电子与空穴均参与导电，总电导率公式为 σ = n·e·μ_e + p·e·μ_h = n_i·e·(μ_e + μ_h)，其中 e 为元电荷，μ_e 与 μ_h 分别为电子与空穴的迁移率。\n③ 空穴物理本质：空穴并非晶体中真实的带正电粒子或质子迁移，而是大量近邻共价价电子相继填补空位产生集体定向运动的等效准粒子描述，其等效电荷为 +e。", "keyPoints": "本征热激发电子与空穴成对产生 n = p = n_i；总电导率 σ = n_i·e·(μ_e + μ_h)；空穴是价带缺失电子的集体等效描述不是质子迁移", "mnemonic": "【答题抓手】扣准本征半导体的、载流子是什么、电子与空穴浓，紧扣物理机制与适用条件展开", "pitfall": "本征激发载流子成对出现，电导率必须包含电子和空穴两项贡献，不可把空穴误当成实体正离子运动；半导体总电导率是电子与空穴两项贡献相加，切勿遗漏空穴项；空穴迁移率通常低于电子（μ_h < μ_e），故电子对电导率的贡献通常更大。", "freq": "核心考点"}, {"id": "qa_09_09", "num": "09-09", "chapter": "ch9", "name": "09-09 为什么本征半导体升温后电导率通常增加？", "title": "为什么本征半导体升温后电导率通常增加？", "section": "叶 pp.273、275–276；第12章习题3。", "def": "① 升温对本征半导体电导率的影响：随温度升高，本征半导体的电导率 σ 通常发生剧烈、呈指数级的显著增加（与金属随温度升高电导率下降完全相反）。\n② 载流子浓度与迁移率的双重竞争机制：\n   - 载流子浓度项：热激发剧增使本征载流子浓度 n_i 呈指数规律飞速增大，满足 n_i ∝ T^(3/2)·exp(-E_g / (2·k·T))；\n   - 迁移率项：随温度升高晶格热振动加剧，对载流子的声子散射增强，导致迁移率 μ 随温度下降（μ ∝ T^(-3/2)）；\n   - 决定性主导项：由于指数项 exp(-E_g/(2kT)) 的增长速度远压倒迁移率的幂律下降，载流子浓度的指数暴增占据绝对压倒优势，使总电导率 σ = n_i·e·(μ_e + μ_h) 随温度显著升高。\n【教材第12章第3题】随温度升高，金属的电导率下降，本征半导体的电导率上升。", "keyPoints": "本征载流子浓度指数增加 n_i ∝ exp(-E_g/(2kT)) 压倒晶格散射导致的迁移率下降，故半导体升温电导率急剧上升", "mnemonic": "【答题抓手】扣准本征半导体升、温后电导率通、常增加，紧扣物理机制与适用条件展开", "pitfall": "金属中载流子浓度恒定，升温散射增强导致电阻上升；半导体中载流子浓度随温度指数暴增，两类机制截然相反；切勿将金属中“升温晶格振动加剧导致电阻率增加”的单一结论直接搬用到半导体，半导体载流子浓度不是常数，浓度指数增长起决定作用。", "freq": "核心考点"}, {"id": "qa_09_10", "num": "09-10", "chapter": "ch9", "name": "09-10 N 型半导体如何形成？施主为何不同时产生一个价带空穴？", "title": "N 型半导体如何形成？施主为何不同时产生一个价带空穴？", "section": "叶 pp.273–275；第12章习题4(a)、5。", "def": "在 Si 中掺 P、As 等五价元素，多出的电子形成靠近导带的施主能级，电离后进入导带，施主留下带正电的离化中心。\n【教材第12章第4题】(a) 因为电子是从施主杂质能级激发至导带，价带电子未参与热激发过程，所以无法产生空穴。 (b) 因为电子是从价带激发至受主杂质能级，导带电子未参与热激发过程，所以无法产生自由电子。", "keyPoints": "在 Si 中掺 P、As 等五价元素，多出的电子形成靠近导带的施主能级，电离后进入导带，施主留下带正电的离化中心；电子来自施主束缚态而非价带，因此这一步不产生对应价带空穴；材料整体仍电中性，N 型不是宏观带负电", "mnemonic": "【答题抓手】扣准型半导体形成、施主为何不同、时产生一个价，紧扣物理机制与适用条件展开", "pitfall": "电子来自施主束缚态而非价带，因此这一步不产生对应价带空穴；材料整体仍电中性，N 型不是宏观带负电。", "freq": "核心考点"}, {"id": "qa_09_11", "num": "09-11", "chapter": "ch9", "name": "09-11 P 型半导体如何形成？受主为何不同时产生一个导带电子？", "title": "P 型半导体如何形成？受主为何不同时产生一个导带电子？", "section": "叶 pp.273–275；第12章习题4(b)。", "def": "Si 中三价受主可接受价带电子，形成带负电的离化受主，同时价带留下可迁移空穴。该电子进入受主态，没有被激发到导带，因此不会同时产生一个对应导带电子。空穴为多数载流子，但仍存在热激发形成的少数电子。\n【教材第12章第4题】(a) 因为电子是从施主杂质能级激发至导带，价带电子未参与热激发过程，所以无法产生空穴。 (b) 因为电子是从价带激发至受主杂质能级，导带电子未参与热激发过程，所以无法产生自由电子。", "keyPoints": "Si 中三价受主可接受价带电子，形成带负电的离化受主，同时价带留下可迁移空穴；该电子进入受主态，没有被激发到导带，因此不会同时产生一个对应导带电子；空穴为多数载流子，但仍存在热激发形成的少数电子", "mnemonic": "【答题抓手】扣准型半导体形成、受主为何不同、时产生一个导，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_09_12", "num": "09-12", "chapter": "ch9", "name": "09-12 多数载流子、少数载流子和电中性如何同时满足？", "title": "多数载流子、少数载流子和电中性如何同时满足？", "section": "叶 pp.273–276；正文。", "def": "① 多数载流子与少数载流子定义：\n   - 在 N 型半导体中，电子由施主杂质电离提供，电子为多数载流子（多子），空穴为本征热激发产生，空穴为少数载流子（少子）；\n   - 在 P 型半导体中相反，空穴为多数载流子（多子），电子为少数载流子（少子）。\n② 质量作用定律（载流子浓度积守恒）：\n   - 在热平衡且非简并条件下，自由电子浓度 n 与空穴浓度 p 的乘积恒等于本征载流子浓度 n_i 的平方：n·p = n_i²；\n   - 增加施主掺杂提高电子浓度 n 会强制抑制空穴浓度 p，但两者的乘积在定温下保持恒定。\n③ 宏观整体电中性方程：\n   - 半导体整体保持严格电中性，正负电荷代数和为零，电中性方程为：n + N_A⁻ = p + N_D⁺；\n   - 式中 N_D⁺ 为离化施主正中心浓度，N_A⁻ 为离化受主负中心浓度。在纯 N 型且室温杂质完全离化时，近似满足 n ≈ N_D。", "keyPoints": "热平衡满足质量作用定律 n·p = n_i²；整体宏观电中性方程为 n + N_A⁻ = p + N_D⁺；N 型多子为电子，P 型多子为空穴", "mnemonic": "【答题抓手】扣准多数载流子、少数载流子和、电中性同时满，紧扣物理机制与适用条件展开", "pitfall": "N 型半导体中自由电子的多余负电荷被离化施主正离子完全中和，材料对外整体严格呈电中性，切勿答成带负电；绝不能把“N 型半导体富含自由负电子”误以为“整块 N 型半导体带有宏观净负电荷”；自由电子带的负电荷与残留在晶格上的施主杂质离子正电荷完全等量中和，整体严格呈电中性。", "freq": "核心考点"}, {"id": "qa_09_13", "num": "09-13", "chapter": "ch9", "name": "09-13 N 型半导体载流子浓度随温度变化可分哪三个区？", "title": "N 型半导体载流子浓度随温度变化可分哪三个区？", "section": "叶 pp.275–276；正文。", "def": "N 型半导体电子浓度随温度变化可分为三个区域：。\n①低温电离区（冻结区）：施主杂质逐步电离，温度升高使电子浓度急剧增加；\n②中温耗尽区（强电离非本征区）：施主杂质全部电离，且本征激发极弱，电子浓度近似为常数 n ≈ N_D；\n③高温本征激发区：价带电子大量热激发跃迁至导带，本征激发占绝对主导，电子与空穴浓度 n = p 随温度急剧指数上升。", "keyPoints": "①低温电离区（冻结区）：施主杂质逐步电离，温度升高使电子浓度急剧增加； ②中温耗尽区（强电离非本征区）：施主杂质全部电离，且本征激发极弱，电子浓度近似为常数 n ≈ N_D； ③高温本征激发区：价带电子大量热激发跃迁至导带，本征激发占绝对主导，电子与空穴浓度 n = p 随温度急剧指数上升。N_D 为施主杂质掺杂浓度，不是载流子迁移率。", "mnemonic": "【答题抓手】扣准型半导体载流、子浓度随温度、变化可分哪三，紧扣物理机制与适用条件展开", "pitfall": "N_D 为施主杂质掺杂浓度，不是载流子迁移率。", "freq": "核心考点"}, {"id": "qa_09_14", "num": "09-14", "chapter": "ch9", "name": "09-14 迁移率为什么有时随温度下降，有时先升后降？", "title": "迁移率为什么有时随温度下降，有时先升后降？", "section": "叶 p.276；正文。", "def": "① 晶格散射主导：升温使晶格振动增强，电子受到更频繁或更强的散射，平均自由运动时间缩短，因此迁移率降低。教材低杂质浓度曲线主要体现这一趋势。\n② 电离杂质散射主导：带电杂质产生库仑扰动；在相应低温区，升温使载流子运动加快，单次经过杂质附近时相对偏转作用减弱，迁移率可以上升。它不是因为杂质消失，也不是因为升温使晶格更安静。\n③ 两者竞争：较高掺杂样品低温可由杂质散射主导，较高温又转为晶格散射主导，所以迁移率可先升后降。读图先确认温度轴是否为1/T，再判断主导机制；电导率还需乘载流子浓度，不能把迁移率曲线直接当作电导率曲线。", "keyPoints": "晶格散射主导：升温使晶格振动增强，电子受到更频繁或更强的散射，平均自由运动时间缩短，因此迁移率降低；教材低杂质浓度曲线主要体现这一趋势；电离杂质散射主导：带电杂质产生库仑扰动；在相应低温区，升温使载流子运动加快，单次经过杂质附近时相对偏转作用减弱，迁移率可以上升...", "mnemonic": "【答题抓手】扣准迁移率有时随、温度下降有时、先升后降，紧扣物理机制与适用条件展开", "pitfall": "它不是因为杂质消失，也不是因为升温使晶格更安静。", "freq": "核心考点"}, {"id": "qa_09_15", "num": "09-15", "chapter": "ch9", "name": "09-15 为什么不能只看载流子浓度判断电导率随温度变化？", "title": "为什么不能只看载流子浓度判断电导率随温度变化？", "section": "叶 pp.275–276；正文。", "def": "① 电导率 σ = n·e·μ_e + p·e·μ_h 同时取决于载流子浓度与迁移率。\n② 在杂质完全电离的中温非本征区，电子浓度基本恒定，但随温度升高声子（晶格振动）散射加剧使迁移率下降，因而电导率随温度升高反而下降；只有进入高温本征区，浓度指数级增长超过迁移率下降时电导率才重新上升。\n③ 因此“半导体电导率必随温度单调上升”是错误的，需明确区分温区与散射机制。", "keyPoints": "电导率 σ = n·e·μ_e + p·e·μ_h 同时取决于载流子浓度与迁移率；在杂质完全电离的中温非本征区，电子浓度基本恒定，但随温度升高声子（晶格振动）散射加剧使迁移率下降，因而电导率随温度升高反而下降；只有进入高温本征区，浓度指数级增长超过迁移率下降时电导率才重新上升；因此“半导体电导率必随温度单调上升”是错误的，需明确区分温区与散射机制", "mnemonic": "【答题抓手】扣准不能只看载流、子浓度判断电、导率随温度变，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_09_16", "num": "09-16", "chapter": "ch9", "name": "09-16 费米能级随温度变化应怎样回答才准确？", "title": "费米能级随温度变化应怎样回答才准确？", "section": "叶 pp.268–276 为基础；2027考纲补充 S3。", "def": "① 本征半导体在禁带中部附近，受导带、价带有效态密度及禁带温变影响。\n② 非简并条件下。在掺杂基本电离到本征激发占优的升温过程中，N 型和 P 型的费米能级总体趋向本征位置。\n③ 低温冻结区也参与时不宜无条件画成全温区单调直线。叶书未系统展开这一温变专题，本题是明确标注的补充。", "keyPoints": "本征半导体在禁带中部附近，受导带、价带有效态密度及禁带温变影响；非简并条件下；在掺杂基本电离到本征激发占优的升温过程中，N 型和 P 型的费米能级总体趋向本征位置；低温冻结区也参与时不宜无条件画成全温区单调直线；叶书未系统展开这一温变专题，本题是明确标注的补充", "mnemonic": "【答题抓手】扣准费米能级随温、度变化应怎样、回答才准确，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_09_17", "num": "09-17", "chapter": "ch9", "name": "09-17 霍尔效应是什么？如何用它判断载流子类型？", "title": "霍尔效应是什么？如何用它判断载流子类型？", "section": "叶 pp.276–277；第12章习题6衍生。", "def": "载流子在电流与磁场共同作用下发生横向偏转，积累电荷形成横向电场和霍尔电压。\n【教材第12章第6题】124.8 mV。", "keyPoints": "载流子在电流与磁场共同作用下发生横向偏转，积累电荷形成横向电场和霍尔电压；简单单一载流子模型中，霍尔系数符号可区分电子与空穴，大小可估算浓度；多载流子材料需综合各自浓度和迁移率，不能机械用单载流子公式", "mnemonic": "【答题抓手】扣准霍尔效应是什、么用它判断载、流子类型，紧扣物理机制与适用条件展开", "pitfall": "简单单一载流子模型中，霍尔系数符号可区分电子与空穴，大小可估算浓度；多载流子材料需综合各自浓度和迁移率，不能机械用单载流子公式。", "freq": "核心考点"}, {"id": "qa_09_18", "num": "09-18", "chapter": "ch9", "name": "09-18 p–n 结为何形成耗尽层和内建电场？", "title": "p–n 结为何形成耗尽层和内建电场？", "section": "叶 pp.277–278；正文延伸。", "def": "接触后电子和空穴沿浓度梯度扩散并复合，结附近留下不能自由迁移的离化施主和受主，形成耗尽层与内建电场。热平衡时漂移与扩散电流抵消；耗尽层并不是“完全没有任何电荷”，而是移动载流子减少、固定空间电荷存在。", "keyPoints": "接触后电子和空穴沿浓度梯度扩散并复合，结附近留下不能自由迁移的离化施主和受主，形成耗尽层与内建电场；热平衡时漂移与扩散电流抵消；耗尽层并不是“完全没有任何电荷”，而是移动载流子减少、固定空间电荷存在", "mnemonic": "【答题抓手】扣准结为何形成耗、尽层和内建电，紧扣物理机制与适用条件展开", "pitfall": "接触后电子和空穴沿浓度梯度扩散并复合，结附近留下不能自由迁移的离化施主和受主，形成耗尽层与内建电场。", "freq": "核心考点"}, {"id": "qa_09_19", "num": "09-19", "chapter": "ch9", "name": "09-19 陶瓷和聚合物的导电方式有哪些？", "title": "陶瓷和聚合物的导电方式有哪些？", "section": "叶 pp.278–279；正文。", "def": "陶瓷可通过电子或空穴导电，也可借离子缺陷迁移产生离子电导；导电类型取决于组成、价态和缺陷。普通聚合物通常绝缘，但共轭结构及适当掺杂可产生电导。", "keyPoints": "陶瓷可通过电子或空穴导电，也可借离子缺陷迁移产生离子电导；导电类型取决于组成、价态和缺陷；普通聚合物通常绝缘，但共轭结构及适当掺杂可产生电导；不能把“陶瓷都绝缘”“所有高分子都不导电”写成普遍结论", "mnemonic": "【答题抓手】扣准陶瓷和聚合物、的导电方式有、哪些，紧扣物理机制与适用条件展开", "pitfall": "不能把“陶瓷都绝缘”“所有高分子都不导电”写成普遍结论。", "freq": "核心考点"}, {"id": "qa_09_D01", "num": "09-20", "chapter": "ch9", "name": "09-20 为什么满能带不能像半满能带那样容易产生净电流？", "title": "为什么满能带不能像半满能带那样容易产生净电流？", "section": "叶 pp.268–271；正文机制细分。", "def": "① 核心概述：电子并非只要存在就能导电：外场要改变电子的状态分布，需有可到达的邻近允许空态。满带中所有允许状态已被占据，相反运动贡献在平衡分布下抵消，且微弱外场不能随意把电子放到已占据状态。\n② 金属情况：未满能带或满带与空带重叠时，费米能级附近存在可用空态，外场可使占据分布发生微小不对称，从而产生净漂移电流。", "keyPoints": "不应写成“满带电子完全静止”", "mnemonic": "【答题抓手】扣准满能带不能像、半满能带那样、容易产生净电，紧扣物理机制与适用条件展开", "pitfall": "满带中所有允许状态已被占据，相反运动贡献在平衡分布下抵消，且微弱外场不能随意把电子放到已占据状态；不应写成“满带电子完全静止”；也不能把半导体价带里有大量电子就等同于它在0K具有金属般电导。", "freq": "考纲深度细化"}, {"id": "qa_09_D02", "num": "09-21", "chapter": "ch9", "name": "09-21 本征半导体电子和空穴浓度相等，二者对电导率的贡献是否相等？", "title": "本征半导体电子和空穴浓度相等，二者对电导率的贡献是否相等？", "section": "叶 pp.272–273、276；正文公式辨析。", "def": "① 结论：尽管本征半导体中自由电子浓度严格等于价带空穴浓度（n = p = n_i），但二者对材料总电导率的贡献通常并不相等（电子电导通常显著大于空穴电导）。\n② 物理机制与公式分析：\n   - 半导体总电导率为电子与空穴两项之和：σ = σ_e + σ_h = n·e·μ_e + p·e·μ_h = n_i·e·(μ_e + μ_h)；\n   - 自由电子的电导贡献比例为 μ_e / (μ_e + μ_h)，空穴的贡献比例为 μ_h / (μ_e + μ_h)；\n   - 导带电子与价带空穴处于不同的能带结构中，导带底曲率通常大于价带顶曲率，导致电子的能带有效质量通常小于空穴（m_e* < m_h*）；\n   - 因而电子在晶格中的迁移率显著高于空穴迁移率（例如硅中室温电子迁移率约 1400 cm²/(V·s)，而空穴迁移率仅约 450 cm²/(V·s)，前者约为后者的 3 倍）。\n③ 答题因果链：电中性与成对激发约束的是载流子的数量守恒（n = p），而电导率取决于数量与迁移率的乘积；不能从“数量相同”错误推导得出“电流贡献各占一半”。", "keyPoints": "本征半导体 n = p = n_i，但电导率 σ = n_i·e·(μ_e + μ_h)；因电子有效质量小、迁移率高（Si 中 μ_e ≈ 3μ_h），电子对电导率的贡献显著大于空穴", "mnemonic": "【答题抓手】扣准本征半导体电、子和空穴浓度、相等二者对电，紧扣物理机制与适用条件展开", "pitfall": "载流子浓度相等不代表电导贡献相等，硅中电子迁移率约为空穴的 3 倍，电子贡献了约 75% 的电导率；切勿将空穴当成质子，空穴是大量价电子相继跃迁的集体等效效应，其散射机制更复杂、有效质量更大，导电能力弱于自由电子。", "freq": "考纲深度细化"}, {"id": "qa_09_D03", "num": "09-22", "chapter": "ch9", "name": "09-22 掺杂浓度增加为何一方面增加载流子，另一方面又降低迁移率？", "title": "掺杂浓度增加为何一方面增加载流子，另一方面又降低迁移率？", "section": "叶 pp.273–276；正文跨图解释。", "def": "① 浓度效应：施主或受主提供可电离的杂质能级，增加掺杂可提高相应多数载流子浓度。\n② 散射效应：离化杂质及其局部扰动又是散射中心，增多后平均自由运动时间缩短，迁移率下降。\n③ 综合判断：电导率取决于浓度与迁移率的乘积，必须合并两者，不能把迁移率降低直接判为电导率必降低；也不能把提高掺杂浓度说成没有副作用地无限提高导电能力。\n④ 条件：在严重补偿、杂质不完全电离或高浓度简并等情况下，简单近似可能不成立，应回到题目限定模型。", "keyPoints": "浓度效应：施主或受主提供可电离的杂质能级，增加掺杂可提高相应多数载流子浓度；散射效应：离化杂质及其局部扰动又是散射中心，增多后平均自由运动时间缩短，迁移率下降；综合判断：电导率取决于浓度与迁移率的乘积，必须合并两者，不能把迁移率降低直接判为电导率必降低；也不能把提高掺杂浓度说成没有副作用地无限提高导电能力...", "mnemonic": "【答题抓手】扣准掺杂浓度增加、为何一方面增、加载流子另一，紧扣物理机制与适用条件展开", "pitfall": "综合判断：电导率取决于浓度与迁移率的乘积，必须合并两者，不能把迁移率降低直接判为电导率必降低。", "freq": "考纲深度细化"}, {"id": "qa_09_D04", "num": "09-23", "chapter": "ch9", "name": "09-23 半导体温度图横轴写1/T或1000/T时，升温应往哪边看？", "title": "半导体温度图横轴写1/T或1000/T时，升温应往哪边看？", "section": "叶 pp.275–276，图12-11至12-14；正文读图细分。", "def": "① 先看横轴：横轴为倒温度，越向右对应温度越低；升温是从右向左。若上方还标摄氏温度，需检查其与下方倒温度轴是否方向相反。\n② 浓度图：本征区随1/T通常呈近似负斜率，向左升温时浓度上升；N型低温冻结区在较大的1/T一侧，中温杂质全电离平台在中间，高温本征区在较小的1/T一侧。\n③ 迁移率图：同样先转换读图方向再解释杂质散射和晶格散射的竞争。", "keyPoints": "先看横轴：横轴为倒温度，越向右对应温度越低；升温是从右向左；若上方还标摄氏温度，需检查其与下方倒温度轴是否方向相反；浓度图：本征区随1/T通常呈近似负斜率，向左升温时浓度上升；N型低温冻结区在较大的1/T一侧，中温杂质全电离平台在中间，高温本征区在较小的1/T一侧...", "mnemonic": "【答题抓手】扣准半导体温度图、横轴写、时升温应往哪，紧扣物理机制与适用条件展开", "pitfall": "不能把纸面从左到右误当作温度从低到高，从而把整个物理结论说反。", "freq": "考纲深度细化"}, {"id": "qa_09_D05", "num": "09-24", "chapter": "ch9", "name": "09-24 只测电导率为什么不能唯一确定半导体的载流子浓度和迁移率？", "title": "只测电导率为什么不能唯一确定半导体的载流子浓度和迁移率？", "section": "叶 pp.276–277；正文直接问题。", "def": "① 方程不足：即使只考虑一种载流子，也只是n与μ的乘积；许多不同的浓度、迁移率组合可以给出同一电导率，更无法仅据大小确定载流子正负。\n② 补充测量：在简单单载流子模型中，霍尔系数提供载流子符号及浓度信息，再结合电导率可估算迁移率。\n③ 模型限制：若电子和空穴都显著贡献导电，霍尔响应受两者浓度及迁移率共同影响，不能仍然把测得系数无条件当作某一浓度的倒数。", "keyPoints": "若电子和空穴都显著贡献导电，霍尔响应受两者浓度及迁移率共同影响，不能仍然把测得系数无条件当作某一浓度的倒数", "mnemonic": "【答题抓手】扣准只测电导率不、能唯一确定半、导体的载流子，紧扣物理机制与适用条件展开", "pitfall": "许多不同的浓度、迁移率组合可以给出同一电导率，更无法仅据大小确定载流子正负；答题需把“为什么不够”和“还需什么信息”写全。", "freq": "考纲深度细化"}, {"id": "qa_10_01", "num": "10-01", "chapter": "ch10", "name": "10-01 工程选材为什么必须同时考虑成分、结构、工艺和性能？", "title": "工程选材为什么必须同时考虑成分、结构、工艺和性能？", "section": "叶 pp.3–14；第1章习题2–6；2027考纲综合。", "def": "成分决定可能的键合与相，工艺决定实际组织、缺陷和形状，结构再影响性能，使用要求反过来约束材料与工艺选择。相同名义成分可因热处理而性能不同；选材还需考虑成本、加工、环境与寿命。\n【教材第1章第2题】材料通常指用来制造某种构件、器件、物品、机械等，并满足人类需求的物质。材料一定是物质，但是物质不一定是材料。", "keyPoints": "成分决定可能的键合与相，工艺决定实际组织、缺陷和形状，结构再影响性能，使用要求反过来约束材料与工艺选择；相同名义成分可因热处理而性能不同；选材还需考虑成本、加工、环境与寿命；材料是能满足一定使用要求的物质，不能把物质名称当成全部性能说明", "mnemonic": "【记忆口诀】基体连续承载荷，增强微粒纤维加；复合策略显奇效，比强比模胜单家。", "pitfall": "材料是能满足一定使用要求的物质，不能把物质名称当成全部性能说明。", "freq": "考纲应用"}, {"id": "qa_10_02", "num": "10-02", "chapter": "ch10", "name": "10-02 铁合金有哪些优势与局限？钢与铸铁怎样区别？", "title": "铁合金有哪些优势与局限？钢与铸铁怎样区别？", "section": "叶 pp.216–229；郭 pp.498–509。", "def": "① 铁合金优势与局限：资源、成本和制造体系有优势，组织与热处理调控范围广；局限包括密度较大、易腐蚀及部分使用温度受限问题。\n② 钢与铸铁的区别：教材按 Fe–Fe3C 相图将钢与白口铸铁的含碳量分界取约 2.11%C；钢通常适于塑性加工，铸铁常用于铸造成形。", "keyPoints": "铁合金资源、成本和制造体系有优势，组织与热处理调控范围广；局限包括密度、腐蚀及部分使用温度问题；教材按 Fe–Fe3C 相图将钢与白口铸铁的分界取约 2.11%C；钢通常适于塑性加工，铸铁常用于铸造成形", "mnemonic": "【记忆口诀】高熵效应降吉布，混合焓负成相争；原子尺寸错配度，协同决定固溶身。", "pitfall": "钢通常适于塑性加工，铸铁常用于铸造成形，但应同时说明石墨或碳化物状态，不能只按颜色区分。", "freq": "考纲应用"}, {"id": "qa_10_03", "num": "10-03", "chapter": "ch10", "name": "10-03 低碳、中碳和高碳钢的成分、组织、性能与用途如何联系？", "title": "低碳、中碳和高碳钢的成分、组织、性能与用途如何联系？", "section": "郭 pp.499–502；叶 pp.227–229 为组织依据。", "def": "① 按该郭福译本：低碳钢通常不超过约0.25%C，中碳钢约0.25%–0.60%C，高碳钢约 0.60%–1.4%C。低碳钢塑性、焊接成形性较好，用于板材、结构件。\n② 中碳钢经适当热处理兼顾强韧，用于轴、齿轮。\n③ 高碳钢硬度耐磨性较高，用于刀具、弹簧等。边界是工程分类近似，最终性能取决于组织和处理。", "keyPoints": "按该郭福译本：低碳钢通常不超过约0.25%C，中碳钢约0.25%–0.60%C，高碳钢约 0.60%–1.4%C；低碳钢塑性、焊接成形性较好，用于板材、结构件；中碳钢经适当热处理兼顾强韧，用于轴、齿轮；高碳钢硬度耐磨性较高，用于刀具、弹簧等；边界是工程分类近似，最终性能取决于组织和处理", "mnemonic": "【记忆口诀】非晶合金急冷成，无位错晶界阻程；超高强度耐腐蚀，软磁性能显威名。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "考纲应用"}, {"id": "qa_10_04", "num": "10-04", "chapter": "ch10", "name": "10-04 不锈钢为什么耐蚀？主要类型和使用限制是什么？", "title": "不锈钢为什么耐蚀？主要类型和使用限制是什么？", "section": "郭 p.502；叶 p.152 仅涉及部分相关内容。", "def": "① Cr 是主要耐蚀合金元素，郭书采用至少约11% Cr 的表述，表面形成富 Cr 钝化膜； Ni、Mo 等进一步调控组织和耐蚀性。\n② 按组织可分奥氏体、铁素体和马氏体类，强度、塑性、磁性及热处理响应不同。", "keyPoints": "Cr 是主要耐蚀合金元素，郭书采用至少约11% Cr 的表述，表面形成富 Cr 钝化膜； Ni、Mo 等进一步调控组织和耐蚀性；按组织可分奥氏体、铁素体和马氏体类，强度、塑性、磁性及热处理响应不同；不锈钢不是任何介质下都不生锈，局部腐蚀及环境条件仍需考虑", "mnemonic": "【答题抓手】扣准不锈钢耐蚀主、要类型和使用、限制是什么，紧扣物理机制与适用条件展开", "pitfall": "不锈钢不是任何介质下都不生锈，局部腐蚀及环境条件仍需考虑。", "freq": "考纲应用"}, {"id": "qa_10_05", "num": "10-05", "chapter": "ch10", "name": "10-05 低合金高强钢与普通低碳钢相比，强化从何而来？", "title": "低合金高强钢与普通低碳钢相比，强化从何而来？", "section": "郭 pp.499–500；叶 pp.148–157。", "def": "通过少量合金元素、晶粒细化及第二相析出等提高强度，尽量保持较好韧性与焊接成形性能。用途包括桥梁、建筑、车辆结构。", "keyPoints": "通过少量合金元素、晶粒细化及第二相析出等提高强度，尽量保持较好韧性与焊接成形性能；用途包括桥梁、建筑、车辆结构；不能把“高强”理解为只靠提高碳含量，否则可能明显损害焊接性和韧性", "mnemonic": "【答题抓手】扣准低合金高强钢、与普通低碳钢、相比强化从何，紧扣物理机制与适用条件展开", "pitfall": "不能把“高强”理解为只靠提高碳含量，否则可能明显损害焊接性和韧性。", "freq": "考纲应用"}, {"id": "qa_10_06", "num": "10-06", "chapter": "ch10", "name": "10-06 灰铸铁、球墨铸铁、白口铸铁和可锻铸铁为何性能不同？", "title": "灰铸铁、球墨铸铁、白口铸铁和可锻铸铁为何性能不同？", "section": "郭 pp.503–509（章节范围）；叶 pp.218、224–227 为基础。", "def": "① 关键是碳存在形态和基体组织。片状石墨易造成应力集中，使灰铸铁抗拉与塑性较低但减振、切削及铸造性能较好。\n② 球状石墨降低尖锐应力集中，球墨铸铁强韧性较好。\n③ 白口铸铁碳多为碳化物，硬而脆、耐磨。\n④ 可锻铸铁由适当白口铸铁退火形成团絮状石墨。各用途还受基体影响。", "keyPoints": "关键是碳存在形态和基体组织；片状石墨易造成应力集中，使灰铸铁抗拉与塑性较低但减振、切削及铸造性能较好；球状石墨降低尖锐应力集中，球墨铸铁强韧性较好；白口铸铁碳多为碳化物，硬而脆、耐磨；可锻铸铁由适当白口铸铁退火形成团絮状石墨；各用途还受基体影响", "mnemonic": "【答题抓手】扣准灰铸铁、球墨铸铁、白口铸铁和可，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "考纲应用"}, {"id": "qa_10_07", "num": "10-07", "chapter": "ch10", "name": "10-07 铸造合金与变形合金有什么区别？", "title": "铸造合金与变形合金有什么区别？", "section": "郭 p.509；2027考纲明确项。", "def": "按主要成形方法分类：铸造合金适于熔融后浇注成形，重视流动性、收缩及热裂倾向；变形合金适于轧制、锻造、挤压等塑性成形，重视塑性和加工窗口。", "keyPoints": "按主要成形方法分类：铸造合金适于熔融后浇注成形，重视流动性、收缩及热裂倾向；变形合金适于轧制、锻造、挤压等塑性成形，重视塑性和加工窗口；不是单纯 “铸造组织有晶粒、变形组织没晶粒”，也不能认为所有同成分合金都适于两种路线", "mnemonic": "【答题抓手】扣准铸造合金与变、形合金有什么、区别，紧扣物理机制与适用条件展开", "pitfall": "不是单纯 “铸造组织有晶粒、变形组织没晶粒”，也不能认为所有同成分合金都适于两种路线。", "freq": "考纲应用"}, {"id": "qa_10_08", "num": "10-08", "chapter": "ch10", "name": "10-08 铝合金为何常用于轻量化？不同铝合金怎样强化？", "title": "铝合金为何常用于轻量化？不同铝合金怎样强化？", "section": "郭 pp.511–512；叶 pp.148–157 为机制。", "def": "① Al 密度低、耐大气腐蚀、导电导热与成形性较好。\n② 通过固溶、加工硬化和析出强化可提高强度。Al–Cu、Al–Mg–Si、Al–Zn–Mg–Cu 等某些系列可热处理强化。\n③ 另一些主要靠冷加工等。应用包括交通、航空结构与容器。\n④ 应考虑温度升高后的软化和连接工艺。", "keyPoints": "Al 密度低、耐大气腐蚀、导电导热与成形性较好；通过固溶、加工硬化和析出强化可提高强度； Al–Cu、Al–Mg–Si、Al–Zn–Mg–Cu 等某些系列可热处理强化；另一些主要靠冷加工等；应用包括交通、航空结构与容器；应考虑温度升高后的软化和连接工艺", "mnemonic": "【答题抓手】扣准铝合金为何常、用于轻量化不、同铝合金怎样，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "考纲应用"}, {"id": "qa_10_09", "num": "10-09", "chapter": "ch10", "name": "10-09 镁合金为什么轻而室温成形较困难？", "title": "镁合金为什么轻而室温成形较困难？", "section": "郭 p.513；叶 pp.139–145。", "def": "Mg 密度很低，有利减重，但 HCP 结构使常温易开动滑移受限，热加工常更有利；通过 Al、Zn、Mn 等合金化可改善性能。", "keyPoints": "Mg 密度很低，有利减重，但 HCP 结构使常温易开动滑移受限，热加工常更有利；通过 Al、Zn、Mn 等合金化可改善性能；用于轻质壳体、交通等部件时，还需考虑耐蚀性、温度能力及加工安全，不能只按密度选材", "mnemonic": "【答题抓手】扣准镁合金轻而室、温成形较困难，紧扣物理机制与适用条件展开", "pitfall": "用于轻质壳体、交通等部件时，还需考虑耐蚀性、温度能力及加工安全，不能只按密度选材。", "freq": "考纲应用"}, {"id": "qa_10_10", "num": "10-10", "chapter": "ch10", "name": "10-10 钛合金的结构、性能与航空用途如何联系？", "title": "钛合金的结构、性能与航空用途如何联系？", "section": "郭 pp.513–514。", "def": "① Ti 密度低于钢，比强度高、耐蚀性好。\n② 低温 α 相为 HCP，高温 β 相为 BCC，合金元素可稳定不同相，形成 α、β 和 α+β 类型。可用于航空结构、发动机部分部件及耐蚀场合。", "keyPoints": "Ti 密度低于钢，比强度高、耐蚀性好；低温 α 相为 HCP，高温 β 相为 BCC，合金元素可稳定不同相，形成 α、β 和 α+β 类型；可用于航空结构、发动机部分部件及耐蚀场合；高成本、加工难度及实际温度上限需考虑，不应将其等同于任意高温下都稳定的材料", "mnemonic": "【答题抓手】扣准钛合金的结构、性能与航空用、途联系，紧扣物理机制与适用条件展开", "pitfall": "高成本、加工难度及实际温度上限需考虑，不应将其等同于任意高温下都稳定的材料。", "freq": "考纲应用"}, {"id": "qa_10_11", "num": "10-11", "chapter": "ch10", "name": "10-11 铜、黄铜、青铜和铍铜的成分与用途如何区分？", "title": "铜、黄铜、青铜和铍铜的成分与用途如何区分？", "section": "郭 pp.510–511。", "def": "① 纯铜突出导电导热及延展性。\n② 黄铜以 Cu–Zn 为主要体系，常用于成形件、管件等。\n③ 青铜传统为 Cu–Sn，也包括其他相应铜合金系列，常用于轴承、耐蚀等场合。\n④ 铍铜可经析出强化获得较高强度，常用于弹性元件。合金化通常改善某些力学性能，却可能降低纯铜的电导率。", "keyPoints": "纯铜突出导电导热及延展性；黄铜以 Cu–Zn 为主要体系，常用于成形件、管件等；青铜传统为 Cu–Sn，也包括其他相应铜合金系列，常用于轴承、耐蚀等场合；铍铜可经析出强化获得较高强度，常用于弹性元件；合金化通常改善某些力学性能，却可能降低纯铜的电导率", "mnemonic": "【答题抓手】扣准黄铜、青铜和铍铜的、成分与用途区，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "考纲应用"}, {"id": "qa_10_12", "num": "10-12", "chapter": "ch10", "name": "10-12 什么是比强度、比刚度？为什么航空选材不能只看绝对强度？", "title": "什么是比强度、比刚度？为什么航空选材不能只看绝对强度？", "section": "郭 pp.511–514、606–608；正文综合。", "def": "比强度是强度与密度之比，比刚度是弹性模量与密度之比，用于衡量单位重量的承载或刚度效率。航空结构常同时受重量、屈曲、疲劳、温度、连接及损伤容限限制，所以高绝对强度但高密度材料未必最优；纤维复合材料还要考虑方向性。", "keyPoints": "比强度是强度与密度之比，比刚度是弹性模量与密度之比，用于衡量单位重量的承载或刚度效率；航空结构常同时受重量、屈曲、疲劳、温度、连接及损伤容限限制，所以高绝对强度但高密度材料未必最优；纤维复合材料还要考虑方向性", "mnemonic": "【答题抓手】扣准什么是比强度、比刚度航空选、材不能只看绝，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "考纲应用"}, {"id": "qa_10_13", "num": "10-13", "chapter": "ch10", "name": "10-13 什么是高熵合金？多主元是否保证形成单相固溶体？", "title": "什么是高熵合金？多主元是否保证形成单相固溶体？", "section": "2027考纲明确项；叶正文未检得系统讲解；补充 S1。", "def": "经典成分定义通常指至少5种主要元素、各主元素原子分数约5%–35%的多主元合金；常用等原子或近等原子配比。", "keyPoints": "经典成分定义通常指至少5种主要元素、各主元素原子分数约5%–35%的多主元合金；常用等原子或近等原子配比；较高构型熵可能有利于固溶体稳定，但相稳定还受混合焓、温度及原子尺寸等影响，因此可出现多相和金属间化合物，不能把“必为单相”“必然性能最好”写进定义", "mnemonic": "【答题抓手】扣准什么是高熵合、金多主元是否、保证形成单相，紧扣物理机制与适用条件展开", "pitfall": "较高构型熵可能有利于固溶体稳定，但相稳定还受混合焓、温度及原子尺寸等影响，因此可出现多相和金属间化合物，不能把“必为单相”“必然性能最好”写进定义。", "freq": "考纲应用"}, {"id": "qa_10_14", "num": "10-14", "chapter": "ch10", "name": "10-14 玻璃为什么是非晶体？石英玻璃与石英晶体有什么区别？", "title": "玻璃为什么是非晶体？石英玻璃与石英晶体有什么区别？", "section": "叶 pp.46–47、64–65；郭 p.518。", "def": "① 玻璃属于典型的非晶态固体，微观结构具有短程有序而长程无序的网络特征，无固定熔点，加热时在玻璃化转变区逐渐软化；石英晶体是具有三维周期平移长程有序的晶体结构，具有确定熔点（1713℃）和各向异性。\n② 二者主要化学成分均为 SiO2，但因原子排列长程有序与否而具有迥异的物理力学性能。\n③ 透明性绝非判断非晶的依据，单晶石英同样完全光学透明。", "keyPoints": "玻璃属于典型的非晶态固体，微观结构具有短程有序而长程无序的网络特征，无固定熔点，加热时在玻璃化转变区逐渐软化；石英晶体是具有三维周期平移长程有序的晶体结构，具有确定熔点（1713℃）和各向异性；二者主要化学成分均为 SiO2，但因原子排列长程有序与否而具有迥异的物理力学性能；透明性绝非判断非晶的依据，单晶石英同样完全光学透明", "mnemonic": "【答题抓手】扣准玻璃是非晶体、石英玻璃与石、英晶体有什么，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "考纲应用"}, {"id": "qa_10_15", "num": "10-15", "chapter": "ch10", "name": "10-15 玻璃陶瓷与普通玻璃有什么不同？", "title": "玻璃陶瓷与普通玻璃有什么不同？", "section": "郭 pp.518–519（章节范围）；叶 pp.46–47 为基础。", "def": "玻璃陶瓷通常通过对玻璃控制形核和晶化，形成细小晶体与残余玻璃相共存的组织；普通玻璃主要保持非晶结构。", "keyPoints": "玻璃陶瓷通常通过对玻璃控制形核和晶化，形成细小晶体与残余玻璃相共存的组织；普通玻璃主要保持非晶结构；受控晶化可调节热膨胀、力学和耐热性能，但具体优劣由晶相、含量和组织决定，不能说“含晶体就一定不透明”", "mnemonic": "【答题抓手】扣准玻璃陶瓷与普、通玻璃有什么、不同，紧扣物理机制与适用条件展开", "pitfall": "受控晶化可调节热膨胀、力学和耐热性能，但具体优劣由晶相、含量和组织决定，不能说“含晶体就一定不透明”。", "freq": "考纲应用"}, {"id": "qa_10_16", "num": "10-16", "chapter": "ch10", "name": "10-16 耐火材料需要哪些主要性能？怎样根据环境选择？", "title": "耐火材料需要哪些主要性能？怎样根据环境选择？", "section": "郭 p.521；2027考纲明确项。", "def": "需在高温下保持承载和尺寸稳定，抵抗熔渣、熔体或气体侵蚀，并具有适当抗热震性。常见成分体系包括硅质、铝硅质、镁质等；选择需匹配酸碱性、温度及热循环。高熔点只是必要考虑之一，孔隙率、液相生成和高温强度同样重要。", "keyPoints": "需在高温下保持承载和尺寸稳定，抵抗熔渣、熔体或气体侵蚀，并具有适当抗热震性；常见成分体系包括硅质、铝硅质、镁质等；选择需匹配酸碱性、温度及热循环；高熔点只是必要考虑之一，孔隙率、液相生成和高温强度同样重要", "mnemonic": "【答题抓手】扣准耐火材料需要、哪些主要性能、怎样根据环境，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "考纲应用"}, {"id": "qa_10_17", "num": "10-17", "chapter": "ch10", "name": "10-17 纤维增强复合材料中纤维、基体和界面各起什么作用？", "title": "纤维增强复合材料中纤维、基体和界面各起什么作用？", "section": "郭 pp.606–608；叶 pp.3–9 有实例。", "def": "纤维主要承担沿其方向的载荷，基体固定纤维、传递载荷并提供环境保护；界面决定应力能否有效传递及损伤扩展方式。", "keyPoints": "纤维主要承担沿其方向的载荷，基体固定纤维、传递载荷并提供环境保护；界面决定应力能否有效传递及损伤扩展方式；性能取决于纤维长度、体积分数、取向、界面和缺陷，不是简单把高强纤维加入任意树脂就自动获得高强复合材料", "mnemonic": "【答题抓手】扣准纤维增强复合、材料中纤维、基体和界面各，紧扣物理机制与适用条件展开", "pitfall": "性能取决于纤维长度、体积分数、取向、界面和缺陷，不是简单把高强纤维加入任意树脂就自动获得高强复合材料。", "freq": "考纲应用"}, {"id": "qa_10_18", "num": "10-18", "chapter": "ch10", "name": "10-18 航空用碳纳米纤维有哪些制备路线？为什么不能只写普通碳纤维工艺？", "title": "航空用碳纳米纤维有哪些制备路线？为什么不能只写普通碳纤维工艺？", "section": "2027考纲原文为“碳纳米纤维”；叶未检得对应系统专题；补充 S2。", "def": "可按两类原理回答：。\n①静电纺丝制得 PAN 等前驱体纳米纤维，再经氧化稳定化、惰性气氛碳化，必要时进一步处理以调结构；\n②催化化学气相沉积，使含碳气体在催化颗粒附近分解并生长碳纳米纤维。", "keyPoints": "①静电纺丝制得 PAN 等前驱体纳米纤维，再经氧化稳定化、惰性气氛碳化，必要时进一步处理以调结构； ②催化化学气相沉积，使含碳气体在催化颗粒附近分解并生长碳纳米纤维。普通 PAN 碳纤维也有稳定化—碳化，但纤维尺度、成形方法和结构未必相同；考纲术语不能未经确认改成“碳纤维”。", "mnemonic": "【答题抓手】扣准航空用碳纳米、纤维有哪些制、备路线不能只，紧扣物理机制与适用条件展开", "pitfall": "普通 PAN 碳纤维也有稳定化—碳化，但纤维尺度、成形方法和结构未必相同；考纲术语不能未经确认改成“碳纤维”。", "freq": "考纲应用"}, {"id": "qa_10_19", "num": "10-19", "chapter": "ch10", "name": "10-19 PAN 前驱体为什么需要先稳定化再碳化？纳米纤维性能受什么影响？", "title": "PAN 前驱体为什么需要先稳定化再碳化？纳米纤维性能受什么影响？", "section": "补充 S2；2027考纲制备原理细分。", "def": "① 氧化稳定化引起环化、脱氢、交联等，使前驱体形成耐后续高温处理的结构，减少熔并和失形。\n② 惰性气氛碳化脱除非碳组分并形成富碳结构。温程、气氛、张力或约束会影响收缩、缺陷和取向，因而影响最终力学与电学性能。", "keyPoints": "氧化稳定化引起环化、脱氢、交联等，使前驱体形成耐后续高温处理的结构，减少熔并和失形；惰性气氛碳化脱除非碳组分并形成富碳结构；温程、气氛、张力或约束会影响收缩、缺陷和取向，因而影响最终力学与电学性能；不能保证不同工艺所得纳米纤维性能相同", "mnemonic": "【答题抓手】扣准前驱体需要先、稳定化再碳化、纳米纤维性能，紧扣物理机制与适用条件展开", "pitfall": "不能保证不同工艺所得纳米纤维性能相同。", "freq": "考纲应用"}, {"id": "qa_10_20", "num": "10-20", "chapter": "ch10", "name": "10-20 碳纳米纤维用于航空相关复合材料有哪些潜在优势和限制？", "title": "碳纳米纤维用于航空相关复合材料有哪些潜在优势和限制？", "section": "补充 S2；郭 pp.606–608 为复合材料机理基础。", "def": "① 低密度、高长径比及可调碳结构，使其可用于增强、导电或热管理等多功能设计；具体效果取决于纤维质量、分散、取向、界面与网络连续性。\n② 团聚、界面热阻、缺陷、氧化及基体耐温会限制性能。", "keyPoints": "低密度、高长径比及可调碳结构，使其可用于增强、导电或热管理等多功能设计；具体效果取决于纤维质量、分散、取向、界面与网络连续性；团聚、界面热阻、缺陷、氧化及基体耐温会限制性能；不能把单根理想纤维性能直接当作复合构件性能，也不能把所有纳米纤维等同于碳纳米管", "mnemonic": "【答题抓手】扣准碳纳米纤维用、于航空相关复、合材料有哪些，紧扣物理机制与适用条件展开", "pitfall": "不能把单根理想纤维性能直接当作复合构件性能，也不能把所有纳米纤维等同于碳纳米管。", "freq": "考纲应用"}, {"id": "qa_10_D01", "num": "10-21", "chapter": "ch10", "name": "10-21 为什么称为高熵合金，不意味着熵是决定组织的唯一因素？", "title": "为什么称为高熵合金，不意味着熵是决定组织的唯一因素？", "section": "2027考纲高熵合金项；原版补充S1；与叶pp.200–204的自由能概念联系。", "def": "① 热力学框架：相稳定取决于自由能中的焓与熵等贡献，而不是只比较“元素种数多不多”。多主元混合可提高构型熵，温度较高时熵项对固溶体稳定的作用可能更明显。\n② 为何可多相：组元化学相互作用、尺寸失配、温度和其他相的自由能可能使有序相或多相组合更稳定，所以高熵合金可以形成多相。\n③ 答题边界：经典成分定义是一种分类口径，不能由定义推出必为单相、必耐高温或必强韧。此题为考纲补充与教材热力学的联系，不冒充叶书已有高熵专题。", "keyPoints": "高熵效应(ΔS_mix增大)促使系统自由能ΔG = ΔH_mix - TΔS_mix降低，有利于形成简单固溶体；但若组元间负混合焓ΔH_mix过大或原子尺寸差δ过大，仍会析出金属间化合物或发生相分离。必须结合热力学参数(Ω与δ)综合判断。", "mnemonic": "【记忆口诀】高熵效应降吉布，混合焓负成相争；原子尺寸错配度，协同决定固溶身。", "pitfall": "切忌认为称为“高熵合金”就必然是单相固溶体。", "freq": "考纲深度细化"}, {"id": "qa_10_D02", "num": "10-22", "chapter": "ch10", "name": "10-22 为什么纤维很强，复合材料却未必达到按纤维强度直接估算的性能？", "title": "为什么纤维很强，复合材料却未必达到按纤维强度直接估算的性能？", "section": "郭 pp.606–608；2027考纲应用项，原版补充来源。", "def": "① 传力条件：外力需经基体和界面传到纤维，纤维过短、取向偏离载荷、界面传力不足或存在孔洞，都可能使纤维强度未充分发挥。\n② 实际损伤：纤维分布不均、团聚、断纤和层间缺陷会产生局部薄弱区；复合材料沿纤维和横向的性能也不同。因此单根理想纤维的性能不能直接代替整件复合材料的强度、疲劳或耐温能力。\n③ 界面也非越强越好：需要兼顾有效传力与损伤耗能机制，具体最佳界面取决于体系与应用。本题按教材复合材料原理解释，不声称任意一种碳纳米纤维已达到特定航空应用指标。", "keyPoints": "传力条件：外力需经基体和界面传到纤维，纤维过短、取向偏离载荷、界面传力不足或存在孔洞，都可能使纤维强度未充分发挥；实际损伤：纤维分布不均、团聚、断纤和层间缺陷会产生局部薄弱区；复合材料沿纤维和横向的性能也不同；因此单根理想纤维的性能不能直接代替整件复合材料的强度、疲劳或耐温能力...", "mnemonic": "【答题抓手】扣准纤维很强复合、材料却未必达、到按纤维强度，紧扣物理机制与适用条件展开", "pitfall": "因此单根理想纤维的性能不能直接代替整件复合材料的强度、疲劳或耐温能力。", "freq": "考纲深度细化"}, {"id": "qa_A_01", "num": "A-01", "chapter": "ch_appA", "name": "A-01 材料科学与材料工程侧重点如何区分？材料怎样分类？", "title": "材料科学与材料工程侧重点如何区分？材料怎样分类？", "section": "叶 pp.3–14；第1章习题2–6。", "def": "材料科学重点研究成分、结构与性能间规律，材料工程更关注利用这些规律设计、制造和应用材料。按组成可分金属、陶瓷、高分子及复合材料等；按功能可分结构与功能材料等。\n【教材第1章第2题】材料通常指用来制造某种构件、器件、物品、机械等，并满足人类需求的物质。材料一定是物质，但是物质不一定是材料。", "keyPoints": "材料科学重点研究成分、结构与性能间规律，材料工程更关注利用这些规律设计、制造和应用材料；按组成可分金属、陶瓷、高分子及复合材料等；按功能可分结构与功能材料等；分类依据不同可交叉，不能将不同维度的名称拼成互斥类别", "mnemonic": "【答题抓手】扣准材料科学与材、料工程侧重点、区分材料怎样，紧扣物理机制与适用条件展开", "pitfall": "分类依据不同可交叉，不能将不同维度的名称拼成互斥类别。", "freq": "拔高扩展"}, {"id": "qa_A_02", "num": "A-02", "chapter": "ch_appA", "name": "A-02 教材第1章的历史、夯土和应用查资料题怎样准备？", "title": "教材第1章的历史、夯土和应用查资料题怎样准备？", "section": "叶 p.16；第1章习题1、7、8。", "def": "采用“具体材料—组成或结构—加工方法—目标性能—使用限制—可核实来源”回答。夯土、防弹衣、燃料电池等存在多种技术路线，不能为每种产品武断指定唯一材料。此类开放检索题本题库保留答题框架，不提供未经逐项考证的历史断言或唯一标准答案。\n【教材第1章第1题】① 成分上：加入一定比例的草筋或动物毛发，提高墙体的抗裂性和拉伸强度；加入石子或碎陶片来增加耐用性。 ② 工艺上：使用木制或石制的夯锤以均匀而有力的节奏进行敲打，通过层层铺垫、层层夯实，确保每一层土都能够达到预期的紧实度。", "keyPoints": "采用“具体材料—组成或结构—加工方法—目标性能—使用限制—可核实来源”回答；夯土、防弹衣、燃料电池等存在多种技术路线，不能为每种产品武断指定唯一材料；此类开放检索题本题库保留答题框架，不提供未经逐项考证的历史断言或唯一标准答案", "mnemonic": "【答题抓手】扣准教材第、章的历史、夯土和应用查，紧扣物理机制与适用条件展开", "pitfall": "夯土、防弹衣、燃料电池等存在多种技术路线，不能为每种产品武断指定唯一材料。", "freq": "拔高扩展"}, {"id": "qa_A_03", "num": "A-03", "chapter": "ch_appA", "name": "A-03 三元成分三角形中平行于边和通过顶点的直线各表示什么？", "title": "三元成分三角形中平行于边和通过顶点的直线各表示什么？", "section": "叶 pp.229–235；第10章习题10。", "def": "在三元成分等边三角形中：。\n①平行于某一边的任意直线上，对应该边所对顶角代表的第三组元含量保持恒定；\n②通过某一顶点的任意直线上，该线上的所有合金中另外两组元的质量比例（或原子比）保持恒定。读取三元坐标必须按顺时针或逆时针统一方向沿各边标尺平移读取。\n【教材第10章第10题】成分点位于与等边三角形某一边平行的直线上的所有合金，其中含有与此线相对顶角的组元含量相等；成分点位于通过等边三角形某顶角的直线上的所有合金，其中含有此直线两侧的两个组元的浓度比值相等。", "keyPoints": "①平行于某一边的任意直线上，对应该边所对顶角代表的第三组元含量保持恒定； ②通过某一顶点的任意直线上，该线上的所有合金中另外两组元的质量比例（或原子比）保持恒定。读取三元坐标必须按顺时针或逆时针统一方向沿各边标尺平移读取。", "mnemonic": "【答题抓手】扣准三元成分三角、形中平行于边、和通过顶点的，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_A_04", "num": "A-04", "chapter": "ch_appA", "name": "A-04 介电极化有哪些机制？频率升高为什么会改变介电响应？", "title": "介电极化有哪些机制？频率升高为什么会改变介电响应？", "section": "叶 pp.280–287；第12章习题8。", "def": "包括电子位移、离子位移、偶极取向及界面或空间电荷等极化。各机制具有不同响应时间，频率升高时较慢机制来不及跟随，贡献降低并可能出现损耗。\n【教材第12章第8题】极化指的是原子或分子诱导偶极矩对外加电场的响应，包括电子极化、离子极化以及取向极化（及空间电荷极化）。", "keyPoints": "包括电子位移、离子位移、偶极取向及界面或空间电荷等极化；各机制具有不同响应时间，频率升高时较慢机制来不及跟随，贡献降低并可能出现损耗；不能把极化等同于电荷穿透整个绝缘体的持续导电", "mnemonic": "【答题抓手】扣准介电极化有哪、些机制频率升、高会改变介电，紧扣物理机制与适用条件展开", "pitfall": "不能把极化等同于电荷穿透整个绝缘体的持续导电。", "freq": "拔高扩展"}, {"id": "qa_A_05", "num": "A-05", "chapter": "ch_appA", "name": "A-05 电容、介电常数和介电损耗有什么区别？", "title": "电容、介电常数和介电损耗有什么区别？", "section": "叶 pp.280–287；第12章习题7衍生。", "def": "① 在平行板电容器模型中，电容 C = ε_r·ε_0·A/d，电容量不仅取决于材料本身，还强烈依赖几何尺度。\n② 相对介电常数 ε_r 表征介质在外电场下的电极化储能能力。\n③ 介电损耗（tanδ）表征交变电场中介质反复极化所引起的能量耗散。\n④ 击穿场强是绝缘性能丧失的临界极限。\n【教材第12章第7题】(a) 100 pF；(b) 200 V。", "keyPoints": "在平行板电容器模型中，电容 C = ε_r·ε_0·A/d，电容量不仅取决于材料本身，还强烈依赖几何尺度；相对介电常数 ε_r 表征介质在外电场下的电极化储能能力；介电损耗（tanδ）表征交变电场中介质反复极化所引起的能量耗散；击穿场强是绝缘性能丧失的临界极限；三者为不同物理指标，不可混淆", "mnemonic": "【答题抓手】扣准电容、介电常数和介、电损耗有什么，紧扣物理机制与适用条件展开", "pitfall": "三者为不同物理指标，不可混淆。", "freq": "拔高扩展"}, {"id": "qa_A_06", "num": "A-06", "chapter": "ch_appA", "name": "A-06 热容、比热容和热导率有什么区别？", "title": "热容、比热容和热导率有什么区别？", "section": "叶 pp.289–292、296–298；正文。", "def": "① 热容表征样品升高单位温度需吸收多少热，比热容按质量等归一化。\n② 热导率表征温度梯度下传热能力。高热容不必高热导。", "keyPoints": "热容表征样品升高单位温度需吸收多少热，比热容按质量等归一化；热导率表征温度梯度下传热能力；高热容不必高热导；热扩散率还与密度、比热容有关，因此“储热快”和“能储热多”不能混为一谈", "mnemonic": "【答题抓手】扣准热容、比热容和热导、率有什么区别，紧扣物理机制与适用条件展开", "pitfall": "热扩散率还与密度、比热容有关，因此“储热快”和“能储热多”不能混为一谈。", "freq": "拔高扩展"}, {"id": "qa_A_07", "num": "A-07", "chapter": "ch_appA", "name": "A-07 经典热容理论与低温热容行为有什么区别？", "title": "经典热容理论与低温热容行为有什么区别？", "section": "叶 pp.290–292；正文。", "def": "经典热容理论（杜隆—珀蒂定律）给出高温下固体晶格摩尔定容热容约为常数 C_v ≈ 3R（约 25 J/(mol·K)）；但在低温下由于晶格振动模式量子化，高频声子无法被激发，热容随温度降低而迅速下降，在极低温下服从德拜 T³ 律（C_v ∝ T³）。金属在低温下还存在自由电子热容贡献 C_e = γT，在接近 0 K 时占主要地位。", "keyPoints": "经典热容理论（杜隆—珀蒂定律）给出高温下固体晶格摩尔定容热容约为常数 C_v ≈ 3R（约 25 J/(mol·K)）；但在低温下由于晶格振动模式量子化，高频声子无法被激发，热容随温度降低而迅速下降，在极低温下服从德拜 T³ 律（C_v ∝ T³） ；金属在低温下还存在自由电子热容贡献 C_e = γT，在接近 0 K 时占主要地位", "mnemonic": "【答题抓手】扣准经典热容理论、与低温热容行、为有什么区别，紧扣物理机制与适用条件展开", "pitfall": "但在低温下由于晶格振动模式量子化，高频声子无法被激发，热容随温度降低而迅速下降，在极低温下服从德拜 T³ 律（C_v ∝ T³）。", "freq": "拔高扩展"}, {"id": "qa_A_08", "num": "A-08", "chapter": "ch_appA", "name": "A-08 热膨胀的微观原因是什么？玻璃杯突然加热为什么易裂？", "title": "热膨胀的微观原因是什么？玻璃杯突然加热为什么易裂？", "section": "叶 pp.292–294；第13章习题3。", "def": "非谐、非对称原子势使升温后的平均原子间距增加。骤热时内外温差导致不同膨胀量，产生热应力；玻璃塑性松弛有限，局部拉应力超过抗裂能力便可能破裂。低膨胀系数、较均匀升温及适当几何可降低热震风险。\n【教材第13章第3题】玻璃的热导率低，倒入热水产生较大温度梯度，从而产生热应力；同时因为玻璃是脆性材料，在热应力作用下容易开裂。", "keyPoints": "非谐、非对称原子势使升温后的平均原子间距增加；骤热时内外温差导致不同膨胀量，产生热应力；玻璃塑性松弛有限，局部拉应力超过抗裂能力便可能破裂；低膨胀系数、较均匀升温及适当几何可降低热震风险", "mnemonic": "【答题抓手】扣准热膨胀的微观、原因是什么玻、璃杯突然加热，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_A_09", "num": "A-09", "chapter": "ch_appA", "name": "A-09 钢、冰与金刚石的导热机制为何不同？", "title": "钢、冰与金刚石的导热机制为何不同？", "section": "叶 pp.296–298；第13章习题1、2、6衍生。", "def": "金属中自由电子通常承担重要热输运；冰和金刚石主要靠晶格振动传热。强结合、晶体完整性和散射影响声子输运，因此绝缘体也可能具有很高热导率。具体数值依温度、纯度、相态等条件，本题库不为开放查值题编造固定数据。\n【教材第13章第1题】液态水（常温 25℃）：热导率约 0.606 W/(m·K)； 固态水（冰 0℃）：热导率约 2.18 W/(m·K)； 气态水蒸气（标准大气压 0℃）：热导率约 0.016 W/(m·K)。", "keyPoints": "金属中自由电子通常承担重要热输运；冰和金刚石主要靠晶格振动传热；强结合、晶体完整性和散射影响声子输运，因此绝缘体也可能具有很高热导率；具体数值依温度、纯度、相态等条件，本题库不为开放查值题编造固定数据", "mnemonic": "【答题抓手】扣准冰与金刚石的、导热机制为何、不同，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_A_10", "num": "A-10", "chapter": "ch_appA", "name": "A-10 傅里叶定律怎样区分热流率和热流密度？", "title": "傅里叶定律怎样区分热流率和热流密度？", "section": "叶 pp.296–298；第13章习题4、6衍生。", "def": "傅里叶导热定律中：一维热流密度 q = -k(dT/dx)，表示垂直于热流方向单位面积、单位时间所通过的热量，单位为 W/m²；总热流率（热流量）Q = q·A = -k·A(dT/dx)，表示整个传热截面上的传热功率，单位为 W（瓦特，即 J/s）。总传热量还需对传热时间进行积分，单位为 J（焦耳）。\n【教材第13章第4题】热损失 Q = 4000 W；热流密度 j = 2000 W/m²。", "keyPoints": "傅里叶导热定律中：一维热流密度 q = -k(dT/dx)，表示垂直于热流方向单位面积、单位时间所通过的热量，单位为 W/m²；总热流率（热流量）Q = q·A = -k·A(dT/dx)，表示整个传热截面上的传热功率，单位为 W（瓦特，即 J/s） ；总传热量还需对传热时间进行积分，单位为 J（焦耳）", "mnemonic": "【答题抓手】扣准傅里叶定律怎、样区分热流率、和热流密度，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_A_11", "num": "A-11", "chapter": "ch_appA", "name": "A-11 列举热导率测量方法，并说明需要注意什么。", "title": "列举热导率测量方法，并说明需要注意什么。", "section": "叶 pp.300–303；第13章习题5。", "def": "① 教材介绍稳态或悬空热桥方法、激光闪射方法、3ω 等方法。稳态法依据已知热流与温差。\n② 闪射常先测热扩散率，再结合密度和比热容求热导率。\n③ 3ω 利用交流加热与温度相关电阻信号。接触热阻、辐射损失及样品尺度会影响结果。\n【教材第13章第5题】稳态热流法、悬空热桥法、电子束自加热法、激光闪射法、瞬态平面热源法等。", "keyPoints": "教材介绍稳态或悬空热桥方法、激光闪射方法、3ω 等方法；稳态法依据已知热流与温差；闪射常先测热扩散率，再结合密度和比热容求热导率；3ω 利用交流加热与温度相关电阻信号；接触热阻、辐射损失及样品尺度会影响结果", "mnemonic": "【答题抓手】扣准列举热导率测、量方法并说明、需要注意什么，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_A_12", "num": "A-12", "chapter": "ch_appA", "name": "A-12 界面热阻为何存在？怎样提高材料或器件的散热能力？", "title": "界面热阻为何存在？怎样提高材料或器件的散热能力？", "section": "叶 pp.303–307；第13章习题7、8。", "def": "界面接触不完善及载热粒子传输失配会产生温降。可提高材料本身热导、减少孔隙缺陷、构建连续导热网络、改善取向及填料界面，并通过柔顺填隙材料改善接触。提高填料含量不必无限提高有效热导，团聚和界面阻力可抵消收益。\n【教材第13章第7题】18.575 K/W。", "keyPoints": "界面接触不完善及载热粒子传输失配会产生温降；可提高材料本身热导、减少孔隙缺陷、构建连续导热网络、改善取向及填料界面，并通过柔顺填隙材料改善接触；提高填料含量不必无限提高有效热导，团聚和界面阻力可抵消收益", "mnemonic": "【答题抓手】扣准界面热阻为何、存在怎样提高、材料或器件的，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_A_13", "num": "A-13", "chapter": "ch_appA", "name": "A-13 磁矩的微观来源是什么？磁感应强度、磁场强度和磁化强度如何关联？", "title": "磁矩的微观来源是什么？磁感应强度、磁场强度和磁化强度如何关联？", "section": "叶 pp.308–315；第14章习题2、3。", "def": "原子磁矩主要来自电子轨道运动和自旋，电子配对可使贡献抵消；宏观磁化强度是单位体积净磁矩。SI 制中，线性各向同性近似可写。", "keyPoints": "原子磁矩主要来自电子轨道运动和自旋，电子配对可使贡献抵消；宏观磁化强度是单位体积净磁矩； SI 制中，线性各向同性近似可写；不能将磁化强度与外加磁场强度当作同一物理量", "mnemonic": "【答题抓手】扣准磁矩的微观来、源是什么磁感、应强度，紧扣物理机制与适用条件展开", "pitfall": "不能将磁化强度与外加磁场强度当作同一物理量。", "freq": "拔高扩展"}, {"id": "qa_A_14", "num": "A-14", "chapter": "ch_appA", "name": "A-14 抗磁、顺磁、铁磁、反铁磁和亚铁磁如何区分？", "title": "抗磁、顺磁、铁磁、反铁磁和亚铁磁如何区分？", "section": "叶 pp.315–322；第14章习题5。", "def": "① 抗磁响应通常与外场反向且弱。\n② 顺磁材料未配对磁矩在外场下部分取向。\n③ 铁磁有平行有序并可自发磁化。\n④ 反铁磁反平行子晶格磁矩相互补偿。\n⑤ 亚铁磁反平行但大小或数量不等，仍有净磁矩。宏观净磁矩还取决于磁畴状态。", "keyPoints": "抗磁响应通常与外场反向且弱；顺磁材料未配对磁矩在外场下部分取向；铁磁有平行有序并可自发磁化；反铁磁反平行子晶格磁矩相互补偿；亚铁磁反平行但大小或数量不等，仍有净磁矩；宏观净磁矩还取决于磁畴状态", "mnemonic": "【答题抓手】扣准抗磁、顺磁、铁磁，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_A_15", "num": "A-15", "chapter": "ch_appA", "name": "A-15 氧气、F心和某些金属为何表现顺磁性？", "title": "氧气、F心和某些金属为何表现顺磁性？", "section": "叶 pp.317–318；第14章习题6。", "def": "关键在存在未完全抵消的电子磁矩或自由电子自旋响应；氧分子存在未配对电子，F 心与缺陷俘获电子相关，碱金属可讨论导电电子的泡利顺磁响应。不同微观来源不必服从完全相同的温度定律。", "keyPoints": "关键在存在未完全抵消的电子磁矩或自由电子自旋响应；氧分子存在未配对电子，F 心与缺陷俘获电子相关，碱金属可讨论导电电子的泡利顺磁响应；不同微观来源不必服从完全相同的温度定律", "mnemonic": "【答题抓手】扣准氧气、心和某些金属、为何表现顺磁，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_A_16", "num": "A-16", "chapter": "ch_appA", "name": "A-16 居里定律与居里—外斯定律分别适用于什么描述？", "title": "居里定律与居里—外斯定律分别适用于什么描述？", "section": "叶 pp.317–321；第14章习题7。", "def": "居里定律 χ = C/T 适用于磁性原子间相互作用极弱的理想顺磁性固体，磁化率与绝对温度成反比；居里—外斯定律 χ = C/(T - θ) 引入了有效分子场参量 θ，适用于存在相邻磁矩交换作用的铁磁性或反铁磁性材料在居里点（或奈尔点）以上的顺磁区磁化行为。", "keyPoints": "居里定律 χ = C/T 适用于磁性原子间相互作用极弱的理想顺磁性固体，磁化率与绝对温度成反比；居里—外斯定律 χ = C/(T - θ) 引入了有效分子场参量 θ，适用于存在相邻磁矩交换作用的铁磁性或反铁磁性材料在居里点（或奈尔点）以上的顺磁区磁化行为", "mnemonic": "【答题抓手】扣准居里定律与居、外斯定律分别、适用于什么描，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_A_17", "num": "A-17", "chapter": "ch_appA", "name": "A-17 铁磁体未磁化前为何可能没有宏观磁性？", "title": "铁磁体未磁化前为何可能没有宏观磁性？", "section": "叶 pp.322–324；第14章习题9。", "def": "材料内部可以已有自发磁化的磁畴，但各畴磁化方向不同，宏观相互抵消。施加磁场时发生畴壁移动与磁矩转动，有利取向磁畴扩大。零宏观磁化不等于每个原子磁矩或每个磁畴磁化都为零。", "keyPoints": "材料内部可以已有自发磁化的磁畴，但各畴磁化方向不同，宏观相互抵消；施加磁场时发生畴壁移动与磁矩转动，有利取向磁畴扩大；零宏观磁化不等于每个原子磁矩或每个磁畴磁化都为零", "mnemonic": "【答题抓手】扣准铁磁体未磁化、前为何可能没、有宏观磁性，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_A_18", "num": "A-18", "chapter": "ch_appA", "name": "A-18 硬磁与软磁如何区分？铁氧体为何适用于高频？", "title": "硬磁与软磁如何区分？铁氧体为何适用于高频？", "section": "叶 pp.322–326；第14章习题1、8、10。", "def": "① 硬磁材料矫顽力较大，适合永久磁体。\n② 软磁易磁化退磁、矫顽力较小，适合反复变化磁场。许多铁氧体电阻率高，可降低高频涡流损耗，这是相对金属铁磁材料的优势。\n③ 不是“亚铁磁一定磁性更强”。指南针依靠磁体与地磁场相互作用指向。", "keyPoints": "硬磁材料矫顽力较大，适合永久磁体；软磁易磁化退磁、矫顽力较小，适合反复变化磁场；许多铁氧体电阻率高，可降低高频涡流损耗，这是相对金属铁磁材料的优势；不是“亚铁磁一定磁性更强” ；指南针依靠磁体与地磁场相互作用指向", "mnemonic": "【答题抓手】扣准硬磁与软磁区、分铁氧体为何、适用于高频，紧扣物理机制与适用条件展开", "pitfall": "不是“亚铁磁一定磁性更强”。", "freq": "拔高扩展"}, {"id": "qa_A_19", "num": "A-19", "chapter": "ch_appA", "name": "A-19 光进入不同介质后哪些量变化？折射和全反射条件是什么？", "title": "光进入不同介质后哪些量变化？折射和全反射条件是什么？", "section": "叶 pp.328–339；第15章习题1、4、5、6衍生。", "def": "① 静止界面两侧光频率相同，传播速度与波长随折射率变化。\n② 折射遵循斯涅尔关系。全内反射要求从高折射率向低折射率传播且入射角超过临界角。", "keyPoints": "静止界面两侧光频率相同，传播速度与波长随折射率变化；折射遵循斯涅尔关系；全内反射要求从高折射率向低折射率传播且入射角超过临界角；布儒斯特条件则与 p 偏振反射消失有关，不能把二者混同", "mnemonic": "【答题抓手】扣准光进入不同介、质后哪些量变、化折射和全反，紧扣物理机制与适用条件展开", "pitfall": "布儒斯特条件则与 p 偏振反射消失有关，不能把二者混同。", "freq": "拔高扩展"}, {"id": "qa_A_20", "num": "A-20", "chapter": "ch_appA", "name": "A-20 金属为何常反光？透明导电材料为何并不矛盾？", "title": "金属为何常反光？透明导电材料为何并不矛盾？", "section": "叶 pp.332–335；第15章习题2、3衍生。", "def": "自由电子对交变电场的响应导致特定频段反射与吸收；反射行为与等离子体频率及散射有关。", "keyPoints": "自由电子对交变电场的响应导致特定频段反射与吸收；反射行为与等离子体频率及散射有关；透明导电材料可在可见光范围保持较低吸收，同时有足够载流子提供电导，关键是频率、载流子和能带条件，不是“有自由电子就对所有光不透明”", "mnemonic": "【答题抓手】扣准金属为何常反、光透明导电材、料为何并不矛，紧扣物理机制与适用条件展开", "pitfall": "透明导电材料可在可见光范围保持较低吸收，同时有足够载流子提供电导，关键是频率、载流子和能带条件，不是“有自由电子就对所有光不透明”。", "freq": "拔高扩展"}, {"id": "qa_A_21", "num": "A-21", "chapter": "ch_appA", "name": "A-21 减反射膜、双折射和波片分别基于什么原理？", "title": "减反射膜、双折射和波片分别基于什么原理？", "section": "叶 pp.339–343；第15章习题7–10衍生。", "def": "① 减反射膜通过界面反射波的相位与振幅设计降低总反射。\n② 双折射来自材料对不同偏振的折射率不同。\n③ 波片利用两正交分量传播相位差改变偏振态。", "keyPoints": "减反射膜通过界面反射波的相位与振幅设计降低总反射；双折射来自材料对不同偏振的折射率不同；波片利用两正交分量传播相位差改变偏振态；半波片与四分之一波片对应不同相位延迟，不能只依据膜厚大小判断用途", "mnemonic": "【答题抓手】扣准减反射膜、双折射和波片、分别基于什么，紧扣物理机制与适用条件展开", "pitfall": "半波片与四分之一波片对应不同相位延迟，不能只依据膜厚大小判断用途。", "freq": "拔高扩展"}, {"id": "qa_A_22", "num": "A-22", "chapter": "ch_appA", "name": "A-22 生物相容性包括什么？能否脱离使用场景评价？", "title": "生物相容性包括什么？能否脱离使用场景评价？", "section": "叶 pp.345–355；第16章习题1、5、6。", "def": "① 生物相容性关注材料在特定应用中与宿主相互作用的可接受性，需结合接触 nts": "温差可产生电势用于热电发电，电流通过适当结结构可产生吸放热用于热电制冷；典型应用是温差发电与局部温控；性能涉及塞贝克系数、电导和热导等协同，不能只提高某一个指标就认定器件效率必然上升", "mnemonic": "【答题抓手】扣准热电器件的原、理及两个典型、应用是什么，紧扣物理机制与适用条件展开", "pitfall": "典型应用是温差发电与局部温控；性能涉及塞贝克系数、电导和热导等协同，不能只提高某一个指标就认定器件效率必然上升。", "freq": "拔高扩展"}, {"id": "qa_A_27", "num": "A-27", "chapter": "ch_appA", "name": "A-27 硅太阳电池的核心结构和工作原理是什么？", "title": "硅太阳电池的核心结构和工作原理是什么？", "section": "叶 pp.361–363；第17章习题2。", "def": "以具有结区的半导体结构为核心，光子吸收产生电子—空穴对，结区内建场及载流子输运使其分离，经外电路形成电流。", "keyPoints": "以具有结区的半导体结构为核心，光子吸收产生电子—空穴对，结区内建场及载流子输运使其分离，经外电路形成电流；需减少复合并有效收集载流子；只有光吸收而无有效分离收集，不能得到理想输出", "mnemonic": "【答题抓手】扣准硅太阳电池的、核心结构和工、作原理是什么，紧扣物理机制与适用条件展开", "pitfall": "需减少复合并有效收集载流子；只有光吸收而无有效分离收集，不能得到理想输出。", "freq": "拔高扩展"}, {"id": "qa_A_28", "num": "A-28", "chapter": "ch_appA", "name": "A-28 智能材料有哪些例子？形状记忆合金如何恢复形状？", "title": "智能材料有哪些例子？形状记忆合金如何恢复形状？", "section": "叶 pp.365–373；第17章习题3、4。", "def": "智能材料可对温度、应力、电场等外界刺激作可利用响应，如形状记忆合金、压电材料及变色材料。", "keyPoints": "智能材料可对温度、应力、电场等外界刺激作可利用响应，如形状记忆合金、压电材料及变色材料；形状记忆合金依靠可逆马氏体相变及变体调整，低温变形后加热逆转变可恢复预设形状；不能与普通弹性卸载立即恢复完全等同", "mnemonic": "【答题抓手】扣准智能材料有哪、些例子形状记、忆合金恢复形，紧扣物理机制与适用条件展开", "pitfall": "形状记忆合金依靠可逆马氏体相变及变体调整，低温变形后加热逆转变可恢复预设形状；不能与普通弹性卸载立即恢复完全等同。", "freq": "拔高扩展"}, {"id": "qa_A_29", "num": "A-29", "chapter": "ch_appA", "name": "A-29 消费电池、动力电池和储能电池的性能侧重点有什么不同？", "title": "消费电池、动力电池和储能电池的性能侧重点有什么不同？", "section": "叶 pp.374–384；第17章习题5、7。", "def": "① 消费应用重视能量密度、体积和安全。\n② 动力应用还重视功率、快充、温度适应及循环寿命。\n③ 固定储能更重视成本、寿命、效率、安全与资源。", "keyPoints": "消费应用重视能量密度、体积和安全；动力应用还重视功率、快充、温度适应及循环寿命；固定储能更重视成本、寿命、效率、安全与资源；下一代电池需综合材料、界面、制造和回收，不能只追逐理论比容量", "mnemonic": "【答题抓手】扣准消费电池、动力电池和储、能电池的性能，紧扣物理机制与适用条件展开", "pitfall": "下一代电池需综合材料、界面、制造和回收，不能只追逐理论比容量。", "freq": "拔高扩展"}, {"id": "qa_A_30", "num": "A-30", "chapter": "ch_appA", "name": "A-30 钠离子电池与锂离子电池有哪些基本差别？", "title": "钠离子电池与锂离子电池有哪些基本差别？", "section": "叶 pp.380–384；第17章习题6。", "def": "Na 与 Li 的质量、离子尺寸、化学电位及适用电极结构不同，使比能量、扩散与嵌入机制存在差异；钠资源及成本有潜在优势，但实际性能取决于具体正负极和电解液。", "keyPoints": "Na 与 Li 的质量、离子尺寸、化学电位及适用电极结构不同，使比能量、扩散与嵌入机制存在差异；钠资源及成本有潜在优势，但实际性能取决于具体正负极和电解液；按教材比较原理，不能把某一产品的数值当作整个技术路线永久不变的水平", "mnemonic": "【答题抓手】扣准钠离子电池与、锂离子电池有、哪些基本差别，紧扣物理机制与适用条件展开", "pitfall": "按教材比较原理，不能把某一产品的数值当作整个技术路线永久不变的水平。", "freq": "拔高扩展"}, {"id": "qa_A_31", "num": "A-31", "chapter": "ch_appA", "name": "A-31 生物降解材料的降解受哪些因素影响？", "title": "生物降解材料的降解受哪些因素影响？", "section": "叶 pp.385–387；第17章习题8。", "def": "化学键可水解性、分子量、结晶度、形状和表面积，以及温度、湿度、微生物、氧和 pH 等环境条件都会影响。可生物降解通常有条件要求，不等于在任何自然环境都迅速消失；结晶区较难被渗透和侵蚀的情况也需考虑。", "keyPoints": "化学键可水解性、分子量、结晶度、形状和表面积，以及温度、湿度、微生物、氧和 pH 等环境条件都会影响；可生物降解通常有条件要求，不等于在任何自然环境都迅速消失；结晶区较难被渗透和侵蚀的情况也需考虑", "mnemonic": "【答题抓手】扣准生物降解材料、的降解受哪些、因素影响，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_A_32", "num": "A-32", "chapter": "ch_appA", "name": "A-32 PCL 如何降解？PP、PLA、尼龙-6谁更易生物降解？", "title": "PCL 如何降解？PP、PLA、尼龙-6谁更易生物降解？", "section": "叶 pp.385–387；第17章习题9、10。", "def": "PCL 为脂肪族聚酯，主链酯键可发生水解并受酶等促进，分子量降低后产物进一步被利用。", "keyPoints": "PCL 为脂肪族聚酯，主链酯键可发生水解并受酶等促进，分子量降低后产物进一步被利用；教材比较中 PLA 通常是三者中较易生物降解的选择，PP 的碳主链和普通尼龙-6并非同类易降解结构；但“最快”需给定环境，不能保证室温海水等任意条件下迅速降解", "mnemonic": "【答题抓手】扣准降解、尼龙、谁更易生物降，紧扣物理机制与适用条件展开", "pitfall": "教材比较中 PLA 通常是三者中较易生物降解的选择，PP 的碳主链和普通尼龙-6并非同类易降解结构；但“最快”需给定环境，不能保证室温海水等任意条件下迅速降解。", "freq": "拔高扩展"}, {"id": "qa_A_33", "num": "A-33", "chapter": "ch_appA", "name": "A-33 什么是生物惰性材料？生物材料如何按属性分类？", "title": "什么是生物惰性材料？生物材料如何按属性分类？", "section": "叶 pp.388–392；第17章习题11、12。", "def": "生物惰性是指在特定环境中反应较弱的相对概念，不存在对一切生物过程绝对无相互作用的材料。", "keyPoints": "生物惰性是指在特定环境中反应较弱的相对概念，不存在对一切生物过程绝对无相互作用的材料；可按属性分金属、陶瓷、高分子和复合生物材料等；各类性能和界面反应不同，不能把“惰性”直接等于“无任何风险”", "mnemonic": "【答题抓手】扣准什么是生物惰、性材料生物材、料按属性分类，紧扣物理机制与适用条件展开", "pitfall": "可按属性分金属、陶瓷、高分子和复合生物材料等；各类性能和界面反应不同，不能把“惰性”直接等于“无任何风险”。", "freq": "拔高扩展"}, {"id": "qa_A_34", "num": "A-34", "chapter": "ch_appA", "name": "A-34 什么是隐焓能？与生成自由能有何区别？", "title": "什么是隐焓能？与生成自由能有何区别？", "section": "叶 pp.398–400；第18章习题3。", "def": "隐焓能在本书语境下指材料从原料获取到规定制造边界所累计消耗的能量，属于工艺和生命周期核算量；生成自由能是给定状态下化学反应的热力学状态函数。", "keyPoints": "隐焓能在本书语境下指材料从原料获取到规定制造边界所累计消耗的能量，属于工艺和生命周期核算量；生成自由能是给定状态下化学反应的热力学状态函数；二者边界、含义和数值来源不同，不能用标准生成自由能直接替代实际生产能耗", "mnemonic": "【答题抓手】扣准什么是隐焓能、与生成自由能、有何区别，紧扣物理机制与适用条件展开", "pitfall": "二者边界、含义和数值来源不同，不能用标准生成自由能直接替代实际生产能耗。", "freq": "拔高扩展"}, {"id": "qa_A_35", "num": "A-35", "chapter": "ch_appA", "name": "A-35 什么是生态审计？材料为什么要按全生命周期评价？", "title": "什么是生态审计？材料为什么要按全生命周期评价？", "section": "叶 pp.401–410；第18章习题4、5衍生。", "def": "生态审计系统评估原料、制造、运输、使用及报废等阶段的能源与排放，寻找主导环节和改进方案。某材料制造能耗高却可能通过减重降低使用阶段消耗，因此不能只看出厂阶段；回收收益也需说明核算边界，不能重复计入。", "keyPoints": "生态审计系统评估原料、制造、运输、使用及报废等阶段的能源与排放，寻找主导环节和改进方案；某材料制造能耗高却可能通过减重降低使用阶段消耗，因此不能只看出厂阶段；回收收益也需说明核算边界，不能重复计入", "mnemonic": "【答题抓手】扣准什么是生态审、计材料要按全、生命周期评价，紧扣物理机制与适用条件展开", "pitfall": "某材料制造能耗高却可能通过减重降低使用阶段消耗，因此不能只看出厂阶段。", "freq": "拔高扩展"}, {"id": "qa_A_36", "num": "A-36", "chapter": "ch_appA", "name": "A-36 太阳能级硅与半导体级硅为什么成本可能不同？稀土资源题如何避免陈旧数据？", "title": "太阳能级硅与半导体级硅为什么成本可能不同？稀土资源题如何避免陈旧数据？", "section": "叶 pp.394–400；第18章习题1、2。", "def": "① 半导体级通常要求更严的杂质控制与工艺质量，净化、检测及合格率要求影响成本。\n② 实际价格还受供需和产品规格影响，不能保证任意时点价差固定。稀土丰度、储量与产量是不同指标，开放题需注明年份、统计口径及来源。\n③ 本题库不捏造现行储量或价格。", "keyPoints": "半导体级通常要求更严的杂质控制与工艺质量，净化、检测及合格率要求影响成本；实际价格还受供需和产品规格影响，不能保证任意时点价差固定；稀土丰度、储量与产量是不同指标，开放题需注明年份、统计口径及来源；本题库不捏造现行储量或价格", "mnemonic": "【答题抓手】扣准太阳能级硅与、半导体级硅成、本可能不同稀，紧扣物理机制与适用条件展开", "pitfall": "实际价格还受供需和产品规格影响，不能保证任意时点价差固定。", "freq": "拔高扩展"}, {"id": "qa_B_01", "num": "B-01", "chapter": "ch_appB", "name": "B-01 比较回复、再结晶和晶粒长大", "title": "比较回复、再结晶和晶粒长大", "section": "附录B · 10分完整答题规范与采分细则", "def": "① 冷变形后，材料中大量位错、点缺陷及内应力使自由能升高。\n② 退火时首先可发生回复，点缺陷减少、位错重排和部分湮灭，形成低能亚晶结构，残余应力及部分物理性能得到改善，但原变形晶粒形貌大体保留，强度硬度通常不会像完全再结晶那样显著下降。\n③ 继续退火可发生再结晶，形成低位错密度的新晶粒并长大，替代原变形组织，强度硬度明显下降、塑性恢复。\n④ 再结晶完成后继续退火可引起晶粒长大，平均晶粒尺寸增大、晶界总面积降低。\n⑤ 回复与再结晶的主要驱动力是冷变形储能；晶粒长大的主要驱动力是晶界能降低。\n⑥ 再结晶通常不改变相的种类和晶体结构，并非从一种相转为另一种相。\n⑦ 变形程度、温度、时间、原晶粒、溶质和第二相共同影响过程，不能把再结晶温度视为固定材料常数。", "keyPoints": "【官方满分应覆盖采分点】三过程的结构变化、性能变化、驱动力、是否发生相种类变化、影响因素。", "mnemonic": "【10分答题范式】先答明确定义与核心结论，次答物理机制与推导公式，再答影响规律与边界限制", "pitfall": "【阅卷常见易失分点】只说“都是变软”；把亚晶界说成假晶界；把晶粒长大的驱动力仍写成形变储能。对应叶 pp.157–164，题06-23至06-29。", "freq": "10分满分大题"}, {"id": "qa_B_02", "num": "B-02", "chapter": "ch_appB", "name": "B-02 为什么细晶能够强化，同时改善韧性？为何高温不一定选细晶？", "title": "为什么细晶能够强化，同时改善韧性？为何高温不一定选细晶？", "section": "附录B · 10分完整答题规范与采分细则", "def": "① 晶界使相邻晶粒的晶体取向发生变化，位错从一个晶粒进入另一个晶粒需克服传播与协调障碍。\n② 晶粒细化使晶界增多、位错有效滑移和塞积距离减小，需要更高外加应力才能使塑性变形继续，因此提高屈服强度，常用 Hall–Petch 关系表述。\n③ 细晶还使塑性变形更均匀，降低局部过大应力集中，并使裂纹传播更频繁地转向或受阻，因而通常有利于韧性。\n④ 但晶界同时是扩散和高温变形的有利通道。\n⑤ 在高温蠕变条件下，晶界滑移、晶界扩散及晶界损伤可能变得重要，因此粗晶、定向晶甚至单晶有时更有利。\n⑥ 以上规律必须限定粒径、材料和温度；不能把细晶结论无限外推到极小纳米晶，也不能断言塑性与所有性能必然同时提高。", "keyPoints": "【官方满分应覆盖采分点】晶界阻碍位错→强度；变形均匀与裂纹阻碍→韧性；高温机制改变→适用边界。对应叶 pp.148–150、182–184，题06-16、06-17。", "mnemonic": "【10分答题范式】先答明确定义与核心结论，次答物理机制与推导公式，再答影响规律与边界限制", "pitfall": "【阅卷常见易失分点】只答出细晶提高强度而遗漏韧性改善机制；将 Hall-Petch 规律无限外推至极小纳米晶；忽略高温蠕变下晶界扩散与滑移导致细晶软化。", "freq": "10分满分大题"}, {"id": "qa_B_03", "num": "B-03", "chapter": "ch_appB", "name": "B-03 解释临界分切应力与晶体取向的关系", "title": "解释临界分切应力与晶体取向的关系", "section": "附录B · 10分完整答题规范与采分细则", "def": "① 单轴拉伸时，滑移系上的分切应力服从施密德定律：τ = σ·cosφ·cosλ，其中 φ 为拉伸轴与滑移面法线的夹角，λ 为拉伸轴与滑移方向的夹角。\n② 当分切应力达到材料在该状态下的临界分切应力 τ_CRSS 时，滑移开动。\n③ 开动所需最小外加拉伸应力为 σ = τ_CRSS / (cosφ·cosλ)。\n④ 改变试样取向只改变施密德取向因子 m = cosφ·cosλ，并不改变材料固有的临界分切应力；最有利取向时 m = 0.5。", "keyPoints": "【官方满分应覆盖采分点】施密德定律公式 τ = σ·cosφ·cosλ ；临界分切应力 τ_CRSS 为材料固有门槛，不随取向改变；改变试样取向改变的是取向因子 m 与所需外加应力 σ。", "mnemonic": "【10分答题范式】先答明确定义与核心结论，次答物理机制与推导公式，再答影响规律与边界限制", "pitfall": "【阅卷常见易失分点】把取成与滑移面的夹角；把“分切应力”与“临界分切应力”混用；仅因更换材料状态后门槛改变就否定取向结论。对应叶 pp.140–145，题06-06至06-08。", "freq": "10分满分大题"}, {"id": "qa_B_04", "num": "B-04", "chapter": "ch_appB", "name": "B-04 区分0.45%C钢的珠光体量与渗碳体总量", "title": "区分0.45%C钢的珠光体量与渗碳体总量", "section": "附录B · 10分完整答题规范与采分细则", "def": "0.45%C 钢在室温平衡组织为先共析铁素体 + 珠光体，主要相为铁素体 α + 渗碳体 Fe3C。\n①求珠光体量：以共析线端点 0.022%C 与 0.77%C 为杠杆，W_P = (0.45 - 0.022)/(0.77 - 0.022) × 100% ≈ 57.2%（先共析铁素体为 42.8%）；\n②求共析温度下的渗碳体总量：以相端点 0.022%C 与 6.69%C 为杠杆，W_Fe3C = (0.45 - 0.022)/(6.69 - 0.022) × 100% ≈ 6.42%；\n③求室温渗碳体总量：若忽略铁素体在室温的极微量溶碳，W_Fe3C ≈ 0.45 / 6.69 × 100% ≈ 6.73%。", "keyPoints": "【官方满分应覆盖采分点】明确区分组织组成物（铁素体+珠光体）与相组成物（铁素体+渗碳体） ；共析珠光体端点取 0.022% 与 0.77% ；渗碳体总量端点取 0.022% 与 6.69%。", "mnemonic": "【10分答题范式】先答明确定义与核心结论，次答物理机制与推导公式，再答影响规律与边界限制", "pitfall": "【阅卷常见易失分点】把珠光体内部的渗碳体百分比（~11.2%）误当成整块钢的渗碳体总量；混淆组织组成物与相组成物的杠杆端点。", "freq": "10分满分大题"}, {"id": "qa_B_05", "num": "B-05", "chapter": "ch_appB", "name": "B-05 球形形核为什么出现临界尺寸？", "title": "球形形核为什么出现临界尺寸？", "section": "附录B · 10分完整答题规范与采分细则", "def": "① 均匀球形形核总自由能变化由两项组成：ΔG = (4/3)πr³ΔG_v + 4πr²γ，其中单位体积相变自由能差 ΔG_v 在过冷时为负值（推动力），比界面能 γ 为正值（阻力）。\n② 小半径时界面表面积项（∝r²）占主导，自由能上升；半径增大后体积功项（∝r³）占主导，自由能下降。\n③ 由 dΔG/dr = 0 得临界晶核半径 r* = -2γ/ΔG_v，形核功势垒 ΔG* = (16πγ³)/(3ΔG_v²)。\n④ r < r* 的晶胚自发溶解，r > r* 的新核自发长大。", "keyPoints": "【官方满分应覆盖采分点】", "mnemonic": "【10分答题范式】先答明确定义与核心结论，次答物理机制与推导公式，再答影响规律与边界限制", "pitfall": "【阅卷常见易失分点】漏掉负号；把当作已乘体积的总能；把势垒顶点说成稳定平衡；把临界尺寸当最终晶粒大小。对应叶 pp.238–243，题08-31至08-36。", "freq": "10分满分大题"}, {"id": "qa_B_06", "num": "B-06", "chapter": "ch_appB", "name": "B-06 分段等温后如何确定最终组织？", "title": "分段等温后如何确定最终组织？", "section": "附录B · 10分完整答题规范与采分细则", "def": "① 第一段等温转变分析：\n   - 题目给定第一阶段在高温保温形成 40% 珠光体；\n   - 此时未转变的剩余过冷奥氏体相对份额为：100% - 40% = 60%。\n② 第二段中温等温转变计算：\n   - 第二阶段在贝氏体区等温，转变目标为“剩余奥氏体的 50%”；\n   - 形成的贝氏体组织相对份额为：60% × 50% = 30%（切记不是整块材料的 50%）；\n   - 此时系统中尚存未转变奥氏体相对份额为：60% - 30% = 30%。\n③ 第三段淬火快冷产物：\n   - 将剩余未转变奥氏体快冷至马氏体转变点 M_f 以下，剩余 30% 奥氏体全部转变为马氏体；\n   - 最终综合组织组成物为：40% 珠光体 + 30% 贝氏体 + 30% 马氏体。", "keyPoints": "第一段形成 40% 珠光体余 60% 奥氏体；第二段转变剩余奥氏体的 50% 得到 30% 贝氏体；剩余 30% 奥氏体淬火转变为马氏体；最终组织 40%P + 30%B + 30%M", "mnemonic": "【10分答题范式】先答明确定义与核心结论，次答物理机制与推导公式，再答影响规律与边界限制", "pitfall": "第二段贝氏体份额是以剩余奥氏体 60% 为基数计算（60% × 50% = 30%），绝不能直接按全相 50% 计算；若题干陈述为“累计转变量达到 50%”，则贝氏体仅为 10%；多段等温热处理每一阶段的基准百分比必须看清是以“总体积 100%”还是以“上一阶段残留奥氏体份额”为计算基数。", "freq": "10分满分大题"}, {"id": "qa_B_07", "num": "B-07", "chapter": "ch_appB", "name": "B-07 比较金属与掺杂半导体的温度—电导关系", "title": "比较金属与掺杂半导体的温度—电导关系", "section": "附录B · 10分完整答题规范与采分细则", "def": "电导率公式为 σ = n·e·μ_e + p·e·μ_h。\n①金属：自由电子浓度高且近乎不随温度变化，升温主要加剧声子晶格振动散射，使迁移率降低，电阻率升高、电导率下降；\n②本征半导体：升温虽使迁移率略降，但价带到导带的本征载流子热激发浓度呈指数暴增，浓度剧增占主导，电导率随温度升高而急剧上升；\n③掺杂半导体：在低温电离区浓度上升电导率升高，在中温强电离区杂质全电离且晶格振动散射加剧使迁移率下降、电导率微降，在高温本征区电导率再次暴增。", "keyPoints": "【官方满分应覆盖采分点】电导率公式 σ = n·e·μ_e + p·e·μ_h；金属载流子浓度恒定，升温晶格散射加剧迁移率下降；本征半导体升温本征激发浓度呈指数暴增；掺杂半导体分低温电离区、中温耗尽区与高温本征区。", "mnemonic": "【10分答题范式】先答明确定义与核心结论，次答物理机制与推导公式，再答影响规律与边界限制", "pitfall": "【阅卷常见易失分点】断言所有半导体电导率在全温区单调上升；混淆中温区杂质全电离时迁移率下降导致的电导率微降与载流子浓度下降。", "freq": "10分满分大题"}, {"id": "qa_B_08", "num": "B-08", "chapter": "ch_appB", "name": "B-08 如何回答“简述四种强化机制”才能形成完整答案？", "title": "如何回答“简述四种强化机制”才能形成完整答案？", "section": "附录B · 10分完整答题规范与采分细则", "def": "① 细晶强化：通过细化晶粒增加晶界障碍，限制位错传播与有效塞积，通常同时改善韧性；用 Hall–Petch 关系说明粒径影响，并注明适用范围（σ_y = σ_0 + k_y·d^(-1/2)）。\n② 固溶强化：溶质原子引起尺寸、模量等失配，应力场与位错相互作用，使其更难运动；效果取决于浓度、失配及分布，不能只比较原子半径。\n③ 加工硬化：塑性加工使位错增殖与缠结，进一步运动阻力增大，强度硬度上升、塑性下降；适当再结晶退火可消除大部分硬化。\n④ 第二相强化：弥散颗粒使位错切过或绕过所需应力提高；颗粒尺寸、间距、共格性和稳定性控制效果，过时效粗化可使强化减弱（细小共格粒子为切过机制，粗大不共格粒子为 Orowan 绕过机制）。\n⑤ 共同本质：提高塑性变形障碍（增加位错滑移阻力）。\n⑥ 不能遗漏：每种机制的障碍是什么、怎样产生、一个条件或限制。若题目要求比较综合性能，再说明热稳定性、塑性及疲劳/蠕变影响，而不是仅排一个永久不变的“谁最强”顺序。对应叶 pp.148–164，题06-15至06-29。", "keyPoints": "【官方满分应覆盖采分点】①每种机制的位错阻碍本质是什么、由什么微观结构产生；②对应经典数学关系式（如 Hall-Petch、Taylor 公式、Orowan 机制）；③各强化方式的边界条件或局限性；④若要求比较综合性能，阐明对塑韧性、高温热稳定性的影响。", "mnemonic": "【10分答题范式】先答明确定义与核心结论，次答物理机制与推导公式，再答影响规律与边界限制", "pitfall": "【阅卷常见易失分点】只罗列名词而不解释位错阻碍微观机制；将 Hall-Petch 关系无条件外推到纳米晶；第二相强化遗漏切过与绕过机制的区分；仅排列谁强谁弱的主观顺序而未分析机制与组织条件。", "freq": "10分满分大题"}, {"id": "qa_D_01", "num": "D-01", "chapter": "ch_appD", "name": "D-01 几何与电子结构核心纠偏（晶向夹角与配位数）", "title": "立方晶向夹角、配位数与临界半径比、硅能带填充纠偏", "section": "附录D · 源文件疑点、版本差异与易误读处", "def": "①立方晶向夹角：问[110]与[11̄0]夹角，两矢量点积为1*1+1*(-1)+0*0=0，余弦为0，夹角必为90°！答案附件写45°为严重错误。\n②配位数与半径比：三维正四面体四配位(CN=4)临界半径比约为0.225；三维八面体六配位(CN=6)或二维平面正方形四配位才对应0.414！必须区分立体四面体与平面四边形几何。\n③硅的能带填充：0K理想本征硅的基础物理模型为价带满带、导带空带，禁带宽度约1.12eV，绝不能说成导带半满。", "keyPoints": "矢量点积算夹角([110]与[11̄0]垂直90°) ；正四面体配位临界半径比0.225 vs 八面体0.414；本征半导体0K价带满导带空。", "mnemonic": "【避坑指南】警惕教材概念混淆，牢记核心判据与物理因果链，切勿将特例当通用结论", "pitfall": "考试遇晶向夹角务必写出标准点积公式cosθ=(u1u2+v1v2+w1w2)/(|r1||r2|)，切忌主观臆断角度。", "freq": "考纲勘误重点"}, {"id": "qa_D_02", "num": "D-02", "chapter": "ch_appD", "name": "D-02 位错方向提取防丢上划线与攀移判定", "title": "位错线指数上划线防丢与刃型位错点积判定", "section": "附录D · 源文件疑点、版本差异与易误读处", "def": "① 在位错综合题中，位错线方向末位常含负指数上划线，例如t=[112̄]，柏氏矢量b=[111]。\n② 两矢量点积为1*1+1*1+(-2)*1=0，因此柏氏矢量垂直于位错线(b⊥t)，判定为纯刃型位错！刃型位错可通过吸收或发射点缺陷发生垂直滑移面的攀移运动。\n③ 若扫描提取丢失负号上划线，会被误算成螺型位错。", "keyPoints": "矢量点积判定位错类型：b·t=0为刃型位错；b×t=0为螺型位错；刃型位错可借助空位/点缺陷发生非保守攀移。", "mnemonic": "【避坑指南】警惕教材概念混淆，牢记核心判据与物理因果链，切勿将特例当通用结论", "pitfall": "手写或答题时负号上划线必须清晰标注在数字正上方，不可漏写或写成减号。", "freq": "考纲勘误重点"}, {"id": "qa_D_03", "num": "D-03", "chapter": "ch_appD", "name": "D-03 铁碳相图组织与相分类口径澄清", "title": "组织组成物 vs 相组成物计算口径与端点选取", "section": "附录D · 源文件疑点、版本差异与易误读处", "def": "铁碳合金计算题必须区分【组织组成物】与【相组成物】：。\n①相组成物在室温下只有两相：铁素体(α)与渗碳体(Fe3C)，杠杆定律端点为0.022%C与6.69%C。\n②组织组成物包括先共析铁素体、珠光体P(共析产物)、二次渗碳体、莱氏体Ld(共晶产物)。室温变态莱氏体Ld'内部本身已包含共析珠光体与共晶渗碳体，不可将内部相与外层组织无序重复累加！", "keyPoints": "相组成物只有α和Fe3C(端点0.022与6.69) ；组织组成物看转变产物(先共析相+共析/共晶组织) ；严禁组织与相重复并列。", "mnemonic": "【避坑指南】警惕教材概念混淆，牢记核心判据与物理因果链，切勿将特例当通用结论", "pitfall": "题目若问渗碳体总量，端点必取6.69%；若问珠光体量，共析端点取0.77%，两者切勿混淆。", "freq": "相图必考题"}, {"id": "qa_D_04", "num": "D-04", "chapter": "ch_appD", "name": "D-04 断裂力学中心穿透裂纹代入半长规范", "title": "格里菲斯及应力强度因子公式中裂纹长度2a与半长a代入规范", "section": "附录D · 源文件疑点、版本差异与易误读处", "def": "在断裂力学格里菲斯公式σ_c = [2Eγ/(πa)]^(1/2) 和应力强度因子K_I = Yσ√(πa) 中，对于无限大平板中的贯穿中心裂纹，题目给出的裂纹总长度为2a，代入公式计算时必须使用裂纹半长a！若题目给定裂纹长度40.8mm，则半长a=20.4mm。直接代入40.8mm会使计算结果产生√2倍的系统性误差！", "keyPoints": "无限大板中心穿透裂纹：总长=2a，计算一律取半长a；边缘表面裂纹：深度=a，计算取深度a。", "mnemonic": "【避坑指南】警惕教材概念混淆，牢记核心判据与物理因果链，切勿将特例当通用结论", "pitfall": "审题务必看清是'中心裂纹'还是'边缘裂纹'，中心裂纹长度给出的数值必须除以2再代入。", "freq": "断裂力学必考"}, {"id": "qa_D_05", "num": "D-05", "chapter": "ch_appD", "name": "D-05 材料学经典规律的适用边界与假说破除", "title": "BCC解理面、细晶强化极限、高熵合金非绝对单相等五大适用边界", "section": "附录D · 源文件疑点、版本差异与易误读处", "def": "①BCC解理面：BCC金属解理面通常是{100}，并非其滑移密排面{110}！解理沿断键代价最低、表面能最小的面发生。\n②霍尔-佩奇极限：细晶强化公式在晶粒细化至极小纳米级(通常<10nm)时失效，晶界滑动主导导致反常软化。\n③高熵合金固溶体：多主元高构型熵倾向形成简单固溶体，但混合焓与原子尺寸差δ过大时仍会析出金属间化合物或多相，不能断言必成单相。\n④再结晶温度：再结晶温度不是固定材料常数，随冷变形量增加、退火时间延长而显著降低。\n⑤淬火残余奥氏体：残余奥氏体含量取决于Mf点，Mf高于室温时残余奥氏体极少，受成分及淬火介质强烈调控。", "keyPoints": "BCC解理面为{100}非密排面； Hall-Petch极小纳米晶失效；高熵合金多主元不必然单相；再结晶温度受时间变形量调控。", "mnemonic": "【避坑指南】警惕教材概念混淆，牢记核心判据与物理因果链，切勿将特例当通用结论", "pitfall": "论述题切忌断言'所有'、'必然'，必须阐明规律成立的温度、尺寸、时间与成分边界条件。", "freq": "简答辨析题"}, {"id": "qa_qh_01", "num": "QH-01", "chapter": "ch_qianghua", "name": "QH-01 核外电子排布规律", "title": "核外电子排布规律", "section": "强化周训练 · 教材 p.20-22", "def": "① 主量子数决定壳层及轨道尺度，角量子数与亚壳层及轨道形状有关；磁量子数区分轨道，自旋量子数取 ±1/2。\n② 基态电子优先占据较低能量轨道；泡利原理规定每个轨道最多容纳两个自旋相反的电子；简并轨道按洪特规则先单独占据且自旋平行，再配对。\n③ 氦的1s层含2个电子而充满；氖的最外层2s、2p亚壳层共含8个电子。充满的价电子层通常对应较稳定的电子结构。 p.20-22。", "keyPoints": "① 主量子数决定壳层及轨道尺度，角量子数与亚壳层及轨道形状有关；磁量子数区分轨道，自旋量子数取 ±1/2；② 基态电子优先占据较低能量轨道；泡利原理规定每个轨道最多容纳两个自旋相反的电子；简并轨道按洪特规则先单独占据且自旋平行，再配对；③ 氦的1s层含2个电子而充满；氖的最外层2s、2p亚壳层共含8个电子。充满的价电子层通常对应较稳定的电子结构。 p.20-22", "mnemonic": "【冲刺抓手】围绕“核外电子排布规律”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_02", "num": "QH-02", "chapter": "ch_qianghua", "name": "QH-02 三类主价键与性能", "title": "三类主价键与性能", "section": "强化周训练 · 教材 p.27-29", "def": "① NaCl中电子由Na转移给Cl，正负离子主要靠静电引力结合；离子键无方向性和饱和性。\n② 金刚石中碳原子共用电子成键，共价键具有方向性和饱和性，形成刚性的三维键合网络。\n③ 铜中正离子实与离域价电子共同成键，金属键无方向性和饱和性；原子相对位置改变时仍可保持结合。\n④ 因此金属易通过滑移变形；金刚石的定向强键使其硬度高，而原子相对移动需明显改变或破坏局部键合，塑性变形困难。 p.27-29。", "keyPoints": "① NaCl中电子由Na转移给Cl，正负离子主要靠静电引力结合；离子键无方向性和饱和性；② 金刚石中碳原子共用电子成键，共价键具有方向性和饱和性，形成刚性的三维键合网络；③ 铜中正离子实与离域价电子共同成键，金属键无方向性和饱和性；原子相对位置改变时仍可保持结合；④ 因此金属易通过滑移变形；金刚石的定向强键使其硬度高，而原子相对移动需明显改变或破坏局部键合，塑性变形困难。 p.27-29", "mnemonic": "【冲刺抓手】围绕“三类主价键与性能”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_03", "num": "QH-03", "chapter": "ch_qianghua", "name": "QH-03 原子平衡与宏观性质", "title": "原子平衡与宏观性质", "section": "强化周训练 · 教材 p.25-26、30-31", "def": "① 较远距离的吸引作用使原子趋于接近；距离过小时，内层电子云重叠引起强烈排斥，使原子不能无限靠近。\n② 平衡间距处吸引力与排斥力大小相等、方向相反，净力为零且势能最低；向两侧偏离时出现使间距恢复的作用。\n③ 结合能反映原子间键合强弱。其他条件相近时，强键使原子分离和偏离平衡位置更困难，通常对应较高熔点、较大弹性模量和较低热膨胀系数。 p.25-26、30-31。", "keyPoints": "① 较远距离的吸引作用使原子趋于接近；距离过小时，内层电子云重叠引起强烈排斥，使原子不能无限靠近；② 平衡间距处吸引力与排斥力大小相等、方向相反，净力为零且势能最低；向两侧偏离时出现使间距恢复的作用；③ 结合能反映原子间键合强弱。其他条件相近时，强键使原子分离和偏离平衡位置更困难，通常对应较高熔点、较大弹性模量和较低热膨胀系数。 p.25-26、30-31", "mnemonic": "【冲刺抓手】围绕“原子平衡与宏观性质”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_04", "num": "QH-04", "chapter": "ch_qianghua", "name": "QH-04 价电子与电负性判断", "title": "价电子与电负性判断", "section": "强化周训练 · 教材 p.22、24、27-28、30", "def": "① Na最外层有一个3s电子，失去后形成近似Ne的稳定电子结构；Cl最外层有7个电子，得到一个电子后形成近似Ar的电子结构。\n② Na和Cl电负性差异大，电子转移后形成正负离子； Cl2两原子电负性相同，通过共用电子达到较稳定的电子结构。\n③ 电负性差异有助于判断离子性与共价性；实际材料常含混合键合，不能把所有化合物机械地认定为完全纯粹的一种键。 p.22、24、27-28、30 第2章金属、陶瓷和高分子结构。", "keyPoints": "① Na最外层有一个3s电子，失去后形成近似Ne的稳定电子结构；Cl最外层有7个电子，得到一个电子后形成近似Ar的电子结构；② Na和Cl电负性差异大，电子转移后形成正负离子； Cl2两原子电负性相同，通过共用电子达到较稳定的电子结构；③ 电负性差异有助于判断离子性与共价性；实际材料常含混合键合，不能把所有化合物机械地认定为完全纯粹的一种键。 p.22、24、27-28、30 第2章金属、陶瓷和高分子结构", "mnemonic": "【冲刺抓手】围绕“价电子与电负性判断”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_05", "num": "QH-05", "chapter": "ch_qianghua", "name": "QH-05 典型金属结构与堆垛", "title": "典型金属结构与堆垛", "section": "强化周训练 · 教材 p.49-54", "def": "① FCC和理想HCP的配位数均为12、致密度均约0.74，属于等尺寸硬球的密堆积；BCC配位数为8、致密度约0.68。\n② FCC密排层按ABCABC顺序堆垛，第三层占据与前两层不同的位置；HCP按ABAB顺序堆垛，第三层与第一层重复。\n③ 两者局部最近邻数和空间利用率相同，但层间重复周期、整体对称性和晶体结构不同，不能仅凭配位数或致密度判定结构相同。 p.49-54。", "keyPoints": "① FCC和理想HCP的配位数均为12、致密度均约0.74，属于等尺寸硬球的密堆积；BCC配位数为8、致密度约0.68；② FCC密排层按ABCABC顺序堆垛，第三层占据与前两层不同的位置；HCP按ABAB顺序堆垛，第三层与第一层重复；③ 两者局部最近邻数和空间利用率相同，但层间重复周期、整体对称性和晶体结构不同，不能仅凭配位数或致密度判定结构相同。 p.49-54", "mnemonic": "【冲刺抓手】围绕“典型金属结构与堆垛”，从“物理本质、组织条件、性能规律”三维逐层答题", "pitfall": "【答题避坑】必须写明适用前提与边界条件，切忌仅回答孤立结论句，注意物理因果链完整。", "freq": "强化周冲刺大题"}, {"id": "qa_qh_06", "num": "QH-06", "chapter": "ch_qianghua", "name": "QH-06 晶面晶向关系辨析", "title": "晶面晶向关系辨析", "section": "强化周训练 · 教材 p.39-44", "def": "① [110]位于(001)晶面内，其沿第三晶轴的分量为零；也可用晶带关系hu＋kv＋lw＝0验证。\n② 立方晶系的三晶轴相互垂直且长度相等，因此(hkl) 晶面法线与[hkl]方向平行，(001)面的法向为[001]。\n③ 晶面指数来自截距的倒数比例，晶向指数来自方向分量比例。非立方晶系中晶轴长度或夹角不同，须考虑实际几何关系，不能直接沿用立方晶系的对应关系。 p.39-44。", "keyPoints":
