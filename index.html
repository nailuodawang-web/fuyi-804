2 分子量增加对聚合物结晶的影响", "title": "分子量增加对聚合物结晶的影响", "section": "《叶飞课后习题答案(1).pdf》第4章第12题｜教材 pp.77–78", "def": "随着分子量的增加，分子间作用力增强，分子运动受到限制，聚合物链难以有序排列和结晶。", "keyPoints": "分子量增→分子间作用力增、链运动受限→难以有序排列结晶", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_5_1", "num": "05-01", "chapter": "hw_ch5", "name": "05-01 金属中主要本征点缺陷", "title": "金属中主要本征点缺陷", "section": "《叶飞课后习题答案(1).pdf》第5章第1题｜教材 p.108", "def": "空位和自间隙原子。", "keyPoints": "空位与自间隙原子", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_5_2", "num": "05-02", "chapter": "hw_ch5", "name": "05-02 置换原子与间隙原子引起的晶格畸变", "title": "置换原子与间隙原子引起的晶格畸变", "section": "《叶飞课后习题答案(1).pdf》第5章第2题｜教材 p.108", "def": "置换原子尺寸大于基体原子时，导致基体晶格膨胀，反之导致收缩；间隙原子总是导致基体晶格膨胀。", "keyPoints": "大置换膨胀、小置换收缩；间隙原子总是引起晶格膨胀", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_5_3", "num": "05-03", "chapter": "hw_ch5", "name": "05-03 热平衡空位浓度计算结果", "title": "热平衡空位浓度计算结果", "section": "《叶飞课后习题答案(1).pdf》第5章第3题｜教材 p.108", "def": "2.2 × 10^25 / m³（原答案文件提取为 2.2×10^5/m，注意数量级与单位核对教材计算）。", "keyPoints": "平衡空位浓度数值结果", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_5_4", "num": "05-04", "chapter": "hw_ch5", "name": "05-04 三类位错的伯氏矢量与位错线方向关系", "title": "三类位错的伯氏矢量与位错线方向关系", "section": "《叶飞课后习题答案(1).pdf》第5章第4题｜教材 p.108", "def": "刃型位错：伯氏矢量方向与位错线方向垂直；\n螺型位错：伯氏矢量方向与位错线方向平行；\n混合型位错：伯氏矢量方向与位错线方向既不平行也不垂直。", "keyPoints": "刃型垂直、螺型平行、混合斜交", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_5_5", "num": "05-05", "chapter": "hw_ch5", "name": "05-05 螺型位错为何可有多个滑移面", "title": "螺型位错为何可有多个滑移面", "section": "《叶飞课后习题答案(1).pdf》第5章第5题｜教材 p.108", "def": "由于位错线方向与伯氏矢量方向平行，无法确定唯一滑移面；由于螺型位错的轴对称结构，包含位错线的晶面都可以成为滑移面。", "keyPoints": "b ∥ t 无法唯一定面，轴对称性使含位错线晶面均可滑移", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_5_6", "num": "05-06", "chapter": "hw_ch5", "name": "05-06 FCC 金属位错伯氏矢量与模长", "title": "FCC 金属位错伯氏矢量与模长", "section": "《叶飞课后习题答案(1).pdf》第5章第6题｜教材 p.108", "def": "FCC 金属中位错的伯氏矢量通常为最密排方向 ⟨110⟩/2，长度为 0.256 nm。", "keyPoints": "b = (a/2)⟨110⟩，长度 0.256 nm", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_5_7", "num": "05-07", "chapter": "hw_ch5", "name": "05-07 给定 b 与位错线方向的位错类型及攀移判断", "title": "给定 b 与位错线方向的位错类型及攀移判断", "section": "《叶飞课后习题答案(1).pdf》第5章第7题｜教材 p.108", "def": "因为伯氏矢量与位错线方向垂直，所以该位错类型为刃型。刃型位错能够攀移。", "keyPoints": "b ⊥ t 为刃型位错，具备攀移能力", "mnemonic": "", "pitfall": "注意：教材原图位错线为 [11-1]（末位有上划线），与 [112] 点积为 0 故垂直为刃型；不可丢掉上划线误判为螺型。", "freq": "教材课后原题"}, {"id": "hw_5_8", "num": "05-08", "chapter": "hw_ch5", "name": "05-08 一般大角度晶界能量较高的原因", "title": "一般大角度晶界能量较高的原因", "section": "《叶飞课后习题答案(1).pdf》第5章第8题｜教材 p.108", "def": "一般的大角度晶界，原子排列混乱，没有周期性匹配位置，界面原子键合受到很大破坏，晶界能量较高。", "keyPoints": "原子排列混乱、无周期匹配、原子键合破坏大→界面能高", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_5_9", "num": "05-09", "chapter": "hw_ch5", "name": "05-09 晶体密排面作为表面时表面能较低的原因", "title": "晶体密排面作为表面时表面能较低的原因", "section": "《叶飞课后习题答案(1).pdf》第5章第9题｜教材 p.108", "def": "表面内能是表面原子近邻原子键数量变化引起的。近邻原子键数减少，断键数增加，表面内能增加。因此，当晶体中密排面形成表面时，断键数较少，表面内能以及相应的表面能较低。", "keyPoints": "密排面断键数较少，表面内能与表面能较低", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_5_10", "num": "05-10", "chapter": "hw_ch5", "name": "05-10 小角度晶界位错间距计算结果", "title": "小角度晶界位错间距计算结果", "section": "《叶飞课后习题答案(1).pdf》第5章第10题｜教材 p.108", "def": "3.44 nm。", "keyPoints": "3.44 nm", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_5_11", "num": "05-11", "chapter": "hw_ch5", "name": "05-11 重位点密度 Σ 的表示方法", "title": "重位点密度 Σ 的表示方法", "section": "《叶飞课后习题答案(1).pdf》第5章第11题｜教材 p.108", "def": "重位点密度以重位点的倒易密度表示，即 CSL 晶胞体积除以晶格晶胞体积。", "keyPoints": "CSL 晶胞体积 / 原晶格晶胞体积（倒易密度 Σ）", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_5_12", "num": "05-12", "chapter": "hw_ch5", "name": "05-12 三类相界及其界面能大小比较", "title": "三类相界及其界面能大小比较", "section": "《叶飞课后习题答案(1).pdf》第5章第12题｜教材 p.108", "def": "相界类型包括共格相界、半共格相界和非共格相界。无畸变的共格相界界面能最低，半共格相界界面能居中，非共格相界界面能最高。有弹性畸变的共格相界的界面能与畸变程度密切相关。", "keyPoints": "无畸变共格 < 半共格 < 非共格；共格需考虑弹性畸变能", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_6_1", "num": "06-01", "chapter": "hw_ch6", "name": "06-01 应力与应变的基本定义", "title": "应力与应变的基本定义", "section": "《叶飞课后习题答案(1).pdf》第6章第1题｜教材 p.135", "def": "应力是作用在单位面积上的力。应变是物体在受到外力作用下，发生的长度变化与原始长度之比。", "keyPoints": "应力 = 单位面积力；应变 = 长度变化 / 原始长度", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_6_2", "num": "06-02", "chapter": "hw_ch6", "name": "06-02 线弹性伸长量计算结果", "title": "线弹性伸长量计算结果", "section": "《叶飞课后习题答案(1).pdf》第6章第2题｜教材 p.135", "def": "0.77 mm。", "keyPoints": "0.77 mm", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_6_3", "num": "06-03", "chapter": "hw_ch6", "name": "06-03 弹性变形的定义与特点", "title": "弹性变形的定义与特点", "section": "《叶飞课后习题答案(1).pdf》第6章第3题｜教材 p.135", "def": "弹性变形是指物体受到外力作用后发生的形变，当外力撤去后，物体又能恢复到原来的形状。弹性变形的特点是具有可逆性和完全恢复性。", "keyPoints": "外力撤去后可完全恢复，具有可逆性", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_6_4", "num": "06-04", "chapter": "hw_ch6", "name": "06-04 屈服强度与规定塑性延伸强度 Rp0.2 测定", "title": "屈服强度与规定塑性延伸强度 Rp0.2 测定", "section": "《叶飞课后习题答案(1).pdf》第6章第4题｜教材 p.135", "def": "有屈服平台时，通常取平台中下屈服点的平均应力值为屈服强度；没有屈服平台时，在 0.2% 应变处引出一条平行于弹性部分的直线，该直线与应力-应变曲线的交点对应的应力被定义为规定屈服强度。", "keyPoints": "有平台取下屈服点均值；无平台取 0.2% 残余应变平行线交点", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_6_5", "num": "06-05", "chapter": "hw_ch6", "name": "06-05 真应力的定义", "title": "真应力的定义", "section": "《叶飞课后习题答案(1).pdf》第6章第5题｜教材 p.135", "def": "真应力是载荷除以发生变形时的瞬时横截面积。", "keyPoints": "真应力 = 载荷 / 瞬时横截面积", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_6_6", "num": "06-06", "chapter": "hw_ch6", "name": "06-06 滞弹性与黏弹性的区别", "title": "滞弹性与黏弹性的区别", "section": "《叶飞课后习题答案(1).pdf》第6章第6题｜教材 p.135", "def": "材料弹性变形时应变落后于应力的现象被称为滞弹性。高分子材料对应力的响应兼有弹性固体和黏性流体的双重特性，这种性质被称为黏弹性。", "keyPoints": "滞弹性：应变落后应力；黏弹性：兼有弹性固体与黏性流体特性", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_6_7", "num": "06-07", "chapter": "hw_ch6", "name": "06-07 布氏、洛氏、维氏硬度的压头及换算", "title": "布氏、洛氏、维氏硬度的压头及换算", "section": "《叶飞课后习题答案(1).pdf》第6章第7题｜教材 p.135", "def": "布氏硬度的压头为钢球；洛氏硬度的压头为金刚石圆锥和钢球；维氏硬度的压头为金刚石正四棱锥体。三种测试方法在一定范围内可以相互比较使用，但各种硬度间没有通用的转换关系式。", "keyPoints": "布氏钢球、洛氏金刚石圆锥/钢球、维氏金刚石正四棱锥；无通用换算式", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_6_8", "num": "06-08", "chapter": "hw_ch6", "name": "06-08 冲击吸收功的计算原理及修正因素", "title": "冲击吸收功的计算原理及修正因素", "section": "《叶飞课后习题答案(1).pdf》第6章第8题｜教材 p.135", "def": "冲击吸收功可以通过摆锤释放时的高度与撞击后达到的高度之间的势能差计算，即 W = mgΔh（m 为摆锤质量，g 为重力加速度，Δh 为摆锤高度差）。实际操作中还需考虑空气阻力、摩擦力以及摆锤的旋转能量等修正因素。", "keyPoints": "W = mgΔh，需修正空气阻力、摩擦力与旋转能量", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_6_9", "num": "06-09", "chapter": "hw_ch6", "name": "06-09 弯曲试验可获得的力学性能指标", "title": "弯曲试验可获得的力学性能指标", "section": "《叶飞课后习题答案(1).pdf》第6章第9题｜教材 p.135", "def": "弯曲试验能够获得力与挠度的关系曲线。借助该曲线能够得到的弯曲性能指标包括弯曲模量、抗弯强度以及断裂挠度等。", "keyPoints": "弯曲模量、抗弯强度、断裂挠度", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_6_10", "num": "06-10", "chapter": "hw_ch6", "name": "06-10 设计应力与安全应力的区别", "title": "设计应力与安全应力的区别", "section": "《叶飞课后习题答案(1).pdf》第6章第10题｜教材 p.135", "def": "设计应力是在结构设计中，根据设计要求和材料特性，预先设定的最大允许应力。安全应力是指在实际工作条件下，结构所承受的确保稳定性和安全性的实际应力。", "keyPoints": "设计应力：预设最大允许应力；安全应力：实际工况安全承受应力", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_1", "num": "07-01", "chapter": "hw_ch7", "name": "07-01 金属、陶瓷与非晶高分子弹性变形机制是否相同", "title": "金属、陶瓷与非晶高分子弹性变形机制是否相同", "section": "《叶飞课后习题答案(1).pdf》第7章第1题｜教材 p.167", "def": "不相同。金属和陶瓷材料弹性变形机制是原子键的伸长；非晶态高分子材料的弹性变形机制是分子链的调整和拉长。", "keyPoints": "金属/陶瓷：原子键伸长；非晶高分子：分子链段调整拉长", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_2", "num": "07-02", "chapter": "hw_ch7", "name": "07-02 滑移与孪生的变形机制", "title": "滑移与孪生的变形机制", "section": "《叶飞课后习题答案(1).pdf》第7章第2题｜教材 p.167", "def": "滑移：晶体的滑移是通过位错的运动来实现的，位错滑移穿过滑移面，材料发生位移，位移量是一个伯氏矢量。\n孪生：切应力可以产生原子位移，使一部分原子位于另一部分原子的镜像位置，从而形成孪晶。", "keyPoints": "滑移：位错运动，位移为 b 整数倍；孪生：镜像对称切变形成孪晶", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_3", "num": "07-03", "chapter": "hw_ch7", "name": "07-03 滑移系数量与塑性变形能力（FCC vs HCP）", "title": "滑移系数量与塑性变形能力（FCC vs HCP）", "section": "《叶飞课后习题答案(1).pdf》第7章第3题｜教材 p.167", "def": "在相同条件下，可供选择的滑移系数量越多，塑性变形能力也就越强。面心立方结构的晶体有 12 个滑移系，而密排六方结构的晶体通常仅有 3 个滑移系。", "keyPoints": "滑移系越多塑性越强；FCC 有 12 个，HCP 常温基面仅有 3 个", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_4", "num": "07-04", "chapter": "hw_ch7", "name": "07-04 临界分切应力的定义", "title": "临界分切应力的定义", "section": "《叶飞课后习题答案(1).pdf》第7章第4题｜教材 p.167", "def": "当施加外力使分切应力达到某个临界值时，单晶中的滑移沿着最优滑移系进行，该临界值称为临界分切应力。", "keyPoints": "单晶滑移开动所需的最小分切应力阈值", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_5", "num": "07-05", "chapter": "hw_ch7", "name": "07-05 变形孪晶与退火孪晶", "title": "变形孪晶与退火孪晶", "section": "《叶飞课后习题答案(1).pdf》第7章第5题｜教材 p.167", "def": "通过机械变形过程形成的孪晶被称为变形孪晶。变形金属进行再结晶退火处理过程中形成的孪晶被称为退火孪晶。", "keyPoints": "机械变形形成变形孪晶；再结晶退火形成退火孪晶", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_6", "num": "07-06", "chapter": "hw_ch7", "name": "07-06 低碳钢屈服平台的微观形成条件", "title": "低碳钢屈服平台的微观形成条件", "section": "《叶飞课后习题答案(1).pdf》第7章第6题｜教材 p.167", "def": "屈服平台形成需要碳间隙原子聚集在位错附近形成柯氏气团。", "keyPoints": "碳/氮间隙原子偏聚位错形成柯氏气团钉扎", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_7", "num": "07-07", "chapter": "hw_ch7", "name": "07-07 四种金属强化机制的定义", "title": "四种金属强化机制的定义", "section": "《叶飞课后习题答案(1).pdf》第7章第7题｜教材 p.167", "def": "① 细晶强化：多晶体材料的强度通常高于单晶体材料，并且晶粒越细小，材料的强度越高。\n② 固溶强化：合金由单相固溶体组成时，随着溶质原子含量增加，抵抗塑性变形能力增强，强度硬度上升而塑韧性下降。\n③ 加工硬化：金属对塑性变形的抗力随变形量的增加而增加，强度硬度提高而韧性延展性降低。\n④ 第二相强化：引入第二相或更多相，使材料成为两相或多相合金，从而提高强度。", "keyPoints": "细晶、固溶、加工硬化、第二相强化", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_8", "num": "07-08", "chapter": "hw_ch7", "name": "07-08 细晶强化为何能同时提高强度、塑性和韧性", "title": "细晶强化为何能同时提高强度、塑性和韧性", "section": "《叶飞课后习题答案(1).pdf》第7章第8题｜教材 p.167", "def": "① 强度提高：相邻晶粒滑移系不连续，位错无法穿过晶界持续滑移而在晶界处塞积；多滑移增加了位错交互作用与运动阻力，晶粒越细强度越高。\n② 改善塑性与韧性：晶粒越细，单位体积晶粒数越多，变形分散在更多晶粒内而更均匀，每个晶粒中塞积位错少、应力集中小，开裂机会少且断裂前可承受更大变形，裂纹扩展吸收更多能量。", "keyPoints": "晶界阻位错塞积→高强；变形均匀分散、应力集中小→高塑韧", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_9", "num": "07-09", "chapter": "hw_ch7", "name": "07-09 A-B 与 A-C 固溶体塑性变形能力比较", "title": "A-B 与 A-C 固溶体塑性变形能力比较", "section": "《叶飞课后习题答案(1).pdf》第7章第9题｜教材 p.167", "def": "A-C 固溶合金的塑性变形能力差。溶质原子的存在及其固溶度的增加会使基体变形抗力提高、塑性下降；尺寸差越大强化越明显。A-B 可能形成置换固溶体，A-C 可能形成间隙固溶体，间隙型溶质原子比置换原子具有更大的固溶强化效果。", "keyPoints": "A-C 间隙固溶强化更强，塑性变形能力更差", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_10", "num": "07-10", "chapter": "hw_ch7", "name": "07-10 加工硬化的定义与消除方法", "title": "加工硬化的定义与消除方法", "section": "《叶飞课后习题答案(1).pdf》第7章第10题｜教材 p.167", "def": "材料对塑性变形的抗力随应变的增加而增加的现象称为加工硬化。加工硬化可以通过再结晶退火予以消除。", "keyPoints": "变形抗力随应变增加而上升；可通过再结晶退火消除", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_11", "num": "07-11", "chapter": "hw_ch7", "name": "07-11 纤维组织与变形织构及其对性能的影响", "title": "纤维组织与变形织构及其对性能的影响", "section": "《叶飞课后习题答案(1).pdf》第7章第11题｜教材 p.167", "def": "① 纤维组织：变形过程中晶粒沿拉伸方向伸长，大变形下呈纤维状条纹，使金属沿纤维方向强度高于横向强度。\n② 变形织构：多晶体塑性变形中晶粒转动产生择优取向，使金属显示明显的各向异性，加工时变形不均匀，但在特定应用中可增强特定方向性能。", "keyPoints": "纤维组织与择优取向织构均导致各向异性", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_12", "num": "07-12", "chapter": "hw_ch7", "name": "07-12 冷变形产生残余应力的三类划分", "title": "冷变形产生残余应力的三类划分", "section": "《叶飞课后习题答案(1).pdf》第7章第12题｜教材 p.167", "def": "① 宏观残余应力：由工件各部分之间的变形不均匀产生。\n② 微观残余应力：由晶粒或亚晶粒的不均匀变形引起，作用范围与晶粒尺寸相当。\n③ 点阵畸变：塑性变形产生大量晶体缺陷使原子偏离平衡位置，造成点阵畸变。", "keyPoints": "宏观残余应力、微观残余应力、点阵畸变", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_13", "num": "07-13", "chapter": "hw_ch7", "name": "07-13 再结晶定义及主要影响因素", "title": "再结晶定义及主要影响因素", "section": "《叶飞课后习题答案(1).pdf》第7章第13题｜教材 p.167", "def": "当冷变形金属加热到一定温度时，形成新的等轴晶粒并逐步取代变形晶粒的过程，称为再结晶。影响因素主要有：变形程度、退火温度、原始晶粒尺寸、微量溶质原子、第二相颗粒。", "keyPoints": "新等轴晶粒取代变形晶粒；受变形量、温度、原晶粒、溶质、第二相影响", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_14", "num": "07-14", "chapter": "hw_ch7", "name": "07-14 楔形板冷轧后退火晶粒与强度分布", "title": "楔形板冷轧后退火晶粒与强度分布", "section": "《叶飞课后习题答案(1).pdf》第7章第14题｜教材 p.167", "def": "厚度不同的楔形板冷轧为相同厚度的钢板，各处变形量不同。再结晶退火后的晶粒大小与变形量密切相关，变形量越大，再结晶后的晶粒越小，所以退火后各处晶粒大小不同。晶粒越细，抗拉强度越高。", "keyPoints": "变形量大处再结晶晶粒更细，抗拉强度更高", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_7_15", "num": "07-15", "chapter": "hw_ch7", "name": "07-15 影响晶粒正常长大的因素", "title": "影响晶粒正常长大的因素", "section": "《叶飞课后习题答案(1).pdf》第7章第15题｜教材 p.167", "def": "加热温度、加热时间、晶粒位向差、杂质与合金元素、第二相颗粒。", "keyPoints": "温度、时间、位向差、杂质合金元素、第二相颗粒", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_8_1", "num": "08-01", "chapter": "hw_ch8", "name": "08-01 应力集中的定义", "title": "应力集中的定义", "section": "《叶飞课后习题答案(1).pdf》第8章第1题｜教材 p.184", "def": "应力集中指物体中应力局部增高的现象，一般出现在物体形状急剧变化的地方。", "keyPoints": "几何形状突变处应力局部增高", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_8_2", "num": "08-02", "chapter": "hw_ch8", "name": "08-02 解理断裂与解理面特性", "title": "解理断裂与解理面特性", "section": "《叶飞课后习题答案(1).pdf》第8章第2题｜教材 p.184", "def": "当晶体材料脆性断裂时，若晶面承受的拉伸应力超过晶面间的结合力，裂纹会沿着晶面扩展，使晶面分离形成光滑断口，称为解理。解理面一般平行于晶体低指数密排面，因为垂直密排面方向上成键数较少、面间距较大、面间结合较弱。", "keyPoints": "沿特定晶面脆性分离；垂直该晶面面间距大、键数少结合弱", "mnemonic": "", "pitfall": "注意：BCC 金属常见 {100} 解理面而非最密排 {110} 滑移面，答题应侧重断键代价低、表面能低。", "freq": "教材课后原题"}, {"id": "hw_8_3", "num": "08-03", "chapter": "hw_ch8", "name": "08-03 两块裂纹板应力强度因子比较", "title": "两块裂纹板应力强度因子比较", "section": "《叶飞课后习题答案(1).pdf》第8章第3题｜教材 p.184", "def": "不相同。A 板为 K = σ√(πa)；B 板为 K = 2σ√(π·a/2) = √2 σ√(πa)。", "keyPoints": "K_A = σ√(πa)，K_B = √2 σ√(πa)，B板更危险", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_8_4", "num": "08-04", "chapter": "hw_ch8", "name": "08-04 无限大板断裂判据计算", "title": "无限大板断裂判据计算", "section": "《叶飞课后习题答案(1).pdf》第8章第4题｜教材 p.184", "def": "无限大板应力强度因子 K = σ√(πa) = 250 MPa × √(π × 40.8 × 10^-3 m) = 89.50 MPa·m^(1/2)，大于 K_IC，因此该板会断裂。", "keyPoints": "计算 K_I 与 K_IC 比较判定断裂", "mnemonic": "", "pitfall": "注意勘误：若 40.8 mm 为中心贯穿裂纹总长 2a，则半长 a = 20.4 mm，原答案文件直接代 40.8 mm 会将 K_I 多算 √2 倍。", "freq": "教材课后原题"}, {"id": "hw_8_5", "num": "08-05", "chapter": "hw_ch8", "name": "08-05 三种典型循环变应力", "title": "三种典型循环变应力", "section": "《叶飞课后习题答案(1).pdf》第8章第5题｜教材 p.184", "def": "非对称循环变应力、脉动循环变应力和对称循环变应力。", "keyPoints": "非对称循环、脉动循环、对称循环", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_8_6", "num": "08-06", "chapter": "hw_ch8", "name": "08-06 循环应力参数计算结果", "title": "循环应力参数计算结果", "section": "《叶飞课后习题答案(1).pdf》第8章第6题｜教材 p.184", "def": "平均应力为 125 MPa，应力幅为 75 MPa，应力比为 0.25。", "keyPoints": "σ_m = 125 MPa，σ_a = 75 MPa，R = 0.25", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_8_7", "num": "08-07", "chapter": "hw_ch8", "name": "08-07 疲劳极限的定义", "title": "疲劳极限的定义", "section": "《叶飞课后习题答案(1).pdf》第8章第7题｜教材 p.184", "def": "对于一些材料，S-N 曲线在 N 值很高时为水平状，即存在一个极限应力水平，该极限水平被称为疲劳极限。很多材料没有疲劳极限。", "keyPoints": "高周次下 S-N 曲线趋于水平对应的极限应力；并非所有材料都有", "mnemonic": "", "pitfall": "对照  "freq": "教材课后原题"}, {"id": "hw_11_3", "num": "11-03", "chapter": "hw_ch11", "name": "11-03 TTT 图的含义与作用", "title": "TTT 图的含义与作用", "section": "《叶飞课后习题答案(1).pdf》第11章第3题｜教材 p.264", "def": "等温转变图。TTT 图可反映不同过冷度下的等温转变过程，包括转变开始和转变终了时间、转变产物的类型以及转变量与时间、温度之间的关系等。", "keyPoints": "反映等温条件下开始/终了时间、产物类型及转变量与温度时间关系", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_11_4", "num": "11-04", "chapter": "hw_ch11", "name": "11-04 上贝氏体与下贝氏体的形貌结构特征", "title": "上贝氏体与下贝氏体的形貌结构特征", "section": "《叶飞课后习题答案(1).pdf》第11章第4题｜教材 p.264", "def": "上贝氏体在贝氏体转变的高温范围内形成，由成束大致平行排列的板条状铁素体和条间的粒状或条状渗碳体构成，呈现羽毛状结构。\n下贝氏体在低温范围内形成：低碳钢中铁素体呈板条状平行成束；高碳钢中铁素体呈片状且各片互成一定角度；中碳钢中可同时存在两种形态。", "keyPoints": "上贝氏体羽毛状（高温）；下贝氏体针片/板条状（低温）", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_11_5", "num": "11-05", "chapter": "hw_ch11", "name": "11-05 上贝氏体强度与冲击韧性较低的原因", "title": "上贝氏体强度与冲击韧性较低的原因", "section": "《叶飞课后习题答案(1).pdf》第11章第5题｜教材 p.264", "def": "上贝氏体形成温度较高，铁素体条粗大，碳化物颗粒较粗大且分布不均，导致强度和硬度较低；同时铁素体条平行排列方向性强且碳化物连续分布于条间，易在交界处产生微裂纹并促进脆断和裂纹快速传播，故冲击韧性较低。", "keyPoints": "条粗、碳化物沿条间连续分布易萌生并扩展微裂纹", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_11_6", "num": "11-06", "chapter": "hw_ch11", "name": "11-06 CCT 图的含义与作用", "title": "CCT 图的含义与作用", "section": "《叶飞课后习题答案(1).pdf》第11章第6题｜教材 p.264", "def": "连续冷却转变图。CCT 图反映了在连续冷却条件下发生转变的规律，可用于预估实际热处理后零件的组织和性能，确定淬火临界冷却速率，从而选择淬火介质。", "keyPoints": "预估连续冷却组织性能，确定淬火临界冷速与选淬火介质", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_11_7", "num": "11-07", "chapter": "hw_ch11", "name": "11-07 淬火临界冷却速率的定义与意义", "title": "淬火临界冷却速率的定义与意义", "section": "《叶飞课后习题答案(1).pdf》第11章第7题｜教材 p.264", "def": "CCT 图中不发生珠光体、贝氏体转变的最小冷却速率称为淬火临界冷却速率。它是保证奥氏体在连续冷却过程中不发生分解而全部过冷到马氏体区的最小冷却速率，可指导生产中获得高硬度高强度的马氏体。", "keyPoints": "不发生 P/B 转变全部进入 M 区的最小冷速", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_11_8", "num": "11-08", "chapter": "hw_ch11", "name": "11-08 板条马氏体与针状马氏体的金相形态特征", "title": "板条马氏体与针状马氏体的金相形态特征", "section": "《叶飞课后习题答案(1).pdf》第11章第8题｜教材 p.264", "def": "板条状马氏体（低碳马氏体）形成温度较高，尺寸大致相同的细马氏体条定向平行排列，组成马氏体束或马氏体区；\n针状马氏体（片状/高碳马氏体）形成温度较低，大小不一，分布无规则。", "keyPoints": "板条状定向平行成束（低碳）；针状大小不一无规则（高碳）", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_11_9", "num": "11-09", "chapter": "hw_ch11", "name": "11-09 淬火至室温为何常保留残余奥氏体", "title": "淬火至室温为何常保留残余奥氏体", "section": "《叶飞课后习题答案(1).pdf》第11章第9题｜教材 p.264", "def": "大部分钢的 M_s 在室温以上，而 M_f 在室温以下，所以当淬火冷却到室温时将保留相当数量的未转变残余奥氏体。", "keyPoints": "M_f 低于室温，冷却至室温时转变未完全结束", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_11_10", "num": "11-10", "chapter": "hw_ch11", "name": "11-10 马氏体高硬度高强度的五大强化因素", "title": "马氏体高硬度高强度的五大强化因素", "section": "《叶飞课后习题答案(1).pdf》第11章第10题｜教材 p.264", "def": "① 相变强化：晶格切变与塑性变形产生大量位错、孪晶和层错等缺陷。\n② 固溶强化：过饱和间隙碳原子引起强烈点阵畸变与应力场钉扎位错。\n③ 时效强化：淬火过程或室温停留发生“自回火”，产生超显微结构不均匀性。\n④ 亚结构强化：马氏体亚结构中的孪晶界阻碍位错运动。\n⑤ 细晶强化：马氏体束尺寸越细小，强度越高。", "keyPoints": "相变强化、间隙固溶强化、自回火时效、孪晶亚结构、细晶强化", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_11_11", "num": "11-11", "chapter": "hw_ch11", "name": "11-11 碳含量对马氏体硬度的影响规律", "title": "碳含量对马氏体硬度的影响规律", "section": "《叶飞课后习题答案(1).pdf》第11章第11题｜教材 p.264", "def": "马氏体的硬度随着碳含量的增加而升高，但当含碳量超过 0.6% 时，硬度增加的趋势会减缓。", "keyPoints": "随含碳量升高而增大，超过 0.6%C 后增势减缓（受残余奥氏体影响）", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_12_1", "num": "12-01", "chapter": "hw_ch12", "name": "12-01 铜的载流子浓度与迁移率计算结果", "title": "铜的载流子浓度与迁移率计算结果", "section": "《叶飞课后习题答案(1).pdf》第12章第1题｜教材 p.288", "def": "载流子浓度：7.625 × 10^28 m^-3；迁移率：55.67 cm²/(V·s)（或 5.567 × 10^-3 m²/(V·s)）。", "keyPoints": "n = 7.625×10^28 m^-3，μ = 55.67 cm²/(V·s)", "mnemonic": "", "pitfall": "对照教材原题设问与考纲范围核对作答，注意单位、前提条件与符号规范。", "freq": "教材课后原题"}, {"id": "hw_12_2", "num": "12-02", "chapter": "hw_ch12", "name": "12-02 费米能级的定义及在     let activeModuleId = 'mod_sustech_804_qa'; // Default to QA

    // Study Workspace State
    let masteryMap = {}; // { [itemId]: 'mastered' | 'fuzzy' | 'forgotten' }
    let selectedChapter = 'all';
    let selectedStatus = 'all'; // 'all' | 'weakness' | 'mastered' | 'fuzzy' | 'forgotten' | 'unmarked'
    let searchQuery = '';
    let viewMode = 'list'; // 'list' | 'flashcard'
    let reciteMaskEnabled = true;
    let showMnemonic = true;
    let showKeyPoints = true;
    let showPitfall = true;
    let showOrigDef = true;

    // Flashcard State
    let fcIndex = 0;
    let fcAnswerVisible = false;
    let fcSlideDir = ''; // 'next' | 'prev' | ''
    let fcShuffledIds = null;

    // Responsive helper: true on mobile portrait, mobile landscape (height < 560), or narrow screens (< 1024)
    function isMobileOrCompactViewport() {
      return window.innerWidth < 1024 || window.innerHeight < 560;
    }

    // Load mastery from localStorage
    function loadMasteryMap() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_MASTERY);
        if (raw) {
          masteryMap = JSON.parse(raw) || {};
        }
      } catch (e) {
        console.error('Failed to load mastery data:', e);
        masteryMap = {};
      }
    }

    function saveMasteryMap() {
      try {
        localStorage.setItem(STORAGE_KEY_MASTERY, JSON.stringify(masteryMap));
      } catch (e) {
        console.error('Failed to save mastery data:', e);
      }
    }

    function loadTrashSet() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_TRASH);
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) trashSet = new Set(arr);
        }
      } catch (e) {
        console.error('Failed to load trash data:', e);
        trashSet = new Set();
      }
    }

    function saveTrashSet() {
      try {
        localStorage.setItem(STORAGE_KEY_TRASH, JSON.stringify(Array.from(trashSet)));
      } catch (e) {
        console.error('Failed to save trash data:', e);
      }
    }

    function updateTrashBadge() {
      const badge = document.getElementById('trashCountBadge');
      if (badge) badge.textContent = `${trashSet.size}项`;
    }

    function moveToTrash(itemId) {
      if (!itemId) return;
      trashSet.add(itemId);
      saveTrashSet();
      updateTrashBadge();
      updateAllUI(false);
      showToast('已移入回收站，可在顶部“回收站”随时恢复');
    }

    function restoreFromTrash(itemId) {
      if (!itemId) return;
      trashSet.delete(itemId);
      saveTrashSet();
      updateTrashBadge();
      updateAllUI(false);
      showToast('已恢复至原题库');
    }

    function restoreAllTrash() {
      if (trashSet.size === 0) return;
      trashSet.clear();
      saveTrashSet();
      updateTrashBadge();
      updateAllUI(false);
      showToast('已恢复回收站全部知识点');
    }

    function buildTrashModule() {
      const srcMeta = {
        'mod_sustech_804_qa': { id: 'src_qa', num: '📘 简答', title: '804 简答题全解' },
        'mod_sustech_804': { id: 'src_terms', num: '📕 名词', title: '804 名词解释' },
        'mod_sustech_804_hw': { id: 'src_hw', num: '📝 习题', title: '课后习题原解' }
      };
      const trashedTerms = [];
      allModules.forEach(m => {
        const meta = srcMeta[m.id] || { id: 'src_other', num: '📚 其他', title: m.title };
        (m.terms || []).forEach(t => {
          if (trashSet.has(t.id)) {
            trashedTerms.push({
              ...t,
              chapter: meta.id,
              _origChapter: t.chapter,
              _origModTitle: meta.title
            });
          }
        });
      });
      return {
        id: 'mod_trash',
        title: '🗑️ 知识点回收站',
        subtitle: '已移入回收站的知识点不计入背诵统计，可随时点击恢复',
        badge: `已回收 ${trashedTerms.length} 项`,
        chapters: [
          { id: 'src_qa', num: '📘 简答', title: '804 简答题全解', desc: '来自简答题模块' },
          { id: 'src_terms', num: '📕 名词', title: '804 名词解释', desc: '来自名词解释模块' },
          { id: 'src_hw', num: '📝 习题', title: '课后习题原解', desc: '来自课后习题模块' }
        ],
        terms: trashedTerms
      };
    }

    function getActiveModule() {
      if (activeModuleId === 'mod_trash') return buildTrashModule();
      return allModules.find(m => m.id === activeModuleId) || allModules[0];
    }

    function getActiveTerms(mod) {
      if (!mod) return [];
      if (mod.id === 'mod_trash') return mod.terms || [];
      return (mod.terms || []).filter(t => !trashSet.has(t.id));
    }

    function getStatus(itemId) {
      return masteryMap[itemId] || 'unmarked';
    }

    function setStatus(itemId, status) {
      if (status === 'unmarked') {
        delete masteryMap[itemId];
      } else {
        masteryMap[itemId] = status;
      }
      saveMasteryMap();
      updateAllUI(false);
    }

    function showToast(msg) {
      const t = document.getElementById('toastNotice');
      if (!t) return;
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => {
        t.classList.add('hidden');
      }, 2200);
    }

    // Switch between QA module and Terms module
    function switchModule(modId) {
      activeModuleId = modId;
      selectedChapter = 'all';
      selectedStatus = 'all';
      searchQuery = '';
      fcIndex = 0;
      fcAnswerVisible = false;
      fcShuffledIds = null;
      document.getElementById('searchInput').value = '';

      // Update module tabs styling
      const btnQa = document.getElementById('switchModQaBtn');
      const btnTerms = document.getElementById('switchModTermsBtn');
      const btnHw = document.getElementById('switchModHwBtn');
      const btnTrash = document.getElementById('switchModTrashBtn');
      const activeCls = 'px-2.5 sm:px-3 py-1 text-xs font-bold rounded-lg transition flex items-center gap-1.5 bg-indigo-600 text-white shadow-xs shrink-0 whitespace-nowrap';
      const inactiveCls = 'px-2.5 sm:px-3 py-1 text-xs font-semibold rounded-lg text-slate-300 hover:text-white hover:bg-slate-700/50 transition flex items-center gap-1.5 shrink-0 whitespace-nowrap';
      if (btnQa) btnQa.className = (modId === 'mod_sustech_804_qa') ? activeCls : inactiveCls;
      if (btnTerms) btnTerms.className = (modId === 'mod_sustech_804') ? activeCls : inactiveCls;
      if (btnHw) btnHw.className = (modId === 'mod_sustech_804_hw') ? activeCls : inactiveCls;
      if (btnTrash) btnTrash.className = (modId === 'mod_trash') ? activeCls : inactiveCls;

      // Update header titles
      const mod = getActiveModule();
      document.getElementById('studyModuleBadge').textContent = mod.badge || '核心考点';
      document.getElementById('studyModuleMainTitle').textContent = mod.title;
      document.getElementById('studyModuleSubtitleText').textContent = mod.subtitle || '';

      updateAllUI(true);
      showToast(`已切换至：${mod.title.replace('南方科技大学 804《材料科学基础》', '804')}`);
    }

    // Filtering logic
    function getFilteredTerms() {
      const mod = getActiveModule();
      let terms = getActiveTerms(mod);

      // Filter by chapter
      if (selectedChapter !== 'all') {
        terms = terms.filter(t => t.chapter === selectedChapter);
      }

      // Filter by status
      if (selectedStatus === 'weakness') {
        terms = terms.filter(t => {
          const st = getStatus(t.id);
          return st === 'fuzzy' || st === 'forgotten';
        });
      } else if (selectedStatus !== 'all') {
        terms = terms.filter(t => getStatus(t.id) === selectedStatus);
      }

      // Search keyword
      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        terms = terms.filter(t => {
          return (t.name && t.name.toLowerCase().includes(q)) ||
                 (t.num && t.num.toLowerCase().includes(q)) ||
                 (t.def && t.def.toLowerCase().includes(q)) ||
                 (t.mnemonic && t.mnemonic.toLowerCase().includes(q)) ||
                 (t.keyPoints && t.keyPoints.toLowerCase().includes(q)) ||
                 (t.section && t.section.toLowerCase().includes(q));
        });
      }

      return terms;
    }

    // Update global progress bar
    function updateStatsBar() {
      const mod = getActiveModule();
      const allTerms = getActiveTerms(mod);
      const total = allTerms.length;

      let mastered = 0, fuzzy = 0, forgotten = 0;
      allTerms.forEach(t => {
        const st = getStatus(t.id);
        if (st === 'mastered') mastered++;
        else if (st === 'fuzzy') fuzzy++;
        else if (st === 'forgotten') forgotten++;
      });

      const unmarked = total - mastered - fuzzy - forgotten;
      const pct = total > 0 ? Math.round((mastered / total) * 100) : 0;

      document.getElementById('statTotalBadge').textContent = `总计 ${total}`;
      document.getElementById('statMasteredBadge').textContent = `✅ 掌握 ${mastered}`;
      document.getElementById('statFuzzyBadge').textContent = `🤔 模糊 ${fuzzy}`;
      document.getElementById('statForgottenBadge').textContent = `❌ 遗忘 ${forgotten}`;
      document.getElementById('statUnmarkedBadge').textContent = `⚪ 未背 ${unmarked}`;

      document.getElementById('statMasteredBar').style.width = `${(mastered / total) * 100}%`;
      document.getElementById('statFuzzyBar').style.width = `${(fuzzy / total) * 100}%`;
      document.getElementById('statForgottenBar').style.width = `${(forgotten / total) * 100}%`;
      document.getElementById('statPercentText').textContent = `${pct}%`;
    }

    // Render left chapter tree
    function renderChapterNav() {
      const mod = getActiveModule();
      const container = document.getElementById('chapterNavList');
      if (!container) return;

      const terms = getActiveTerms(mod);
      let html = '';

      let totalMasteredCount = 0;
      terms.forEach(t => {
        if (getStatus(t.id) === 'mastered') totalMasteredCount++;
      });
      const allBtn = document.getElementById('showAllChaptersBtn');
      if (allBtn) {
        allBtn.innerHTML = `全部大纲 <span class="ml-1 text-[10px] px-1.5 py-0.5 rounded-full font-mono font-bold ${selectedChapter === 'all' ? 'bg-indigo-600 text-white' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}">${totalMasteredCount}/${terms.length}</span>`;
      }

      mod.chapters.forEach(ch => {
        const chTerms = terms.filter(t => t.chapter === ch.id);
        const chTotal = chTerms.length;
        let chMastered = 0;
        let chFuzzy = 0;
        let chForgotten = 0;
        chTerms.forEach(t => {
          const st = getStatus(t.id);
          if (st === 'mastered') chMastered++;
          else if (st === 'fuzzy') chFuzzy++;
          else if (st === 'forgotten') chForgotten++;
        });

        const pctMastered = chTotal > 0 ? (chMastered / chTotal) * 100 : 0;
        const pctFuzzy = chTotal > 0 ? (chFuzzy / chTotal) * 100 : 0;
        const pctForgotten = chTotal > 0 ? (chForgotten / chTotal) * 100 : 0;
        const isSelected = selectedChapter === ch.id;

        html += `
          <div data-chapter-id="${ch.id}" class="chapter-nav-item p-2.5 rounded-xl cursor-pointer transition ${isSelected ? 'bg-indigo-50 border-indigo-200 border text-indigo-950 font-bold shadow-xs' : 'hover:bg-slate-100 text-slate-700'}">
            <div class="flex items-center justify-between gap-1.5 mb-1.5">
              <span class="text-xs truncate font-semibold" title="${ch.num} · ${ch.title}">${ch.num} · ${ch.title}</span>
              <span class="inline-flex items-center gap-0.5 text-[11px] font-bold font-mono px-2 py-0.5 rounded-full shrink-0 transition-all ${
                chMastered === chTotal && chTotal > 0
                  ? 'bg-emerald-100 text-emerald-800 border border-emerald-300 shadow-xs'
                  : chMastered > 0
                  ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                  : 'bg-slate-100 text-slate-400'
              }">
                <span class="${chMastered > 0 ? 'text-emerald-700 font-bold' : 'text-slate-400'}">${chMastered}</span>
                <span class="text-slate-300 font-normal">/</span>
                <span class="text-slate-500 font-normal">${chTotal}</span>
              </span>
            </div>
            <!-- Multi-segment Progress Bar: Green (Mastered), Yellow (Fuzzy), Red (Forgotten) -->
            <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden flex" title="掌握 ${chMastered} · 模糊 ${chFuzzy} · 遗忘 ${chForgotten} / 共 ${chTotal}">
              <div class="bg-emerald-500 h-full transition-all" style="width: ${pctMastered}%"></div>
              <div class="bg-amber-400 h-full transition-all" style="width: ${pctFuzzy}%"></div>
              <div class="bg-rose-500 h-full transition-all" style="width: ${pctForgotten}%"></div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      // Add click handlers
      container.querySelectorAll('.chapter-nav-item').forEach(el => {
        el.addEventListener('click', () => {
          selectedChapter = el.getAttribute('data-chapter-id');
          if (isMobileOrCompactViewport()) {
            applySidebarState(true, true);
          }
          updateAllUI(true);
        });
      });
    }

    function getStatusBadgeHTML(st) {
      if (st === 'mastered') return `<span class="nowrap-pill text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">✅ 已掌握</span>`;
      if (st === 'fuzzy') return `<span class="nowrap-pill text-[11px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">🤔 模糊</span>`;
      if (st === 'forgotten') return `<span class="nowrap-pill text-[11px] font-bold text-rose-700 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">❌ 遗忘</span>`;
      return `<span class="nowrap-pill text-[11px] text-slate-400 bg-slate-100 px-2 py-0.5 rounded">⚪ 未标记</span>`;
    }

    // Render Mode A: List Cards
    function renderListView(filteredTerms) {
      const container = document.getElementById('listViewContainer');
      if (!container) return;

      if (filteredTerms.length === 0) {
        if (activeModuleId === 'mod_trash') {
          container.innerHTML = `
            <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center">
              <p class="text-base font-semibold text-slate-700 mb-1">🗑️ 回收站为空</p>
              <p class="text-xs text-slate-500 mb-4">点击任意知识点卡片右侧的垃圾桶图标，即可将其移入回收站；随时可在此恢复。</p>
            </div>
          `;
          return;
        }
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center">
            <p class="text-base font-semibold text-slate-700 mb-1">当前筛选条件下没有匹配的题目</p>
            <p class="text-xs text-slate-500 mb-4">你可以切换左侧章节、清空搜索词或点击下方按钮查看全部题目</p>
            <button id="emptyResetFilterBtn" type="button" class="px-4 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition">显示全部大纲题目</button>
          </div>
        `;
        const resetBtn = document.getElementById('emptyResetFilterBtn');
        if (resetBtn) {
          resetBtn.addEventListener('click', () => {
            selectedChapter = 'all';
            selectedStatus = 'all';
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            updateAllUI(true);
          });
        }
        return;
      }

      const mod = getActiveModule();
      const chMap = {};
      mod.chapters.forEach(c => { chMap[c.id] = c; });

      let html = '';

      // Prominent Chapter Mastery Banner when a specific chapter is selected
      if (selectedChapter !== 'all') {

        });

        html += `
          <div class="mb-3.5 p-3 rounded-xl bg-gradient-to-r from-indigo-50/90 via-slate-50 to-emerald-50/60 border border-slate-200 flex flex-wrap items-center justify-between gap-2 shadow-xs">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>
              <span class="text-sm font-bold text-slate-800 truncate">${curCh.num} · ${curCh.title}</span>
              <span class="text-xs text-slate-500 hidden md:inline truncate">${curCh.bookRef || ''}</span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="inline-flex items-center gap-1.5 text-xs font-bold font-mono px-2.5 py-1 rounded-lg bg-emerald-100/90 text-emerald-800 border border-emerald-300 shadow-xs whitespace-nowrap">
                <span>✅ 已掌握</span>
                <span class="text-sm text-emerald-900 font-bold">${chMastered}</span>
                <span class="text-slate-400 font-normal">/</span>
                <span class="text-slate-600 font-normal">${chTotal} 题</span>

              </span>
            </div>
          </div>
        `;
      }
      if (activeModuleId === 'mod_trash') {
        html += `
          <div class="mb-3 px-4 py-2.5 rounded-xl bg-rose-50/70 border border-rose-200/80 flex items-center justify-between gap-3">

      filteredTerms.forEach((item) => {

        html += `

                ${activeModuleId === 'mod_trash' ? `

                </button>
                <button type="button" data-trash-id="${item.id}" title="移入回收站" aria-label="移入回收站" class="term-trash-btn shrink-0 p-1.5 rounded-lg border border-slate-200 text-slate-400 hover:text-rose-600 hover:border-rose-200 hover:bg-rose-50 transition">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
                `}
              </div>
            </div>

            <div class="mt-3 space-y-2.5">
              ${showOrigDef && item.origDef ? `
              <div class="recite-target ${maskClass} p-3 rounded-xl bg-sky-50/90 border border-sky-300" title="${reciteMaskEnabled ? '点击切换显示/遮罩' : ''}">
                <div class="text-xs font-bold text-sky-900 mb-1 flex items-center justify-between gap-2 flex-wrap">
                  <span>📖【叶飞教材原话详细版】</span>
                  <span class="text-[10px] text-sky-600 font-normal">叶飞·刘玮书《材料科学与工程基础》</span>

              ${(() => {

    // Render Mode B: Flashcard View
    function renderFlashcardView(filteredTerms) {

            <!-- Question Front -->
            <div class="my-4 text-center">

            <div id="fcAnswerBox" class="mt-5 ${fcAnswerVisible ? '' : 'hidden'} space-y-3">
              ${curItem.origDef ? `

                <p class="text-sm sm:text-base text-sky-950 leading-relaxed font-medium break-words">${formatMathHTML(curItem.origDef)}</p>

              ${(() => {
                const parts = splitDefAndHw(curItem.def);
                const isHwMod = activeModuleId === 'mod_sustech_804_hw';
                const boxCls = isHwMod ? 'bg-sky-50/90 border border-sky-300 text-sky-950' : 'bg-slate-50 border border-slate-200 text-slate-900';
                const labelCls = isHwMod ? 'text-sky-900' : 'text-slate-500';
                const labelText = isHwMod ? '📘【课后习题原答案】' : (curItem.origDef ? '⚡【答题速背简洁版】' : '【标准答案】');

                <div class="p-3.5 sm:p-4 rounded-xl ${boxCls} text-left">

                <div class="p-3.5 sm:p-4 rounded-xl bg-sky-50/90 border border-sky-300 text-left">

              ${curItem.mnemonic ? `

              ${curItem.keyPoints ? `

              ${curItem.pitfall ? `

                <p class="text-xs font-medium text-rose-950 leading-relaxed break-words">${formatMathHTML(curItem.pitfall)}</p>
              </div>
              ` : ''}
            </div>

            <!-- Flip Trigger Button -->
            <div class="${fcAnswerVisible ? 'hidden' : ''} my-6 sm:my-8 text-center">
              <button id="fcRevealBtn" type="button" class="max-w-full px-4 sm:px-6 py-3 text-xs sm:text-sm font-bold rounded-2xl bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white shadow-md transition transform active:scale-95">
                👁️ 点击揭晓标准答案与口诀
              </button>
            </div>
          </div>

          <!-- Card Controls & Rating -->
          <div class="pt-4 sm:pt-6 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
            <div class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto touch-scroll-x flex-nowrap">
              <button id="fcShuffleBtn" type="button" class="px-3 py-1.5 text-xs font-semibold rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 transition shrink-0 whitespace-nowrap">
                🔀 乱序
              </button>
              <span class="text-[11px] text-slate-400 whitespace-nowrap">可左右滑动或点击两侧箭头切题</span>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto touch-scroll-x flex-nowrap">
              <button id="fcMarkForgottenBtn" type="button" class="px-3 py-1.5 text-xs font-bold rounded-xl bg-rose-600 hover:bg-rose-700 text-white transition shadow-xs shrink-0 whitespace-nowrap">
                ❌ 遗忘 [1]
              </button>
              <button id="fcMarkFuzzyBtn" type="button" class="px-3 py-1.5 text-xs font-bold rounded-xl bg-amber-500 hover:bg-amber-600 text-white transition shadow-xs shrink-0 whitespace-nowrap">
                🤔 模糊 [2]
              </button>
              ${activeModuleId === 'mod_trash' ? `
              <button id="fcRestoreBtn" type="button" class="px-3 py-1.5 text-xs font-bold rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white transition shadow-xs shrink-0 whitespace-nowrap">
                ♻️ 恢复此题
              </button>
              ` : `
              <button id="fcMarkMasteredBtn" type="button" class="px-3 py-1.5 text-xs font-bold rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white transition shadow-xs shrink-0 whitespace-nowrap">
                ✅ 已掌握 [3]
              </button>
              <button id="fcTrashBtn" type="button" title="移入回收站" aria-label="移入回收站" class="p-1.5 rounded-xl border border-slate-200 text-slate-400 hover:text-rose-600 hover:border-rose-200 hover:bg-rose-50 transition shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>

            </div>
          </div>

      fcSlideDir = '';

      // Flashcard Listeners
      const revealBtn = document.getElementById('fcRevealBtn');
      if (revealBtn) {
        revealBtn.addEventListener('click', () => {
          fcAnswerVisible = true;
          renderFlashcardView(filteredTerms);
        });
      }

      function goFlashcard(dir) {
        const cardBody = document.getElementById('fcCardBody');
        const step = () => {
          if (dir === 'next') {
            if (fcIndex < filteredTerms.length - 1) fcIndex++;
            else fcIndex = 0;
          } else {
            if (fcIndex > 0) fcIndex--;
            else fcIndex = filteredTerms.length - 1;
          }
          fcSlideDir = dir;
          fcAnswerVisible = false;
          renderFlashcardView(filteredTerms);
        };
        if (cardBody) {
          cardBody.style.transition = 'transform 0.14s ease-out, opacity 0.14s ease-out';
          cardBody.style.transform = dir === 'next' ? 'translateX(-42px) scale(0.98)' : 'translateX(42px) scale(0.98)';
          cardBody.style.opacity = '0';
          setTimeout(step, 130);
        } else {
          step();
        }
      }

      document.getElementById('fcPrevBtn')?.addEventListener('click', () => goFlashcard('prev'));
      document.getElementById('fcNextBtn')?.addEventListener('click', () => goFlashcard('next'));

      // Touch drag + swipe left/right on flashcard
      const swipeEl = document.getElementById('fcSwipeWrapper');
      if (swipeEl) {
        let touchStartX = 0;
        let touchStartY = 0;
        let isDraggingHoriz = false;
        swipeEl.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          isDraggingHoriz = false;
          const cardBody = document.getElementById('fcCardBody');
          if (cardBody) cardBody.style.transition = 'none';
        }, { passive: true });
        swipeEl.addEventListener('touchmove', (e) => {
          if (e.touches.length !== 1) return;
          const dx = e.touches[0].clientX - touchStartX;
          const dy = e.touches[0].clientY - touchStartY;
          if (!isDraggingHoriz && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) {
            isDraggingHoriz = true;
          }
          if (isDraggingHoriz) {
            const cardBody = document.getElementById('fcCardBody');
            if (cardBody) {
              const offset = dx * 0.48;
              const rot = Math.max(-4, Math.min(4, dx * 0.015));
              const op = Math.max(0.65, 1 - Math.abs(dx) / 420);
              cardBody.style.transform = `translateX(${offset}px) rotate(${rot}deg)`;
              cardBody.style.opacity = String(op);
            }
          }
        }, { passive: true });
        swipeEl.addEventListener('touchend', (e) => {
          if (e.changedTouches.length !== 1) return;
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) {
            goFlashcard(dx < 0 ? 'next' : 'prev');
          } else {
            const cardBody = document.getElementById('fcCardBody');
            if (cardBody) {
              cardBody.style.transition = 'transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease';
              cardBody.style.transform = '';
              cardBody.style.opacity = '';
            }
          }
        }, { passive: true });
      }

      document.getElementById('fcTrashBtn')?.addEventListener('click', () => {
        fcAnswerVisible = false;
        moveToTrash(curItem.id);
      });
      document.getElementById('fcRestoreBtn')?.addEventListener('click', () => {
        fcAnswerVisible = false;
        restoreFromTrash(curItem.id);
      });

      document.getElementById('fcShuffleBtn')?.addEventListener('click', () => {
        fcIndex = Math.floor(Math.random() * filteredTerms.length);
        fcAnswerVisible = false;
        renderFlashcardView(filteredTerms);
        showToast('已随机抽取一题');
      });

      document.getElementById('fcMarkForgottenBtn')?.addEventListener('click', () => {
        setStatus(curItem.id, 'forgotten');
        advanceFc(filteredTerms);
      });

      document.getElementById('fcMarkFuzzyBtn')?.addEventListener('click', () => {
        setStatus(curItem.id, 'fuzzy');
        advanceFc(filteredTerms);
      });

      document.getElementById('fcMarkMasteredBtn')?.addEventListener('click', () => {
        setStatus(curItem.id, 'mastered');
        advanceFc(filteredTerms);
      });
    }

    function advanceFc(filteredTerms) {
      if (fcIndex < filteredTerms.length - 1) {
        fcIndex++;
      } else {
        fcIndex = 0;
        showToast('🎉 本组题目已全部过完一轮！');
      }
      fcAnswerVisible = false;
      renderFlashcardView(filteredTerms);
    }

    // Global UI update orchestrator
    function updateAllUI(resetScroll = false) {
      updateStatsBar();
      renderChapterNav();

      const filtered = getFilteredTerms();

      if (viewMode === 'list') {
        document.getElementById('listViewWrapper').classList.remove('hidden');
        document.getElementById('flashcardViewWrapper').classList.add('hidden');
        renderListView(filtered);
        if (resetScroll) {
          document.getElementById('listViewWrapper').scrollTop = 0;
          if (isMobileOrCompactViewport()) {
            window.scrollTo({ top: 0, behavior: 'instant' });
          }
        }
      } else {
        document.getElementById('listViewWrapper').classList.add('hidden');
        document.getElementById('flashcardViewWrapper').classList.remove('hidden');
        renderFlashcardView(filtered);
      }

      // Update active status filter button styles (preserving shrink-0 whitespace-nowrap!)
      document.querySelectorAll('.status-filter-btn').forEach(btn => {
        const filter = btn.getAttribute('data-status-filter');
        if (filter === selectedStatus) {
          btn.className = 'status-filter-btn shrink-0 whitespace-nowrap px-2.5 py-1 text-xs font-bold rounded-lg transition bg-slate-900 text-white shadow-xs';
        } else if (filter === 'weakness') {
          btn.className = 'status-filter-btn shrink-0 whitespace-nowrap px-2.5 py-1 text-xs font-bold rounded-lg transition bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100';
        } else {
          btn.className = 'status-filter-btn shrink-0 whitespace-nowrap px-2.5 py-1 text-xs font-semibold rounded-lg transition text-slate-600 hover:bg-slate-100';
        }
      });
    }

    // Modal dialog handler
    function openDialog(title, bodyHTML, onConfirm) {
      const modal = document.getElementById('appModal');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = bodyHTML;
      modal.classList.remove('hidden');

      const confirmBtn = document.getElementById('modalConfirmBtn');
      const cancelBtn = document.getElementById('modalCancelBtn');

      const cleanup = () => {
        modal.classList.add('hidden');
      };

      cancelBtn.onclick = cleanup;
      confirmBtn.onclick = () => {
        if (onConfirm) onConfirm();
        cleanup();
      };
    }

    // Sidebar Collapsible State (Default collapsed on mobile portrait & landscape; expanded on iPad landscape / desktop)
    let sidebarCollapsed = isMobileOrCompactViewport();

    function applySidebarState(collapsed, silent = false) {
      sidebarCollapsed = collapsed;
      const sidebar = document.getElementById('chapterSidebar');
      const expandBtn = document.getElementById('expandSidebarBtn');
      const backdrop = document.getElementById('sidebarBackdrop');

      if (sidebarCollapsed) {
        sidebar?.classList.add('sidebar-collapsed');
        expandBtn?.classList.remove('hidden');
        expandBtn?.classList.add('inline-flex');
        backdrop?.classList.add('hidden');
        if (!silent) showToast('已收起大纲目录');
      } else {
        sidebar?.classList.remove('sidebar-collapsed');
        expandBtn?.classList.add('hidden');
        expandBtn?.classList.remove('inline-flex');
        if (isMobileOrCompactViewport()) {
          backdrop?.classList.remove('hidden');
        } else {
          backdrop?.classList.add('hidden');
        }
        if (!silent) showToast('已展开大纲目录');
      }
    }

    function toggleSidebar() {
      applySidebarState(!sidebarCollapsed, false);
    }

    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
      loadMasteryMap();
      loadTrashSet();
      updateTrashBadge();

      // Apply responsive default sidebar state immediately (collapsed on phone portrait & landscape; open on iPad landscape)
      applySidebarState(isMobileOrCompactViewport(), true);

      // Keep backdrop and default sidebar state synced on orientation change / resize
      let lastIsCompact = isMobileOrCompactViewport();
      window.addEventListener('resize', () => {
        const nowCompact = isMobileOrCompactViewport();
        if (nowCompact !== lastIsCompact) {
          lastIsCompact = nowCompact;
          // Auto-collapse when rotating/resizing into compact mobile viewport, or auto-expand on iPad landscape
          applySidebarState(nowCompact, true);
        } else {
          // Sync backdrop visibility
          const backdrop = document.getElementById('sidebarBackdrop');
          if (!sidebarCollapsed && nowCompact) {
            backdrop?.classList.remove('hidden');
          } else {
            backdrop?.classList.add('hidden');
          }
        }
      });

      // Sidebar Collapse / Expand Listeners
      document.getElementById('toggleSidebarBtn')?.addEventListener('click', toggleSidebar);
      document.getElementById('collapseSidebarHeaderBtn')?.addEventListener('click', toggleSidebar);
      document.getElementById('expandSidebarBtn')?.addEventListener('click', toggleSidebar);
      document.getElementById('sidebarBackdrop')?.addEventListener('click', () => applySidebarState(true, true));

      // Keyboard shortcut '[' to toggle sidebar
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === '[' || e.key === '【') {
          e.preventDefault();
          toggleSidebar();
        }
      });

      // Module Switcher Listeners
      document.getElementById('switchModQaBtn')?.addEventListener('click', () => switchModule('mod_sustech_804_qa'));
      document.getElementById('switchModTermsBtn')?.addEventListener('click', () => switchModule('mod_sustech_804'));
      document.getElementById('switchModHwBtn')?.addEventListener('click', () => switchModule('mod_sustech_804_hw'));
      document.getElementById('switchModTrashBtn')?.addEventListener('click', () => switchModule('mod_trash'));

      // View Mode Toggle Listeners
      const toggleViewMode = () => {
        viewMode = viewMode === 'list' ? 'flashcard' : 'list';
        const icon = document.getElementById('navViewModeIcon');
        const text = document.getElementById('navViewModeText');
        if (viewMode === 'list') {
          icon.textContent = '🗂️';
          text.textContent = '闪卡模式';
          showToast('已切换至列表精读模式');
        } else {
          icon.textContent = '📋';
          text.textContent = '列表模式';
          showToast('已切换至闪卡抽查模式');
        }
        updateAllUI(true);
      };

      document.getElementById('toggleViewModeNavBtn')?.addEventListener('click', toggleViewMode);

      // Recite Mask Toggle Listeners
      const toggleReciteMask = () => {
        reciteMaskEnabled = !reciteMaskEnabled;
        const btn = document.getElementById('toggleReciteMaskNavBtn');
        const txt = document.getElementById('navMaskText');
        if (reciteMaskEnabled) {
          btn.className = 'px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-indigo-950 text-indigo-300 border border-indigo-700/60 hover:bg-indigo-900 transition flex items-center gap-1 shrink-0 whitespace-nowrap';
          txt.textContent = '遮罩已开启';
          showToast('遮罩默写已开启：点击即可揭晓');
        } else {
          btn.className = 'px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center gap-1 shrink-0 whitespace-nowrap';
          txt.textContent = '遮罩已关闭';
          showToast('遮罩已关闭：答案直接显示');
        }
        updateAllUI(false);
      };

      document.getElementById('toggleReciteMaskNavBtn')?.addEventListener('click', toggleReciteMask);

      // Checkbox Toggles
      document.getElementById('toggleOrigDefCheckbox')?.addEventListener('change', (e) => {
        showOrigDef = e.target.checked;
        updateAllUI(false);
      });

      document.getElementById('toggleMnemonicCheckbox')?.addEventListener('change', (e) => {
        showMnemonic = e.target.checked;
        updateAllUI(false);
      });

      document.getElementById('toggleKeyPointsCheckbox')?.addEventListener('change', (e) => {
        showKeyPoints = e.target.checked;
        updateAllUI(false);
      });

      document.getElementById('togglePitfallCheckbox')?.addEventListener('change', (e) => {
        showPitfall = e.target.checked;
        updateAllUI(false);
      });

      // Status Filter Buttons
      document.querySelectorAll('.status-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedStatus = btn.getAttribute('data-status-filter');
          updateAllUI(true);
        });
      });

      // Chapter All Reset Button
      document.getElementById('showAllChaptersBtn')?.addEventListener('click', () => {
        selectedChapter = 'all';
        if (isMobileOrCompactViewport()) {
          applySidebarState(true, true);
        }
        updateAllUI(true);
      });

      // Keyword Search Input
      document.getElementById('searchInput')?.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        updateAllUI(true);
      });

      // Backup & Restore Progress
      document.getElementById('navBackupRestoreBtn')?.addEventListener('click', () => {
        const jsonStr = JSON.stringify(masteryMap, null, 2);
        const bodyHTML = `
          <div class="space-y-3">
            <p class="text-xs text-slate-600">你的背诵标记进度（已掌握/模糊/遗忘）保存在当前浏览器本地。你可以导出 JSON 备份或粘贴 JSON 恢复：</p>
            <textarea id="backupTextarea" class="w-full h-36 text-xs p-2.5 font-mono border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">${jsonStr}</textarea>
            <div class="flex gap-2">
              <button id="copyBackupBtn" type="button" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">📋 复制到剪贴板</button>
            </div>
          </div>
        `;
        openDialog('备份与恢复背诵进度', bodyHTML, () => {
          const val = document.getElementById('backupTextarea')?.value;
          if (val) {
            try {
              masteryMap = JSON.parse(val);
              saveMasteryMap();
              updateAllUI(false);
              showToast('背诵进度已成功恢复！');
            } catch (err) {
              showToast('恢复失败：JSON 格式不合法');
            }
          }
        });

        setTimeout(() => {
          document.getElementById('copyBackupBtn')?.addEventListener('click', () => {
            const ta = document.getElementById('backupTextarea');
            if (ta) {
              ta.select();
              document.execCommand('copy');
              showToast('备份数据已复制');
            }
          });
        }, 50);
      });

      // Export / Print Review List
      document.getElementById('navExportPrintBtn')?.addEventListener('click', () => {
        window.print();
      });

      // Reset Progress
      document.getElementById('navResetProgressBtn')?.addEventListener('click', () => {
        openDialog('重置当前题库背诵进度', '<p class="text-xs text-slate-600">确定要清空当前的全部背诵标记吗？重置后所有题目将恢复为“未标记”状态。建议在重置前先做备份。</p>', () => {
          const mod = getActiveModule();
          (mod.terms || []).forEach(t => {
            delete masteryMap[t.id];
          });
          saveMasteryMap();
          updateAllUI(false);
          showToast('当前题库背诵标记已重置');
        });
      });

      // Global Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        if (viewMode === 'flashcard') {
          const filtered = getFilteredTerms();
          if (filtered.length === 0) return;
          const cur = filtered[fcIndex];

          if (e.code === 'Space') {
            e.preventDefault();
            fcAnswerVisible = !fcAnswerVisible;
            renderFlashcardView(filtered);
          } else if (e.code === 'ArrowLeft') {
            e.preventDefault();
            if (fcIndex > 0) fcIndex--;
            else fcIndex = filtered.length - 1;
            fcAnswerVisible = false;
            renderFlashcardView(filtered);
          } else if (e.code === 'ArrowRight') {
            e.preventDefault();
            if (fcIndex < filtered.length - 1) fcIndex++;
            else fcIndex = 0;
            fcAnswerVisible = false;
            renderFlashcardView(filtered);
          } else if (e.key === '1') {
            e.preventDefault();
            setStatus(cur.id, 'forgotten');
            advanceFc(filtered);
          } else if (e.key === '2') {
            e.preventDefault();
            setStatus(cur.id, 'fuzzy');
            advanceFc(filtered);
          } else if (e.key === '3') {
            e.preventDefault();
            setStatus(cur.id, 'mastered');
            advanceFc(filtered);
          }
        }
      });

      // Initial Render
      updateAllUI(true);
    });
  </script>
</body>
</html>
