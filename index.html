": "05-01", "chapter": "ch5", "name": "05-01 应力、应变与载荷、变形量有什么区别？", "title": "应力、应变与载荷、变形量有什么区别？", "section": "叶 pp.110–112；第6章习题1。", "def": "载荷和伸长量受试样尺寸影响，应力和应变通过面积、长度归一化来表征响应。单轴工程应力，工程应变。应力单位为 Pa，应变无量纲；材料性能比较必须说明试验温度、速率和取样条件。\n【教材第6章第1题】应力是作用在单位面积上的力。应变是物体在受到外力作用下，发生的长度变化与原始长度之比。", "keyPoints": "载荷和伸长量受试样尺寸影响，应力和应变通过面积、长度归一化来表征响应；单轴工程应力，工程应变；应力单位为 Pa，应变无量纲；材料性能比较必须说明试验温度、速率和取样条件", "mnemonic": "【记忆口诀】工程应力原面积，真实应力瞬时除；工程应变原标距，真实应变对数求。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_05_02", "num": "05-02", "chapter": "ch5", "name": "05-02 弹性变形和塑性变形的本质及卸载行为如何区别？", "title": "弹性变形和塑性变形的本质及卸载行为如何区别？", "section": "叶 pp.111–112、136–138；正文。", "def": "弹性变形主要是原子间距和键角可恢复变化，卸载后恢复；塑性变形是位错滑移、孪生或链段相对运动等导致的永久结构变化。弹塑性阶段卸载通常仍有弹性恢复，因此卸载前总应变不等于残余塑性应变。", "keyPoints": "弹性变形主要是原子间距和键角可恢复变化，卸载后恢复；塑性变形是位错滑移、孪生或链段相对运动等导致的永久结构变化；弹塑性阶段卸载通常仍有弹性恢复，因此卸载前总应变不等于残余塑性应变", "mnemonic": "【记忆口诀】胡克定律弹性线，比例极限弹性边；屈服发生塑性起，抗拉极大颈缩连。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_05_03", "num": "05-03", "chapter": "ch5", "name": "05-03 胡克定律、弹性模量、剪切模量和泊松比分别表示什么？", "title": "胡克定律、弹性模量、剪切模量和泊松比分别表示什么？", "section": "叶 pp.110–112、136–137；第6章习题2、3。", "def": "线弹性单轴范围内 σ = Eε，剪切时 τ = Gγ；泊松比 ν = -ε_trans/ε_axial。E 与 G 分别表示抵抗正应变与切应变的能力。\n【教材第6章第2题】0.77 mm。", "keyPoints": "线弹性单轴范围内 σ = Eε，剪切时 τ = Gγ；泊松比 ν = -ε_trans/ε_axial； E 与 G 分别表示抵抗正应变与切应变的能力；对各向同性线弹性材料，G = E/[2(1+ν)]，不能对任意各向异性单晶直接套用", "mnemonic": "【记忆口诀】弹性模量结合键，微观组织难动摇；晶粒细化沉淀强，屈服骤升E不增。", "pitfall": "对各向同性线弹性材料，G = E/[2(1+ν)]，不能对任意各向异性单晶直接套用。", "freq": "核心考点"}, {"id": "qa_05_04", "num": "05-04", "chapter": "ch5", "name": "05-04 刚度、强度、硬度、塑性和韧性有什么区别？", "title": "刚度、强度、硬度、塑性和韧性有什么区别？", "section": "叶 pp.112–127；正文。", "def": "① 刚度是抵抗弹性变形能力，构件刚度还取决于几何。\n② 强度是抵抗规定失效或塑性变形的应力水平。\n③ 硬度反映局部压入等变形阻力。\n④ 塑性是断裂前永久变形能力。\n⑤ 韧性是吸收能量并抵抗断裂的综合能力。高强或高硬不必然高韧。", "keyPoints": "刚度是抵抗弹性变形能力，构件刚度还取决于几何；强度是抵抗规定失效或塑性变形的应力水平；硬度反映局部压入等变形阻力；塑性是断裂前永久变形能力；韧性是吸收能量并抵抗断裂的综合能力；高强或高硬不必然高韧", "mnemonic": "【记忆口诀】横向应变比轴向，负值定义泊松比；弹性阶段体积变，塑性变形体积恒。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_05_05", "num": "05-05", "chapter": "ch5", "name": "05-05 如何从金属拉伸曲线判断弹性、屈服、强化、颈缩和断裂？", "title": "如何从金属拉伸曲线判断弹性、屈服、强化、颈缩和断裂？", "section": "叶 pp.112–120；正文。", "def": "① 初始近直线段为弹性阶段。\n② 明显塑性变形开始对应屈服。\n③ 随后变形强化使承载能力上升。\n④ 工程应力达到最大值后发生明显颈缩，局部截面快速减小，最终断裂。曲线下降并不自动意味着局部真实应力下降，须区分面积定义。", "keyPoints": "初始近直线段为弹性阶段；明显塑性变形开始对应屈服；随后变形强化使承载能力上升；工程应力达到最大值后发生明显颈缩，局部截面快速减小，最终断裂；曲线下降并不自动意味着局部真实应力下降，须区分面积定义", "mnemonic": "【记忆口诀】微小塑性定门槛，零点二点规定强；有屈平台看下点，无屈平台引平线。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_05_06", "num": "05-06", "chapter": "ch5", "name": "05-06 有明显屈服平台和无屈服平台时，屈服强度如何确定？", "title": "有明显屈服平台和无屈服平台时，屈服强度如何确定？", "section": "叶 pp.113–116；第6章习题4。", "def": "① 有明显屈服时可区分上屈服与下屈服，按规定取值。\n② 无明显屈服平台时常取规定塑性延伸强度，如 σ_0.2（或 Rp0.2）。作图时从工程应变 0.2% 处作与弹性直线平行的直线，与应力—应变曲线交点对应应力。\n【教材第6章第4题】有屈服平台时，通常取平台中下屈服点的平均应力值为屈服强度；没有屈服平台时，在 0.2% 应变处引出一条平行于弹性部分的直线，该直线与应力-应变曲线的交点对应的应力被定义为规定屈服强度。", "keyPoints": "有明显屈服时可区分上屈服与下屈服，按规定取值；无明显屈服平台时常取规定塑性延伸强度，如 σ_0.2（或 Rp0.2） ；作图时从工程应变 0.2% 处作与弹性直线平行的直线，与应力—应变曲线交点对应应力；0.2% 不是总应变，也不是 0.2", "mnemonic": "【记忆口诀】拉伸失稳最大载，局部截面骤然缩；孔洞萌生长大连，杯锥断口颈缩显。", "pitfall": "0.2% 不是总应变，也不是 0.2。", "freq": "核心考点"}, {"id": "qa_05_07", "num": "05-07", "chapter": "ch5", "name": "05-07 抗拉强度、断后伸长率和断面收缩率如何定义？", "title": "抗拉强度、断后伸长率和断面收缩率如何定义？", "section": "叶 pp.114–120；正文。", "def": "① 抗拉强度为最大载荷除以原始面积。\n② 断后伸长率为断裂后标距增长与原标距之比。\n③ 断面收缩率为最小断面减少量与原面积之比。前者表征工程拉伸最大承载应力，后两者表征塑性，且伸长率受标距及试样形式影响。", "keyPoints": "抗拉强度为最大载荷除以原始面积；断后伸长率为断裂后标距增长与原标距之比；断面收缩率为最小断面减少量与原面积之比；前者表征工程拉伸最大承载应力，后两者表征塑性，且伸长率受标距及试样形式影响", "mnemonic": "【记忆口诀】布氏钢球测较软，洛氏压头深度算；维氏金刚锥面压，硬度表征抗压陷。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_05_08", "num": "05-08", "chapter": "ch5", "name": "05-08 真实应力应变与工程应力应变为何不同？什么时候可以相互换算？", "title": "真实应力应变与工程应力应变为何不同？什么时候可以相互换算？", "section": "叶 pp.117–120；第6章习题5。", "def": "① 真实应力 σ_t = F/A_i，真实应变 ε_t = ln(L_i/L_0)。\n② 在颈缩前的均匀变形、近似体积不变时，σ_t = σ(1+ε)、ε_t = ln(1+ε)。\n【教材第6章第5题】真应力是载荷除以发生变形时的瞬时横截面积。", "keyPoints": "真实应力 σ_t = F/A_i，真实应变 ε_t = ln(L_i/L_0) ；在颈缩前的均匀变形、近似体积不变时，σ_t = σ(1+ε)、ε_t = ln(1+ε) ；颈缩后标距内不再均匀，不能把上述整体公式直接用于颈部，应使用局部瞬时截面尺寸与 Bridgman 修正", "mnemonic": "【记忆口诀】摆锤冲击势能差，吸收功大韧性佳；体心金属温降脆，转变温区安全划。", "pitfall": "颈缩后标距内不再均匀，不能把上述整体公式直接用于颈部，应使用局部瞬时截面尺寸与 Bridgman 修正。", "freq": "核心考点"}, {"id": "qa_05_09", "num": "05-09", "chapter": "ch5", "name": "05-09 颈缩为什么发生？真实应力曲线和工程曲线为何可能走势不同？", "title": "颈缩为什么发生？真实应力曲线和工程曲线为何可能走势不同？", "section": "叶 pp.117–120；正文。", "def": "① 塑性变形使截面减小，同时加工硬化提高流动应力。\n② 当硬化不足以补偿截面减少时，局部变形失稳形成颈缩。工程应力用原面积，载荷下降时曲线下降。\n③ 真实应力用当前局部面积，仍可能上升。理想均匀单轴条件下可用 Considère 准则 dσ_t/dε_t = σ_t 判断失稳起点。", "keyPoints": "塑性变形使截面减小，同时加工硬化提高流动应力；当硬化不足以补偿截面减少时，局部变形失稳形成颈缩；工程应力用原面积，载荷下降时曲线下降；真实应力用当前局部面积，仍可能上升；理想均匀单轴条件下可用 Considère 准则 dσ_t/dε_t = σ_t 判断失稳起点", "mnemonic": "【答题抓手】扣准颈缩发生真实、应力曲线和工、程曲线为何可，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_05_10", "num": "05-10", "chapter": "ch5", "name": "05-10 弹性应变能、弹性回复能力与韧性如何从曲线理解？", "title": "弹性应变能、弹性回复能力与韧性如何从曲线理解？", "section": "叶 pp.116–120；正文。", "def": "① 应力-应变曲线面积物理意义：应力-应变曲线下的积分面积 ∫σ dε 表示单位体积材料发生变形所吸收的形变功（应变能密度）。\n② 弹性回复能力（弹性比能 / 回弹能模量 U_r）：在线弹性变形范围内吸收的应变能，公式为 U_r = (1/2)·σ_y·ε_y = σ_y² / (2E)，表征材料在卸载后完全释放可恢复弹性形变的能力。\n③ 拉伸韧性（断裂韧性功）：整个拉伸曲线直至断裂点下的总面积，表征材料在断裂前吸收塑性变形功与断裂功的总能力，综合反映了材料的强度与塑性。", "keyPoints": "曲线下面积为形变能密度；线弹性储能 U_r = (1/2)σ_y·ε_y = σ_y²/(2E) 对应弹性回复能力；断裂前总面积表征拉伸韧性", "mnemonic": "【答题抓手】扣准弹性应变能、弹性回复能力、与韧性从曲线，紧扣物理机制与适用条件展开", "pitfall": "弹性储能只计屈服前的三角形面积，断裂韧性计整个拉伸曲线下的总面积，二者物理含义不可混淆；比较不同材料的弹性储能或韧性面积时，必须保持工程应力-工程应变（或真实应力-真实应变）口径完全统一，不能将工程曲线与真实曲线直接比面积。", "freq": "核心考点"}, {"id": "qa_05_11", "num": "05-11", "chapter": "ch5", "name": "05-11 滞弹性与黏弹性是什么？与理想弹性有何不同？", "title": "滞弹性与黏弹性是什么？与理想弹性有何不同？", "section": "叶 pp.120–123；第6章习题6。", "def": "① 理想弹性响应瞬时且可恢复。\n② 滞弹性恢复有时间延迟，但给足时间可恢复。\n③ 黏弹性同时具有弹性与黏性特征，表现为响应依赖时间、加载速率及历史，并常有能量耗散。\n【教材第6章第6题】材料弹性变形时应变落后于应力的现象被称为滞弹性。高分子材料对应力的响应兼有弹性固体和黏性流体的双重特性，这种性质被称为黏弹性。", "keyPoints": "理想弹性响应瞬时且可恢复；滞弹性恢复有时间延迟，但给足时间可恢复；黏弹性同时具有弹性与黏性特征，表现为响应依赖时间、加载速率及历史，并常有能量耗散；不能把所有延迟变形都直接称为永久塑性变形", "mnemonic": "【答题抓手】扣准滞弹性与黏弹、性是什么与理、想弹性有何不，紧扣物理机制与适用条件展开", "pitfall": "不能把所有延迟变形都直接称为永久塑性变形。", "freq": "核心考点"}, {"id": "qa_05_12", "num": "05-12", "chapter": "ch5", "name": "05-12 聚合物的蠕变、应力松弛和滞后分别是什么？", "title": "聚合物的蠕变、应力松弛和滞后分别是什么？", "section": "叶 pp.120–123；正文。", "def": "① 恒定应力下应变随时间增大叫蠕变。\n② 恒定应变下应力随时间下降叫应力松弛。\n③ 加载与卸载路径不重合形成滞后环，环面积反映耗散能量。三者都与链段运动有关，但控制条件不同，考试应先写清“恒定的量”。", "keyPoints": "恒定应力下应变随时间增大叫蠕变；恒定应变下应力随时间下降叫应力松弛；加载与卸载路径不重合形成滞后环，环面积反映耗散能量；三者都与链段运动有关，但控制条件不同，考试应先写清“恒定的量”", "mnemonic": "【答题抓手】扣准聚合物的蠕变、应力松弛和滞、后分别是什么，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_05_13", "num": "05-13", "chapter": "ch5", "name": "05-13 温度和应变速率如何影响聚合物拉伸行为？", "title": "温度和应变速率如何影响聚合物拉伸行为？", "section": "叶 pp.120–123、164–166；正文。", "def": "升温或降低加载速率给链段更多运动时间，通常模量、强度下降而变形能力增加；降温或提高速率可使行为偏硬、偏脆。接近玻璃化转变时变化显著，半结晶、交联等结构会修正具体规律。", "keyPoints": "升温或降低加载速率给链段更多运动时间，通常模量、强度下降而变形能力增加；降温或提高速率可使行为偏硬、偏脆；接近玻璃化转变时变化显著，半结晶、交联等结构会修正具体规律", "mnemonic": "【答题抓手】扣准温度和应变速、率影响聚合物、拉伸行为，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_05_14", "num": "05-14", "chapter": "ch5", "name": "05-14 布氏、洛氏、维氏硬度的原理和压头有何不同？", "title": "布氏、洛氏、维氏硬度的原理和压头有何不同？", "section": "叶 pp.124–126；第6章习题7。", "def": "① 布氏用球形压头，根据载荷与压痕面积求硬度。\n② 洛氏按规定初、主试验力下的压入深度差表征，标尺不同可用金刚石圆锥或球。\n③ 维氏用金刚石四棱锥，根据压痕对角线计算。不同标尺只可在适用材料范围内经验换算，不存在通用严格互换式。\n【教材第6章第7题】布氏硬度的压头为钢球；洛氏硬度的压头为金刚石圆锥和钢球；维氏硬度的压头为金刚石正四棱锥体。三种测试方法在一定范围内可以相互比较使用，但各种硬度间没有通用的转换关系式。", "keyPoints": "布氏用球形压头，根据载荷与压痕面积求硬度；洛氏按规定初、主试验力下的压入深度差表征，标尺不同可用金刚石圆锥或球；维氏用金刚石四棱锥，根据压痕对角线计算；不同标尺只可在适用材料范围内经验换算，不存在通用严格互换式", "mnemonic": "【答题抓手】扣准布氏、洛氏、维氏硬度的原，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_05_15", "num": "05-15", "chapter": "ch5", "name": "05-15 为什么薄层或微小组织宜用显微硬度？硬度能否直接代替强度？", "title": "为什么薄层或微小组织宜用显微硬度？硬度能否直接代替强度？", "section": "叶 pp.124–126；正文。", "def": "小载荷、小压痕可检测局部相、薄层或小区域，避免常规大压痕混合多种组织响应。", "keyPoints": "小载荷、小压痕可检测局部相、薄层或小区域，避免常规大压痕混合多种组织响应；某些金属硬度与抗拉强度存在经验关系，但受材料类别、热处理及加工状态影响；不能将一种钢的换算系数推广到陶瓷、聚合物或所有合金", "mnemonic": "【答题抓手】扣准薄层或微小组、织宜用显微硬、度硬度能否直，紧扣物理机制与适用条件展开", "pitfall": "某些金属硬度与抗拉强度存在经验关系，但受材料类别、热处理及加工状态影响；不能将一种钢的换算系数推广到陶瓷、聚合物或所有合金。", "freq": "核心考点"}, {"id": "qa_05_16", "num": "05-16", "chapter": "ch5", "name": "05-16 冲击试验测得什么？冲击吸收能与断裂韧度有何区别？", "title": "冲击试验测得什么？冲击吸收能与断裂韧度有何区别？", "section": "叶 p.127、pp.172–176；第6章习题8。", "def": "① 摆锤冲击试验通过断裂前后势能差测量试样吸收的能量，理想化写作 Ak = mg(H-h)，实际试验需考虑装置摩擦与风阻损失校正，受缺口几何、试样尺寸、试验温度和加载速率强烈影响。\n② 断裂韧度 K_IC 描述含裂纹材料抵抗裂纹失稳扩展的能力，量纲与冲击功完全不同（MPa·m^(1/2)）。\n【教材第6章第8题】冲击吸收功可以通过摆锤释放时的高度与撞击后达到的高度之间的势能差计算，即 W = mgΔh（m 为摆锤质量，g 为重力加速度，Δh 为摆锤高度差）。实际操作中还需考虑空气阻力、摩擦力以及摆锤的旋转能量等修正因素。", "keyPoints": "摆锤冲击试验通过断裂前后势能差测量试样吸收的能量，理想化写作 Ak = mg(H-h)，实际试验需考虑装置摩擦与风阻损失校正，受缺口几何、试样尺寸、试验温度和加载速率强烈影响；断裂韧度 K_IC 描述含裂纹材料抵抗裂纹失稳扩展的能力，量纲与冲击功完全不同（MPa·m^(1/2)） ；二者都涉及韧性，但不能把冲击功直接当作 K_IC", "mnemonic": "【答题抓手】扣准冲击试验测得、什么冲击吸收、能与断裂韧度，紧扣物理机制与适用条件展开", "pitfall": "二者都涉及韧性，但不能把冲击功直接当作 K_IC。", "freq": "核心考点"}, {"id": "qa_05_17", "num": "05-17", "chapter": "ch5", "name": "05-17 金属拉伸与压缩曲线为什么不同？陶瓷为何抗压远强于抗拉？", "title": "金属拉伸与压缩曲线为什么不同？陶瓷为何抗压远强于抗拉？", "section": "叶 p.128、pp.168–174；正文。", "def": "压缩时试样截面增大，不发生拉伸式颈缩，端面摩擦还会造成鼓肚与应力不均；拉伸有颈缩和裂纹张开。陶瓷的缺陷在拉伸下易形成张开裂纹并扩展，压缩则抑制张开，因此抗压强度通常显著高于抗拉强度。", "keyPoints": "压缩时试样截面增大，不发生拉伸式颈缩，端面摩擦还会造成鼓肚与应力不均；拉伸有颈缩和裂纹张开；陶瓷的缺陷在拉伸下易形成张开裂纹并扩展，压缩则抑制张开，因此抗压强度通常显著高于抗拉强度", "mnemonic": "【答题抓手】扣准金属拉伸与压、缩曲线不同陶、瓷为何抗压远，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_05_18", "num": "05-18", "chapter": "ch5", "name": "05-18 为什么脆性材料常用弯曲试验？怎样解释弯曲曲线？", "title": "为什么脆性材料常用弯曲试验？怎样解释弯曲曲线？", "section": "叶 pp.130–131；第6章习题9。", "def": "① 直接拉伸脆性试样装夹及对中困难，弯曲试验较易实施。梁截面一侧受拉、一侧受压，中性层附近纵向正应力为零。\n② 表面缺陷对断裂敏感。脆性材料常在较小挠度下突然断裂，延性材料可出现明显非线性。\n【教材第6章第9题】弯曲试验能够获得力与挠度的关系曲线。借助该曲线能够得到的弯曲性能指标包括弯曲模量、抗弯强度以及断裂挠度等。", "keyPoints": "直接拉伸脆性试样装夹及对中困难，弯曲试验较易实施；梁截面一侧受拉、一侧受压，中性层附近纵向正应力为零；表面缺陷对断裂敏感；脆性材料常在较小挠度下突然断裂，延性材料可出现明显非线性；弯曲强度不是均匀单轴拉伸强度", "mnemonic": "【答题抓手】扣准脆性材料常用、弯曲试验怎样、弯曲曲线，紧扣物理机制与适用条件展开", "pitfall": "弯曲强度不是均匀单轴拉伸强度。", "freq": "核心考点"}, {"id": "qa_05_19", "num": "05-19", "chapter": "ch5", "name": "05-19 材料性能为什么具有分散性？安全系数的意义是什么？", "title": "材料性能为什么具有分散性？安全系数的意义是什么？", "section": "叶 pp.132–134；第6章习题10。", "def": "成分、组织、缺陷、表面、尺寸及试验条件存在差异，使测量结果分散。设计许用应力可按规定强度除以安全系数确定，以覆盖载荷、材料及模型的不确定性。\n【教材第6章第10题】设计应力是在结构设计中，根据设计要求和材料特性，预先设定的最大允许应力。安全应力是指在实际工作条件下，结构所承受的确保稳定性和安全性的实际应力。", "keyPoints": "成分、组织、缺陷、表面、尺寸及试验条件存在差异，使测量结果分散；设计许用应力可按规定强度除以安全系数确定，以覆盖载荷、材料及模型的不确定性；选取屈服强度还是断裂相关强度取决于失效模式，安全系数不是材料固有常数", "mnemonic": "【答题抓手】扣准材料性能具有、分散性安全系、数的意义是什，紧扣物理机制与适用条件展开", "pitfall": "选取屈服强度还是断裂相关强度取决于失效模式，安全系数不是材料固有常数。", "freq": "核心考点"}, {"id": "qa_05_20", "num": "05-20", "chapter": "ch5", "name": "05-20 教材中的设计应力与安全应力怎样计算？", "title": "教材中的设计应力与安全应力怎样计算？", "section": "叶 p.134；第6章习题10。", "def": "按本书，设计应力，将预估计算应力放大，选材时要求屈服强度不低于该需求；安全或工作应力，将材料屈服强度折减，用于限制实际工作应力。\n【教材第6章第10题】设计应力是在结构设计中，根据设计要求和材料特性，预先设定的最大允许应力。安全应力是指在实际工作条件下，结构所承受的确保稳定性和安全性的实际应力。", "keyPoints": "按本书，设计应力，将预估计算应力放大，选材时要求屈服强度不低于该需求；安全或工作应力，将材料屈服强度折减，用于限制实际工作应力；二者分别从载荷端和材料端留安全余量，不是把两个公式中的符号任意互换", "mnemonic": "【答题抓手】扣准教材中的设计、应力与安全应、力怎样计算，紧扣物理机制与适用条件展开", "pitfall": "二者分别从载荷端和材料端留安全余量，不是把两个公式中的符号任意互换。", "freq": "核心考点"}, {"id": "qa_05_21", "num": "05-21", "chapter": "ch5", "name": "05-21 弯曲试验直接得到哪条曲线，可求哪些指标？", "title": "弯曲试验直接得到哪条曲线，可求哪些指标？", "section": "叶 pp.130–131；第6章习题9。", "def": "直接记录弯曲力—挠度曲线，由弹性段斜率及试样几何求弯曲弹性模量，由最大载荷和截面、跨距求抗弯强度，由断裂对应挠度评价变形能力。三点弯曲矩形梁常用，其中为受弯方向厚度；公式有相应梁理论与几何前提。\n【教材第6章第9题】弯曲试验能够获得力与挠度的关系曲线。借助该曲线能够得到的弯曲性能指标包括弯曲模量、抗弯强度以及断裂挠度等。", "keyPoints": "直接记录弯曲力—挠度曲线，由弹性段斜率及试样几何求弯曲弹性模量，由最大载荷和截面、跨距求抗弯强度，由断裂对应挠度评价变形能力；三点弯曲矩形梁常用，其中为受弯方向厚度；公式有相应梁理论与几何前提", "mnemonic": "【答题抓手】扣准弯曲试验直接、得到哪条曲线、可求哪些指标，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_05_D01", "num": "05-22", "chapter": "ch5", "name": "05-22 弹性变形是否一定满足线性胡克定律？比例极限与弹性极限有何区别？", "title": "弹性变形是否一定满足线性胡克定律？比例极限与弹性极限有何区别？", "section": "叶 pp.112–115；正文曲线细分。", "def": "① 结论：弹性强调卸载后可恢复，线弹性还要求应力与应变成正比，因此弹性不必全部是线性的。\n② 读图：应力—应变曲线最初直线段终点对应比例关系结束；继续加载仍可能存在可恢复的非线性弹性段；再超过弹性极限后留下不可恢复变形。教材拉伸曲线将弹性阶段中的直线段和非线性段分别标出。", "keyPoints": "弹性强调卸载后可恢复，线弹性还要求应力与应变成正比，因此弹性不必全部是线性的；曲线变弯不必已经塑性变形", "mnemonic": "【答题抓手】扣准弹性变形是否、一定满足线性、胡克定律比例，紧扣物理机制与适用条件展开", "pitfall": "再超过弹性极限后留下不可恢复变形；曲线变弯不必已经塑性变形；也不能把比例极限、弹性极限、规定塑性延伸强度及抗拉强度当作同一个点。判断塑性最直接的依据之一是按相应试验条件卸载后是否留下永久应变。", "freq": "考纲深度细化"}, {"id": "qa_05_D02", "num": "05-23", "chapter": "ch5", "name": "05-23 强化后屈服强度明显提高，弹性模量是否也会同样提高？", "title": "强化后屈服强度明显提高，弹性模量是否也会同样提高？", "section": "叶 pp.114–115、136–137、148–157；跨章节比较。", "def": "① 结论：不一定，常规细晶、加工硬化或析出强化可显著提高强度，却通常不会按同样比例提高弹性模量。\n② 机制区别：弹性模量主要反映原子键在平衡位置附近抵抗小幅可恢复位移的能力；屈服强度主要受位错开始并持续运动的障碍控制。增加晶界或位错障碍可显著改变后者，而不必显著改变大多数原子键的小应变刚度。\n③ 例子与限制：冷加工后拉伸曲线的屈服位置可提高，初始弹性斜率却变化较小。若同时改变相组成、孔隙率或织构，模量仍可能改变，所以不能反过来说模量永远不变。", "keyPoints": "弹性模量E是组织不敏感参数，由原子间结合键的势能曲线本质决定；屈服强度σ_y是组织敏感参数，由位错滑移障碍控制。各种强化机制(细晶、固溶、沉淀、形变)只能大幅提高σ_y，对E几乎没有影响。", "mnemonic": "【记忆口诀】弹性模量化学键，微观组织难动摇；强化提高屈服值，刚度模量终不偏。", "pitfall": "不能认为材料被“强化”后刚度(弹性模量)就会同比例提高。", "freq": "考纲深度细化"}, {"id": "qa_05_D03", "num": "05-24", "chapter": "ch5", "name": "05-24 塑性变形后卸载再加载，为什么会留下残余应变，并可能提高同方向再次屈服应力？", "title": "塑性变形后卸载再加载，为什么会留下残余应变，并可能提高同方向再次屈服应力？", "section": "叶 pp.112–120、152–154；正文综合。", "def": "① 卸载：总应变由可恢复的弹性部分和不可恢复的塑性部分组成；理想单轴近似下卸载线斜率约为弹性模量，卸载到零应力时剩余的是塑性应变。\n② 再加载：若变形中发生加工硬化且温度、方向和组织未改变，重新沿同方向加载，常需达到较高应力才能继续塑性变形；原有塑性伸长不会因再加载而自动归零。\n③ 边界：反向加载、循环软化、时效或卸载后退火均可能改变过程，因此不能将“再次屈服一定升高”作为任意加载历史下的结论。答题先说明加载方向与中间是否热处理。", "keyPoints": "卸载：总应变由可恢复的弹性部分和不可恢复的塑性部分组成；理想单轴近似下卸载线斜率约为弹性模量，卸载到零应力时剩余的是塑性应变；再加载：若变形中发生加工硬化且温度、方向和组织未改变，重新沿同方向加载，常需达到较高应力才能继续塑性变形；原有塑性伸长不会因再加载而自动归零；边界：反向加载、循环软化、时效或卸载后退火均可能改变过程，因此不能将“再次屈服一定升高”作为任意加载历史下的结论...", "mnemonic": "【答题抓手】扣准塑性变形后卸、载再加载会留、下残余应变并，紧扣物理机制与适用条件展开", "pitfall": "卸载：总应变由可恢复的弹性部分和不可恢复的塑性部分组成。", "freq": "考纲深度细化"}, {"id": "qa_05_D04", "num": "05-25", "chapter": "ch5", "name": "05-25 压缩时真实应力与工程应力为什么不能照搬拉伸中的大小判断？", "title": "压缩时真实应力与工程应力为什么不能照搬拉伸中的大小判断？", "section": "叶 pp.117–120、128；正文几何推演。", "def": "① 从定义出发：工程应力用原面积，真实应力用当前面积。在均匀塑性拉伸中面积减小，所以同一载荷下真实应力的大小大于工程应力；均匀压缩中面积增大，则真实压应力的绝对值可小于工程压应力。\n② 应变关系：体积近似不变且变形均匀时，拉伸与压缩都可在有符号工程应变约定下使用，但必须保持符号及当前面积一致。\n③ 实际限制：压缩试样因端部摩擦形成鼓肚时，应力应变并不均匀；薄长试样还可能屈曲。", "keyPoints": "压缩试样因端部摩擦形成鼓肚时，应力应变并不均匀", "mnemonic": "【答题抓手】扣准压缩时真实应、力与工程应力、不能照搬拉伸，紧扣物理机制与适用条件展开", "pitfall": "此时简单均匀换算不能代替实际应力分析。", "freq": "考纲深度细化"}, {"id": "qa_05_26_yf", "num": "05-26", "title": "典型低碳钢拉伸应力—应变曲线分为哪四个阶段？", "name": "05-26 典型低碳钢拉伸应力—应变曲线分为哪四个阶段？", "chapter": "ch5", "section": "教材p.113—114｜正文原标号：①—④（正文分条）", "freq": "叶飞正文分条", "def": "① 弹性阶段：卸载后可恢复；教材图中的OA为线性段，AB为非线性弹性段。\n② 屈服阶段：出现明显塑性变形，可表现上、下屈服点和屈服平台。\n③ 强化阶段：继续塑性变形需要更大应力，变形抗力不断增加。\n④ 颈缩阶段：超过最大载荷点后变形局部集中，截面局部收缩，最终断裂。", "keyPoints": "① 弹性阶段：卸载后可恢复；教材图中的OA为线性段，AB为非线性弹性段；② 屈服阶段：出现明显塑性变形，可表现上、下屈服点和屈服平台；③ 强化阶段：继续塑性变形需要更大应力，变形抗力不断增加；④ 颈缩阶段：超过最大载荷点后变形局部集中，截面局部收缩，最终断裂。", "pitfall": "不能把全部弹性段都说成严格服从胡克定律；也不能把有屈服平台的低碳钢曲线推广到所有材料。颈缩后工程应力下降不等于真应力必然同步下降。", "mnemonic": ""}, {"id": "qa_06_01", "num": "06-01", "chapter": "ch6", "name": "06-01 金属、陶瓷和聚合物的弹性变形机制有什么不同？", "title": "金属、陶瓷和聚合物的弹性变形机制有什么不同？", "section": "叶 pp.136–137；第7章习题1。", "def": "金属和陶瓷的弹性主要来自原子间距、键角的可恢复改变，模量与键强度相关；聚合物还涉及链段转动、链构象变化，弹性响应强烈依赖温度、时间及交联状态。橡胶大弹性主要体现构象熵恢复趋势，不宜完全套用金属小应变模型。\n【教材第7章第1题】不相同。金属和陶瓷材料弹性变形机制是原子键的伸长；非晶态高分子材料的弹性变形机制是分子链的调整和拉长。", "keyPoints": "金属和陶瓷的弹性主要来自原子间距、键角的可恢复改变，模量与键强度相关；聚合物还涉及链段转动、链构象变化，弹性响应强烈依赖温度、时间及交联状态；橡胶大弹性主要体现构象熵恢复趋势，不宜完全套用金属小应变模型", "mnemonic": "【记忆口诀】滑移面搭滑移向，密排面内密排向；滑移系数丰与简，决定金属塑性强。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_06_02", "num": "06-02", "chapter": "ch6", "name": "06-02 晶体塑性变形有哪些主要方式？", "title": "晶体塑性变形有哪些主要方式？", "section": "叶 pp.138–145；第7章习题2。", "def": "主要为滑移与孪生。滑移由位错运动逐步实现，晶体两部分沿滑移面发生相对位移；孪生是一定区域原子发生协调位移，形成与母晶具有孪晶关系的新取向。温度、速率、取向和晶体结构决定哪种机制更易发生。\n【教材第7章第2题】滑移：晶体的滑移是通过位错的运动来实现的，位错滑移穿过滑移面，材料发生位移，位移量是一个伯氏矢量。 孪生：切应力可以产生原子位移，使一部分原子位于另一部分原子的镜像位置，从而形成孪晶。", "keyPoints": "主要为滑移与孪生；滑移由位错运动逐步实现，晶体两部分沿滑移面发生相对位移；孪生是一定区域原子发生协调位移，形成与母晶具有孪晶关系的新取向；温度、速率、取向和晶体结构决定哪种机制更易发生", "mnemonic": "【记忆口诀】单轴拉伸分切应，施密德角余弦乘；临界切应达门槛，最优取向最先动。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_06_03", "num": "06-03", "chapter": "ch6", "name": "06-03 滑移面、滑移方向和滑移系是什么？滑移线与滑移带如何区分？", "title": "滑移面、滑移方向和滑移系是什么？滑移线与滑移带如何区分？", "section": "叶 pp.138–141；正文。", "def": "滑移面与其面内的一条滑移方向合称一个滑移系。滑移通常优先沿原子排列较密的方向及有利晶面发生；表面出现的细小台阶痕迹为滑移线，多条邻近滑移线组成滑移带。", "keyPoints": "滑移面与其面内的一条滑移方向合称一个滑移系；滑移通常优先沿原子排列较密的方向及有利晶面发生；表面出现的细小台阶痕迹为滑移线，多条邻近滑移线组成滑移带；滑移线是表面观察结果，不能把它当作晶体内部位错线本身", "mnemonic": "【记忆口诀】晶界阻碍位错塞，霍尔佩奇粒径反；细晶强韧双兼顾，唯此强化两全成。", "pitfall": "滑移线是表面观察结果，不能把它当作晶体内部位错线本身。", "freq": "高频必背"}, {"id": "qa_06_04", "num": "06-04", "chapter": "ch6", "name": "06-04 FCC、BCC 和 HCP 的滑移系为何不同？", "title": "FCC、BCC 和 HCP 的滑移系为何不同？", "section": "叶 pp.139–140；第7章习题3衍生。", "def": "① FCC 的 {111}⟨110⟩ 有 12 个滑移系。\n② BCC 常讨论 {110}⟨111⟩、{112}⟨111⟩ 与 {123}⟨111⟩ 组合，共 48 个几何可能滑移系，但并非全部同时开动。\n③ HCP 常温主要基面 {0001}⟨112̄0⟩ 滑移有 3 个，其他滑移可在适当温度和应力下开动。几何数量不等于实际可动数量。\n【教材第7章第3题】在相同条件下，可供选择的滑移系数量越多，塑性变形能力也就越强。面心立方结构的晶体有 12 个滑移系，而密排六方结构的晶体通常仅有 3 个滑移系。", "keyPoints": "FCC 的 {111}⟨110⟩ 有 12 个滑移系；BCC 常讨论 {110}⟨111⟩、{112}⟨111⟩ 与 {123}⟨111⟩ 组合，共 48 个几何可能滑移系，但并非全部同时开动；HCP 常温主要基面滑移有 3 个", "mnemonic": "【记忆口诀】溶质进入晶格偏，尺寸模量失配显；弹性应力钉位错，固溶强化硬度连。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_06_05", "num": "06-05", "chapter": "ch6", "name": "06-05 为什么铝通常比镁更容易室温塑性加工？", "title": "为什么铝通常比镁更容易室温塑性加工？", "section": "叶 pp.139–145；第7章习题3。", "def": "Al 为 FCC，易开动的独立滑移系较多，有利于协调多晶各晶粒变形；Mg 为 HCP，室温主要基面滑移，协调任意形变较困难，常需孪生或提高温度开动非基面滑移。\n【教材第7章第3题】在相同条件下，可供选择的滑移系数量越多，塑性变形能力也就越强。面心立方结构的晶体有 12 个滑移系，而密排六方结构的晶体通常仅有 3 个滑移系。", "keyPoints": "Al 为 FCC，易开动的独立滑移系较多，有利于协调多晶各晶粒变形；Mg 为 HCP，室温主要基面滑移，协调任意形变较困难，常需孪生或提高温度开动非基面滑移；不能简单归因于 Al 密度小或金属键更弱", "mnemonic": "【记忆口诀】塑性加工位错繁，交割缠结阻力全；加工硬化强度起，退火回复可消除。", "pitfall": "不能简单归因于 Al 密度小或金属键更弱。", "freq": "高频必背"}, {"id": "qa_06_06", "num": "06-06", "chapter": "ch6", "name": "06-06 施密德定律是什么？两个角各自如何定义？", "title": "施密德定律是什么？两个角各自如何定义？", "section": "叶 pp.140–142；第7章习题4。", "def": "① 施密德定律定义与公式：\n   - 单晶体在轴向拉伸应力 σ 作用下，某一滑移系上受到的分解分切应力 τ 为：τ = σ·cosφ·cosλ；\n   - 式中 φ 为拉伸轴与滑移面法线之间的夹角；\n   - λ 为拉伸轴与该面内滑移方向之间的夹角；\n   - m = cosφ·cosλ 称为施密德因子（取向因子）。\n② 滑移启动判据：当滑移系上的分切应力 τ 达到该晶体材料固有的临界分切应力 τ_CRSS 时（即 σ·cosφ·cosλ ≥ τ_CRSS），该滑移系才正式启动滑移。\n③ 几何角度约束：因为滑移方向严格位于滑移面内，所以滑移面法线与滑移方向必成 90° 直角，两夹角满足几何约束 φ + λ ≥ 90°；施密德因子理论最大值为 0.5（对应 φ = λ = 45° 时最有利取向）。\n【教材第7章第4题】当施加外力使分切应力达到某个临界值时，单晶中的滑移沿着最优滑移系进行，该临界值称为临界分切应力。", "keyPoints": "施密德定律 τ = σ·cosφ·cosλ；φ 为外力轴与法线夹角，λ 为外力轴与滑移向夹角；m = cosφ·cosλ 为施密德因子，最大值 0.5；达到 τ_CRSS 时滑移系开动", "mnemonic": "【记忆口诀】微细第二相颗粒，位错切过绕过行；奥罗万环绕过立，沉淀强化效果精。", "pitfall": "φ 是与滑移面法线的夹角而不是与滑移面本身的夹角，当外力垂直或平行滑移面时分切应力为 0，晶体发生屈服困难；φ 绝对是外力轴与滑移面“法线”的夹角，绝不是与滑移面本身的夹角；若拉伸轴垂直于滑移面 (φ = 0°, λ = 90°) 或平行于滑移面 (φ = 90°, λ = 0°)，施密德因子为 0，无论拉应力多大该滑移系都绝不可能开动。", "freq": "高频必背"}, {"id": "qa_06_07", "num": "06-07", "chapter": "ch6", "name": "06-07 临界分切应力是否随试样摆放角度而改变？", "title": "临界分切应力是否随试样摆放角度而改变？", "section": "叶 pp.140–142；第7章习题4。", "def": "① 在材料成分、组织、温度、变形速率等状态固定时，临界分切应力 τ_CRSS 主要由晶体本质及位错运动障碍决定，不因单纯改变外力相对晶体的取向而改变。\n② 改变取向改变的是施密德因子 m = cosφ·cosλ，从而改变达到该门槛所需的外加拉伸应力 σ = τ_CRSS / m。\n【教材第7章第4题】当施加外力使分切应力达到某个临界值时，单晶中的滑移沿着最优滑移系进行，该临界值称为临界分切应力。", "keyPoints": "在材料成分、组织、温度、变形速率等状态固定时，临界分切应力 τ_CRSS 主要由晶体本质及位错运动障碍决定，不因单纯改变外力相对晶体的取向而改变；改变取向改变的是施密德因子 m = cosφ·cosλ，从而改变达到该门槛所需的外加拉伸应力 σ = τ_CRSS / m；它不是对同种材料在所有加工硬化状态下都不变的常数", "mnemonic": "【记忆口诀】冷变退火分三步，回复亚晶内应释；再结晶换新晶粒，晶粒长大表面驱。", "pitfall": "它不是对同种材料在所有加工硬化状态下都不变的常数。", "freq": "高频必背"}, {"id": "qa_06_08", "num": "06-08", "chapter": "ch6", "name": "06-08 为什么最有利取向的施密德因子为0.5？多晶屈服为何更复杂？", "title": "为什么最有利取向的施密德因子为0.5？多晶屈服为何更复杂？", "section": "叶 pp.140–145；正文。", "def": "滑移方向位于滑移面内，因而与法线垂直；单轴载荷对这两个正交方向的分量乘积最大为0.5，对应理想45°、45°取向。", "keyPoints": "滑移方向位于滑移面内，因而与法线垂直；单轴载荷对这两个正交方向的分量乘积最大为0.5，对应理想45°、45°取向；多晶各晶粒取向不同，晶界约束要求变形协调，不能只用一个最好取向晶粒的门槛代表整个材料的宏观屈服", "mnemonic": "【答题抓手】扣准最有利取向的、施密德因子为、多晶屈服为何，紧扣物理机制与适用条件展开", "pitfall": "多晶各晶粒取向不同，晶界约束要求变形协调，不能只用一个最好取向晶粒的门槛代表整个材料的宏观屈服。", "freq": "高频必背"}, {"id": "qa_06_09", "num": "06-09", "chapter": "ch6", "name": "06-09 滑移与孪生在位移规律、取向和变形量上有何区别？", "title": "滑移与孪生在位移规律、取向和变形量上有何区别？", "section": "叶 pp.142–144；正文。", "def": "① 滑移：位错通过某滑移面，使面两侧晶体沿滑移方向产生晶格平移；理想滑移后两侧原有晶体取向保持对应，累计滑移量可很大，常承担金属的大部分塑性变形。\n② 孪生：孪生区内多个原子层按规定规律发生协调切变，不同层的位移随位置有规律改变，形成与母晶满足孪晶取向关系的区域。单个原子的位移不必为完整晶格平移，区域取向会改变。\n③ 性能作用：孪生直接贡献的应变通常有限，但可使某些原本不利于滑移的区域转到较有利取向，从而协助后续变形。", "keyPoints": "滑移：位错通过某滑移面，使面两侧晶体沿滑移方向产生晶格平移；理想滑移后两侧原有晶体取向保持对应，累计滑移量可很大，常承担金属的大部分塑性变形；孪生：孪生区内多个原子层按规定规律发生协调切变，不同层的位移随位置有规律改变，形成与母晶满足孪晶取向关系的区域；单个原子的位移不必为完整晶格平移，区域取向会改变...", "mnemonic": "【答题抓手】扣准滑移与孪生在、位移规律、取向和变形量，紧扣物理机制与适用条件展开", "pitfall": "不能把孪生描述成所有原子同距离整体平移，也不能只根据表面有直线痕迹就断定一定是滑移或一定是孪生。", "freq": "高频必背"}, {"id": "qa_06_10", "num": "06-10", "chapter": "ch6", "name": "06-10 变形孪晶与退火孪晶的形成条件有何区别？", "title": "变形孪晶与退火孪晶的形成条件有何区别？", "section": "叶 pp.143–144；第7章习题5。", "def": "变形孪晶由外加应力诱发，常与低温、高速或滑移受限有关；退火孪晶在再结晶或晶粒长大过程中形成，常见于某些 FCC 金属。\n【教材第7章第5题】通过机械变形过程形成的孪晶被称为变形孪晶。变形金属进行再结晶退火处理过程中形成的孪晶被称为退火孪晶。", "keyPoints": "变形孪晶由外加应力诱发，常与低温、高速或滑移受限有关；退火孪晶在再结晶或晶粒长大过程中形成，常见于某些 FCC 金属；两者均符合孪晶取向关系，但形成驱动与组织形貌不同，不能把所有孪晶都视为加工变形的证据", "mnemonic": "【答题抓手】扣准变形孪晶与退、火孪晶的形成、条件有何区别，紧扣物理机制与适用条件展开", "pitfall": "两者均符合孪晶取向关系，但形成驱动与组织形貌不同，不能把所有孪晶都视为加工变形的证据。", "freq": "高频必背"}, {"id": "qa_06_11", "num": "06-11", "chapter": "ch6", "name": "06-11 为什么低碳钢可出现上下屈服点，而铝通常没有同样的平台？", "title": "为什么低碳钢可出现上下屈服点，而铝通常没有同样的平台？", "section": "叶 pp.145–146；第7章习题6。", "def": "低碳钢中间隙溶质 C、N 可偏聚于位错附近并钉扎位错；脱钉需较高应力，脱钉后运动阻力降低，出现上、下屈服及吕德斯变形传播。Al 通常不具备同样显著的间隙原子钉扎条件。\n【教材第7章第6题】屈服平台形成需要碳间隙原子聚集在位错附近形成柯氏气团。", "keyPoints": "低碳钢中间隙溶质 C、N 可偏聚于位错附近并钉扎位错；脱钉需较高应力，脱钉后运动阻力降低，出现上、下屈服及吕德斯变形传播； Al 通常不具备同样显著的间隙原子钉扎条件；屈服现象也受组织和加载条件影响，不能仅按元素名称绝对判断", "mnemonic": "【答题抓手】扣准低碳钢可出现、上下屈服点而、铝通常没有同，紧扣物理机制与适用条件展开", "pitfall": "屈服现象也受组织和加载条件影响，不能仅按元素名称绝对判断。", "freq": "高频必背"}, {"id": "qa_06_12", "num": "06-12", "chapter": "ch6", "name": "06-12 冷塑性变形会引起哪些组织与性能变化？", "title": "冷塑性变形会引起哪些组织与性能变化？", "section": "叶 pp.146–154；正文。", "def": "① 晶粒被拉长、位错密度增加，可形成胞状或亚晶结构。\n② 晶体取向择优形成织构。\n③ 产生残余应力。宏观上通常强度、硬度上升，塑性下降，部分物理性能改变。变形储能只是外功的一部分，大部分塑性功转化为热。", "keyPoints": "晶粒被拉长、位错密度增加，可形成胞状或亚晶结构；晶体取向择优形成织构；产生残余应力；宏观上通常强度、硬度上升，塑性下降，部分物理性能改变；变形储能只是外功的一部分，大部分塑性功转化为热", "mnemonic": "【答题抓手】扣准冷塑性变形会、引起哪些组织、与性能变化，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_06_13", "num": "06-13", "chapter": "ch6", "name": "06-13 纤维组织与织构有什么区别？", "title": "纤维组织与织构有什么区别？", "section": "叶 pp.146–147；第7章习题11。", "def": "① 纤维组织强调晶粒、第二相或夹杂被沿加工方向拉长的形貌。\n② 织构强调晶粒晶体学取向的择优分布。前者看形状与排列，后者看取向，两者可共存但不是同一概念。\n③ 织构会使多晶的力学及物理性质产生各向异性。\n【教材第7章第11题】① 纤维组织：变形过程中晶粒沿拉伸方向伸长，大变形下呈纤维状条纹，使金属沿纤维方向强度高于横向强度。 ② 变形织构：多晶体塑性变形中晶粒转动产生择优取向，使金属显示明显的各向异性，加工时变形不均匀，但在特定应用中可增强特定方向性能。", "keyPoints": "纤维组织强调晶粒、第二相或夹杂被沿加工方向拉长的形貌；织构强调晶粒晶体学取向的择优分布；前者看形状与排列，后者看取向，两者可共存但不是同一概念；织构会使多晶的力学及物理性质产生各向异性", "mnemonic": "【答题抓手】扣准纤维组织与织、构有什么区别，紧扣物理机制与适用条件展开", "pitfall": "前者看形状与排列，后者看取向，两者可共存但不是同一概念。", "freq": "高频必背"}, {"id": "qa_06_14", "num": "06-14", "chapter": "ch6", "name": "06-14 残余应力分哪几类？它们如何形成？", "title": "残余应力分哪几类？它们如何形成？", "section": "叶 pp.147–148；第7章习题12。", "def": "① 第一类为宏观尺度、跨许多晶粒的应力。\n② 第二类在晶粒或相之间尺度平衡。\n③ 第三类在晶内更小尺度与缺陷畸变有关。非均匀塑性变形、温差、相变体积差等都可产生残余应力。\n【教材第7章第12题】① 宏观残余应力：由工件各部分之间的变形不均匀产生。 ② 微观残余应力：由晶粒或亚晶粒的不均匀变形引起，作用范围与晶粒尺寸相当。 ③ 点阵畸变：塑性变形产生大量晶体缺陷使原子偏离平衡位置，造成点阵畸变。", "keyPoints": "第一类为宏观尺度、跨许多晶粒的应力；第二类在晶粒或相之间尺度平衡；第三类在晶内更小尺度与缺陷畸变有关；非均匀塑性变形、温差、相变体积差等都可产生残余应力；零外力只要求整体平衡，不代表内部处处无应力", "mnemonic": "【答题抓手】扣准残余应力分哪、几类它们形成，紧扣物理机制与适用条件展开", "pitfall": "零外力只要求整体平衡，不代表内部处处无应力。", "freq": "高频必背"}, {"id": "qa_06_15", "num": "06-15", "chapter": "ch6", "name": "06-15 四种主要强化机制有什么共同点和不同点？", "title": "四种主要强化机制有什么共同点和不同点？", "section": "叶 pp.148–157；第7章习题7。", "def": "① 细晶强化用晶界阻碍位错传播。\n② 固溶强化用溶质引起的应力场等阻碍位错。\n③ 加工硬化通过增殖位错并增加相互作用。\n④ 第二相强化通过颗粒阻挡位错。共同点是提高塑性变形阻力，区别在障碍的来源、尺度及热稳定性。\n【教材第7章第7题】① 细晶强化：多晶体材料的强度通常高于单晶体材料，并且晶粒越细小，材料的强度越高。 ② 固溶强化：合金由单相固溶体组成时，随着溶质原子含量增加，抵抗塑性变形能力增强，强度硬度上升而塑韧性下降。 ③ 加工硬化：金属对塑性变形的抗力随变形量的增加而增加，强度硬度提高而韧性延展性降低。 ④ 第二相强化：引入第二相或更多相，使材料成为两相或多相合金，从而提高强度。", "keyPoints": "细晶强化用晶界阻碍位错传播；固溶强化用溶质引起的应力场等阻碍位错；加工硬化通过增殖位错并增加相互作用；第二相强化通过颗粒阻挡位错；共同点是提高塑性变形阻力，区别在障碍的来源、尺度及热稳定性", "mnemonic": "【答题抓手】扣准四种主要强化、机制有什么共、同点和不同点，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_06_16", "num": "06-16", "chapter": "ch6", "name": "06-16 Hall–Petch 关系如何解释细晶强化？为什么细晶还常能改善韧性？", "title": "Hall–Petch 关系如何解释细晶强化？为什么细晶还常能改善韧性？", "section": "叶 pp.148–150；第7章习题8。", "def": "① 霍尔-佩奇关系为 σ_y = σ_0 + k_y·d^(-1/2)。\n② 晶粒越小，晶界越多，位错跨晶粒传播及有效塞积更受阻；同时细小晶粒可使变形更均匀，裂纹传播频繁转向，降低局部应力集中，常提高韧性。\n③ 该经验关系有适用粒径范围，不能无限外推到极小纳米晶（可能发生反常软化）。\n【教材第7章第8题】① 强度提高：相邻晶粒滑移系不连续，位错无法穿过晶界持续滑移而在晶界处塞积；多滑移增加了位错交互作用与运动阻力，晶粒越细强度越高。 ② 改善塑性与韧性：晶粒越细，单位体积晶粒数越多，变形分散在更多晶粒内而更均匀，每个晶粒中塞积位错少、应力集中小，开裂机会少且断裂前可承受更大变形，裂纹扩展吸收更多能量。", "keyPoints": "霍尔-佩奇公式 σ_y = σ_0 + k_y·d^(-1/2)；晶界阻碍位错滑移与塞积提高屈服强度；变形均匀分散应力集中改善韧性；极小纳米晶反常软化失效。", "mnemonic": "【答题抓手】扣准关系细晶强化、细晶还常能改、善韧性，紧扣物理机制与适用条件展开", "pitfall": "该经验关系有适用粒径范围，不能无限外推到极小纳米晶。", "freq": "高频必背"}, {"id": "qa_06_17", "num": "06-17", "chapter": "ch6", "name": "06-17 为什么细晶并非对所有使用条件都最好？", "title": "为什么细晶并非对所有使用条件都最好？", "section": "叶 pp.148–150、182–184；正文衍生。", "def": "细晶通常利于室温强度和韧性，但晶界也是快速扩散、晶界滑移及高温损伤通道；高温蠕变场合较粗晶或单晶有时更有利。", "keyPoints": "细晶通常利于室温强度和韧性，但晶界也是快速扩散、晶界滑移及高温损伤通道；高温蠕变场合较粗晶或单晶有时更有利；选材需先明确主导失效机制，不能将“细晶强化”直接等同于所有性能全面提高", "mnemonic": "【答题抓手】扣准细晶并非对所、有使用条件都、最好，紧扣物理机制与适用条件展开", "pitfall": "选材需先明确主导失效机制，不能将“细晶强化”直接等同于所有性能全面提高。", "freq": "高频必背"}, {"id": "qa_06_18", "num": "06-18", "chapter": "ch6", "name": "06-18 固溶强化的微观机制和影响因素是什么？", "title": "固溶强化的微观机制和影响因素是什么？", "section": "叶 pp.150–152；第7章习题7、9。", "def": "溶质造成尺寸、弹性模量等失配，与位错应力场相互作用，提高位错运动所需应力。效应与溶质浓度、尺寸差、模量差、占位及分布有关；间隙溶质往往畸变较强。\n【教材第7章第7题】① 细晶强化：多晶体材料的强度通常高于单晶体材料，并且晶粒越细小，材料的强度越高。 ② 固溶强化：合金由单相固溶体组成时，随着溶质原子含量增加，抵抗塑性变形能力增强，强度硬度上升而塑韧性下降。 ③ 加工硬化：金属对塑性变形的抗力随变形量的增加而增加，强度硬度提高而韧性延展性降低。 ④ 第二相强化：引入第二相或更多相，使材料成为两相或多相合金，从而提高强度。", "keyPoints": "溶质造成尺寸、弹性模量等失配，与位错应力场相互作用，提高位错运动所需应力；效应与溶质浓度、尺寸差、模量差、占位及分布有关；间隙溶质往往畸变较强；析出新相后已不是单纯固溶强化，应另行分析", "mnemonic": "【答题抓手】扣准固溶强化的微、观机制和影响、因素是什么，紧扣物理机制与适用条件展开", "pitfall": "析出新相后已不是单纯固溶强化，应另行分析。", "freq": "高频必背"}, {"id": "qa_06_19", "num": "06-19", "chapter": "ch6", "name": "06-19 若原子半径满足 r_A < r_B < r_C，能否直接判断 A–B、A–C 合金谁更强？", "title": "若原子半径满足 r_A < r_B < r_C，能否直接判断 A–B、A–C 合金谁更强？", "section": "叶 pp.150–152；第7章习题9。", "def": "若原子半径满足 |r_C - r_A| > |r_B - r_A|，能否直接判断 A–B、A–C 合金谁更强？只有在以 A 为共同溶剂、溶质浓度及显微组织等可比、且两者均形成相应固溶体时，才可用 A–C 尺寸差较大推测其尺寸失配强化更明显。\n【教材第7章第9题】A-C 固溶合金的塑性变形能力差。溶质原子的存在及其固溶度的增加会使基体变形抗力提高、塑性下降；尺寸差越大强化越明显。A-B 可能形成置换固溶体，A-C 可能形成间隙固溶体，间隙型溶质原子比置换原子具有更大的固溶强化效果。", "keyPoints": "若原子半径满足 |r_C - r_A| > |r_B - r_A|，能否直接判断 A–B、A–C 合金谁更强？只有在以 A 为共同溶剂、溶质浓度及显微组织等可比、且两者均形成相应固溶体时，才可用 A–C 尺寸差较大推测其尺寸失配强化更明显；还需综合考虑剪切模量失配、固溶度及金属间化合物析出；仅凭三个半径大小不能判定 C 必为间隙原子，也不能无条件给出最终强度顺序", "mnemonic": "【答题抓手】扣准若原子半径满、足能否直接判、合金谁更强，紧扣物理机制与适用条件展开", "pitfall": "还需综合考虑剪切模量失配、固溶度及金属间化合物析出；仅凭三个半径大小不能判定 C 必为间隙原子，也不能无条件给出最终强度顺序。", "freq": "高频必背"}, {"id": "qa_06_20", "num": "06-20", "chapter": "ch6", "name": "06-20 加工硬化的原因是什么？如何消除？", "title": "加工硬化的原因是什么？如何消除？", "section": "叶 pp.152–154、157–164；第7章习题10。", "def": "变形使位错增殖，交互作用、缠结和障碍增多，进一步运动需更高应力。适当退火可通过回复和再结晶降低储能、减少位错，恢复塑性。回复可消除部分应力但未必显著消除全部硬化；充分再结晶通常使强度硬度明显下降。\n【教材第7章第10题】材料对塑性变形的抗力随应变的增加而增加的现象称为加工硬化。加工硬化可以通过再结晶退火予以消除。", "keyPoints": "变形使位错增殖，交互作用、缠结和障碍增多，进一步运动需更高应力；适当退火可通过回复和再结晶降低储能、减少位错，恢复塑性；回复可消除部分应力但未必显著消除全部硬化；充分再结晶通常使强度硬度明显下降", "mnemonic": "【答题抓手】扣准加工硬化的原、因是什么消除，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_06_21", "num": "06-21", "chapter": "ch6", "name": "06-21 第二相如何通过切过或绕过机制强化？", "title": "第二相如何通过切过或绕过机制强化？", "section": "叶 pp.154–157；正文。", "def": "① 切过机制：位错穿过可剪切颗粒时，可能需克服颗粒共格应变、弹性模量差异，或破坏有序结构等，因此所需应力提高。颗粒尺寸、结构和界面决定它是否容易被切过，而不是仅看“硬不硬”。\n② 绕过机制：对难以剪切的障碍，位错在颗粒之间弯曲并最终从其周围通过，可留下位错环。颗粒间自由间距越小，位错要形成的曲率越大，通常需要更高应力；这是弥散颗粒强化的重要依据。为何过时效可能降强：继续时效使颗粒粗化、数密度减少和间距增大，或改变共格状态，主导通过机制发生变化。需要比较最容易实现的机制所需应力，不能把切过和绕过两种阻力直接随意相加，也不能断言颗粒越大强化越强。", "keyPoints": "位错穿过可剪切颗粒时，可能需克服颗粒共格应变、弹性模量差异，或破坏有序结构等，因此所需应力提高；对难以剪切的障碍，位错在颗粒之间弯曲并最终从其周围通过，可留下位错环", "mnemonic": "【答题抓手】扣准第二相通过切、过或绕过机制、强化，紧扣物理机制与适用条件展开", "pitfall": "颗粒尺寸、结构和界面决定它是否容易被切过，而不是仅看“硬不硬”。", "freq": "高频必背"}, {"id": "qa_06_22", "num": "06-22", "chapter": "ch6", "name": "06-22 析出强化为什么会出现峰值时效和过时效？", "title": "析出强化为什么会出现峰值时效和过时效？", "section": "叶 pp.154–157；正文衍生。", "def": "① 时效早期形成细小析出物，障碍逐渐增强。\n② 随尺寸和分布变化达到峰值强度。\n③ 继续时效发生粗化、颗粒间距增大或共格性改变，位错更易通过有效路径，强度下降。", "keyPoints": "时效早期形成细小析出物，障碍逐渐增强；随尺寸和分布变化达到峰值强度；继续时效发生粗化、颗粒间距增大或共格性改变，位错更易通过有效路径，强度下降；第二相体积分数、尺寸和间距需共同考虑，不能说颗粒越粗强化越强", "mnemonic": "【答题抓手】扣准析出强化会出、现峰值时效和、过时效，紧扣物理机制与适用条件展开", "pitfall": "第二相体积分数、尺寸和间距需共同考虑，不能说颗粒越粗强化越强。", "freq": "高频必背"}, {"id": "qa_06_23", "num": "06-23", "chapter": "ch6", "name": "06-23 回复、再结晶和晶粒长大分别发生什么？", "title": "回复、再结晶和晶粒长大分别发生什么？", "section": "叶 pp.157–164；正文。", "def": "① 回复主要发生点缺陷消除、位错重排和部分湮灭，原变形晶粒整体形貌大体保留。\n② 再结晶形成并长大低位错密度的新晶粒，替代变形组织。\n③ 随后晶粒长大使平均尺寸增加。三阶段是便于描述的划分，实际温度范围可能重叠。", "keyPoints": "回复主要发生点缺陷消除、位错重排和部分湮灭，原变形晶粒整体形貌大体保留；再结晶形成并长大低位错密度的新晶粒，替代变形组织；随后晶粒长大使平均尺寸增加；三阶段是便于描述的划分，实际温度范围可能重叠", "mnemonic": "【答题抓手】扣准回复、再结晶和晶粒、长大分别发生，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_06_24", "num": "06-24", "chapter": "ch6", "name": "06-24 回复、再结晶与晶粒长大的驱动力分别是什么？", "title": "回复、再结晶与晶粒长大的驱动力分别是什么？", "section": "叶 pp.157–164；正文。", "def": "回复和再结晶主要由冷变形储存的能量驱动，尤其与缺陷及位错能有关；正常晶粒长大主要由减少晶界面积、降低晶界能驱动。", "keyPoints": "回复和再结晶主要由冷变形储存的能量驱动，尤其与缺陷及位错能有关；正常晶粒长大主要由减少晶界面积、降低晶界能驱动；再结晶前后相的种类和晶体结构通常不变，因此不能把它当成一般意义的新相形成", "mnemonic": "【答题抓手】扣准回复、再结晶与晶粒、长大的驱动力，紧扣物理机制与适用条件展开", "pitfall": "再结晶前后相的种类和晶体结构通常不变，因此不能把它当成一般意义的新相形成。", "freq": "高频必背"}, {"id": "qa_06_25", "num": "06-25", "chapter": "ch6", "name": "06-25 多边化如何形成亚晶？回复为何对电阻率和强度的影响不同？", "title": "多边化如何形成亚晶？回复为何对电阻率和强度的影响不同？", "section": "叶 pp.157–158；正文。", "def": "回复时位错通过滑移、攀移等重排成低能位错墙，形成小角度亚晶界，即多边化。点缺陷和局部畸变消除可明显改善某些物理性能、降低内应力；但原变形晶粒和相当部分位错障碍仍存在，所以强度硬度未必立即大幅下降。", "keyPoints": "回复时位错通过滑移、攀移等重排成低能位错墙，形成小角度亚晶界，即多边化；点缺陷和局部畸变消除可明显改善某些物理性能、降低内应力；但原变形晶粒和相当部分位错障碍仍存在，所以强度硬度未必立即大幅下降", "mnemonic": "【答题抓手】扣准多边化形成亚、晶回复为何对、电阻率和强度，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_06_26", "num": "06-26", "chapter": "ch6", "name": "06-26 什么是再结晶温度？它是不是材料的固定相变温度？", "title": "什么是再结晶温度？它是不是材料的固定相变温度？", "section": "叶 pp.158–162；正文。", "def": "① 本质：再结晶是具有时间尺度的热激活过程，所以定义一个比较温度时必须说明先前冷变形状态、保温时间及完成标准，不像平衡熔点那样是单一固定转变温度。\n② 教材约定： p.160介绍工业比较常用较大冷变形量（大于70%）的金属，在1小时内再结晶体积分数超过95%所需的最低温度。不同书或研究也可采用其他约定，引用数值时应带上定义。\n③ 影响方向：更大储能或更长保温时间通常有利于在较低温度达到规定完成程度；溶质拖曳、细颗粒钉扎会使过程受阻。再结晶温度与熔点的经验比例必须使用绝对温度K，不能直接拿摄氏温度相乘；该比例也不能代替实际组织判断。", "keyPoints": "本质：再结晶是具有时间尺度的热激活过程，所以定义一个比较温度时必须说明先前冷变形状态、保温时间及完成标准，不像平衡熔点那样是单一固定转变温度；教材约定： p.160介绍工业比较常用较大冷变形量（大于70%）的金属，在1小时内再结晶体积分数超过95%所需的最低温度；不同书或研究也可采用其他约定，引用数值时应带上定义...", "mnemonic": "【答题抓手】扣准什么是再结晶、温度它是不是、材料的固定相，紧扣物理机制与适用条件展开", "pitfall": "再结晶温度与熔点的经验比例必须使用绝对温度K，不能直接拿摄氏温度相乘。", "freq": "高频必背"}, {"id": "qa_06_27", "num": "06-27", "chapter": "ch6", "name": "06-27 影响再结晶的主要因素有哪些？", "title": "影响再结晶的主要因素有哪些？", "section": "叶 pp.158–162；第7章习题13。", "def": "① 变形程度决定储能和潜在形核位置。\n② 温度、时间影响迁移与完成程度。\n③ 原始晶粒大小影响边界及储能分布。\n④ 溶质拖曳和细颗粒钉扎可推迟再结晶。\n⑤ 粗颗粒可在一定条件下促进颗粒周围形核。\n⑥ 位向差及取向影响新晶粒生长。\n【教材第7章第13题】当冷变形金属加热到一定温度时，形成新的等轴晶粒并逐步取代变形晶粒的过程，称为再结晶。影响因素主要有：变形程度、退火温度、原始晶粒尺寸、微量溶质原子、第二相颗粒。", "keyPoints": "变形程度决定储能和潜在形核位置；温度、时间影响迁移与完成程度；原始晶粒大小影响边界及储能分布；溶质拖曳和细颗粒钉扎可推迟再结晶；粗颗粒可在一定条件下促进颗粒周围形核；位向差及取向影响新晶粒生长；不要把“所有第二相都抑制”写成绝对结论", "mnemonic": "【答题抓手】扣准影响再结晶的、主要因素有哪，紧扣物理机制与适用条件展开", "pitfall": "不要把“所有第二相都抑制”写成绝对结论。", "freq": "高频必背"}, {"id": "qa_06_28", "num": "06-28", "chapter": "ch6", "name": "06-28 变形量对再结晶晶粒大小有何影响？楔形板轧至等厚后为何性能不一？", "title": "变形量对再结晶晶粒大小有何影响？楔形板轧至等厚后为何性能不一？", "section": "叶 pp.158–162；第7章习题14。", "def": "同等退火条件下，超过临界变形量后更大变形通常提供更多形核位置，得到更细再结晶晶粒；临界附近形核少，可能形成粗晶。\n【教材第7章第14题】厚度不同的楔形板冷轧为相同厚度的钢板，各处变形量不同。再结晶退火后的晶粒大小与变形量密切相关，变形量越大，再结晶后的晶粒越小，所以退火后各处晶粒大小不同。晶粒越细，抗拉强度越高。", "keyPoints": "同等退火条件下，超过临界变形量后更大变形通常提供更多形核位置，得到更细再结晶晶粒；临界附近形核少，可能形成粗晶；楔形板各处原始厚度不同，轧至等厚后局部压下率、储能、硬化和再结晶情况不同，所以不能仅凭最终厚度判断强度一致", "mnemonic": "【答题抓手】扣准变形量对再结、晶晶粒大小有、何影响楔形板，紧扣物理机制与适用条件展开", "pitfall": "楔形板各处原始厚度不同，轧至等厚后局部压下率、储能、硬化和再结晶情况不同，所以不能仅凭最终厚度判断强度一致。", "freq": "高频必背"}, {"id": "qa_06_29", "num": "06-29", "chapter": "ch6", "name": "06-29 影响晶粒长大的因素有哪些？正常长大与异常长大如何区别？", "title": "影响晶粒长大的因素有哪些？正常长大与异常长大如何区别？", "section": "叶 pp.162–164；第7章习题15。", "def": "温度、时间、晶界能及迁移率、溶质拖曳、第二相颗粒钉扎、原始尺寸及织构等共同控制长大。正常长大时整体尺寸分布相对稳定地粗化；异常长大时少数晶粒优先生长，远大于其余晶粒。细小稳定颗粒通常抑制晶界移动，颗粒溶解或粗化可削弱钉扎。\n【教材第7章第15题】加热温度、加热时间、晶粒位向差、杂质与合金元素、第二相颗粒。", "keyPoints": "温度、时间、晶界能及迁移率、溶质拖曳、第二相颗粒钉扎、原始尺寸及织构等共同控制长大；正常长大时整体尺寸分布相对稳定地粗化；异常长大时少数晶粒优先生长，远大于其余晶粒；细小稳定颗粒通常抑制晶界移动，颗粒溶解或粗化可削弱钉扎", "mnemonic": "【答题抓手】扣准影响晶粒长大、的因素有哪些、正常长大与异，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_06_30", "num": "06-30", "chapter": "ch6", "name": "06-30 冷加工与热加工的区别为何不能只看是否在室温进行？", "title": "冷加工与热加工的区别为何不能只看是否在室温进行？", "section": "叶 pp.152–164；正文衍生。", "def": "应结合材料的回复、再结晶条件判断。冷加工中硬化容易积累，强度上升、塑性消耗；热加工中回复或再结晶可同时发生，降低流动应力并恢复部分变形能力。同一室温对低熔点和高熔点材料对应的相对温度差别很大。", "keyPoints": "应结合材料的回复、再结晶条件判断；冷加工中硬化容易积累，强度上升、塑性消耗；热加工中回复或再结晶可同时发生，降低流动应力并恢复部分变形能力；同一室温对低熔点和高熔点材料对应的相对温度差别很大", "mnemonic": "【答题抓手】扣准冷加工与热加、工的区别为何、不能只看是否，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_06_31", "num": "06-31", "chapter": "ch6", "name": "06-31 陶瓷、非晶金属和聚合物的塑性机制与晶态金属有何不同？", "title": "陶瓷、非晶金属和聚合物的塑性机制与晶态金属有何不同？", "section": "叶 pp.164–166；正文。", "def": "① 陶瓷在室温常因键方向性、电中性和滑移阻力限制而难塑性变形，高温仍可能发生位错或晶界相关变形。\n② 非晶金属没有长程周期晶格，不能用传统晶格位错滑移完整描述，常表现局部剪切。\n③ 聚合物通过链段运动、链取向、滑移及晶区变化变形，受温度和速率显著影响。", "keyPoints": "陶瓷在室温常因键方向性、电中性和滑移阻力限制而难塑性变形，高温仍可能发生位错或晶界相关变形；非晶金属没有长程周期晶格，不能用传统晶格位错滑移完整描述，常表现局部剪切；聚合物通过链段运动、链取向、滑移及晶区变化变形，受温度和速率显著影响", "mnemonic": "【答题抓手】扣准陶瓷、非晶金属和聚、合物的塑性机，紧扣物理机制与适用条件展开", "pitfall": "非晶金属没有长程周期晶格，不能用传统晶格位错滑移完整描述，常表现局部剪切。", "freq": "高频必背"}, {"id": "qa_06_D01", "num": "06-32", "chapter": "ch6", "name": "06-32 为什么BCC几何上有更多潜在滑移系，塑性却不一定优于FCC？", "title": "为什么BCC几何上有更多潜在滑移系，塑性却不一定优于FCC？", "section": "叶 p.139；正文直接解释。", "def": "① 区别：几何允许的滑移系数量，不等于在给定温度、应力和加载速率下容易启动的滑移系数量。\n② 教材机制： BCC的滑移面原子密排程度不如FCC，滑移阻力较大，实际滑移面随成分和温度变化；FCC的密排面和密排方向组合较容易启动，有利于多晶协调变形。因此不能用48大于12就推出BCC一定更塑。\n③ 答题条件：必须写“常见条件下”“取决于实际可开动滑移系和阻力”。同一结构的不同金属及不同温度下也可能有很大差别，不能把结构类别当作唯一决定因素。", "keyPoints": "BCC虽有48个潜在滑移系，但滑移面{110}非真正密排面，位错核宽窄，晶格阻力(Peierls-Nabarro应力)高且对温度极敏感；FCC具12个滑移系但均为密排面{111}，Peierls应力极低，常温及低温塑性均优于BCC。", "mnemonic": "【记忆口诀】BCC滑移四十八，密排方向最关键；派纳应力温敏显，低温脆断韧性劣。", "pitfall": "滑移系多寡不直接等同于塑性优劣，必须综合考虑密排程度与Peierls阻力。", "freq": "考纲深度细化"}, {"id": "qa_06_D02", "num": "06-33", "chapter": "ch6", "name": "06-33 固溶原子为什么会偏聚到位错附近？大、小置换原子的偏聚位置有什么区别？", "title": "固溶原子为什么会偏聚到位错附近？大、小置换原子的偏聚位置有什么区别？", "section": "叶 pp.150–152；正文机制细分。", "def": "① 能量原则：溶质引起的局部尺寸畸变若能抵消部分位错应力场，体系弹性能可降低，因此溶质倾向在有利位置富集。\n② 对简单刃型位错：多余半原子面一侧通常有压应力区，小置换原子可在该区减轻挤压；另一侧拉应力区可容纳较大置换原子。形成的溶质气团会阻碍位错脱离和运动，产生强化或屈服点相关效应。", "keyPoints": "刃型位错滑移面上方受压、下方受拉。半径大于基体溶质原子进入下方拉应力区可松弛拉应力，半径较小溶质原子偏聚于上方压应力区松弛压应力，使系统弹性应变能降到最低，形成柯氏气团。", "mnemonic": "【记忆口诀】应力场弹性交互，大溶质奔受拉区；小溶质趋受压侧，柯氏气团钉位错。", "pitfall": "螺型位错仅具切应力场，通常只与产生非球对称畸变的溶质原子发生强烈弹性交互；不是所有溶质都聚到同一侧；间隙原子有更复杂、常较不对称的应变场，不能仅凭一个球形体积失配图解释全部固溶强化。", "freq": "考纲深度细化"}, {"id": "qa_06_D03", "num": "06-34", "chapter": "ch6", "name": "06-34 再结晶为什么常在原晶界或变形严重区域开始？晶界凸出形核具体是什么？", "title": "再结晶为什么常在原晶界或变形严重区域开始？晶界凸出形核具体是什么？", "section": "叶 pp.158–160；正文遗漏细节。", "def": "① 原因：冷变形不均匀，各处位错密度和储能不同；原晶界、变形带及颗粒附近常提供较高储能差和有利界面条件。\n② 晶界凸出机制：在较小变形量条件下，相邻晶粒储能差较显著，低储能一侧的界面向高储能、位错密度高的一侧凸出，扫过区域的变形组织被较低缺陷密度组织取代，从而形成可继续长大的再结晶区域。\n③ 关键区别：不是凭空生成另一种化学成分的新相；界面迁移由两侧储能差驱动。原晶界是常见位置，但大变形时还可通过亚晶合并或长大形成新晶粒，不能把再结晶形核只限于原晶界。", "keyPoints": "冷变形不均匀，各处位错密度和储能不同；在较小变形量条件下，相邻晶粒储能差较显著，低储能一侧的界面向高储能、位错密度高的一侧凸出，扫过区域的变形组织被较低缺陷密度组织取代，从而形成可继续长大的再结晶区域", "mnemonic": "【答题抓手】扣准再结晶常在原、晶界或变形严、重区域开始晶，紧扣物理机制与适用条件展开", "pitfall": "关键区别：不是凭空生成另一种化学成分的新相。", "freq": "考纲深度细化"}, {"id": "qa_06_D04", "num": "06-35", "chapter": "ch6", "name": "06-35 亚晶合并与亚晶长大如何形成再结晶晶核？为什么临界变形附近容易粗晶？", "title": "亚晶合并与亚晶长大如何形成再结晶晶核？为什么临界变形附近容易粗晶？", "section": "叶 pp.159–162；正文细分。", "def": "① 亚晶机制：大变形后，回复可使位错形成亚晶结构；相邻亚晶通过位错结构调整及边界消失而合并，或较有利亚晶吞并邻近亚晶逐步长大，并形成能够迁移的大角度边界，最终替代周围变形组织。\n② 临界变形附近：储能刚足以推动再结晶，但可有效发展为新晶粒的位置少，少数晶粒能占据较大体积，所以易得到粗大组织。变形超过一定程度后，形核位置通常增多，晶粒可细化。", "keyPoints": "大变形后，回复可使位错形成亚晶结构；回复形成亚晶不等于已经完成再结晶", "mnemonic": "【答题抓手】扣准亚晶合并与亚、晶长大形成再、结晶晶核临界，紧扣物理机制与适用条件展开", "pitfall": "回复形成亚晶不等于已经完成再结晶；也不能说变形量从零开始越小，退火后晶粒一定越细。", "freq": "考纲深度细化"}, {"id": "qa_06_D05", "num": "06-36", "chapter": "ch6", "name": "06-36 第二相为何有时促进再结晶、有时又阻碍再结晶？", "title": "第二相为何有时促进再结晶、有时又阻碍再结晶？", "section": "叶 p.162；正文直接解释。", "def": "① 粗颗粒一类情况：变形时粗大且间距较大的颗粒使周围变形不协调，位错聚集、局部畸变强，可提供再结晶形核的有利区域，从而促进形核。\n② 细颗粒一类情况：细小弥散颗粒造成的局部形核促进可能较弱，却能有效阻碍位错和晶界迁移，使新晶粒难以长大，因而延迟再结晶、提高完成所需温度或时间。\n③ 答题重点：分别讨论形核和长大，并说明尺寸与分布。只写“第二相钉扎所以永远抑制”或“第二相增加形核所以永远促进”都不完整。", "keyPoints": "粗颗粒一类情况：变形时粗大且间距较大的颗粒使周围变形不协调，位错聚集、局部畸变强，可提供再结晶形核的有利区域，从而促进形核；细颗粒一类情况：细小弥散颗粒造成的局部形核促进可能较弱，却能有效阻碍位错和晶界迁移，使新晶粒难以长大，因而延迟再结晶、提高完成所需温度或时间；答题重点：分别讨论形核和长大，并说明尺寸与分布...", "mnemonic": "【答题抓手】扣准第二相为何有、时促进再结晶、有时又阻碍再，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "考纲深度细化"}, {"id": "qa_06_37_yf", "num": "06-37", "title": "FCC单晶体典型加工硬化曲线的三个阶段及机制是什么？", "name": "06-37 FCC单晶体典型加工硬化曲线的三个阶段及机制是什么？", "chapter": "ch6", "section": "教材p.153—154｜正文原标号：①—③（正文分条）", "freq": "叶飞正文分条", "def": "① 第Ⅰ阶段，易滑移阶段：主要启动一组有利滑移系，位错相互干扰较少，硬化率较低。\n② 第Ⅱ阶段，线性硬化阶段：多个滑移系启动，位错交互作用、缠结和胞状结构增加，硬化率高，曲线近似直线。\n③ 第Ⅲ阶段，抛物线型硬化阶段：交滑移有利于位错绕过障碍，异号位错可抵消，动态回复使硬化率逐渐降低。", "keyPoints": "① 第Ⅰ阶段，易滑移阶段：主要启动一组有利滑移系，位错相互干扰较少，硬化率较低；② 第Ⅱ阶段，线性硬化阶段：多个滑移系启动，位错交互作用、缠结和胞状结构增加，硬化率高，曲线近似直线；③ 第Ⅲ阶段，抛物线型硬化阶段：交滑移有利于位错绕过障碍，异号位错可抵消，动态回复使硬化率逐渐降低。", "pitfall": "硬化率降低不等于材料强度已经下降。阶段长度和明显程度与层错能、晶体结构、取向及温度有关。", "mnemonic": ""}, {"id": "qa_06_38_yf", "num": "06-38", "title": "单晶体与多晶体的加工硬化有何区别？", "name": "06-38 单晶体与多晶体的加工硬化有何区别？", "chapter": "ch6", "section": "教材p.153—154｜正文原标号：（1）（2）（正文分条）", "freq": "叶飞正文分条", "def": "① 单晶体：适当取向下可先出现较明显的单滑移及易滑移阶段，再进入多滑移硬化和回复较强阶段。\n② 多晶体：各晶粒取向不同且相互约束，常需多滑移协调变形，易滑移阶段通常不明显，硬化较强。", "keyPoints": "① 单晶体：适当取向下可先出现较明显的单滑移及易滑移阶段，再进入多滑移硬化和回复较强阶段；② 多晶体：各晶粒取向不同且相互约束，常需多滑移协调变形，易滑移阶段通常不明显，硬化较强。", "pitfall": "教材还讨论固溶体和多相合金的复杂情况；不要把纯金属单晶体三阶段图不加条件地套到所有合金。", "mnemonic": ""}, {"id": "qa_06_39_yf", "num": "06-39", "title": "按第二相尺寸，两相合金可分为哪两类？", "name": "06-39 按第二相尺寸，两相合金可分为哪两类？", "chapter": "ch6", "section": "教材p.154—155｜正文原标号：①②（正文分条）", "freq": "叶飞正文分条", "def": "① 复合型合金：第二相尺寸与基体晶粒尺寸属于同一数量级，常以较大颗粒或颗粒聚集体存在。\n② 弥散型合金：第二相细小，并弥散分布于基体晶粒内部，能有效阻碍位错运动。", "keyPoints": "① 复合型合金：第二相尺寸与基体晶粒尺寸属于同一数量级，常以较大颗粒或颗粒聚集体存在；② 弥散型合金：第二相细小，并弥散分布于基体晶粒内部，能有效阻碍位错运动。", "pitfall": "分类依据是第二相相对尺寸与分布，不能把“有第二相”直接等同于“弥散强化”。", "mnemonic": ""}, {"id": "qa_06_40_yf", "num": "06-40", "title": "硬脆第二相的形状和分布如何影响两相合金性能？", "name": "06-40 硬脆第二相的形状和分布如何影响两相合金性能？", "chapter": "ch6", "section": "教材p.155｜正文原标号：①—③（正文分条）", "freq": "叶飞正文分条", "def": "① 连续网状：硬脆相沿晶界包围、分割塑性基体，容易沿晶开裂；网越连续、含量越高，塑性越差，强度也可能下降。\n② 层片状：如珠光体，界面限制位错运动；片层细化通常提高强度，并使变形更均匀。\n③ 较粗颗粒状：如球化渗碳体，连续基体容易变形，较层片或网状组织强度、硬度降低，塑性和韧性改善。", "keyPoints": "① 连续网状：硬脆相沿晶界包围、分割塑性基体，容易沿晶开裂；网越连续、含量越高，塑性越差，强度也可能下降；② 层片状：如珠光体，界面限制位错运动；片层细化通常提高强度，并使变形更均匀；③ 较粗颗粒状：如球化渗碳体，连续基体容易变形，较层片或网状组织强度、硬度降低，塑性和韧性改善。", "pitfall": "核对提醒：本页网状渗碳体例子的晶界名称不严谨；过共析钢先共析渗碳体形成时主要沿原奥氏体晶界，参见p.223。", "mnemonic": ""}, {"id": "qa_06_41_yf", "num": "06-41", "title": "位错切过可变形第二相颗粒时，教材列出哪些强化因素？", "name": "06-41 位错切过可变形第二相颗粒时，教材列出哪些强化因素？", "chapter": "ch6", "section": "教材p.156｜正文原标号：①—⑥（正文分条）", "freq": "叶飞正文分条", "def": "① 错排能：颗粒与基体结构不同，切割造成原子错排，需要额外能量。\n② 反相畴界能：切过有序颗粒产生反相畴界，对应有序强化。\n③ 表面能：切割在颗粒表面留下台阶，增加表面能，对应教材所称化学强化。\n④ 层错能：颗粒与基体层错能不同，改变扩展位错能量，产生层错强化。\n⑤ 弹性模量差异：改变位错能量及线张力，产生模量强化。\n⑥ 晶格常数差异：共格错配产生应力场，阻碍位错运动，产生共格强化。", "keyPoints": "① 错排能：颗粒与基体结构不同，切割造成原子错排，需要额外能量；② 反相畴界能：切过有序颗粒产生反相畴界，对应有序强化；③ 表面能：切割在颗粒表面留下台阶，增加表面能，对应教材所称化学强化；④ 层错能：颗粒与基体层错能不同，改变扩展位错能量，产生层错强化；⑤ 弹性模量差异：改变位错能量及线张力，产生模量强化；⑥ 晶格常数差异：共格错配产生应力场，阻碍位错运动，产生共格强化。", "pitfall": "这是六点题，不能仅写“颗粒阻碍位错”。具体颗粒未必同时具有同等显著的全部六种贡献。", "mnemonic": ""}, {"id": "qa_06_42_yf", "num": "06-42", "title": "回复过程有哪些特征？", "name": "06-42 回复过程有哪些特征？", "chapter": "ch6", "section": "教材p.157｜正文原标号：①—④（正文分条）", "freq": "叶飞正文分条", "def": "① 晶粒形貌没有明显改变，仍保留冷变形后伸长的晶粒。\n② 力学性能变化较小，强度和硬度略降、塑性略升；电阻等物理性能可明显恢复。\n③ 位错数量减少，位错组态可调整。\n④ 变形产生的内应力部分消除。", "keyPoints": "① 晶粒形貌没有明显改变，仍保留冷变形后伸长的晶粒；② 力学性能变化较小，强度和硬度略降、塑性略升；电阻等物理性能可明显恢复；③ 位错数量减少，位错组态可调整；④ 变形产生的内应力部分消除。", "pitfall": "“无明显形貌变化”不等于内部缺陷完全不变。回复可用于去应力退火，驱动力是形变储能。", "mnemonic": ""}, {"id": "qa_06_43_yf", "num": "06-43", "title": "低温、中温、高温回复的主要机制分别是什么？", "name": "06-43 低温、中温、高温回复的主要机制分别是什么？", "chapter": "ch6", "section": "教材p.158｜正文原标号：①—③（正文分条）", "freq": "叶飞正文分条", "def": "① 低温回复：约为熔点绝对温度的0.1—0.3倍，主要发生点缺陷迁移、复合、消失或聚集。\n② 中温回复：约为熔点绝对温度的0.3—0.5倍，除点缺陷变化外，位错可滑移、重排及异号抵消。\n③ 高温回复：教材以约0.5倍熔点绝对温度以上讨论，位错滑移和攀移形成小角度亚晶界，多边形化是主要机制。", "keyPoints": "① 低温回复：约为熔点绝对温度的0.1—0.3倍，主要发生点缺陷迁移、复合、消失或聚集；② 中温回复：约为熔点绝对温度的0.3—0.5倍，除点缺陷变化外，位错可滑移、重排及异号抵消；③ 高温回复：教材以约0.5倍熔点绝对温度以上讨论，位错滑移和攀移形成小角度亚晶界，多边形化是主要机制。", "pitfall": "温度比例必须使用K；分区是教材的概括，不能当作任何材料都精确相同的界限。", "mnemonic": ""}, {"id": "qa_06_44_yf", "num": "06-44", "title": "再结晶有哪两类形核机制？", "name": "06-44 再结晶有哪两类形核机制？", "chapter": "ch6", "section": "教材p.159｜正文原标号：（1）（2）（正文分条）", "freq": "叶飞正文分条", "def": "① 晶界凸出形核：变形量较小时，晶粒间储能不均，低储能一侧的晶界向高储能一侧凸出，逐步形成并长大为再结晶晶粒。\n② 亚晶形核：变形量较大时，回复形成亚晶；通过相邻亚晶合并或亚晶直接长大，使边界逐步变成可迁移的大角度晶界。", "keyPoints": "① 晶界凸出形核：变形量较小时，晶粒间储能不均，低储能一侧的晶界向高储能一侧凸出，逐步形成并长大为再结晶晶粒；② 亚晶形核：变形量较大时，回复形成亚晶；通过相邻亚晶合并或亚晶直接长大，使边界逐步变成可迁移的大角度晶界。", "pitfall": "两者都是在原变形组织基础上的形核过程，不是凭空生成一种新的化学相。", "mnemonic": ""}, {"id": "qa_07_01", "num": "07-01", "chapter": "ch7", "name": "07-01 韧性断裂与脆性断裂在变形、裂纹扩展和断口上有何区别？", "title": "韧性断裂与脆性断裂在变形、裂纹扩展和断口上有何区别？", "section": "叶 pp.168–172；正文。", "def": "① 韧性断裂前通常有明显塑性变形，裂纹扩展常需继续增加外功，断口可见韧窝。\n② 脆性断裂塑性变形较小，裂纹可能快速失稳扩展，解理时常见解理面和河流花样。宏观变形小不代表裂尖绝无微观塑性。\n③ 沿晶断裂也不能简单等同于解理。", "keyPoints": "韧性断裂前通常有明显塑性变形，裂纹扩展常需继续增加外功，断口可见韧窝；脆性断裂塑性变形较小，裂纹可能快速失稳扩展，解理时常见解理面和河流花样；宏观变形小不代表裂尖绝无微观塑性；沿晶断裂也不能简单等同于解理", "mnemonic": "【记忆口诀】塑性宏观微孔连，韧窝纤维延性断；解理河流沿晶裂，平整无形脆性断。", "pitfall": "宏观变形小不代表裂尖绝无微观塑性。", "freq": "核心考点"}, {"id": "qa_07_02", "num": "07-02", "chapter": "ch7", "name": "07-02 韧窝与解理断口分别反映什么机制？", "title": "韧窝与解理断口分别反映什么机制？", "section": "叶 pp.169–172；正文。", "def": "① 韧窝来自微孔在夹杂或第二相附近形核、长大并聚合。\n② 解理来自沿特定晶面结合断开形成较平坦晶面。韧窝形状可受应力状态和剪切影响。\n③ 河流花样与解理台阶汇合有关。判断断裂机制需结合宏观形貌、微观特征及载荷历史。", "keyPoints": "韧窝来自微孔在夹杂或第二相附近形核、长大并聚合；解理来自沿特定晶面结合断开形成较平坦晶面；韧窝形状可受应力状态和剪切影响；河流花样与解理台阶汇合有关；判断断裂机制需结合宏观形貌、微观特征及载荷历史", "mnemonic": "【记忆口诀】格里菲斯能量衡，弹性释放耗表面；临界应力裂纹反，尖锐缺陷最危险。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_07_03", "num": "07-03", "chapter": "ch7", "name": "07-03 沿晶断裂与穿晶断裂有什么区别？", "title": "沿晶断裂与穿晶断裂有什么区别？", "section": "叶 pp.169–172；正文。", "def": "沿晶裂纹主要沿晶界扩展，常与晶界弱化、偏聚、腐蚀或高温损伤有关；穿晶裂纹穿过晶粒内部，可表现为解理或微孔聚合等机制。", "keyPoints": "沿晶裂纹主要沿晶界扩展，常与晶界弱化、偏聚、腐蚀或高温损伤有关；穿晶裂纹穿过晶粒内部，可表现为解理或微孔聚合等机制；裂纹路径分类与“韧—脆”分类不同，不能把穿晶一律判为脆性", "mnemonic": "【记忆口诀】应力强度因子K，表征尖端应力场；临界抗力断裂韧，小于韧度保安全。", "pitfall": "裂纹路径分类与“韧—脆”分类不同，不能把穿晶一律判为脆性。", "freq": "核心考点"}, {"id": "qa_07_04", "num": "07-04", "chapter": "ch7", "name": "07-04 什么是应力集中？哪些几何因素会使其加剧？", "title": "什么是应力集中？哪些几何因素会使其加剧？", "section": "叶 pp.172–174；第8章习题1。", "def": "孔洞、缺口、截面突变或裂纹使局部应力高于名义应力，称应力集中。尖端越尖锐、曲率半径越小、裂纹尺寸越大，通常局部集中越严重；圆滑过渡可减轻。\n【教材第8章第1题】应力集中指物体中应力局部增高的现象，一般出现在物体形状急剧变化的地方。", "keyPoints": "孔洞、缺口、截面突变或裂纹使局部应力高于名义应力，称应力集中；尖端越尖锐、曲率半径越小、裂纹尺寸越大，通常局部集中越严重；圆滑过渡可减轻；理论应力集中系数与断裂力学的应力强度因子不是同一个量", "mnemonic": "【记忆口诀】交变应力循环疲，低于屈服仍破裂；疲劳源萌辉纹展，最终失稳瞬断绝。", "pitfall": "理论应力集中系数与断裂力学的应力强度因子不是同一个量。", "freq": "核心考点"}, {"id": "qa_07_05", "num": "07-05", "chapter": "ch7", "name": "07-05 为什么实际脆性强度远低于理论强度？", "title": "为什么实际脆性强度远低于理论强度？", "section": "叶 pp.172–174；正文。", "def": "理论强度假设较理想完整结构，而实际材料含表面或内部裂纹、孔隙等缺陷。裂尖放大局部应力，使宏观较低应力即可破坏局部结合并扩展；尺寸效应还使大体积材料更可能包含危险缺陷。", "keyPoints": "理论强度假设较理想完整结构，而实际材料含表面或内部裂纹、孔隙等缺陷；裂尖放大局部应力，使宏观较低应力即可破坏局部结合并扩展；尺寸效应还使大体积材料更可能包含危险缺陷", "mnemonic": "【记忆口诀】恒载高温持续长，蠕变三阶速率迁；晶界滑移空位散，单晶合金抗蠕变。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_07_06", "num": "07-06", "chapter": "ch7", "name": "07-06 解理为何优先发生在某些晶面？是否一定是密排面？", "title": "解理为何优先发生在某些晶面？是否一定是密排面？", "section": "叶 pp.169–174；第8章习题2。", "def": "裂纹倾向选择产生新表面的能量代价较低、断键方式有利且受力条件合适的晶面。不能把解理面与滑移密排面直接等同，例如 BCC 金属常见解理，而常见滑移面为等。应依据具体结构讨论断键与表面能。\n【教材第8章第2题】当晶体材料脆性断裂时，若晶面承受的拉伸应力超过晶面间的结合力，裂纹会沿着晶面扩展，使晶面分离形成光滑断口，称为解理。解理面一般平行于晶体低指数密排面，因为垂直密排面方向上成键数较少、面间距较大、面间结合较弱。", "keyPoints": "裂纹倾向选择产生新表面的能量代价较低、断键方式有利且受力条件合适的晶面；不能把解理面与滑移密排面直接等同，例如 BCC 金属常见解理，而常见滑移面为等；应依据具体结构讨论断键与表面能", "mnemonic": "【答题抓手】扣准解理为何优先、发生在某些晶、面是否一定是，紧扣物理机制与适用条件展开", "pitfall": "不能把解理面与滑移密排面直接等同，例如 BCC 金属常见解理，而常见滑移面为等。", "freq": "核心考点"}, {"id": "qa_07_07", "num": "07-07", "chapter": "ch7", "name": "07-07 应力强度因子与断裂韧度分别是什么？怎样判断失稳？", "title": "应力强度因子与断裂韧度分别是什么？怎样判断失稳？", "section": "叶 pp.172–176；第8章习题3、4。", "def": "① 应力强度因子：对规定Ⅰ型几何，常写，表征裂尖附近线弹性应力场幅度。Y是几何因子，σ是相应名义应力，a必须按该解定义为半长、深度或其他裂纹尺寸，不能见到长度就代入。\n② 断裂韧度：是满足平面应变及试样尺寸等有效条件时，材料抵抗Ⅰ型裂纹失稳的临界值。它不是载荷本身，单位为应力乘长度平方根；实际测量与温度、速率、材料方向和组织状态相关。\n③ 判断：在该准则适用时比较与临界值。名义应力低于屈服强度也可能因裂纹足够大而失稳；反之，未达到K临界不表示所有其他失效模式都安全。大范围塑性等情况不能无条件套用线弹性模型。\n【教材第8章第3题】不相同。A 板为 K = σ√(πa)；B 板为 K = 2σ√(π·a/2) = √2 σ√(πa)。", "keyPoints": "应力强度因子：对规定Ⅰ型几何，常写，表征裂尖附近线弹性应力场幅度； Y是几何因子，σ是相应名义应力，a必须按该解定义为半长、深度或其他裂纹尺寸，不能见到长度就代入；断裂韧度：是满足平面应变及试样尺寸等有效条件时，材料抵抗Ⅰ型裂纹失稳的临界值...", "mnemonic": "【答题抓手】扣准应力强度因子、与断裂韧度分、别是什么怎样，紧扣物理机制与适用条件展开", "pitfall": "Y是几何因子，σ是相应名义应力，a必须按该解定义为半长、深度或其他裂纹尺寸，不能见到长度就代入。", "freq": "核心考点"}, {"id": "qa_07_08", "num": "07-08", "chapter": "ch7", "name": "07-08 裂纹尺寸与允许应力有什么关系？为什么高强材料仍可能突然断裂？", "title": "裂纹尺寸与允许应力有什么关系？为什么高强材料仍可能突然断裂？", "section": "叶 pp.172–176；正文。", "def": "① 给定断裂韧度 K_IC 和构件几何时，允许工作应力大致与 1/√a 成正比（σ = K_IC / [Y√(πa)]），裂纹尺寸 a 越大越危险。\n② 高屈服强度不保证高断裂韧度；含深裂纹的高强构件可在远未达到整体屈服应力时发生低应力脆断。\n③ 工程设计需同时核算屈服准则与断裂力学准则。", "keyPoints": "给定断裂韧度 K_IC 和构件几何时，允许工作应力大致与 1/√a 成正比（σ = K_IC / [Y√(πa)]），裂纹尺寸 a 越大越危险；高屈服强度不保证高断裂韧度；含深裂纹的高强构件可在远未达到整体屈服应力时发生低应力脆断；工程设计需同时核算屈服准则与断裂力学准则", "mnemonic": "【答题抓手】扣准裂纹尺寸与允、许应力有什么、关系高强材料，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_07_09", "num": "07-09", "chapter": "ch7", "name": "07-09 平面应力与平面应变对断裂有什么影响？", "title": "平面应力与平面应变对断裂有什么影响？", "section": "叶 pp.174–176；正文。", "def": "薄板表面厚向应力易释放，较接近平面应力，裂尖塑性区通常较大；厚板中部厚向变形受约束，较接近平面应变，三轴约束增强，抗裂塑性耗能较受限。", "keyPoints": "薄板表面厚向应力易释放，较接近平面应力，裂尖塑性区通常较大；厚板中部厚向变形受约束，较接近平面应变，三轴约束增强，抗裂塑性耗能较受限；测试需满足厚度及尺寸有效性条件，不能任意用薄片测值代表它", "mnemonic": "【答题抓手】扣准平面应力与平、面应变对断裂、有什么影响，紧扣物理机制与适用条件展开", "pitfall": "测试需满足厚度及尺寸有效性条件，不能任意用薄片测值代表它。", "freq": "核心考点"}, {"id": "qa_07_10", "num": "07-10", "chapter": "ch7", "name": "07-10 影响断裂韧性和韧脆转变的因素有哪些？", "title": "影响断裂韧性和韧脆转变的因素有哪些？", "section": "叶 pp.174–176；正文。", "def": "温度、应变速率、晶体结构、晶粒尺寸、杂质、缺口、厚度及应力状态均会影响。降温、提高速率或约束程度，通常有利于脆性行为；某些 BCC 材料存在明显韧脆转变，FCC 金属通常不表现同样明显转变。", "keyPoints": "温度、应变速率、晶体结构、晶粒尺寸、杂质、缺口、厚度及应力状态均会影响；降温、提高速率或约束程度，通常有利于脆性行为；某些 BCC 材料存在明显韧脆转变，FCC 金属通常不表现同样明显转变；需说明“通常”，并避免对所有材料泛化", "mnemonic": "【答题抓手】扣准影响断裂韧性、和韧脆转变的、因素有哪些，紧扣物理机制与适用条件展开", "pitfall": "需说明“通常”，并避免对所有材料泛化。", "freq": "核心考点"}, {"id": "qa_07_11", "num": "07-11", "chapter": "ch7", "name": "07-11 什么是疲劳？为什么应力低于屈服强度也可能失效？", "title": "什么是疲劳？为什么应力低于屈服强度也可能失效？", "section": "叶 pp.177–181；正文。", "def": "疲劳是在循环载荷下局部损伤累积，经历裂纹萌生、稳定扩展及最终瞬断的失效。", "keyPoints": "疲劳是在循环载荷下局部损伤累积，经历裂纹萌生、稳定扩展及最终瞬断的失效；即使名义应力较低，局部缺陷或滑移区域仍可能产生反复塑性与裂纹增长；不能用一次静载安全就证明无限次循环安全", "mnemonic": "【答题抓手】扣准什么是疲劳应、力低于屈服强、度也可能失效，紧扣物理机制与适用条件展开", "pitfall": "即使名义应力较低，局部缺陷或滑移区域仍可能产生反复塑性与裂纹增长；不能用一次静载安全就证明无限次循环安全。", "freq": "核心考点"}, {"id": "qa_07_12", "num": "07-12", "chapter": "ch7", "name": "07-12 循环载荷有哪些形式？平均应力、幅值和应力比如何定义？", "title": "循环载荷有哪些形式？平均应力、幅值和应力比如何定义？", "section": "叶 pp.178–179；第8章习题5、6。", "def": "① 循环载荷可分对称循环、脉动循环或一般非对称循环及随机载荷。平均应力 σ_m = (σ_max + σ_min)/2，应力幅值 σ_a = (σ_max - σ_min)/2，应力比 R = σ_min/σ_max。对称循环时 R = -1。\n② 脉动拉伸循环时 R = 0。\n③ 应力范围为 Δσ = σ_max - σ_min = 2σ_a。\n【教材第8章第5题】非对称循环变应力、脉动循环变应力和对称循环变应力。", "keyPoints": "循环载荷可分对称循环、脉动循环或一般非对称循环及随机载荷；平均应力 σ_m = (σ_max + σ_min)/2，应力幅值 σ_a = (σ_max - σ_min)/2，应力比 R = σ_min/σ_max；对称循环时 R = -1；脉动拉伸循环时 R = 0；应力范围为 Δσ = σ_max - σ_min = 2σ_a", "mnemonic": "【答题抓手】扣准循环载荷有哪、些形式平均应、幅值和应力比，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_07_13", "num": "07-13", "chapter": "ch7", "name": "07-13 S–N 曲线、疲劳极限、疲劳强度和疲劳寿命有什么区别？", "title": "S–N 曲线、疲劳极限、疲劳强度和疲劳寿命有什么区别？", "section": "叶 pp.179–180；第8章习题7。", "def": "① S–N曲线：在规定载荷形式、应力比、表面、环境及失效标准下，记录应力水平与失效循环次数的关系；横轴常用循环次数的对数。对应某一固定应力读取N，是疲劳寿命；给定目标循环数反查应力，是相应疲劳强度。\n② 疲劳极限：某些材料在试验长寿命区呈近似水平的平台，可在规定意义下讨论疲劳极限；许多有色合金没有明确水平平台，必须报指定循环数的疲劳强度。\n【教材第8章第7题】对于一些材料，S-N 曲线在 N 值很高时为水平状，即存在一个极限应力水平，该极限水平被称为疲劳极限。很多材料没有疲劳极限。", "keyPoints": "不能认为任何材料都存在一个“低于它绝对永不坏”的常数", "mnemonic": "【答题抓手】扣准曲线、疲劳极限、疲劳强度和疲，紧扣物理机制与适用条件展开", "pitfall": "不能认为任何材料都存在一个“低于它绝对永不坏”的常数；腐蚀、载荷序列、残余应力及超长寿命机制等可能改变结果。读图前也要确认纵轴是应力幅、最大应力还是其他应力指标。", "freq": "核心考点"}, {"id": "qa_07_14", "num": "07-14", "chapter": "ch7", "name": "07-14 疲劳裂纹为什么常从表面萌生？典型断口有何特征？", "title": "疲劳裂纹为什么常从表面萌生？典型断口有何特征？", "section": "叶 pp.180–181；正文。", "def": "表面存在加工痕迹、缺口、腐蚀坑和较少约束，循环滑移可形成挤出、侵入，因而常成为萌生位置。", "keyPoints": "表面存在加工痕迹、缺口、腐蚀坑和较少约束，循环滑移可形成挤出、侵入，因而常成为萌生位置；断口可分疲劳源、扩展区和最终瞬断区；宏观海滩纹反映载荷变化形成的扩展痕迹，微观疲劳条带则是另一尺度，不能把二者一概等同", "mnemonic": "【答题抓手】扣准疲劳裂纹常从、表面萌生典型、断口有何特征，紧扣物理机制与适用条件展开", "pitfall": "断口可分疲劳源、扩展区和最终瞬断区；宏观海滩纹反映载荷变化形成的扩展痕迹，微观疲劳条带则是另一尺度，不能把二者一概等同。", "freq": "核心考点"}, {"id": "qa_07_15", "num": "07-15", "chapter": "ch7", "name": "07-15 平均应力、表面状态、尺寸和环境如何影响疲劳？", "title": "平均应力、表面状态、尺寸和环境如何影响疲劳？", "section": "叶 pp.180–181；正文。", "def": "① 其他条件相近时，拉伸平均应力通常不利，压缩平均应力常有利。\n② 粗糙表面、缺口、腐蚀与较大缺陷增加裂纹萌生和扩展风险。\n③ 大尺寸构件的危险缺陷概率及受力梯度也不同。疲劳数据必须对应相近的载荷比、环境和表面条件。", "keyPoints": "其他条件相近时，拉伸平均应力通常不利，压缩平均应力常有利；粗糙表面、缺口、腐蚀与较大缺陷增加裂纹萌生和扩展风险；大尺寸构件的危险缺陷概率及受力梯度也不同；疲劳数据必须对应相近的载荷比、环境和表面条件", "mnemonic": "【答题抓手】扣准平均应力、表面状态、尺寸和环境影，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_07_16", "num": "07-16", "chapter": "ch7", "name": "07-16 喷丸为什么能提高疲劳寿命？有哪些条件限制？", "title": "喷丸为什么能提高疲劳寿命？有哪些条件限制？", "section": "叶 p.181；第8章习题8。", "def": "喷丸造成表层塑性变形，内部约束使表层形成残余压应力，降低循环中的有效拉应力与裂纹张开倾向；表面加工硬化也可发挥作用。若喷丸过度造成粗糙或损伤，或高温使残余应力松弛，效果会下降。\n【教材第8章第8题】喷丸处理使外表面区域发生局域塑性变形并引入残余压应力，表面压应力会抑制表面裂纹的萌生。", "keyPoints": "喷丸造成表层塑性变形，内部约束使表层形成残余压应力，降低循环中的有效拉应力与裂纹张开倾向；表面加工硬化也可发挥作用；若喷丸过度造成粗糙或损伤，或高温使残余应力松弛，效果会下降；不能只答“增加硬度”而漏掉残余压应力", "mnemonic": "【答题抓手】扣准喷丸能提高疲、劳寿命有哪些、条件限制，紧扣物理机制与适用条件展开", "pitfall": "不能只答“增加硬度”而漏掉残余压应力。", "freq": "核心考点"}, {"id": "qa_07_17", "num": "07-17", "chapter": "ch7", "name": "07-17 什么是蠕变？典型三阶段各有什么特点？", "title": "什么是蠕变？典型三阶段各有什么特点？", "section": "叶 pp.182–184；第8章习题9。", "def": "① 恒定应力及一定温度下，应变随时间增加称蠕变。初生阶段速率下降，硬化逐渐增强。\n② 稳态阶段硬化与回复等竞争达到近似平衡，速率近恒定。\n③ 加速阶段孔洞、晶界损伤、截面减小等使速率升高，最终断裂。实际材料未必完整呈现三个阶段。\n【教材第8章第9题】减速蠕变阶段、恒定蠕变阶段和加速蠕变阶段。", "keyPoints": "恒定应力及一定温度下，应变随时间增加称蠕变；初生阶段速率下降，硬化逐渐增强；稳态阶段硬化与回复等竞争达到近似平衡，速率近恒定；加速阶段孔洞、晶界损伤、截面减小等使速率升高，最终断裂；实际材料未必完整呈现三个阶段", "mnemonic": "【答题抓手】扣准什么是蠕变典、型三阶段各有、什么特点，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_07_18", "num": "07-18", "chapter": "ch7", "name": "07-18 温度、应力和组织如何影响蠕变？怎样提高抗蠕变能力？", "title": "温度、应力和组织如何影响蠕变？怎样提高抗蠕变能力？", "section": "叶 pp.182–184；正文。", "def": "① 升温和提高应力通常加快蠕变。\n② 扩散、位错攀移及晶界滑移在不同区间起作用。提高高温组织稳定性、采用稳定弥散相、合适合金化及减少不利晶界可改善性能。\n③ 高温条件下粗晶或单晶有时有利。", "keyPoints": "升温和提高应力通常加快蠕变；扩散、位错攀移及晶界滑移在不同区间起作用；提高高温组织稳定性、采用稳定弥散相、合适合金化及减少不利晶界可改善性能；高温条件下粗晶或单晶有时有利；不能直接套用室温细晶强化排序", "mnemonic": "【答题抓手】扣准温度、应力和组织影、响蠕变怎样提，紧扣物理机制与适用条件展开", "pitfall": "不能直接套用室温细晶强化排序。", "freq": "核心考点"}, {"id": "qa_07_19", "num": "07-19", "chapter": "ch7", "name": "07-19 疲劳与蠕变的控制变量和设计指标有什么不同？", "title": "疲劳与蠕变的控制变量和设计指标有什么不同？", "section": "叶 pp.177–184；正文衍生。", "def": "疲劳重点关注循环幅值、平均应力、循环次数及裂纹扩展；蠕变重点关注持续应力、温度、时间、稳态速率及持久寿命。", "keyPoints": "疲劳重点关注循环幅值、平均应力、循环次数及裂纹扩展；蠕变重点关注持续应力、温度、时间、稳态速率及持久寿命；高温循环工况可出现疲劳—蠕变交互作用，不能简单把两种独立寿命中较大者作为安全寿命", "mnemonic": "【答题抓手】扣准疲劳与蠕变的、控制变量和设、计指标有什么，紧扣物理机制与适用条件展开", "pitfall": "高温循环工况可出现疲劳—蠕变交互作用，不能简单把两种独立寿命中较大者作为安全寿命。", "freq": "核心考点"}, {"id": "qa_07_D01", "num": "07-20", "chapter": "ch7", "name": "07-20 为什么尖裂纹比圆孔更危险？应力集中系数能直接代替应力强度因子吗？", "title": "为什么尖裂纹比圆孔更危险？应力集中系数能直接代替应力强度因子吗？", "section": "叶 pp.172–174；正文比较细分。", "def": "① 几何原因：尖裂纹尖端曲率半径很小，外加载荷难以通过平缓路径传递，局部应力高度集中；圆孔边缘较圆滑，其应力放大程度通常有限。\n② 两个量不同：应力集中系数是局部最大应力与名义应力之比，通常无量纲；应力强度因子表征理想裂尖附近应力场幅度，常含，单位为应力乘长度平方根。", "keyPoints": "尖裂纹尖端曲率半径很小，外加载荷难以通过平缓路径传递，局部应力高度集中", "mnemonic": "【答题抓手】扣准尖裂纹比圆孔、更危险应力集、中系数能直接，紧扣物理机制与适用条件展开", "pitfall": "不能混用：理想尖裂纹线弹性解在尖端出现奇异性，不能只用一个有限最大应力代替整套断裂判据。判断危险性还需裂纹方向、载荷方式、材料韧度及有效几何条件。", "freq": "考纲深度细化"}, {"id": "qa_07_D02", "num": "07-21", "chapter": "ch7", "name": "07-21 两个裂纹长度和外加应力不同的板，如何比较裂尖危险性？", "title": "两个裂纹长度和外加应力不同的板，如何比较裂尖危险性？", "section": "叶 p.184 第8章习题3；pp.172–174为依据。", "def": "① 先统一定义：设 A 板总裂纹长为 2a，B 板总长为 a，外加应力分别为 σ、2σ。公式所用裂纹半长分别为 a_A = a、a_B = a/2。\n② 同几何无限大板模型比较：\n   - A 板应力强度因子：K_A = σ·√(π·a)；\n   - B 板应力强度因子：K_B = 2σ·√(π·a/2) = √2·σ·√(π·a) = √2·K_A > K_A，故 B 板裂尖应力场更强、更危险。\n③ 物理原因：外加应力按一次方直接影响 K，而裂纹半长仅按平方根影响 K；应力加倍带来的危险性增加不能被裂纹长度减半完全抵消。\n【教材第8章第3题】不相同。A 板为 K = σ√(πa)；B 板为 K = 2σ√(π·a/2) = √2 σ√(πa)。", "keyPoints": "K_A = σ√(πa)，K_B = 2σ√(π·a/2) = √2·K_A > K_A；应力按一次方影响 K，裂纹半长按平方根影响 K，故 B 板更危险", "mnemonic": "【答题抓手】扣准两个裂纹长度、和外加应力不、同的板裂尖危，紧扣物理机制与适用条件展开", "pitfall": "必须将总裂纹长度换算为半长（a 与 a/2）代入，切勿把两者的总长度直接当成半长；且只有材料韧度 K_IC 相同等前提下才可直接由 K 比较相对失稳倾向。", "freq": "考纲深度细化"}, {"id": "qa_07_D03", "num": "07-22", "chapter": "ch7", "name": "07-22 为什么提高静强度不保证疲劳寿命提高？", "title": "为什么提高静强度不保证疲劳寿命提高？", "section": "叶 pp.177–181；正文综合推演。", "def": "① 静载与循环机制不同：屈服或抗拉强度衡量一次加载下的特定响应，疲劳则取决于反复局部塑性、裂纹萌生和随循环扩展。\n② 可能抵消强化收益的因素：提高强度的同时若降低裂纹容限、增加缺口敏感性，或表面粗糙、夹杂、残余拉应力未改善，实际构件疲劳寿命未必随静强度同步提高。\n③ 答题方法：不能只报材料强度大小，还需比较表面、缺陷、载荷比、环境和组织。\n④ 喷丸的典型意义之一是改变表面残余应力，而不是单纯把整个零件的静强度提高到更大数值。", "keyPoints": "静载与循环机制不同：屈服或抗拉强度衡量一次加载下的特定响应，疲劳则取决于反复局部塑性、裂纹萌生和随循环扩展；可能抵消强化收益的因素：提高强度的同时若降低裂纹容限、增加缺口敏感性，或表面粗糙、夹杂、残余拉应力未改善，实际构件疲劳寿命未必随静强度同步提高；答题方法：不能只报材料强度大小，还需比较表面、缺陷、载荷比、环境和组织...", "mnemonic": "【答题抓手】扣准提高静强度不、保证疲劳寿命、提高，紧扣物理机制与适用条件展开", "pitfall": "答题方法：不能只报材料强度大小，还需比较表面、缺陷、载荷比、环境和组织。", "freq": "考纲深度细化"}, {"id": "qa_07_D04", "num": "07-23", "chapter": "ch7", "name": "07-23 蠕变的稳态阶段为何仍可能累积大量永久变形？恒载与恒应力有何差别？", "title": "蠕变的稳态阶段为何仍可能累积大量永久变形？恒载与恒应力有何差别？", "section": "叶 pp.182–184；正文机制细分。", "def": "① 稳态不是不变形：稳态阶段接近不变的是蠕变速率，而不是应变；若速率虽小但持续很久，总蠕变应变仍可很大。\n② 机制：加工硬化抑制位错运动，与高温回复、攀移等软化过程竞争，在一定阶段形成近似动态平衡。\n③ 载荷口径：恒载试验中若截面随变形减小，真实应力会上升，可促进加速蠕变；恒真实应力则需要相应调节载荷。描述第三阶段时应同时考虑组织损伤和几何变化，不能仅用一句“温度越来越高”解释恒温试验中的加速。", "keyPoints": "加工硬化抑制位错运动，与高温回复、攀移等软化过程竞争，在一定阶段形成近似动态平衡", "mnemonic": "【答题抓手】扣准蠕变的稳态阶、段为何仍可能、累积大量永久，紧扣物理机制与适用条件展开", "pitfall": "稳态不是不变形：稳态阶段接近不变的是蠕变速率，而不是应变。", "freq": "考纲深度细化"}, {"id": "qa_07_24_yf", "num": "07-24", "title": "裂纹的三种基本扩展方式及应力强度因子的作用是什么？", "name": "07-24 裂纹的三种基本扩展方式及应力强度因子的作用是什么？", "chapter": "ch7", "section": "教材p.172—174｜正文原标号：（1）—（3）同级条目（正文分条）", "freq": "叶飞正文分条", "def": "① 扩展方式：Ⅰ型为垂直裂纹面的拉应力引起张开；Ⅱ型为裂纹面内剪切引起滑开；Ⅲ型为沿裂纹前缘方向的反平面剪切引起撕开。\n② 裂纹尖端应力场：尖端附近存在强烈应力集中，局部应力受外载荷、裂纹尺寸及几何形状影响。\n③ 应力强度因子：表征裂纹尖端弹性应力场强弱；达到相应断裂韧度时可发生失稳扩展。", "keyPoints": "① 扩展方式：Ⅰ型为垂直裂纹面的拉应力引起张开；Ⅱ型为裂纹面内剪切引起滑开；Ⅲ型为沿裂纹前缘方向的反平面剪切引起撕开；② 裂纹尖端应力场：尖端附近存在强烈应力集中，局部应力受外载荷、裂纹尺寸及几何形状影响；③ 应力强度因子：表征裂纹尖端弹性应力场强弱；达到相应断裂韧度时可发生失稳扩展。", "pitfall": "原文三个编号分别是“扩展方式、尖端应力场、应力强度因子”，不是用（1）—（3）直接标三种裂纹。此处把三项组织为一个完整简答题。", "mnemonic": ""}, {"id": "qa_08_01", "num": "08-01", "chapter": "ch8", "name": "08-01 组元、相、组织组成物及组织有什么区别？", "title": "组元、相、组织组成物及组织有什么区别？", "section": "叶 pp.196–197、216–229；正文。", "def": "① 组元是描述体系组成所需的独立物质。\n② 相是成分和结构等性质均匀、与其他部分有界面分隔的区域。\n③ 组织组成物是按形成过程与显微形貌区分的组织单元，可由一个或多个相组成。", "keyPoints": "组元是描述体系组成所需的独立物质；相是成分和结构等性质均匀、与其他部分有界面分隔的区域；组织组成物是按形成过程与显微形貌区分的组织单元，可由一个或多个相组成；珠光体是铁素体与渗碳体的复相组织，不是一个新相", "mnemonic": "【记忆口诀】相律自度组相加，恒压自由二变一；匀晶凝固两相带，杠杆反比算相分。", "pitfall": "珠光体是铁素体与渗碳体的复相组织，不是一个新相。", "freq": "高频必背"}, {"id": "qa_08_02", "num": "08-02", "chapter": "ch8", "name": "08-02 相平衡和吉布斯相律说明什么？", "title": "相平衡和吉布斯相律说明什么？", "section": "叶 pp.196–197；正文。", "def": "① 相平衡要求各相间所有组元的化学势达到平衡，宏观状态不再发生净相变。吉布斯相律通常写为 F = C - P + 2。\n② 固定压力（凝聚系统）时写为 F = C - P + 1。二元定压系统发生三相平衡（如共晶、共析、包晶）时自由度 F = 2 - 3 + 1 = 0，反应温度和各平衡相成分完全固定。\n③ 合金总成分不同只改变各相的相对量，不违背相律。", "keyPoints": "相平衡要求各相间所有组元的化学势达到平衡，宏观状态不再发生净相变；吉布斯相律通常写为 F = C - P + 2；固定压力（凝聚系统）时写为 F = C - P + 1；二元定压系统发生三相平衡（如共晶、共析、包晶）时自由度 F = 2 - 3 + 1 = 0，反应温度和各平衡相成分完全固定；合金总成分不同只改变各相的相对量，不违背相律", "mnemonic": "【记忆口诀】一液变二固共晶，一固变二固共析；一液一固包晶生，恒温三相水平衡。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_03", "num": "08-03", "chapter": "ch8", "name": "08-03 相图可以告诉什么，不能直接告诉什么？", "title": "相图可以告诉什么，不能直接告诉什么？", "section": "叶 pp.196–204、247；正文。", "def": "给定温度、成分和压力条件，可确定平衡相种类、各相成分及相对量，并推断平衡转变路径。普通平衡相图不能直接给出实际转变所需时间、非平衡产物形貌及冷却速率影响；这些需结合动力学、TTT/CCT 等信息。", "keyPoints": "给定温度、成分和压力条件，可确定平衡相种类、各相成分及相对量，并推断平衡转变路径；普通平衡相图不能直接给出实际转变所需时间、非平衡产物形貌及冷却速率影响；这些需结合动力学、TTT/CCT 等信息", "mnemonic": "【记忆口诀】铁素奥氏渗碳体，珠光共析莱氏共；含碳比例调硬韧，相图规律显清晰。", "pitfall": "普通平衡相图不能直接给出实际转变所需时间、非平衡产物形貌及冷却速率影响。", "freq": "高频必背"}, {"id": "qa_08_04", "num": "08-04", "chapter": "ch8", "name": "08-04 二元相图怎样用实验建立？冷却曲线的拐点和平台表示什么？", "title": "二元相图怎样用实验建立？冷却曲线的拐点和平台表示什么？", "section": "叶 pp.197–199；正文。", "def": "可配制不同成分合金，通过热分析确定转变温度，再结合金相、衍射等辨认相。发生转变时潜热改变冷却速率，出现拐点或停滞；定压三相不变反应常有水平停滞。非平衡过冷、测量误差及传热条件会影响实际曲线。", "keyPoints": "可配制不同成分合金，通过热分析确定转变温度，再结合金相、衍射等辨认相；发生转变时潜热改变冷却速率，出现拐点或停滞；定压三相不变反应常有水平停滞；非平衡过冷、测量误差及传热条件会影响实际曲线", "mnemonic": "【记忆口诀】体积能降界面增，临界尺寸势垒封；过冷度大驱动盛，非均附壁形核灵。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_05", "num": "08-05", "chapter": "ch8", "name": "08-05 如何从自由能曲线理解稳定相、两相共存和公切线？", "title": "如何从自由能曲线理解稳定相、两相共存和公切线？", "section": "叶 pp.200–204；正文。", "def": "在固定温压下，体系趋于最低吉布斯自由能。若分成两个成分不同的相可比单相具有更低自由能，则两相共存；公切线确定两相平衡成分，并体现相应组元化学势相等。", "keyPoints": "在固定温压下，体系趋于最低吉布斯自由能；若分成两个成分不同的相可比单相具有更低自由能，则两相共存；公切线确定两相平衡成分，并体现相应组元化学势相等；总成分位于两端之间时改变相分数，而不是随意改动平衡端点", "mnemonic": "【记忆口诀】过冷度增驱动大，过冷度深扩散慢；两相竞争出峰值，C曲线鼻尖显最快。", "pitfall": "总成分位于两端之间时改变相分数，而不是随意改动平衡端点。", "freq": "高频必背"}, {"id": "qa_08_06", "num": "08-06", "chapter": "ch8", "name": "08-06 液相线、固相线和溶解度线分别表示什么？", "title": "液相线、固相线和溶解度线分别表示什么？", "section": "叶 pp.205–215；正文。", "def": "① 液相线为全液区与液固两相区边界。\n② 固相线为全固区与液固区边界。\n③ 溶解度线为固溶体单相区与含另一固相的两相区边界。冷却越过它们分别可能开始凝固、结束凝固或从固溶体析出第二相。\n④ “固相线”不等于所有固态转变线。", "keyPoints": "液相线为全液区与液固两相区边界；固相线为全固区与液固区边界；溶解度线为固溶体单相区与含另一固相的两相区边界；冷却越过它们分别可能开始凝固、结束凝固或从固溶体析出第二相；“固相线”不等于所有固态转变线", "mnemonic": "【记忆口诀】珠光片层贝针羽，马氏无扩切变生；过冷控制相变态，回火调质得所需。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_07", "num": "08-07", "chapter": "ch8", "name": "08-07 连接线和杠杆定则如何使用？最常见的错误是什么？", "title": "连接线和杠杆定则如何使用？最常见的错误是什么？", "section": "叶 pp.205–214；正文。", "def": "① 杠杆定则标准三步作图法：\n   - 第一步：在相图上根据给定的合金总成分 C_0 与目标温度 T 定位状态点，确认位于两相区；\n   - 第二步：在两相区内作水平等温连接线，与两侧相界线相交，交点横坐标即为平衡两相的化学成分（如液相成分 C_L 与固相成分 C_α）；\n   - 第三步：依据总体组元质量守恒与相分数之和为 1，利用“对侧杠杆线段比”计算两相的相对质量分数。\n② 杠杆计算公式：\n   - 液相质量分数：w_L = (C_α - C_0) / (C_α - C_L)；\n   - 固相质量分数：w_α = (C_0 - C_L) / (C_α - C_L)。\n③ 检验与物理意义：相分数分子取与目标相“相对的相反侧线段长”，分母为连接线全长；总成分 C_0 越靠近哪一相，该相的相对量就越多；两相分数之和必须严格等于 1。", "keyPoints": "定温画水平连接线读取端点成分；杠杆定则相分数取对侧线段：w_L = (C_α-C_0)/(C_α-C_L)，w_α = (C_0-C_L)/(C_α-C_L)；两相分数之和恒为 1", "mnemonic": "【答题抓手】扣准连接线和杠杆、定则使用最常、见的错误是什，紧扣物理机制与适用条件展开", "pitfall": "杠杆定则分子必须取对侧线段，横轴为质量分数时得到的是质量相分数，绝不可不加换算直接称为体积分数；横轴为质量分数时计算出的是质量分数，绝不等于体积分数；单相区内相成分即为总成分，严禁乱用杠杆定则；三相恒温转变线（共晶/共析）必须严格区分“相组成物”与“组织组成物”。", "freq": "高频必背"}, {"id": "qa_08_08", "num": "08-08", "chapter": "ch8", "name": "08-08 匀晶合金平衡凝固时两相成分和相量怎样变化？", "title": "匀晶合金平衡凝固时两相成分和相量怎样变化？", "section": "叶 pp.205–209；正文。", "def": "开始析出的固相成分由同温固相线读出，剩余液相由液相线读出；随温度下降，两相成分沿各自边界变化，相量由杠杆定则变化。平衡条件要求固、液中扩散充分，因此最终固相成分均匀并等于合金总成分。", "keyPoints": "开始析出的固相成分由同温固相线读出，剩余液相由液相线读出；随温度下降，两相成分沿各自边界变化，相量由杠杆定则变化；平衡条件要求固、液中扩散充分，因此最终固相成分均匀并等于合金总成分", "mnemonic": "【答题抓手】扣准匀晶合金平衡、凝固时两相成、分和相量怎样，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_09", "num": "08-09", "chapter": "ch8", "name": "08-09 什么是枝晶偏析？为什么可用均匀化退火减轻？", "title": "什么是枝晶偏析？为什么可用均匀化退火减轻？", "section": "叶 pp.207–209；正文。", "def": "实际凝固中固态扩散来不及充分进行，先凝固和后凝固部分保留不同成分，形成枝晶或晶内偏析。高温均匀化利用固态扩散减小成分差，但应避免局部熔化。", "keyPoints": "实际凝固中固态扩散来不及充分进行，先凝固和后凝固部分保留不同成分，形成枝晶或晶内偏析；高温均匀化利用固态扩散减小成分差，但应避免局部熔化；均匀化改变成分分布，不是把总成分改变成另一数值", "mnemonic": "【答题抓手】扣准什么是枝晶偏、析可用均匀化、退火减轻，紧扣物理机制与适用条件展开", "pitfall": "均匀化改变成分分布，不是把总成分改变成另一数值。", "freq": "高频必背"}, {"id": "qa_08_10", "num": "08-10", "chapter": "ch8", "name": "08-10 共晶、共析和包晶反应如何比较？", "title": "共晶、共析和包晶反应如何比较？", "section": "叶 pp.209–215；第10章习题1、2。", "def": "① 共晶：一个液相转变为两个固相。\n② 共析：一个固相分解为两个固相。\n③ 包晶：液相与一个已有固相反应形成另一固相。\n【教材第10章第1题】共晶转变指一定成分的液体冷却时，同时结晶出一定成分的两个固相。共析转变是指一定成分的固相材料冷却时，同时转变形成一定成分的两个固相。", "keyPoints": "共晶：一个液相转变为两个固相；共析：一个固相分解为两个固相；包晶：液相与一个已有固相反应形成另一固相；二元定压平衡时均为三相不变反应，但参与相态和原子传输路径不同，不能只说“都是三相”", "mnemonic": "【答题抓手】扣准共晶、共析和包晶反，紧扣物理机制与适用条件展开", "pitfall": "二元定压平衡时均为三相不变反应，但参与相态和原子传输路径不同，不能只说“都是三相”。", "freq": "高频必背"}, {"id": "qa_08_11", "num": "08-11", "chapter": "ch8", "name": "08-11 亚共晶、共晶和过共晶合金的组织怎样形成？", "title": "亚共晶、共晶和过共晶合金的组织怎样形成？", "section": "叶 pp.209–214；正文。", "def": "① 亚共晶侧先析出左侧初生相，剩余液体成分移向共晶点，随后形成共晶组织。\n② 共晶成分在理想平衡下整体发生共晶反应。\n③ 过共晶侧先析出右侧初生相，再由剩余液体形成共晶。初生相与共晶中的同名相可属同一个相，但属于不同组织组成物。", "keyPoints": "亚共晶侧先析出左侧初生相，剩余液体成分移向共晶点，随后形成共晶组织；共晶成分在理想平衡下整体发生共晶反应；过共晶侧先析出右侧初生相，再由剩余液体形成共晶；初生相与共晶中的同名相可属同一个相，但属于不同组织组成物", "mnemonic": "【答题抓手】扣准亚共晶、共晶和过共晶、合金的组织怎，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_12", "num": "08-12", "chapter": "ch8", "name": "08-12 共晶组织为何常呈层片或棒状？粗细如何影响性能？", "title": "共晶组织为何常呈层片或棒状？粗细如何影响性能？", "section": "叶 pp.209–214；正文。", "def": "两相协同生长可缩短溶质再分配距离，并满足成分守恒，形成层片或棒状形貌；相对体积分数、界面能和生长条件影响形态。", "keyPoints": "两相协同生长可缩短溶质再分配距离，并满足成分守恒，形成层片或棒状形貌；相对体积分数、界面能和生长条件影响形态；较细组织通常提高强度与硬度，但韧性还与脆性相是否连续及其形貌有关，不能只看层片间距", "mnemonic": "【答题抓手】扣准共晶组织为何、常呈层片或棒、状粗细影响性，紧扣物理机制与适用条件展开", "pitfall": "较细组织通常提高强度与硬度，但韧性还与脆性相是否连续及其形貌有关，不能只看层片间距。", "freq": "高频必背"}, {"id": "qa_08_13", "num": "08-13", "chapter": "ch8", "name": "08-13 包晶反应为什么实际中容易不完全？", "title": "包晶反应为什么实际中容易不完全？", "section": "叶 pp.214–215；第10章习题3。", "def": "新相在原固相与液相接触处形成，随后可能包裹原固相，切断直接接触。继续反应需原子通过新相层扩散，而固态扩散较慢，因此实际冷却中常来不及完成并保留成分或组织不均匀。\n【教材第10章第3题】反应产物包围了反应相，使液相和原来的固相隔离，由于原子在固相中扩散的速度比在液相中慢得多，所以包晶转变的速度很慢。", "keyPoints": "新相在原固相与液相接触处形成，随后可能包裹原固相，切断直接接触；继续反应需原子通过新相层扩散，而固态扩散较慢，因此实际冷却中常来不及完成并保留成分或组织不均匀", "mnemonic": "【答题抓手】扣准包晶反应实际、中容易不完全，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_14", "num": "08-14", "chapter": "ch8", "name": "08-14 铁碳相图为什么通常指 Fe–Fe3C 亚稳相图？", "title": "铁碳相图为什么通常指 Fe–Fe3C 亚稳相图？", "section": "叶 pp.216–219；正文。", "def": "① 碳在铁中既可形成渗碳体 Fe3C，也可形成石墨；石墨在热力学上更稳定，渗碳体属亚稳相。\n② 由于常温常压及常见冷却速率下石墨形核极其困难，动力学上碳通常以 Fe3C 形式析出，因此工程上常采用 Fe–Fe3C 亚稳相图。", "keyPoints": "碳在铁中既可形成渗碳体 Fe3C，也可形成石墨；石墨在热力学上更稳定，渗碳体属亚稳相；由于常温常压及常见冷却速率下石墨形核极其困难，动力学上碳通常以 Fe3C 形式析出，因此工程上常采用 Fe–Fe3C 亚稳相图；只有在极缓慢冷却或高硅铸铁中才需考虑 Fe–C 稳定相图，两张图的转变温度和组织不能混淆", "mnemonic": "【答题抓手】扣准铁碳相图通常、亚稳相图，紧扣物理机制与适用条件展开", "pitfall": "只有在极缓慢冷却或高硅铸铁中才需考虑 Fe–C 稳定相图，两张图的转变温度和组织不能混淆。", "freq": "高频必背"}, {"id": "qa_08_15", "num": "08-15", "chapter": "ch8", "name": "08-15 铁素体、奥氏体和渗碳体的结构、含碳能力及性能如何比较？", "title": "铁素体、奥氏体和渗碳体的结构、含碳能力及性能如何比较？", "section": "叶 p.57、pp.217–218；正文。", "def": "① 铁素体是碳在 BCC 铁中的间隙固溶体，含碳能力小，软、塑性好。\n② 奥氏体是碳在 FCC 铁中的间隙固溶体，溶碳能力大，具有良好高温塑性。\n③ 渗碳体为硬脆化合物。教材最大溶碳量分别为 α 在727℃约0.022%，γ 在1148℃约2.11%。", "keyPoints": "铁素体是碳在 BCC 铁中的间隙固溶体，含碳能力小，软、塑性好；奥氏体是碳在 FCC 铁中的间隙固溶体，溶碳能力大，具有良好高温塑性；渗碳体为硬脆化合物；教材最大溶碳量分别为 α 在727℃约0.022%，γ 在1148℃约2.11%", "mnemonic": "【答题抓手】扣准铁素体、奥氏体和渗碳、体的结构，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_16", "num": "08-16", "chapter": "ch8", "name": "08-16 Fe–Fe3C 图三条水平反应线的温度、成分和反应是什么？", "title": "Fe–Fe3C 图三条水平反应线的温度、成分和反应是什么？", "section": "叶 pp.217–219；第10章习题7。", "def": "按本书铁碳相图：。\n①1495℃包晶反应：L(0.53%C) + δ(0.09%C) → γ(0.17%C)；\n②1148℃共晶反应：L(4.30%C) → γ(2.11%C) + Fe3C(6.69%C)（产物为莱氏体 Ld）；\n③727℃共析反应：γ(0.77%C) → α(0.022%C) + Fe3C(6.69%C)（产物为珠光体 P）。渗碳体碳含量固定取 6.69%C，勿与其他版本（如 6.67% 或 6.70%）混用。\n【教材第10章第7题】① 包晶转变：L + δ ⇌ γ； ② 共晶转变：L ⇌ γ + Fe3C； ③ 共析转变：γ ⇌ α + Fe3C。", "keyPoints": "①1495℃包晶反应：L(0.53%C) + δ(0.09%C) → γ(0.17%C)； ②1148℃共晶反应：L(4.30%C) → γ(2.11%C) + Fe3C(6.69%C)（产物为莱氏体 Ld）； ③727℃共析反应：γ(0.77%C) → α(0.022%C) + Fe3C(6.69%C)（产物为珠光体 P）。渗碳体碳含量固定取 6.69%C，勿与其他版本（如 6.67% 或 6.70%）混用。", "mnemonic": "【答题抓手】扣准图三条水平反、应线的温度、成分和反应是，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_17", "num": "08-17", "chapter": "ch8", "name": "08-17 GS、ES、PSK、PQ、ECF 等线分别控制什么？", "title": "GS、ES、PSK、PQ、ECF 等线分别控制什么？", "section": "叶 pp.217–227；正文。", "def": "① GS 为 γ 与 α+γ 的边界，控制先共析铁素体析出。\n② ES 为 γ 与 γ+ 的边界，控制二次渗碳体析出。\n③ PSK 为共析转变线。\n④ PQ 为碳在铁素体中的溶解度线，涉及三次渗碳体析出。\n⑤ ECF 为共晶水平线。答题优先写物理意义，再对照本书图中点号。", "keyPoints": "GS 为 γ 与 α+γ 的边界，控制先共析铁素体析出；ES 为 γ 与 γ+ 的边界，控制二次渗碳体析出；PSK 为共析转变线；PQ 为碳在铁素体中的溶解度线，涉及三次渗碳体析出；ECF 为共晶水平线；答题优先写物理意义，再对照本书图中点号", "mnemonic": "【答题抓手】扣准等线分别控制、什么，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_18", "num": "08-18", "chapter": "ch8", "name": "08-18 工业纯铁为什么也可能含少量渗碳体？", "title": "工业纯铁为什么也可能含少量渗碳体？", "section": "叶 pp.219–221；第10章习题4。", "def": "工业纯铁不是绝对不含碳；碳在铁素体中的平衡溶解度随降温下降，超过室温溶解度的部分可形成少量三次渗碳体。教材将低于约0.022%C 的相应范围列为工业纯铁，但“只有铁素体”通常是忽略微量析出物的近似。\n【教材第10章第4题】不是，工业纯铁是含碳量不超过 0.0218%（教材取 0.022%）的 Fe 基固溶体。", "keyPoints": "工业纯铁不是绝对不含碳；碳在铁素体中的平衡溶解度随降温下降，超过室温溶解度的部分可形成少量三次渗碳体；教材将低于约0.022%C 的相应范围列为工业纯铁，但“只有铁素体”通常是忽略微量析出物的近似", "mnemonic": "【答题抓手】扣准工业纯铁也可、能含少量渗碳，紧扣物理机制与适用条件展开", "pitfall": "工业纯铁不是绝对不含碳。", "freq": "高频必背"}, {"id": "qa_08_19", "num": "08-19", "chapter": "ch8", "name": "08-19 亚共析钢缓冷时奥氏体怎样转变？室温组织与相组成分别是什么？", "title": "亚共析钢缓冷时奥氏体怎样转变？室温组织与相组成分别是什么？", "section": "叶 pp.221–223；第10章习题8衍生。", "def": "① 先共析阶段：奥氏体在缓冷过程中越过GS线开始析出铁素体。铁素体能容纳的碳很少，析出时将碳向剩余奥氏体排出，因此剩余奥氏体的含碳量沿边界逐渐增大，而不是保持等于合金总碳量。\n② 共析阶段：接近727℃时，剩余奥氏体成分达到约0.77%C，再分解为铁素体与渗碳体协同组成的珠光体；先前析出的铁素体仍保留，所以最终主要组织为先共析铁素体+珠光体。\n③ 两种分类：组织组成物有先共析铁素体和珠光体；相只有铁素体和渗碳体，珠光体不是第三相。更低温时还可能有少量三次渗碳体。求珠光体量先求共析前剩余奥氏体量，求渗碳体总量则使用最终相的连接线；不能把两者混算。\n【教材第10章第8题】冷却路径：L → L+δ → L+γ → γ → γ+α → α+P（α + Fe3C_共析 + P）。 室温相分数：α 相 = (6.69 - 0.45) / (6.69 - 0) = 93.3%；Fe3C 相 = 1 - 93.3% = 6.7%。", "keyPoints": "先共析阶段：奥氏体在缓冷过程中越过GS线开始析出铁素体；铁素体能容纳的碳很少，析出时将碳向剩余奥氏体排出，因此剩余奥氏体的含碳量沿边界逐渐增大，而不是保持等于合金总碳量；共析阶段：接近727℃时，剩余奥氏体成分达到约0.77%C，再分解为铁素体与渗碳体协同组成的珠光体；先前析出的铁素体仍保留，所以最终主要组织为先共析铁素体+珠光体...", "mnemonic": "【答题抓手】扣准亚共析钢缓冷、时奥氏体怎样、转变室温组织，紧扣物理机制与适用条件展开", "pitfall": "铁素体能容纳的碳很少，析出时将碳向剩余奥氏体排出，因此剩余奥氏体的含碳量沿边界逐渐增大，而不是保持等于合金总碳量。", "freq": "高频必背"}, {"id": "qa_08_20", "num": "08-20", "chapter": "ch8", "name": "08-20 共析钢和过共析钢缓冷后的组织有何区别？", "title": "共析钢和过共析钢缓冷后的组织有何区别？", "section": "叶 pp.222–224；正文。", "def": "① 共析钢的奥氏体在共析温度转变为珠光体。\n② 过共析钢先从奥氏体析出先共析渗碳体，剩余奥氏体降碳至共析成分后转为珠光体。过共析钢的先共析渗碳体在缓冷下常沿奥氏体晶界呈网状，易降低韧性。\n③ 其存在不改变室温主要相仍为 α 与。", "keyPoints": "共析钢的奥氏体在共析温度转变为珠光体；过共析钢先从奥氏体析出先共析渗碳体，剩余奥氏体降碳至共析成分后转为珠光体；过共析钢的先共析渗碳体在缓冷下常沿奥氏体晶界呈网状，易降低韧性；其存在不改变室温主要相仍为 α 与", "mnemonic": "【答题抓手】扣准共析钢和过共、析钢缓冷后的、组织有何区别，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_21", "num": "08-21", "chapter": "ch8", "name": "08-21 为什么计算珠光体量和计算渗碳体总量要用不同连接线？", "title": "为什么计算珠光体量和计算渗碳体总量要用不同连接线？", "section": "叶 pp.221–229；第10章习题5、8衍生。", "def": "珠光体是由共析前剩余奥氏体转变而来，先求727℃以上或转变前 γ 的量；渗碳体总量则按最终 α+ 两相的成分守恒求。把珠光体当成一个端点为6.69%C 的单相，会混淆组织分数与相分数。\n【教材第10章第5题】原答案文件列式结果：莱氏体占比 40.6%，珠光体占比 45.9%，共析渗碳体占比 5.2%。", "keyPoints": "珠光体是由共析前剩余奥氏体转变而来，先求727℃以上或转变前 γ 的量；渗碳体总量则按最终 α+ 两相的成分守恒求；把珠光体当成一个端点为6.69%C 的单相，会混淆组织分数与相分数", "mnemonic": "【答题抓手】扣准计算珠光体量、和计算渗碳体、总量要用不同，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_22", "num": "08-22", "chapter": "ch8", "name": "08-22 珠光体内部铁素体与渗碳体比例如何求？", "title": "珠光体内部铁素体与渗碳体比例如何求？", "section": "叶 pp.222–223、247–251；正文。", "def": "取共析总成分0.77%C，以及共析温度下 α 为0.022%C、为6.69%C，用杠杆定则得，约11.2%，其余约88.8%为铁素体。", "keyPoints": "取共析总成分0.77%C，以及共析温度下 α 为0.022%C、为6.69%C，用杠杆定则得，约11.2%，其余约88.8%为铁素体；这里是珠光体内部质量比例，不是整块合金的渗碳体比例", "mnemonic": "【答题抓手】扣准珠光体内部铁、素体与渗碳体、比例求，紧扣物理机制与适用条件展开", "pitfall": "这里是珠光体内部质量比例，不是整块合金的渗碳体比例。", "freq": "高频必背"}, {"id": "qa_08_23", "num": "08-23", "chapter": "ch8", "name": "08-23 亚共晶、共晶和过共晶白口铸铁凝固时各先形成什么？", "title": "亚共晶、共晶和过共晶白口铸铁凝固时各先形成什么？", "section": "叶 pp.224–227；正文。", "def": "① 亚共晶白口铸铁先析出奥氏体，剩余液相在共晶温度形成莱氏体。\n② 共晶成分直接发生共晶反应。\n③ 过共晶白口铸铁先析出一次渗碳体，再形成莱氏体。", "keyPoints": "亚共晶白口铸铁先析出奥氏体，剩余液相在共晶温度形成莱氏体；共晶成分直接发生共晶反应；过共晶白口铸铁先析出一次渗碳体，再形成莱氏体；继续降温时奥氏体还会析出二次渗碳体并最终发生共析转变，不能停在刚凝固完的状态", "mnemonic": "【答题抓手】扣准亚共晶、共晶和过共晶、白口铸铁凝固，紧扣物理机制与适用条件展开", "pitfall": "继续降温时奥氏体还会析出二次渗碳体并最终发生共析转变，不能停在刚凝固完的状态。", "freq": "高频必背"}, {"id": "qa_08_24", "num": "08-24", "chapter": "ch8", "name": "08-24 高温莱氏体与低温莱氏体有什么区别？", "title": "高温莱氏体与低温莱氏体有什么区别？", "section": "叶 pp.224–227；正文。", "def": "① 刚形成时：在1148℃共晶反应中，4.30%C液相形成奥氏体+共晶渗碳体，这种共晶组织称高温莱氏体。它由两个相组成，不是某个单独的新晶体结构。\n② 继续冷却：莱氏体中的奥氏体溶碳能力降低，先析出二次渗碳体；到727℃，剩余奥氏体转变为珠光体。原共晶渗碳体仍在，析出的二次渗碳体也可能依附其生长，显微上不易完全拆分。\n③ 室温表达：低温或变态莱氏体通常写成珠光体+渗碳体，实际相为铁素体+渗碳体。亚共晶铸铁还包含莱氏体区域以外、由初生奥氏体演变的组织，不能将整块试样全部归入莱氏体；统计分数时必须说明莱氏体内外，避免重复计入。", "keyPoints": "刚形成时：在1148℃共晶反应中，4.30%C液相形成奥氏体+共晶渗碳体，这种共晶组织称高温莱氏体；它由两个相组成，不是某个单独的新晶体结构；继续冷却：莱氏体中的奥氏体溶碳能力降低，先析出二次渗碳体；到727℃，剩余奥氏体转变为珠光体...", "mnemonic": "【答题抓手】扣准高温莱氏体与、低温莱氏体有、什么区别，紧扣物理机制与适用条件展开", "pitfall": "它由两个相组成，不是某个单独的新晶体结构。", "freq": "高频必背"}, {"id": "qa_08_25", "num": "08-25", "chapter": "ch8", "name": "08-25 莱氏体中奥氏体和渗碳体为什么不能凭图中面积目测质量比例？", "title": "莱氏体中奥氏体和渗碳体为什么不能凭图中面积目测质量比例？", "section": "叶 pp.224–227；正文。", "def": "① 刚形成的共晶莱氏体总成分为 4.30%C，其中奥氏体端点为 2.11%C、渗碳体端点为 6.69%C。\n② 根据杠杆定律，奥氏体质量分数为 W_γ = (6.69 - 4.30)/(6.69 - 2.11) × 100% ≈ 52.2%，渗碳体质量分数 W_Fe3C ≈ 47.8%。\n③ 金相示意图并非严格定量几何，面积比例受各相密度与形态影响，必须通过相图端点杠杆定律精确计算质量分数。", "keyPoints": "刚形成的共晶莱氏体总成分为 4.30%C，其中奥氏体端点为 2.11%C、渗碳体端点为 6.69%C；根据杠杆定律，奥氏体质量分数为 W_γ = (6.69 - 4.30)/(6.69 - 2.11) × 100% ≈ 52.2%，渗碳体质量分数 W_Fe3C ≈ 47.8% ；金相示意图并非严格定量几何，面积比例受各相密度与形态影响，必须通过相图端点杠杆定律精确计算质量分数", "mnemonic": "【答题抓手】扣准莱氏体中奥氏、体和渗碳体不、能凭图中面积，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_26", "num": "08-26", "chapter": "ch8", "name": "08-26 一次、二次、三次、共晶和共析渗碳体怎样区分？", "title": "一次、二次、三次、共晶和共析渗碳体怎样区分？", "section": "叶 pp.218–227；正文。", "def": "① 一次从液体直接析出。\n② 二次从奥氏体因溶碳度降低而析出。\n③ 三次从铁素体析出。\n④ 共晶渗碳体在液体共晶反应中与奥氏体共同形成。\n⑤ 共析渗碳体在奥氏体共析反应中与铁素体共同形成。", "keyPoints": "一次从液体直接析出；二次从奥氏体因溶碳度降低而析出；三次从铁素体析出；共晶渗碳体在液体共晶反应中与奥氏体共同形成；共析渗碳体在奥氏体共析反应中与铁素体共同形成；它们均可属于同一相，名称区别形成过程，不是五种不同化合物", "mnemonic": "【答题抓手】扣准一次、二次、三次，紧扣物理机制与适用条件展开", "pitfall": "它们均可属于同一相，名称区别形成过程，不是五种不同化合物。", "freq": "高频必背"}, {"id": "qa_08_27", "num": "08-27", "chapter": "ch8", "name": "08-27 亚共晶白口铸铁的二次渗碳体是否一定呈独立网状？", "title": "亚共晶白口铸铁的二次渗碳体是否一定呈独立网状？", "section": "叶 pp.224–227；正文衍生。", "def": "不一定。它由奥氏体析出，可依附原有共晶渗碳体生长，因此显微组织中常难以单独辨认；是否呈网状还受生长位置、冷却条件和原组织影响。", "keyPoints": "不一定；它由奥氏体析出，可依附原有共晶渗碳体生长，因此显微组织中常难以单独辨认；是否呈网状还受生长位置、冷却条件和原组织影响；过共析钢先共析渗碳体常沿原奥氏体晶界成网的结论，不能无条件搬到所有白口铸铁", "mnemonic": "【答题抓手】扣准亚共晶白口铸、铁的二次渗碳、体是否一定呈，紧扣物理机制与适用条件展开", "pitfall": "过共析钢先共析渗碳体常沿原奥氏体晶界成网的结论，不能无条件搬到所有白口铸铁。", "freq": "高频必背"}, {"id": "qa_08_28", "num": "08-28", "chapter": "ch8", "name": "08-28 含碳量如何影响平衡碳钢的组织和性能？", "title": "含碳量如何影响平衡碳钢的组织和性能？", "section": "叶 pp.227–229；正文。", "def": "在亚共析范围，碳增多使珠光体增多、先共析铁素体减少，通常强度硬度上升而塑性下降；过共析范围先共析渗碳体增加，硬度继续提高，但连续网状脆性相会使强度或韧性受损。比较前提是相近加工、热处理和组织状态。", "keyPoints": "在亚共析范围，碳增多使珠光体增多、先共析铁素体减少，通常强度硬度上升而塑性下降；过共析范围先共析渗碳体增加，硬度继续提高，但连续网状脆性相会使强度或韧性受损；比较前提是相近加工、热处理和组织状态", "mnemonic": "【答题抓手】扣准含碳量影响平、衡碳钢的组织、和性能，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_29", "num": "08-29", "chapter": "ch8", "name": "08-29 相图组织分析题怎样按时间顺序避免漏相、漏组织？", "title": "相图组织分析题怎样按时间顺序避免漏相、漏组织？", "section": "叶 pp.205–229；第10章习题8、9衍生。", "def": "① 先固定合金总成分，画冷却竖线。\n② 逐次记录穿过的相界与反应。\n③ 每个温度分别写“现存相”和“形成历史上的组织”。\n④ 涉及分数先定计算温度和质量/体积口径，再作连接线。\n【教材第10章第8题】冷却路径：L → L+δ → L+γ → γ → γ+α → α+P（α + Fe3C_共析 + P）。 室温相分数：α 相 = (6.69 - 0.45) / (6.69 - 0) = 93.3%；Fe3C 相 = 1 - 93.3% = 6.7%。", "keyPoints": "先固定合金总成分，画冷却竖线；逐次记录穿过的相界与反应；每个温度分别写“现存相”和“形成历史上的组织”；涉及分数先定计算温度和质量/体积口径，再作连接线；最后用各分数之和为1及总体碳守恒检查，不能把消失的奥氏体继续算入室温相", "mnemonic": "【答题抓手】扣准相图组织分析、题怎样按时间、顺序避免漏相，紧扣物理机制与适用条件展开", "pitfall": "最后用各分数之和为1及总体碳守恒检查，不能把消失的奥氏体继续算入室温相。", "freq": "高频必背"}, {"id": "qa_08_30", "num": "08-30", "chapter": "ch8", "name": "08-30 为什么结晶需要过冷？热力学驱动力是什么？", "title": "为什么结晶需要过冷？热力学驱动力是什么？", "section": "叶 pp.237–242；正文。", "def": "① 在平衡熔点固液自由能相等，没有净转变驱动力。\n② 低于熔点后固相体积自由能较低，体积自由能差有利于凝固。但形成新界面需要能量，因此必须出现足以克服形核势垒的晶胚。\n③ “自由能降低”不等于任意微小晶胚都会自发生长。", "keyPoints": "在平衡熔点固液自由能相等，没有净转变驱动力；低于熔点后固相体积自由能较低，体积自由能差有利于凝固；但形成新界面需要能量，因此必须出现足以克服形核势垒的晶胚；“自由能降低”不等于任意微小晶胚都会自发生长", "mnemonic": "【答题抓手】扣准结晶需要过冷、热力学驱动力、是什么，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_31", "num": "08-31", "chapter": "ch8", "name": "08-31 球形均匀形核的自由能变化、临界半径和临界形核功怎样得到？", "title": "球形均匀形核的自由能变化、临界半径和临界形核功怎样得到？", "section": "叶 pp.238–242；正文。", "def": "① 球形晶核总自由能变化：设 ΔG_v 为单位体积相变自由能变化（过冷液相中 ΔG_v < 0），γ 为单位面积液-固界面能（γ > 0），半径为 r 的球形晶胚总自由能变化为：ΔG(r) = (4/3)·π·r³·ΔG_v + 4·π·r²·γ。\n② 临界晶核半径推导：对 ΔG(r) 求导并令其为零（dΔG/dr = 4·π·r²·ΔG_v + 8·π·r·γ = 0），解得临界半径 r* = -2γ / ΔG_v（或写作 r* = 2γ / |ΔG_v|）。\n③ 临界形核功推导：将 r* 代回总自由能表达式，得临界形核功 ΔG* = (16·π·γ³) / (3·ΔG_v²)。其中体积自由能项提供相变驱动力（促进形核），界面能项构成形核阻力（阻碍形核）。", "keyPoints": "ΔG(r) = (4/3)πr³ΔG_v + 4πr²γ；令 dΔG/dr = 0 得 r* = -2γ/ΔG_v；代回得 ΔG* = 16πγ³/(3ΔG_v²)", "mnemonic": "【答题抓手】扣准球形均匀形核、的自由能变化、临界半径和临，紧扣物理机制与适用条件展开", "pitfall": "需严格区分单位体积自由能变化 ΔG_v（J/m³）与总自由能变化 ΔG（J），界面能项与半径平方成正比、体积项与半径立方成正比。", "freq": "高频必背"}, {"id": "qa_08_32", "num": "08-32", "chapter": "ch8", "name": "08-32 为什么小于临界尺寸的晶胚容易消失，大于临界尺寸的晶核会长大？", "title": "为什么小于临界尺寸的晶胚容易消失，大于临界尺寸的晶核会长大？", "section": "叶 pp.238–242；正文。", "def": "① 时增大半径使总自由能升高，因此缩小有利。\n② 时继续增大可降低总自由能，因此长大有利。\n③ 是自由能极大点，为不稳定平衡。", "keyPoints": "时增大半径使总自由能升高，因此缩小有利；时继续增大可降低总自由能，因此长大有利；是自由能极大点，为不稳定平衡；临界半径不是最终晶粒半径，也不意味着尺寸达到后无限快长大", "mnemonic": "【答题抓手】扣准小于临界尺寸、的晶胚容易消、失大于临界尺，紧扣物理机制与适用条件展开", "pitfall": "临界半径不是最终晶粒半径，也不意味着尺寸达到后无限快长大。", "freq": "高频必背"}, {"id": "qa_08_33", "num": "08-33", "chapter": "ch8", "name": "08-33 过冷度如何影响临界半径、形核功和形核率？", "title": "过冷度如何影响临界半径、形核功和形核率？", "section": "叶 pp.239–243；正文。", "def": "① 临界晶核半径与形核功理论公式：\n   - 均匀形核临界半径公式：r* = 2γ·T_m / (ΔH_m·ΔT)；\n   - 临界形核功公式：ΔG* = 16π·γ³·T_m² / (3·ΔH_m²·ΔT²)；\n   - 式中 γ 为固-液界面能，T_m 为平衡熔点，ΔH_m 为单位体积熔化潜热，ΔT = T_m - T 为过冷度。\n② 过冷度对热力学参数的影响：\n   - 随着过冷度 ΔT 增大，临界晶核半径 r* 与过冷度成反比急剧减小（r* ∝ 1/ΔT）；\n   - 临界形核功（形核势垒）ΔG* 与过冷度的平方成反比急剧下降（ΔG* ∝ 1/ΔT²），相变热力学驱动力成倍暴增。\n③ 过冷度对形核率 I 的综合影响（马鞍形 / 峰值曲线）：\n   - 稳态形核率公式为：I = I_0·exp(-ΔG* / (k·T))·exp(-Q / (k·T))；\n   - 在较小过冷度下（靠近熔点 T_m），形核势垒 ΔG* 极大，热力学形核阻力占主导，形核率极低；\n   - 在极大过冷度下（深冷低温），原子热扩散激活能 Q/(kT) 剧增，原子长程迁移停滞，形核率同样极低；\n   - 因此形核率随过冷度增大呈现先急剧上升、达到极大峰值后再迅速下降的“马鞍形鼻尖曲线”。", "keyPoints": "临界半径 r* = 2γT_m/(ΔH_m·ΔT)；形核功 ΔG* ∝ 1/ΔT²；形核率综合热力学驱动与动力学扩散呈单峰曲线，非单调递增", "mnemonic": "【答题抓手】扣准过冷度影响临、界半径、形核功和形核，紧扣物理机制与适用条件展开", "pitfall": "不能认为过冷度越大形核就越快，极深过冷下原子扩散被冻结（动力学阻碍），形核率反而趋近于零；绝对不能简单断言“过冷度越大形核越快”，在极深过冷下原子扩散被完全冻结，液相将直接转变为非晶金属玻璃而不是晶核。", "freq": "高频必背"}, {"id": "qa_08_34", "num": "08-34", "chapter": "ch8", "name": "08-34 均匀形核与非均匀形核有什么区别？同过冷度下临界尺寸是否更小？", "title": "均匀形核与非均匀形核有什么区别？同过冷度下临界尺寸是否更小？", "section": "叶 pp.242–243；第11章习题1。", "def": "均匀形核在母相内部进行；非均匀形核依托器壁、杂质或已有界面，减少新界面形成代价。在理想球冠、相同界面参数模型中，临界曲率半径可与均匀形核相同，而形核功乘以小于1的润湿因子。\n【教材第11章第1题】临界半径相同；均匀形核的临界形核功大。", "keyPoints": "均匀形核在母相内部进行；非均匀形核依托器壁、杂质或已有界面，减少新界面形成代价；在理想球冠、相同界面参数模型中，临界曲率半径可与均匀形核相同，而形核功乘以小于1的润湿因子；不能把“势垒更低”自动等同于“临界曲率半径更小”", "mnemonic": "【答题抓手】扣准均匀形核与非、均匀形核有什、么区别同过冷，紧扣物理机制与适用条件展开", "pitfall": "不能把“势垒更低”自动等同于“临界曲率半径更小”。", "freq": "高频必背"}, {"id": "qa_08_35", "num": "08-35", "chapter": "ch8", "name": "08-35 非均匀形核的润湿性如何影响形核？怎样细化铸态晶粒？", "title": "非均匀形核的润湿性如何影响形核？怎样细化铸态晶粒？", "section": "叶 pp.242–245；正文。", "def": "① 界面替换：在基底上形核时，既形成固—液及固—基底界面，也替换掉一部分原有液—基底界面，因此新增界面能不等于在母相内部造一个完整球形新界面的能量。\n② 润湿作用：理想平面基底球冠模型中，接触角越小，形状因子越小，非均匀形核功越低；在相同体积自由能差与固液界面能等前提下，临界曲率半径可以与均匀形核相同。不能把球冠高度、球冠体积与其曲率半径混为一谈。\n③ 细化应用：孕育处理通过提供有效基底降低形核困难并增加晶核数，配合适当过冷和生长控制可细化晶粒。颗粒需有合适润湿、结构匹配和稳定性；任意加入杂质未必有效，还可能形成有害夹杂。", "keyPoints": "界面替换：在基底上形核时，既形成固—液及固—基底界面，也替换掉一部分原有液—基底界面，因此新增界面能不等于在母相内部造一个完整球形新界面的能量；润湿作用：理想平面基底球冠模型中，接触角越小，形状因子越小，非均匀形核功越低；在相同体积自由能差与固液界面能等前提下，临界曲率半径可以与均匀形核相同；不能把球冠高度、球冠体积与其曲率半径混为一谈...", "mnemonic": "【答题抓手】扣准非均匀形核的、润湿性影响形、核怎样细化铸，紧扣物理机制与适用条件展开", "pitfall": "不能把球冠高度、球冠体积与其曲率半径混为一谈。", "freq": "高频必背"}, {"id": "qa_08_36", "num": "08-36", "chapter": "ch8", "name": "08-36 正温度梯度和负温度梯度为何导致不同生长形态？", "title": "正温度梯度和负温度梯度为何导致不同生长形态？", "section": "叶 pp.244–245；正文。", "def": "正温度梯度下，伸入前方较高温液体的凸起生长受抑，界面趋于稳定和平面生长；负温度梯度下，凸起进入更过冷液体而生长更快，形成胞状或树枝状倾向。", "keyPoints": "正温度梯度下，伸入前方较高温液体的凸起生长受抑，界面趋于稳定和平面生长；负温度梯度下，凸起进入更过冷液体而生长更快，形成胞状或树枝状倾向；合金还受溶质再分配引起的成分过冷影响，不能只看外加温度梯度", "mnemonic": "【答题抓手】扣准正温度梯度和、负温度梯度为、何导致不同生，紧扣物理机制与适用条件展开", "pitfall": "合金还受溶质再分配引起的成分过冷影响，不能只看外加温度梯度。", "freq": "高频必背"}, {"id": "qa_08_37", "num": "08-37", "chapter": "ch8", "name": "08-37 形核率与长大速率怎样共同决定晶粒大小？", "title": "形核率与长大速率怎样共同决定晶粒大小？", "section": "叶 pp.237–245；正文。", "def": "在给定总体积中，有效晶核多且后续长大受限，最终晶粒通常较细；晶核少而长大充分则较粗。", "keyPoints": "在给定总体积中，有效晶核多且后续长大受限，最终晶粒通常较细；晶核少而长大充分则较粗；形核率和长大速率对温度的依赖不同，热处理或冷却需控制二者相对关系，不能仅以“冷却快”替代全部机制说明", "mnemonic": "【答题抓手】扣准形核率与长大、速率怎样共同、决定晶粒大小，紧扣物理机制与适用条件展开", "pitfall": "形核率和长大速率对温度的依赖不同，热处理或冷却需控制二者相对关系，不能仅以“冷却快”替代全部机制说明。", "freq": "高频必背"}, {"id": "qa_08_38", "num": "08-38", "chapter": "ch8", "name": "08-38 固态相变与液态结晶有什么共同点和区别？", "title": "固态相变与液态结晶有什么共同点和区别？", "section": "叶 pp.245–247；第11章习题2。", "def": "共同点是通常经历形核与长大、受自由能差和界面能影响；固态母相对新相有约束，常额外涉及弹性应变能、位向关系、缺陷和界面共格性，原子扩散也较慢。某些固态相变可通过协同切变完成，不宜全部套用扩散控制生长。\n【教材第11章第2题】相同点：都是相变过程，包括形核和长大，临界形核半径形式相同，转变动力学特征也相同； 不同点：固态相变形核阻力中增加了弹性应变能，形核功增大。", "keyPoints": "共同点是通常经历形核与长大、受自由能差和界面能影响；固态母相对新相有约束，常额外涉及弹性应变能、位向关系、缺陷和界面共格性，原子扩散也较慢；某些固态相变可通过协同切变完成，不宜全部套用扩散控制生长", "mnemonic": "【答题抓手】扣准固态相变与液、态结晶有什么、共同点和区别，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_39", "num": "08-39", "chapter": "ch8", "name": "08-39 TTT 图表示什么？如何读出开始、完成和转变量？", "title": "TTT 图表示什么？如何读出开始、完成和转变量？", "section": "叶 pp.247–251；第11章习题3。", "def": "TTT 图表示给定成分和奥氏体状态下，迅速冷却到某温度并保持时的等温转变规律。水平读温度，按时间轴读开始、结束及给出的中间转变量线；开始前主要是未转变奥氏体，开始与结束之间为混合组织。图的适用前提包括奥氏体化及快速转移条件。\n【教材第11章第3题】等温转变图。TTT 图可反映不同过冷度下的等温转变过程，包括转变开始和转变终了时间、转变产物的类型以及转变量与时间、温度之间的关系等。", "keyPoints": "TTT 图表示给定成分和奥氏体状态下，迅速冷却到某温度并保持时的等温转变规律；水平读温度，按时间轴读开始、结束及给出的中间转变量线；开始前主要是未转变奥氏体，开始与结束之间为混合组织；图的适用前提包括奥氏体化及快速转移条件", "mnemonic": "【答题抓手】扣准图表示什么读、出开始、完成和转变量，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_40", "num": "08-40", "chapter": "ch8", "name": "08-40 为什么扩散型转变曲线常呈 C 形？“鼻尖”意味着什么？", "title": "为什么扩散型转变曲线常呈 C 形？“鼻尖”意味着什么？", "section": "叶 pp.248–251；正文。", "def": "① 高温接近平衡点时驱动力小、形核困难，孕育期长。\n② 低温时驱动力大但原子迁移慢，转变也慢。\n③ 中间温度两者配合，转变最快，孕育期最短，形成鼻尖。", "keyPoints": "高温接近平衡点时驱动力小、形核困难，孕育期长；低温时驱动力大但原子迁移慢，转变也慢；中间温度两者配合，转变最快，孕育期最短，形成鼻尖；不能只用“高温扩散快”断言高温转变最快", "mnemonic": "【答题抓手】扣准扩散型转变曲、线常呈、鼻尖，紧扣物理机制与适用条件展开", "pitfall": "不能只用“高温扩散快”断言高温转变最快。", "freq": "高频必背"}, {"id": "qa_08_41", "num": "08-41", "chapter": "ch8", "name": "08-41 粗珠光体和细珠光体形成条件及性能如何比较？", "title": "粗珠光体和细珠光体形成条件及性能如何比较？", "section": "叶 pp.247–251、257–259；正文。", "def": "较高珠光体转变温度下扩散距离较长，片层间距较大，形成粗珠光体；较低温度下片层较细。细片层增加相界障碍，通常强度硬度高于粗珠光体，但塑性相对下降。珠光体与贝氏体分区需按给定图判断，不宜把固定温度界限套到所有钢。", "keyPoints": "较高珠光体转变温度下扩散距离较长，片层间距较大，形成粗珠光体；较低温度下片层较细；细片层增加相界障碍，通常强度硬度高于粗珠光体，但塑性相对下降；珠光体与贝氏体分区需按给定图判断，不宜把固定温度界限套到所有钢", "mnemonic": "【答题抓手】扣准粗珠光体和细、珠光体形成条、件及性能，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_08_42", "num": "08-42", "chapter": "ch8", "name": "08-42 珠光体形成时碳如何扩散？为何两相协同长大？", "title": "珠光体形成时碳如何扩散？为何两相协同长大？", "section": "叶 pp.250–251；第10章习题6衍生。", "def": "铁素体溶碳能力低，形成时排出碳；邻近渗碳体富碳，吸收碳。两相并排生长使碳主要在较短距离内重新分配，降低长距离传输要求。\n【教材第10章第6题】碳原子从贫碳的 α 相（0.022%C）向富碳的 Fe3C（6.69%C）扩散（或沿碳化学势降低方向，视过饱和/脱碳条件而定）。", "keyPoints": "铁素体溶碳能力低，形成时排出碳；邻近渗碳体富碳，吸收碳；两相并排生长使碳主要在较短距离内重新分配，降低长距离传输要求；扩散方向由化学势降低决定，因此不能仅比较不同相的碳质量分数来否定扩散方向", "mnemonic": "【答题抓手】扣准珠光体形成时、碳扩散为何两、相协同长大，紧扣物理机制与适用条件展开", "pitfall": "扩散方向由化学势降低决定，因此不能仅比较不同相的碳质量分数来否定扩散方向。", "freq": "高频必背"}, {"id": "qa_08_43", "num": "08-43", "chapter": "ch8", "name": "08-43 上贝氏体与下贝氏体的形貌和性能有何区别？", "title": "上贝氏体与下贝氏体的形貌和性能有何区别？", "section": "叶 pp.251–253、259–261；第11章习题4、5。", "def": "① 上贝氏体：在较高贝氏体转变温区形成，铁素体多呈板条或羽毛状集合，碳化物主要位于板条之间。相对粗大的板条与不利的碳化物边界分布容易形成裂纹萌生、扩展路径，韧性常较差。\n② 下贝氏体：在较低温区形成，铁素体形态及碳化物更细，细小碳化物可在铁素体片内按一定方向析出；较细且分散的组织常可兼顾较高强度和较好韧性。\n③ 比较条件：二者都不能简单称为一种纯相，必须说明铁素体与碳化物的位置、尺度和组合形貌。具体转变界限依钢的成分和给定转变图，不能把某个固定温度当成对所有钢通用的分界；“下贝氏体好”也应联系具体指标与处理条件。\n【教材第11章第4题】上贝氏体在贝氏体转变的高温范围内形成，由成束大致平行排列的板条状铁素体和条间的粒状或条状渗碳体构成，呈现羽毛状结构。 下贝氏体在低温范围内形成：低碳钢中铁素体呈板条状平行成束；高碳钢中铁素体呈片状且各片互成一定角度；中碳钢中可同时存在两种形态。", "keyPoints": "上贝氏体：在较高贝氏体转变温区形成，铁素体多呈板条或羽毛状集合，碳化物主要位于板条之间；相对粗大的板条与不利的碳化物边界分布容易形成裂纹萌生、扩展路径，韧性常较差；下贝氏体：在较低温区形成，铁素体形态及碳化物更细，细小碳化物可在铁素体片内按一定方向析出；较细且分散的组织常可兼顾较高强度和较好韧性...", "mnemonic": "【答题抓手】扣准上贝氏体与下、贝氏体的形貌、和性能有何区，紧扣物理机制与适用条件展开", "pitfall": "比较条件：二者都不能简单称为一种纯相，必须说明铁素体与碳化物的位置、尺度和组合形貌。", "freq": "高频必背"}, {"id": "qa_08_44", "num": "08-44", "chapter": "ch8", "name": "08-44 马氏体转变有哪些基本特征？是否需要碳长程扩散？", "title": "马氏体转变有哪些基本特征？是否需要碳长程扩散？", "section": "叶 pp.253–256；正文。", "def": "马氏体由原子协同位移形成，通常属无扩散切变型转变；碳来不及按平衡重新分配，固溶于过饱和铁晶格中，可形成体心四方结构，并伴随形状和体积变化。", "keyPoints": "马氏体由原子协同位移形成，通常属无扩散切变型转变；碳来不及按平衡重新分配，固溶于过饱和铁晶格中，可形成体心四方结构，并伴随形状和体积变化；常用碳钢模型中转变量主要随冷却到的温度决定，而不是靠恒温延长时间完成一般扩散型转变", "mnemonic": "【答题抓手】扣准马氏体转变有、哪些基本特征、是否需要碳长，紧扣物理机制与适用条件展开", "pitfall": "常用碳钢模型中转变量主要随冷却
