<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-text-size-adjust: 100%;
    }
    /* Prevent character-by-character vertical wrapping on all buttons and filter pills */
    button, .status-filter-btn, .term-status-btn, .nowrap-pill {
      white-space: nowrap !important;
      flex-shrink: 0 !important;
    }
    .touch-scroll-x {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .blur-mask {
      filter: blur(6.5px);
      user-select: none;
      transition: filter 0.2s ease;
      cursor: pointer;
    }
    .blur-mask:hover, .blur-mask.revealed {
      filter: blur(0);
      user-select: auto;
    }
    .card-transition {
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .status-mastered {
      border-left: 4.5px solid #10b981;
    }
    .status-fuzzy {
      border-left: 4.5px solid #f59e0b;
    }
    .status-forgotten {
      border-left: 4.5px solid #f43f5e;
    }
    .status-unmarked {
      border-left: 4.5px solid #cbd5e1;
    }
    .independent-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .independent-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .independent-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .independent-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* ===================================================================
       RESPONSIVE LAYOUT ARCHITECTURE:
       1) iPad Landscape & Desktop (width >= 1024px AND height >= 560px):
          Fixed split-pane app layout with independent pane scrolling.
       2) Mobile Portrait, Mobile Landscape (height < 560px), & Narrow Screens (< 1024px):
          Natural document scrolling (no fixed h-screen or overflow clipping),
          and slide-over drawer sidebar when expanded.
       =================================================================== */
    @media (min-width: 1024px) and (min-height: 560px) {
      body.app-shell {
        height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #studyWorkspaceView {
        flex: 1 1 0%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #workspaceBody {
        flex: 1 1 0%;
        min-height: 0;
        display: flex;
        flex-direction: row;
        overflow: hidden;
      }
      #chapterSidebar {
        position: relative;
        width: 19rem;
        flex-shrink: 0;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #mainContentPane {
        flex: 1 1 0%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #listViewWrapper, #flashcardViewWrapper {
        flex: 1 1 0%;
        min-height: 0;
        overflow-y: auto;
      }
      #sidebarBackdrop {
        display: none !important;
      }
    }

    @media (max-width: 1023.98px), (max-height: 559.98px) {
      body.app-shell {
        min-height: 100dvh;
        height: auto !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        display: flex;
        flex-direction: column;
      }
      #studyWorkspaceView {
        flex: 1 0 auto;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        display: flex;
        flex-direction: column;
      }
      #workspaceBody {
        flex: 1 0 auto;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        display: flex;
        flex-direction: column;
      }
      #chapterSidebar {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        bottom: 0 !important;
        width: min(84vw, 320px) !important;
        max-width: 84vw !important;
        height: 100dvh !important;
        z-index: 60 !important;
        box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.28) !important;
        display: flex;
        flex-direction: column;
        overflow: hidden !important;
      }
      #mainContentPane {
        flex: 1 0 auto;
        width: 100%;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        display: flex;
        flex-direction: column;
      }
      #listViewWrapper, #flashcardViewWrapper {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
    }

    .sidebar-collapsed {
      width: 0px !important;
      min-width: 0px !important;
      max-width: 0px !important;
      padding: 0px !important;
      margin: 0px !important;
      border-right: none !important;
      overflow: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    @media (max-width: 1023.98px), (max-height: 559.98px) {
      .sidebar-collapsed {
        display: none !important;
      }
    }

    @media print {
      body.app-shell {
        background: #ffffff !important;
        overflow: visible !important;
        height: auto !important;
      }
      .no-print {
        display: none !important;
      }
      .print-visible {
        display: block !important;
        overflow: visible !important;
        height: auto !important;
      }
      .blur-mask {
        filter: none !important;
      }
    }

    /* Mathematical typography: Long radical bar & distinct sub/superscripts */
    .math-radical {
      display: inline-flex;
      align-items: stretch;
      vertical-align: -0.14em;
      margin: 0 1.5px;
      font-style: normal;
    }
    .math-radical .radical-svg {
      width: 0.62em;
      height: auto;
      align-self: stretch;
      flex-shrink: 0;
      margin-right: -0.5px;
      overflow: visible;
    }
    .math-radical .radicand {
      border-top: 1.7px solid #3730a3;
      padding-top: 0.30em;
      padding-bottom: 0.05em;
      padding-left: 2px;
      padding-right: 3px;
      display: inline-block;
      line-height: 1.25;
    }
    sub.math-sub {
      font-size: 0.64em;
      line-height: 0;
      vertical-align: -0.24em;
      font-weight: 700;
      color: #0369a1;
      margin-left: 0.5px;
      margin-right: 0.5px;
      font-family: Cambria, "Times New Roman", "DejaVu Serif", serif, system-ui;
    }
    sup.math-sup {
      font-size: 0.64em;
      line-height: 0;
      vertical-align: 0.36em;
      font-weight: 700;
      color: #b91c1c;
      margin-left: 0.5px;
      margin-right: 0.5px;
      font-family: Cambria, "Times New Roman", "DejaVu Serif", serif, system-ui;
    }
    .math-bar {
      text-decoration: overline;
      text-decoration-thickness: 1.8px;
      text-decoration-color: #b91c1c;
      font-weight: 700;
      font-style: normal;
    }
    @keyframes fcSlideInNext {
      0% { opacity: 0; transform: translateX(38px) scale(0.985); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes fcSlideInPrev {
      0% { opacity: 0; transform: translateX(-38px) scale(0.985); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    .fc-enter-next {
      animation: fcSlideInNext 0.26s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .fc-enter-prev {
      animation: fcSlideInPrev 0.26s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
  </style>
</head>

  <script>
    // Mathematical typography helper for long root bars and distinct sub/superscripts
    function splitDefAndHw(rawDef) {
      const m = /\n【教材第\d+章第\d+题】/.exec(rawDef || '');
      if (!m) return { main: rawDef || '', hw: '' };
      return {
        main: rawDef.slice(0, m.index),
        hw: rawDef.slice(m.index + 1)
      };
    }

    function formatMathHTML(str) {
      if (!str) return '';
      let res = String(str);

      // Crystallographic negative index overbar (e.g. 1̄, 2̄ or \bar{1})
      res = res.replace(/([0-9hkluvtw])[\u0304\u0305]/g, '<span class="math-bar">$1</span>');
      res = res.replace(/\\bar\{([0-9hkluvtw])\}/g, '<span class="math-bar">$1</span>');

      // Square roots: √(expression) or √expression with SVG radical hook & long overline
      const svgHook = '<svg class="radical-svg" viewBox="0 0 12 24" preserveAspectRatio="none" aria-hidden="true"><path d="M1 14 L3.5 14 L6.5 22.5 L12 0.8" fill="none" stroke="#3730a3" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      res = res.replace(/√\(([^)]+)\)/g, `<span class="math-radical">${svgHook}<span class="radicand">$1</span></span>`);
      res = res.replace(/√([0-9a-zA-Z]+)/g, `<span class="math-radical">${svgHook}<span class="radicand">$1</span></span>`);

      // Superscripts: ^(expression), ^number, and unicode ², ³, etc.
      res = res.replace(/\^\(([^)]+)\)/g, '<sup class="math-sup">$1</sup>');
      res = res.replace(/\^([0-9a-zA-Z\+\-\*]+)/g, '<sup class="math-sup">$1</sup>');
      const supMap = {'²':'2', '³':'3', '¹':'1', '⁴':'4', '⁵':'5', '⁶':'6', '⁷':'7', '⁸':'8', '⁹':'9', '⁰':'0'};
      res = res.replace(/([²³¹⁴⁵⁶⁷⁸⁹⁰])/g, (m, c) => `<sup class="math-sup">${supMap[c] || c}</sup>`);

      // Subscripts: variable_subscript like T_m, N_A, r_oct, D_0, u_1, v_1, w_1, r_A, etc.
      res = res.replace(/([A-Za-zα-ωΑ-ΩΔστεμγρλθϕφ][A-Za-z0-9α-ωΑ-ΩΔστεμγρλθϕφ]*)_([a-zA-Z0-9\+\-α-ωΑ-Ω]+)/g, '$1<sub class="math-sub">$2</sub>');

      // Chemical formulas with stoichiometric subscripts: Fe3C -> Fe<sub>3</sub>C, Al2O3 -> Al<sub>2</sub>O<sub>3</sub>, Ni3Al -> Ni<sub>3</sub>Al, Cl2 -> Cl<sub>2</sub>
      res = res.replace(/(Fe|Al|Si|Ti|Zr|Cu|Ni|Mg|Ca|Ba|Cr|Mn|Co|Zn|Li|Na|K|H|O|N|C|Cl|F|S|P)([2-9])(?=[A-Z0-9\u4e00-\u9fa5\s，。；、（）()\-–—·+]|$)/g, '$1<sub class="math-sub">$2</sub>');

      return res;
    }

a_01_01", "num": "01-01", "chapter": "ch1", "name": "01-01 原子由哪些粒子组成？原子序数、质量数和同位素有什么关系？", "title": "原子由哪些粒子组成？原子序数、质量数和同位素有什么关系？", "section": "叶 pp.18–19；正文。", "def": "①原子由原子核和核外电子组成，原子核含质子与中子。\n②原子序数等于质子数；中性原子的电子数等于质子数。\n③质量数为质子数与中子数之和。\n④同位素质子数相同而中子数不同，不能把质量数等同于平均相对原子质量。", "keyPoints": "①原子由原子核和核外电子组成，原子核含质子与中子；②原子序数等于质子数；中性原子的电子数等于质子数；③质量数为质子数与中子数之和；④同位素质子数相同而中子数不同，不能把质量数等同于平均相对原子质量。", "mnemonic": "【记忆口诀】质子中子居核内，核外电子等序数；质量数为二者和，同位质同中子殊。", "pitfall": "④同位素质子数相同而中子数不同，不能把质量数等同于平均相对原子质量。", "freq": "高频必背"}, {"id": "qa_01_02", "num": "01-02", "chapter": "ch1", "name": "01-02 四个量子数分别表示什么？", "title": "四个量子数分别表示什么？", "section": "叶 pp.19–21；第2章习题2。", "def": "① 主量子数 n 表示电子层及轨道尺度。\n② 角量子数 l 表示亚层和轨道形状。\n③ 磁量子数 m_l 表示轨道空间取向。\n④ 自旋量子数 m_s 表示电子自旋状态。其取值依次为：n = 1, 2, 3, ...（正整数）。\n⑤ l = 0, 1, 2, ..., n-1（共 n 个取值）。\n⑥ m_l = 0, ±1, ±2, ..., ±l（共 2l+1 个取值）。\n⑦ m_s = ±1/2。\n【教材第2章第2题】主量子数 n、角量子数 l、磁量子数 m_l、自旋量子数 m_s。", "keyPoints": "主量子数 n(层与尺度，取正整数 1,2,3...) ；角量子数 l(亚层与形状，取 0 ~ n-1) ；磁量子数 m_l(空间取向，取 0, ±1...±l 共 2l+1 个) ；自旋量子数 m_s(自旋方向，取 ±1/2)。", "mnemonic": "【记忆口诀】主量子数定尺度，角量子数定形状；磁量子数辨取向，自旋上下半整数。", "pitfall": "四个量子数的符号与取值范围必须严格写全，切忌遗漏整数约束或将磁量子数与自旋量子数符号混淆。", "freq": "高频必背"}, {"id": "qa_01_03", "num": "01-03", "chapter": "ch1", "name": "01-03 核外电子排布遵循哪些原则？如何联系材料性质？", "title": "核外电子排布遵循哪些原则？如何联系材料性质？", "section": "叶 pp.20–24；正文。", "def": "①能量最低原理：优先占据低能轨道。\n②泡利不相容原理：一个原子内不能有四个量子数完全相同的两个电子，一个轨道最多容纳两个自旋相反电子。\n③洪特规则：简并轨道先单独占据且自旋平行。\n④价电子决定主要成键方式，并影响导电性和化学活性。", "keyPoints": "①能量最低原理：优先占据低能轨道；②泡利不相容原理：同一轨道最多容纳两个自旋相反电子；③洪特规则：简并轨道先单独占据且自旋平行；④价电子决定成键方式及导电性、化学活性", "mnemonic": "【记忆口诀】能量最低先占底，泡利不相容自旋反；洪特简并先单占，价层电子定成键。", "pitfall": "泡利不相容原理强调同一原子内不能有四个量子数完全相同的两个电子，不要漏掉自旋相反条件。", "freq": "高频必背"}, {"id": "qa_01_04", "num": "01-04", "chapter": "ch1", "name": "01-04 同一周期和同一主族元素的电子结构各有什么共同点？", "title": "同一周期和同一主族元素的电子结构各有什么共同点？", "section": "叶 pp.22–24；第2章习题1。", "def": "同一周期原子的基态占据电子层数通常相同，随原子序数增加逐步填充电子；同一主族价电子构型相似，通常具有相同价电子数，因而化学性质相似。\n【教材第2章第1题】同一周期元素，从左到右最外层电子数逐渐增加，原子半径逐渐减小；同一主族元素最外层电子数相等，化学性能相似，原子半径逐渐增大。", "keyPoints": "同一周期原子的基态占据电子层数通常相同，随原子序数增加逐步填充电子；同一主族价电子构型相似，通常具有相同价电子数，因而化学性质相似；过渡元素还需考虑未充满的内层 (n-1)d 或 (n-2)f 电子，不能把主族规律机械套用", "mnemonic": "【记忆口诀】同周期电子层数同，同主族价层电子等；主族化性表现似，过渡内层d充填。", "pitfall": "过渡元素还需考虑未充满的内层 (n-1)d 或 (n-2)f 电子，不能把主族规律机械套用。", "freq": "高频必背"}, {"id": "qa_01_05", "num": "01-05", "chapter": "ch1", "name": "01-05 什么是电负性？它与化学键类型有什么联系？", "title": "什么是电负性？它与化学键类型有什么联系？", "section": "叶 pp.23–24；正文。", "def": "电负性表示原子在成键时吸引电子的能力。两原子电负性差较大，成键的离子性通常较强；差较小且通过共享电子成键，通常共价性较强。", "keyPoints": "电负性表示原子在成键时吸引电子的能力；两原子电负性差较大，成键的离子性通常较强；差较小且通过共享电子成键，通常共价性较强；实际材料可有混合键，不能仅凭一个差值把所有材料绝对分成纯离子键或纯共价键", "mnemonic": "【记忆口诀】电负性大吸电子，差值悬殊离子键；差小电子共用享，极性共价杂键多。", "pitfall": "实际材料可有混合键，不能仅凭一个差值把所有材料绝对分成纯离子键或纯共价键。", "freq": "高频必背"}, {"id": "qa_01_06", "num": "01-06", "chapter": "ch1", "name": "01-06 原子间为什么同时存在引力和斥力？", "title": "原子间为什么同时存在引力和斥力？", "section": "叶 pp.25–26；第2章习题6。", "def": "较远距离下，静电作用、电子共享等产生吸引；原子接近时电子云重叠，泡利排斥及核间、电子间排斥增强。排斥随距离缩短通常增长更快，因此原子不会无限接近，并在平衡间距处形成稳定结合。\n【教材第2章第6题】原子间的排斥作用来自相邻原子内层电子云的重叠。", "keyPoints": "较远距离下，静电作用、电子共享等产生吸引；原子接近时电子云重叠，泡利排斥及核间、电子间排斥增强；排斥随距离缩短通常增长更快，因此原子不会无限接近，并在平衡间距处形成稳定结合", "mnemonic": "【记忆口诀】静电共用生引力，电子重叠生排斥；斥力随距增更快，平衡间距两相抵。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_01_07", "num": "01-07", "chapter": "ch1", "name": "01-07 结合力曲线和势能曲线如何判断平衡间距与稳定性？", "title": "结合力曲线和势能曲线如何判断平衡间距与稳定性？", "section": "叶 pp.25–26；正文。", "def": "规定向外为正时，相互作用力 F = -dE/dr。平衡间距 r_0 处合力为零、势能为极小值；略偏离后产生恢复力，属于稳定平衡。", "keyPoints": "规定向外为正时，相互作用力 F = -dE/dr；平衡间距 r_0 处合力为零、势能为极小值；略偏离后产生恢复力，属于稳定平衡；势能曲线最低点的纵坐标不是力（为结合能 E_0），势阱深度也不是平衡间距", "mnemonic": "【记忆口诀】势能极小合力零，拉远拉回压近推；势阱深度定结合，最低横轴定间距。", "pitfall": "势能曲线最低点的纵坐标不是力（为结合能 E_0），势阱深度也不是平衡间距。", "freq": "高频必背"}, {"id": "qa_01_08", "num": "01-08", "chapter": "ch1", "name": "01-08 结合能、弹性模量、熔点和热膨胀与势能曲线有什么关系？", "title": "结合能、弹性模量、熔点和热膨胀与势能曲线有什么关系？", "section": "叶 pp.25–26、30–31；正文。", "def": "①势阱深度反映结合强弱，结合强通常对应较高熔点。\n②平衡位置附近势能曲率越大，抵抗弹性变形能力通常越强。\n③势阱非对称使升温后平均原子间距增加，产生热膨胀。", "keyPoints": "①势阱深度反映结合强弱与熔点高低；②平衡位置曲率反映弹性模量大小；③势阱非对称导致升温热膨胀", "mnemonic": "【记忆口诀】阱深熔点结合高，曲率陡峭模量大；非谐不对称膨胀，宏观物性势阱定。", "pitfall": "这些是一般联系，不是所有材料间严格单调的定量规律；结合能也不等于熔化热。", "freq": "高频必背"}, {"id": "qa_01_09", "num": "01-09", "chapter": "ch1", "name": "01-09 主要化学键有哪些？分别举例并说明成键本质。", "title": "主要化学键有哪些？分别举例并说明成键本质。", "section": "叶 pp.27–30；第2章习题3。", "def": "① 离子键：电子转移后正负离子静电吸引，如 NaCl。\n② 共价键：原子共享价电子，如金刚石、Si。\n③ 金属键：金属离子实与离域电子共同形成结合，如 Cu。次级键包括范德华力与氢键，常见于分子之间或聚合物链之间。\n【教材第2章第3题】原子间的结合键可分为主价键和次价键。主价键包括离子键、金属键、共价键。", "keyPoints": "离子键：电子转移后正负离子静电吸引，如 NaCl；共价键：原子共享价电子，如金刚石、Si；金属键：金属离子实与离域电子共同形成结合，如 Cu；次级键包括范德华力与氢键，常见于分子之间或聚合物链之间", "mnemonic": "【记忆口诀】离子转移库仑吸，共价共用方向牢；金属电子气离域，分子氢键弱次价。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_01_10", "num": "01-10", "chapter": "ch1", "name": "01-10 主价键与次价键有什么区别？", "title": "主价键与次价键有什么区别？", "section": "叶 pp.27–30；第2章习题4。", "def": "主价键涉及价电子转移、共享或离域，通常较强，决定原子组成的基本骨架；次价键主要来自偶极相互作用，通常较弱，常控制分子间或链间结合。\n【教材第2章第4题】主价键即化学键，它通过电子的转移或共享两原子的电子云达到稳定结构；次价键通过分子间偶极子吸引力结合。", "keyPoints": "主价键涉及价电子转移、共享或离域，通常较强，决定原子组成的基本骨架；次价键主要来自偶极相互作用，通常较弱，常控制分子间或链间结合；氢键具有一定方向性，不能把所有次价键都说成无方向性", "mnemonic": "【记忆口诀】主价转移与共享，强度高且定骨架；次价偶极弱作用，控制链间与分子。", "pitfall": "氢键具有一定方向性，不能把所有次价键都说成无方向性。", "freq": "高频必背"}, {"id": "qa_01_11", "num": "01-11", "chapter": "ch1", "name": "01-11 为什么共价键具有方向性和饱和性？", "title": "为什么共价键具有方向性和饱和性？", "section": "叶 pp.28–29；第2章习题7。", "def": "① 方向性：共价键通过原子轨道重叠、共享电子形成。轨道在特定空间方向重叠更有效，可使成键能降低更多，因此键往往沿特定方向形成，进而限制邻近原子的排列。\n② 饱和性：可参与成键的价电子及相应轨道状态有限，在给定成键方式下形成一定数量的键后，不能无限增加同样的共价键。它不是“有空间就能继续塞入任意多个邻居”。\n③ 性能联系：强且有方向性的共价网络可产生较高硬度；塑性滑移若需要明显破坏或重组这些定向键，阻力常较大。注意分子内部也可以有强共价键，而分子之间仍靠较弱次价键，因此“含共价键”不等于整块材料必定像金刚石那样硬。\n【教材第2章第7题】在形成共价键时，为使电子云达到最大限度的重叠，共价键就有了方向性；成键的共用电子对数目是一定的，即共价键具有饱和性。", "keyPoints": "方向性：共价键通过原子轨道重叠、共享电子形成；轨道在特定空间方向重叠更有效，可使成键能降低更多，因此键往往沿特定方向形成，进而限制邻近原子的排列；饱和性：可参与成键的价电子及相应轨道状态有限，在给定成键方式下形成一定数量的键后，不能无限增加同样的共价键...", "mnemonic": "【记忆口诀】最大重叠方向显，有限轨道饱和明；三维强网高硬度，滑移受阻塑性难。", "pitfall": "饱和性：可参与成键的价电子及相应轨道状态有限，在给定成键方式下形成一定数量的键后，不能无限增加同样的共价键。", "freq": "高频必背"}, {"id": "qa_01_12", "num": "01-12", "chapter": "ch1", "name": "01-12 为什么金属通常既能导电又具有较好塑性？", "title": "为什么金属通常既能导电又具有较好塑性？", "section": "叶 pp.29–31；第2章习题8。", "def": "离域电子可在电场作用下定向运动，产生电流；金属键没有严格的方向性与饱和性，原子相对滑移后仍可保持结合。\n【教材第2章第8题】金属键不具有方向性和饱和性，当金属受力而改变原子之间的相互位置时不至于破坏金属键，故金属具有良好的延展性。", "keyPoints": "离域电子可在电场作用下定向运动，产生电流；金属键没有严格的方向性与饱和性，原子相对滑移后仍可保持结合；实际塑性还取决于滑移系、位错运动、晶界、温度等，不能仅凭金属键就断言任何金属均有良好塑性", "mnemonic": "【记忆口诀】离域电子自由动，金属成键无方向；层间滑移结合存，导电良好塑性优。", "pitfall": "实际塑性还取决于滑移系、位错运动、晶界、温度等，不能仅凭金属键就断言任何金属均有良好塑性。", "freq": "高频必背"}, {"id": "qa_01_13", "num": "01-13", "chapter": "ch1", "name": "01-13 离子晶体为什么通常硬而脆？", "title": "离子晶体为什么通常硬而脆？", "section": "叶 pp.27–31；第2章习题5衍生。", "def": "较强的离子结合使晶体具有较高硬度和较高熔点；不适当的滑移使同号离子相邻，排斥增强，且可开动的滑移系较少并受电中性等约束，裂纹容易扩展。\n【教材第2章第5题】结合键越强，材料的强度和硬度越高，熔点越高，热膨胀系数越小。", "keyPoints": "较强的离子结合使晶体具有较高硬度和较高熔点；不适当的滑移使同号离子相邻，排斥增强，且可开动的滑移系较少并受电中性等约束，裂纹容易扩展", "mnemonic": "【记忆口诀】强离子键熔点高，错位滑移同号斥；电中约束难开动，微裂易展呈脆性。", "pitfall": "不能说离子晶体在任何温度下都不能发生塑性变形。", "freq": "高频必背"}, {"id": "qa_01_14", "num": "01-14", "chapter": "ch1", "name": "01-14 不同结合方式怎样影响典型材料性能？", "title": "不同结合方式怎样影响典型材料性能？", "section": "叶 pp.27–31；第2章习题5。", "def": "① 金属键通常对应良好导电导热与可塑性。\n② 离子或强共价结合通常对应较高熔点、硬度及较低室温塑性。\n③ 分子间次价键较弱的材料通常软化温度较低、变形较容易。聚合物链内主价键、链间次价键并存，所以需结合结构共同解释。\n【教材第2章第5题】结合键越强，材料的强度和硬度越高，熔点越高，热膨胀系数越小。", "keyPoints": "金属键通常对应良好导电导热与可塑性；离子或强共价结合通常对应较高熔点、硬度及较低室温塑性；分子间次价键较弱的材料通常软化温度较低、变形较容易；聚合物链内主价键、链间次价键并存，所以需结合结构共同解释", "mnemonic": "【记忆口诀】金属导电且塑性，离子共价硬且脆；次价分子软化低，高分子看链与间。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_01_D01", "num": "01-15", "chapter": "ch1", "name": "01-15 原子结合能为什么通常大于熔化热？熔化是否把原子完全拆散？", "title": "原子结合能为什么通常大于熔化热？熔化是否把原子完全拆散？", "section": "叶 pp.25–26、30–31；正文原理推演，不是课后原题。", "def": "① 结论：对同一物质、相同物质量口径而言，将凝聚态原子完全分离到远离彼此的状态，所需能量通常大于仅使固体熔化的能量。\n② 原因：结合能描述原子由分离状态形成结合所降低的能量；熔化主要破坏晶体长程有序，使原子能相对运动。液体仍有短程有序与较强原子间相互作用，并没有变成彼此不作用的孤立原子。", "keyPoints": "结合能是完全拆成孤立原子所需功；熔化热仅打破固态长程有序，液态仍保留短程有序与分子间结合键。", "mnemonic": "【记忆口诀】结合拆散至无穷，熔化仅破长程序；短程尚存键未灭，结合能远胜熔化热。", "pitfall": "切勿把“熔化破坏结合”等同于“所有结合键全部消失”，两者口径完全不同；“熔化需要破坏结合”不等于“全部原子键完全消失”；比较前须统一每摩尔原子、分子或化学式单元的口径。结合能与熔化热不能直接代入同一公式相互替代。", "freq": "考纲深度细化"}, {"id": "qa_01_D02", "num": "01-16", "chapter": "ch1", "name": "01-16 为什么完全对称的非极性原子或分子之间也有吸引力？", "title": "为什么完全对称的非极性原子或分子之间也有吸引力？", "section": "叶 p.29；正文细分。", "def": "① 现象：惰性气体和非极性分子也能液化、凝固，说明无永久偶极矩不等于没有分子间作用。\n② 机制：电子分布会发生瞬时涨落，某时刻正负电荷中心可不重合，产生瞬时偶极；它又使邻近粒子的电子云极化，产生相关的诱导偶极，从而形成吸引作用。", "keyPoints": "瞬时偶极：电子分布瞬时涨落正负中心分离；诱导偶极：瞬时电场极化相邻原子电子云；两者相互吸引产生色散力。", "mnemonic": "【记忆口诀】瞬时涨落生电偶，极化邻近诱导生；非极性亦有色散力，范德华力遍物质。", "pitfall": "非极性分子无永久偶极矩，但仍具瞬时和诱导偶极，绝非先形成离子才能凝聚；永久偶极来自分子的长期电荷分布不对称，瞬时偶极则随时间变化。不能说非极性分子没有电子云、没有电荷，或认为它们必须先形成离子才能凝聚。", "freq": "考纲深度细化"}, {"id": "qa_01_D03", "num": "01-17", "chapter": "ch1", "name": "01-17 只知道势阱很深，能否精确判断弹性模量和热膨胀系数？", "title": "只知道势阱很深，能否精确判断弹性模量和热膨胀系数？", "section": "叶 pp.25–26、30–31；正文比较衍生。", "def": "① 结论：势阱深度、最低点附近曲率和非对称性分别对应不同信息，不能只由深度精确确定另外两项。\n② 机制：结合能主要看势阱深度；小应变弹性响应主要看平衡间距附近势能曲线的曲率，即原子偏离平衡时恢复力增长有多快；热膨胀与非谐性、势阱两侧不对称有关。\n③ 限制：强结合常与高模量、低热膨胀相关，是有物理依据的一般趋势，但两条势能曲线可以深度相近而宽窄或非对称程度不同。回答“为什么”时必须说出对应的曲线特征，不能把三种量说成同一个概念。", "keyPoints": "结合能对应势阱深度；弹性模量E对应势阱极小值处的曲率(二阶导数)；热膨胀系数对应势阱的非谐振非对称性。", "mnemonic": "【记忆口诀】势阱深浅看结合，曲率陡缓定模量；左右不对称热膨胀，三维特征互独立。", "pitfall": "深度大通常模量高、膨胀小，但这仅是一般趋势，不能断言由深度唯一确定模量或膨胀系数。", "freq": "考纲深度细化"}, {"id": "qa_02_01", "num": "02-01", "chapter": "ch2", "name": "02-01 晶体与非晶体的结构和宏观特征有何区别？", "title": "晶体与非晶体的结构和宏观特征有何区别？", "section": "叶 pp.32–34、46–47；第3章习题1。", "def": "晶体具有长程有序的周期结构，单晶常表现各向异性，并有确定的熔点；非晶体长程无序、短程有序，通常宏观各向同性，受热逐渐软化。多晶体若晶粒随机取向可近似各向同性，有织构时则不一定。\n【教材第3章第1题】周期性、自限性、对称性、均匀性、各向异性。", "keyPoints": "晶体具有长程有序的周期结构，单晶常表现各向异性，并有确定的熔点；非晶体长程无序、短程有序，通常宏观各向同性，受热逐渐软化；多晶体若晶粒随机取向可近似各向同性，有织构时则不一定", "mnemonic": "【记忆口诀】晶体周期长程序，确切熔点各向异；非晶混乱短程序，渐进软化各向同。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_02", "num": "02-02", "chapter": "ch2", "name": "02-02 点阵、基元、晶体结构和晶胞之间是什么关系？", "title": "点阵、基元、晶体结构和晶胞之间是什么关系？", "section": "叶 pp.34–36；第3章习题2、3。", "def": "① 点阵描述周期平移规律，每个格点周围环境等同。\n② 基元是附着于格点的原子或原子组合。\n③ 晶体结构等于点阵加基元。\n④ 晶胞是通过平移重复构成晶体的基本空间单元。\n【教材第3章第2题】二维立方点阵，结构基元为一大一小两个原子。", "keyPoints": "点阵描述周期平移规律，每个格点周围环境等同；基元是附着于格点的原子或原子组合；晶体结构等于点阵加基元；晶胞是通过平移重复构成晶体的基本空间单元；格点不是必然对应一个原子，Cu、NaCl、可有相同布拉菲点阵而基元不同", "mnemonic": "【记忆口诀】点阵抽象周期网，基元附着格点旁；结构点阵加基元，平移重复成晶邦。", "pitfall": "格点不是必然对应一个原子，Cu、NaCl、可有相同布拉菲点阵而基元不同。", "freq": "核心考点"}, {"id": "qa_02_03", "num": "02-03", "chapter": "ch2", "name": "02-03 七大晶系与十四种布拉菲点阵如何对应？", "title": "七大晶系与十四种布拉菲点阵如何对应？", "section": "叶 pp.36–38；第3章习题7衍生。", "def": "① 对应关系：三斜：简单，共1种。\n② 单斜：简单、底心，共2种。\n③ 正交：简单、底心、体心、面心，共4种。\n④ 四方：简单、体心，共2种。\n⑤ 三方：菱方点阵，共1种。\n⑥ 六方：简单六方，共1种。\n⑦ 立方：简单、体心、面心，共3种。合计。\n⑧ 为什么不是28种：将7个晶系分别配上4种中心化并不保证都保持该晶系对称性，也不保证得到相互独立的平移点阵；某些组合可通过重新选胞化为已存在的点阵表示。\n⑨ 答题层次：晶系先按对称性及对应晶格度量分类；布拉菲点阵进一步考虑平移排列与中心化。HCP是带有两原子基元的晶体结构，不能把“HCP”直接当成新增的一种第15类布拉菲点阵。\n【教材第3章第7题】立方晶系。", "keyPoints": "对应关系：三斜：简单，共1种；单斜：简单、底心，共2种；正交：简单、底心、体心、面心，共4种；四方：简单、体心，共2种；三方：菱方点阵，共1种；六方：简单六方，共1种；立方：简单、体心、面心，共3种；合计；为什么不是28种：将7个晶系分别配上4种中心化并不保证都保持该晶系对称性，也不保证得到相互独立的平移点阵；某些组合可通过重新选胞化为已存在的点阵表示...", "mnemonic": "【记忆口诀】三斜单斜正四方，立方菱六共七系；初基加心布拉维，十四点阵不可多。", "pitfall": "为什么不是28种：将7个晶系分别配上4种中心化并不保证都保持该晶系对称性，也不保证得到相互独立的平移点阵。", "freq": "核心考点"}, {"id": "qa_02_04", "num": "02-04", "chapter": "ch2", "name": "02-04 为什么没有独立的面心四方点阵？底心和面心有何区别？", "title": "为什么没有独立的面心四方点阵？底心和面心有何区别？", "section": "叶 pp.37–38；正文衍生。", "def": "面心四方可重新选取晶胞，等价表示为体心四方，因此不另计一种。底心是某一对相对面的面心有格点；面心是三对相对面均有格点。判断独立点阵既要考虑对称性，也要排除能通过重新选胞得到的重复表示。", "keyPoints": "面心四方可重新选取晶胞，等价表示为体心四方，因此不另计一种；底心是某一对相对面的面心有格点；面心是三对相对面均有格点；判断独立点阵既要考虑对称性，也要排除能通过重新选胞得到的重复表示", "mnemonic": "【记忆口诀】面心四方重选胞，几何等价体心四；底心仅限一对面，面心三对皆有心。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_05", "num": "02-05", "chapter": "ch2", "name": "02-05 如何确定晶向指数和晶面指数？", "title": "如何确定晶向指数和晶面指数？", "section": "叶 pp.39–43；第3章习题4、5。", "def": "① 晶向：取方向平行矢量，按晶轴单位表示分量，化为最简整数，写成 [uvw]。\n② 晶面：求对晶轴截距，取倒数后化为最简整数，写成 (hkl)；平行某轴时该指数为零；过原点平面先平移到不过原点的平行平面。负指数加上划线。\n【教材第3章第4题】（原答案文件为晶胞内晶面示意图）：(112) 面与 (001) 面。", "keyPoints": "晶向：取方向平行矢量，按晶轴单位表示分量，化为最简整数，写成 [uvw] ；晶面：求对晶轴截距，取倒数后化为最简整数，写成 (hkl)；平行某轴时该指数为零；过原点平面先平移到不过原点的平行平面；负指数加上划线", "mnemonic": "【记忆口诀】晶向分量化最简，晶面截距取倒数；负号上划最简整，方括晶向圆括面。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_06", "num": "02-06", "chapter": "ch2", "name": "02-06 晶面族、晶向族与单个晶面、晶向有什么区别？", "title": "晶面族、晶向族与单个晶面、晶向有什么区别？", "section": "叶 pp.39–43；正文。", "def": "[uvw] 表示一个晶向，⟨uvw⟩ 表示由晶体对称性关联的一组等价晶向族；(hkl) 表示一组平行晶面取向，{hkl} 表示等价晶面族。", "keyPoints": "[uvw] 表示一个晶向，⟨uvw⟩ 表示由晶体对称性关联的一组等价晶向族；(hkl) 表示一组平行晶面取向，{hkl} 表示等价晶面族；族内等价来自对称性，不是任意交换或改号都在任意晶系中成立", "mnemonic": "【记忆口诀】晶向方括晶向族尖，晶面圆括晶面族花；对称操作关联等，非立晶系勿乱转。", "pitfall": "族内等价来自对称性，不是任意交换或改号都在任意晶系中成立。", "freq": "核心考点"}, {"id": "qa_02_07", "num": "02-07", "chapter": "ch2", "name": "02-07 什么时候可以把 [hkl] 晶向当作 (hkl) 晶面的法向？", "title": "什么时候可以把 [hkl] 晶向当作 (hkl) 晶面的法向？", "section": "叶 pp.39–43；第3章习题6衍生。", "def": "① 适用前提：仅在立方晶系的正交且等长晶轴系（a = b = c，α = β = γ = 90°）中，指数相同的晶向 [hkl] 才严格与同指数晶面 (hkl) 相互垂直，可直接作为法向。\n② 严禁乱套：在四方、正交、单斜、三斜和六方等非立方晶系中，因晶轴长度不相等或轴间角不全为 90°，指数相同的晶向与晶面通常并不垂直，绝不能直接将 [hkl] 当作 (hkl) 的法向。\n③ 晶向夹角计算：立方晶系中两个晶向的夹角通过方向矢量点积公式求解，即 cosθ = (u_1·u_2 + v_1·v_2 + w_1·w_2) / (√(u_1² + v_1² + w_1²) · √(u_2² + v_2² + w_2²))。例如 [110] 与 [11̄0] 点积为 1·1 + 1·(-1) + 0·0 = 0，两者夹角为 90°（不是 45°）。\n【教材第3章第6题】代表矢量长度为 √2a，夹角 45°（原答案文件写法为：l = √2a，夹角45°）。", "keyPoints": "仅在立方晶系等长正交晶轴中 [hkl] 垂直于 (hkl)；非立方晶系绝不能直接套用；晶向夹角由方向矢量点积求出，[110] 与 [11̄0] 夹角为 90°。", "mnemonic": "【记忆口诀】立方正交轴等长，同标晶向垂直面；非立晶系不可套，法向夹角点积求。", "pitfall": "非立方晶系中晶轴不等长或夹角不正交，[hkl] 并不垂直于 (hkl)，严禁直接当作法向。", "freq": "核心考点"}, {"id": "qa_02_08", "num": "02-08", "chapter": "ch2", "name": "02-08 六方晶系为什么采用四指数？基面如何表示？", "title": "六方晶系为什么采用四指数？基面如何表示？", "section": "叶 pp.42–43；第3章习题8。", "def": "① 引入基面内互成 120° 的三根等价轴 (a1, a2, a3)，加上垂直基面的 c 轴，可更直观表示六方对称性。\n② 晶面 (hkil) 满足 i = -(h+k)，晶向 [uvtw] 满足 t = -(u+v)。\n③ 基面平行三根基面轴，截 c 轴，写作 (0001)。\n【教材第3章第8题】为了更好地表达等价晶面和晶向的关系。转换关系略。", "keyPoints": "引入基面内互成 120° 的三根等价轴 (a1, a2, a3)，加上垂直基面的 c 轴，可更直观表示六方对称性；晶面 (hkil) 满足 i = -(h+k)，晶向 [uvtw] 满足 t = -(u+v) ；基面平行三根基面轴，截 c 轴，写作 (0001)", "mnemonic": "【记忆口诀】六方引入三基轴，基面夹角百二度；晶面四轴和为零，直观显现六方称。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_09", "num": "02-09", "chapter": "ch2", "name": "02-09 简单立方、体心立方、面心立方的原子数、配位数和致密度如何比较？", "title": "简单立方、体心立方、面心立方的原子数、配位数和致密度如何比较？", "section": "叶 pp.49–53；第4章习题1–5衍生。", "def": "① 按常规晶胞：SC 为1个原子、配位数6、致密度约0.52。\n② BCC 为2个、8、约0.68。\n③ FCC 为4个、12、约0.74。顶点原子计入1/8，面心计入1/2，体心计入1。\n【教材第4章第1题】6.62 × 10^-2 nm³（或 6.62 × 10² nm³，按原答案文件数值校核）。", "keyPoints": "按常规晶胞：SC 为1个原子、配位数6、致密度约0.52；BCC 为2个、8、约0.68； FCC 为4个、12、约0.74；顶点原子计入1/8，面心计入1/2，体心计入1；不要把晶胞图中画出的球数当作晶胞原子数", "mnemonic": "【记忆口诀】单立一原子配位六，体心二原配位八；面心四原配十二，致密七四面心赢。", "pitfall": "不要把晶胞图中画出的球数当作晶胞原子数。", "freq": "核心考点"}, {"id": "qa_02_10", "num": "02-10", "chapter": "ch2", "name": "02-10 三种立方结构的晶格常数与原子半径是什么关系？", "title": "三种立方结构的晶格常数与原子半径是什么关系？", "section": "叶 pp.50–53；第4章习题1–5衍生。", "def": "① 简单立方 (SC)：原子沿晶胞立方棱相切，几何关系为 a = 2R。\n② 体心立方 (BCC)：原子沿立方体对角线相切，体对角线长等于 4 个原子半径，几何关系为 √3·a = 4R（即 a = 4R / √3 ≈ 2.309R）。\n③ 面心立方 (FCC)：原子沿立方体面对角线相切，面对角线长等于 4 个原子半径，几何关系为 √2·a = 4R（即 a = 2√2·R ≈ 2.828R）。\n【教材第4章第1题】6.62 × 10^-2 nm³（或 6.62 × 10² nm³，按原答案文件数值校核）。", "keyPoints": "SC 沿棱相切 a = 2R；BCC 沿体对角线相切 √3·a = 4R (a = 4R/√3)；FCC 沿面对角线相切 √2·a = 4R (a = 2√2·R)；相切关系取决于最近邻原子连线", "mnemonic": "【记忆口诀】单立棱边等于二，体心体对二乘径；面心面对紧密贴，几何相切算晶胞。", "pitfall": "晶格常数与原子半径的关系严格来自晶胞中最近邻原子的几何相切连线（SC 棱边、BCC 体对角线、FCC 面对角线），绝不能对所有结构都盲目误套 a = 2R。", "freq": "核心考点"}, {"id": "qa_02_11", "num": "02-11", "chapter": "ch2", "name": "02-11 FCC 与 HCP 有何相同和不同？", "title": "FCC 与 HCP 有何相同和不同？", "section": "叶 pp.52–54；第4章习题3衍生。", "def": "① 相同点：FCC 与 HCP 在理想等径硬球模型中，配位数均为 12，空间致密度均为约 0.74，且密排面内的二维原子排列完全等价。\n② 不同点：两者的密排层堆垛顺序不同。FCC 为 ABCABC... 三层周期重复；HCP 为 ABAB... 两层周期重复。\n③ 晶体参数：理想 HCP 的晶轴轴比为 c/a = √(8/3) ≈ 1.633；常规完整六方柱晶胞含 6 个原子，而菱方原胞仅含 2 个原子。\n【教材第4章第3题】证明思路：HCP 晶胞结构中，四面体 JKLM 的边长为 a，高度为 c/2。", "keyPoints": "FCC 与 HCP 配位数均为 12、致密度均为 0.74；FCC 为 ABC 堆垛，HCP 为 AB 堆垛；理想 HCP 轴比 c/a = √(8/3) ≈ 1.633；完整六方柱含 6 原子，原胞含 2 原子", "mnemonic": "【记忆口诀】面心ABC密堆，六方ABAB重叠；致密配位虽相同，滑移对称大不同。", "pitfall": "完整六方柱含 6 个原子，原胞含 2 个原子，使用前必须说明选胞方式，不可混淆原子数与堆垛周期；答题计算或说明配位数与致密度时，必须先明确指明所选晶胞是 6 个原子的完整六方柱还是 2 个原子的原胞，切忌混淆。", "freq": "核心考点"}, {"id": "qa_02_12", "num": "02-12", "chapter": "ch2", "name": "02-12 常见金属结构及其密排面、密排方向是什么？", "title": "常见金属结构及其密排面、密排方向是什么？", "section": "叶 pp.50–55、139–140；正文。", "def": "① 面心立方 (FCC)：常见金属包括 Al、Cu、Ni、Ag、γ-Fe 等；密排晶面族为 {111}，密排晶向族为 ⟨110⟩。\n② 体心立方 (BCC)：常见金属包括室温 α-Fe、Cr、Mo、W 等；无 FCC 式严格密排面，最密排晶面族为 {110}，最密排晶向族为 ⟨111⟩。\n③ 密排六方 (HCP)：常见金属包括 Mg、Zn、α-Ti、Cd 等；密排面为基面 (0001)，密排晶向族为 ⟨112̄0⟩。", "keyPoints": "FCC（Al/Cu/Ni）密排面 {111}、密排向 ⟨110⟩；BCC（α-Fe/Cr/W）无严格密排面，最密面 {110}、最密向 ⟨111⟩；HCP（Mg/Zn/Ti）密排面 (0001)、密排向 ⟨112̄0⟩", "mnemonic": "【记忆口诀】理论密度看晶胞，原数原子量作分子；晶胞体积阿伏伽德罗，分母相乘算密度。", "pitfall": "BCC 中没有原子直接相切的绝对密排面，{110} 仅为最密面，不可混同于 FCC 的密排面 {111}；BCC 中没有原子完全相互接触的绝对密排面，{110} 仅为面密度相对最大的最密面，不能答成“密排面”。", "freq": "核心考点"}, {"id": "qa_02_13", "num": "02-13", "chapter": "ch2", "name": "02-13 如何用晶体结构计算理论密度？影响密度的因素有哪些？", "title": "如何用晶体结构计算理论密度？影响密度的因素有哪些？", "section": "叶 pp.52–53；第4章习题4、5、7衍生。", "def": "理论密度计算公式为 ρ = (n·M) / (V_c·N_A)，其中 n 为晶胞内原子数或化学式单元数，M 为摩尔质量（必须与其计数对象一致），V_c 为晶胞体积，N_A 为阿伏伽德罗常数。密度取决于原子质量、晶胞体积与占位数；致密度高不意味着不同元素间的质量密度一定更大。\n【教材第4章第4题】7.90 g/cm³。", "keyPoints": "理论密度公式 ρ = (n·M)/(V_c·N_A)；n 为单胞内原子数或化学式单元数；M 与计数对象一致；密度受原子质量、晶胞体积与点阵占位数共同决定。", "mnemonic": "【记忆口诀】离子化合物看化学式，阳阴离子算单元；面心点阵四单元，摩尔质量换密度。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_14", "num": "02-14", "chapter": "ch2", "name": "02-14 什么是四面体和八面体间隙？FCC 中各有多少？", "title": "什么是四面体和八面体间隙？FCC 中各有多少？", "section": "叶 pp.54–55；正文。", "def": "分别由4个、6个近邻原子包围形成的间隙位置。每个 FCC 常规晶胞有8个四面体间隙、4个八面体间隙；理想密排硬球模型可容纳半径比分别约0.225和0.414。", "keyPoints": "分别由4个、6个近邻原子包围形成的间隙位置；每个 FCC 常规晶胞有8个四面体间隙、4个八面体间隙；理想密排硬球模型可容纳半径比分别约0.225和0.414；间隙大小与周围原子排列有关，不能只用整体致密度判断", "mnemonic": "【记忆口诀】密排面内原子密，沿面滑移阻力小；原子间距最小向，线密度大阻力低。", "pitfall": "间隙大小与周围原子排列有关，不能只用整体致密度判断。", "freq": "核心考点"}, {"id": "qa_02_15", "num": "02-15", "chapter": "ch2", "name": "02-15 固溶体如何分类？固溶体与化合物有何区别？", "title": "固溶体如何分类？固溶体与化合物有何区别？", "section": "叶 pp.56–60；正文。", "def": "① 按占位分置换固溶体与间隙固溶体，按溶解范围分有限与无限固溶体。\n② 固溶体保留溶剂基本晶体结构，溶质在其中分布。化合物具有区别于组成元素的结构及较明确的成分关系。\n③ 实际化合物也可有一定成分范围，不宜一概称其成分绝对固定。", "keyPoints": "按占位分置换固溶体与间隙固溶体，按溶解范围分有限与无限固溶体；固溶体保留溶剂基本晶体结构，溶质在其中分布；化合物具有区别于组成元素的结构及较明确的成分关系；实际化合物也可有一定成分范围，不宜一概称其成分绝对固定", "mnemonic": "【记忆口诀】四面体间隙配位四，八面体间隙配位六；间隙尺寸几何算，八面体大容杂质。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_16", "num": "02-16", "chapter": "ch2", "name": "02-16 影响置换固溶度的主要因素是什么？", "title": "影响置换固溶度的主要因素是什么？", "section": "叶 pp.56–57；正文。", "def": "① 尺寸因素：溶质与溶剂原子尺寸越接近，置换引起的弹性畸变通常越小，较有利于固溶；教材列出约14%—15%的尺寸差经验规则，但它不是判断所有体系是否能固溶的绝对界限。\n② 化学与电子因素：电负性差较大时可能更倾向形成化合物；价态和合金电子浓度也影响固溶体稳定。教材还讨论相对价效应及某些合金的极限电子浓度，不能把影响因素压缩成仅有原子大小。\n③ 结构与温度：相同晶体结构是形成无限置换固溶体的重要必要条件之一，但不是单独充分条件。温度改变混合自由能及可能的竞争相，许多体系升温会提高固溶度。", "keyPoints": "尺寸因素：溶质与溶剂原子尺寸越接近，置换引起的弹性畸变通常越小，较有利于固溶；教材列出约14%—15%的尺寸差经验规则，但它不是判断所有体系是否能固溶的绝对界限；化学与电子因素：电负性差较大时可能更倾向形成化合物；价态和合金电子浓度也影响固溶体稳定；教材还讨论相对价效应及某些合金的极限电子浓度，不能把影响因素压缩成仅有原子大小...", "mnemonic": "【记忆口诀】十五定则看尺寸，电负相差莫过大；相对价大易固溶，晶体同构无限溶。", "pitfall": "教材列出约14%—15%的尺寸差经验规则，但它不是判断所有体系是否能固溶的绝对界限；完整答案应按尺寸、化学、电子、结构、温度依次说明作用，而不是背出一个15% 数字。", "freq": "核心考点"}, {"id": "qa_02_17", "num": "02-17", "chapter": "ch2", "name": "02-17 为什么间隙固溶体通常是有限固溶体？", "title": "为什么间隙固溶体通常是有限固溶体？", "section": "叶 pp.54–57；正文。", "def": "① 间隙尺寸有限，溶质需足够小才能进入。\n② 进入后引起较强晶格畸变，随浓度增加弹性能上升，可能促使第二相形成。间隙数目很多不等于这些间隙能同时被完全占满。\n③ 固溶度由热力学与结构共同决定。", "keyPoints": "间隙尺寸有限，溶质需足够小才能进入；进入后引起较强晶格畸变，随浓度增加弹性能上升，可能促使第二相形成；间隙数目很多不等于这些间隙能同时被完全占满；固溶度由热力学与结构共同决定", "mnemonic": "【记忆口诀】原子尺寸差小于十五，电负相近结构同；各向条件皆具备，连续互溶无限通。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_18", "num": "02-18", "chapter": "ch2", "name": "02-18 金属间化合物有哪些类型？其形成受什么控制？", "title": "金属间化合物有哪些类型？其形成受什么控制？", "section": "叶 pp.57–60；正文。", "def": "可按主要控制因素讨论正常价化合物、电子化合物与尺寸因素主导的化合物等；分别与电负性或价态、电子浓度、原子尺寸及几何配位有关。", "keyPoints": "可按主要控制因素讨论正常价化合物、电子化合物与尺寸因素主导的化合物等；分别与电负性或价态、电子浓度、原子尺寸及几何配位有关；答题宜说明“形成因素 —结构特点—性能”，通常较硬、塑性较低，但不能把全部金属间化合物概括为同一结构", "mnemonic": "【记忆口诀】间隙原子挤晶格，局部畸变弹性高；晶格间隙数量限，间隙固溶必有限。", "pitfall": "答题宜说明“形成因素 —结构特点—性能”，通常较硬、塑性较低，但不能把全部金属间化合物概括为同一结构。", "freq": "核心考点"}, {"id": "qa_02_19", "num": "02-19", "chapter": "ch2", "name": "02-19 离子晶体结构受哪些因素控制？", "title": "离子晶体结构受哪些因素控制？", "section": "叶 pp.60–64；正文。", "def": "主要考虑电中性、正负离子半径比及相应配位稳定性。化学计量需使正负电荷平衡；半径比影响阳离子可稳定占据的配位位置。半径比规则是几何近似，实际结构还受键的共价性、极化及温压条件影响。", "keyPoints": "主要考虑电中性、正负离子半径比及相应配位稳定性；化学计量需使正负电荷平衡；半径比影响阳离子可稳定占据的配位位置；半径比规则是几何近似，实际结构还受键的共价性、极化及温压条件影响", "mnemonic": "【记忆口诀】组元形成新晶体，中间相在相图居；金属间化结合强，高熔高硬强化相。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_20", "num": "02-20", "chapter": "ch2", "name": "02-20 NaCl、CsCl、闪锌矿和萤石结构怎样区分？", "title": "NaCl、CsCl、闪锌矿和萤石结构怎样区分？", "section": "叶 pp.60–64；正文。", "def": "① NaCl：两类离子互为八面体配位，配位数 6∶6。\n② CsCl：立方配位，配位数 8∶8；其两种离子不等价，不能简单称为体心立方布拉菲点阵。\n③ 闪锌矿（ZnS）：四面体配位，配位数 4∶4。\n④ 萤石（CaF2）：Ca 配位 8，F 配位 4，且满足 1∶2 化学计量。", "keyPoints": "NaCl：两类离子互为八面体配位，配位数6∶6；CsCl：立方配位8∶8，其两种离子不等价，不能简单称为体心立方布拉菲点阵；闪锌矿 ZnS：四面体配位4∶4；萤石：Ca 配位8，F 配位4，且满足1∶2化学计量", "mnemonic": "【记忆口诀】电子浓度e比a，特定晶构定相型；贝塔体心伽马复，电子化合物定规律。", "pitfall": "CsCl：立方配位8∶8，其两种离子不等价，不能简单称为体心立方布拉菲点阵。", "freq": "核心考点"}, {"id": "qa_02_21", "num": "02-21", "chapter": "ch2", "name": "02-21 如何解释教材配位数4与半径比0.414的习题疑点？", "title": "如何解释教材配位数4与半径比0.414的习题疑点？", "section": "叶 p.61、p.77；第4章习题6。", "def": "三维正四面体配位数4的最低半径比是约0.225；0.414通常对应三维八面体配位数6，或二维正方形四配位模型。答题应先说明所用几何模型。\n【教材第4章第6题】证明思路：配位数为 4 时，阴离子和阳离子正好沿边缘接触，2√2 R_阴 = 2R_阴 + 2R_阳，可得半径比 0.414。", "keyPoints": "三维正四面体配位数4的最低半径比是约0.225；0.414通常对应三维八面体配位数6，或二维正方形四配位模型；答题应先说明所用几何模型；不能把二维正方形推导直接当作三维四面体结论", "mnemonic": "【记忆口诀】非金过渡半径比，点五九为临界线；比小简单晶体构，比大复杂结构现。", "pitfall": "不能把二维正方形推导直接当作三维四面体结论。", "freq": "核心考点"}, {"id": "qa_02_22", "num": "02-22", "chapter": "ch2", "name": "02-22 金刚石与石墨为何同为碳却性能相差很大？", "title": "金刚石与石墨为何同为碳却性能相差很大？", "section": "叶 pp.64–65、74–75；正文。", "def": "① 金刚石中碳以强共价键形成三维四面体网络，硬度高。\n② 石墨中碳形成层状结构，层内结合强、层间结合弱，易沿层滑移。石墨具有较强各向异性及沿层方向的导电能力。\n③ 差异来自原子结合与排列方式，而非化学元素不同。", "keyPoints": "金刚石中碳以强共价键形成三维四面体网络，硬度高；石墨中碳形成层状结构，层内结合强、层间结合弱，易沿层滑移；石墨具有较强各向异性及沿层方向的导电能力；差异来自原子结合与排列方式，而非化学元素不同", "mnemonic": "【记忆口诀】大小两原子精密配，配位多面体高配位；拓扑密堆空间满，拉弗斯相强度高。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_23", "num": "02-23", "chapter": "ch2", "name": "02-23 聚合物的基本结构、聚合度与分子量如何理解？", "title": "聚合物的基本结构、聚合度与分子量如何理解？", "section": "叶 pp.65–70；第4章习题8–10衍生。", "def": "聚合物由重复单元组成长链，聚合度表示每条分子链所含重复单元数。实际样品链长分布不一，因此使用数均、重均分子量；一般重均分子量不小于数均分子量。计算需区分单体与重复单元，缩聚时要考虑小分子的脱除。\n【教材第4章第8题】① 聚三氟氯乙烯：-[CF2-CFCl]-； ② 聚乙烯醇：-[CH2-CH(OH)]-。", "keyPoints": "聚合物由重复单元组成长链，聚合度表示每条分子链所含重复单元数；实际样品链长分布不一，因此使用数均、重均分子量；一般重均分子量不小于数均分子量；计算需区分单体与重复单元，缩聚时要考虑小分子的脱除", "mnemonic": "【记忆口诀】重复单元长链连，聚合度定分子量；共价主链次价间，分子形态看构型。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_24", "num": "02-24", "chapter": "ch2", "name": "02-24 聚合物链结构如何分类？结构如何影响性能？", "title": "聚合物链结构如何分类？结构如何影响性能？", "section": "叶 pp.68–74；正文。", "def": "可分线型、支化、交联及网状结构；链越规整越容易紧密堆积，支化通常妨碍结晶，交联限制链段与分子链相对运动。适度交联有利于橡胶弹性，密集三维交联则提高刚性和耐热性，但使再熔融加工困难。", "keyPoints": "可分线型、支化、交联及网状结构；链越规整越容易紧密堆积，支化通常妨碍结晶，交联限制链段与分子链相对运动；适度交联有利于橡胶弹性，密集三维交联则提高刚性和耐热性，但使再熔融加工困难", "mnemonic": "【记忆口诀】聚合分子量分散，数均重均不相同；分子量分布表宽度，性能依赖重均值。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_25", "num": "02-25", "chapter": "ch2", "name": "02-25 热塑性与热固性聚合物有何区别？", "title": "热塑性与热固性聚合物有何区别？", "section": "叶 pp.70–74；第4章习题11。", "def": "热塑性聚合物以线型或支化链为主，加热可软化、冷却固化，通常可重复成形，如 PE；热固性聚合物固化后形成交联网络，再加热不重新熔融而可能分解，如固化环氧树脂。\n【教材第4章第11题】① 热塑性聚合物具有线型和支链结构，而热固性聚合物的结构通常是交联结构或网状结构。 ② 热塑性聚合物在加热时变软，冷却时变硬，而热固性聚合物在加热时变硬，再加热也不会变软。", "keyPoints": "热塑性聚合物以线型或支化链为主，加热可软化、冷却固化，通常可重复成形，如 PE；热固性聚合物固化后形成交联网络，再加热不重新熔融而可能分解，如固化环氧树脂；区别核心是结构与受热行为，不能只按软硬判断", "mnemonic": "【记忆口诀】线型支链热塑性，加热软化冷却硬；体型网状热固性，固化不熔耐热高。", "pitfall": "区别核心是结构与受热行为，不能只按软硬判断。", "freq": "核心考点"}, {"id": "qa_02_26", "num": "02-26", "chapter": "ch2", "name": "02-26 结晶聚合物与非晶聚合物如何区别？哪些因素影响结晶度？", "title": "结晶聚合物与非晶聚合物如何区别？哪些因素影响结晶度？", "section": "叶 pp.71–74；第4章习题12。", "def": "① 聚合物常为晶区与非晶区共存的半结晶体。\n② 链的规整性、对称性、支化、交联、分子量及冷却条件影响结晶。链越规整越易排列。\n③ 分子量增大常因缠结、迁移困难使结晶速度降低或在给定条件下结晶度下降。\n【教材第4章第12题】随着分子量的增加，分子间作用力增强，分子运动受到限制，聚合物链难以有序排列和结晶。", "keyPoints": "聚合物常为晶区与非晶区共存的半结晶体；链的规整性、对称性、支化、交联、分子量及冷却条件影响结晶；链越规整越易排列；分子量增大常因缠结、迁移困难使结晶速度降低或在给定条件下结晶度下降；该趋势需说明比较条件，不能理解为绝对定律", "mnemonic": "【记忆口诀】片晶折叠形成核，球晶生长向外延；规整慢冷易结晶，侧基庞大结晶难。", "pitfall": "该趋势需说明比较条件，不能理解为绝对定律。", "freq": "核心考点"}, {"id": "qa_02_27", "num": "02-27", "chapter": "ch2", "name": "02-27 玻璃化转变与熔融有什么区别？弹性体为何需要适度交联？", "title": "玻璃化转变与熔融有什么区别？弹性体为何需要适度交联？", "section": "叶 pp.71–74、120–123、164–166；正文。", "def": "① 玻璃化转变反映非晶链段运动能力的改变，玻璃态转为高弹态。\n② 熔融是晶区有序结构消失。弹性体通常在玻璃化温度以上使用，拉伸时链由卷曲趋于伸展，卸载后趋于恢复。", "keyPoints": "玻璃化转变反映非晶链段运动能力的改变，玻璃态转为高弹态；熔融是晶区有序结构消失；弹性体通常在玻璃化温度以上使用，拉伸时链由卷曲趋于伸展，卸载后趋于恢复；少量交联防止链整体不可逆滑移，过多交联会限制伸长", "mnemonic": "【记忆口诀】离子晶体看半径比，多面配位定结构；电荷中性须守恒，岩盐闪锌结构殊。", "pitfall": "少量交联防止链整体不可逆滑移，过多交联会限制伸长。", "freq": "核心考点"}, {"id": "qa_02_28", "num": "02-28", "chapter": "ch2", "name": "02-28 同素异构、多晶型和同分异构有什么区别？", "title": "同素异构、多晶型和同分异构有什么区别？", "section": "叶 pp.74–77；正文。", "def": "① 同素异构：同一元素具有不同晶体结构，如纯铁的 α-Fe、γ-Fe、δ-Fe。\n② 多晶型：更一般地指相同化学成分的物质（单质或化合物）具有不同晶体结构，如 TiO2 的金红石与锐钛矿型。\n③ 同分异构：指分子式相同但分子内原子连接方式或空间排列不同（常见于有机高分子与小分子），属于分子结构差异。", "keyPoints": "同素异构指同一元素不同晶体结构；多晶型指同成分物质不同晶体结构；同分异构指分子式相同而原子连接或空间排列不同", "mnemonic": "【记忆口诀】硅氧四面体骨架，共顶交织网络成；修饰剂破网降熔度，无机玻璃形容易。", "pitfall": "切勿把有机分子层面的“同分异构”与晶体学层面的“同素异构/多晶型（堆垛与晶格差异）”混为一谈。", "freq": "核心考点"}, {"id": "qa_02_29", "num": "02-29", "chapter": "ch2", "name": "02-29 六方晶系三指数与四指数怎样转换？晶面和晶向能否用同一套公式？", "title": "六方晶系三指数与四指数怎样转换？晶面和晶向能否用同一套公式？", "section": "叶 pp.42–43；第3章习题8。", "def": "① 同一六方轴约定下，晶面直接为 i = -(h+k)。\n② 晶向 [UVW] 转四指数 [uvtw] 时：u = (2U-V)/3，v = (2V-U)/3，t = -(u+v)，w = W，最后整体化成最简整数；反向 U = 2u+v，V = 2v+u，W = w。\n【教材第3章第8题】为了更好地表达等价晶面和晶向的关系。转换关系略。", "keyPoints": "同一六方轴约定下，晶面直接为 i = -(h+k) ；晶向 [UVW] 转四指数 [uvtw] 时：u = (2U-V)/3，v = (2V-U)/3，t = -(u+v)，w = W，最后整体化成最简整数；反向 U = 2u+v，V = 2v+u，W = w；晶面是截距倒数规则，晶向是矢量分解，不能混用转换式", "mnemonic": "【答题抓手】扣准六方晶系三指、数与四指数怎、样转换晶面和，紧扣物理机制与适用条件展开", "pitfall": "晶面是截距倒数规则，晶向是矢量分解，不能混用转换式。", "freq": "核心考点"}, {"id": "qa_02_30", "num": "02-30", "chapter": "ch2", "name": "02-30 聚合物数均分子量、重均分子量和分散性如何表达？", "title": "聚合物数均分子量、重均分子量和分散性如何表达？", "section": "叶 pp.66–70；第4章习题9、10。", "def": "① 数均分子量 M_n = Σ(N_i·M_i)/ΣN_i，重均分子量 M_w = Σ(w_i·M_i)。\n② 后者使大分子链权重更高。分散度指数 PDI = M_w / M_n，所有链分子量相同时取1。若题目给的是质量分数，则不能直接当作数目分数代入。\n③ 聚合度需除以对应重复单元分子量。\n【教材第4章第9题】① 62.49 g/mol；② 192.16 g/mol；③ 254.27 g/mol；④ 74.16 g/mol。", "keyPoints": "数均分子量 M_n 与重均分子量 M_w 公式；M_w 赋予大分子链更高权重；分散度指数 PDI = M_w/M_n；求聚合度须除以重复单元分子量。", "mnemonic": "【答题抓手】扣准聚合物数均分、子量、重均分子量和，紧扣物理机制与适用条件展开", "pitfall": "若题目给的是质量分数，则不能直接当作数目分数代入。", "freq": "核心考点"}, {"id": "qa_02_31", "num": "02-31", "chapter": "ch2", "name": "02-31 聚合物的立构规整性和共聚序列怎样影响结晶？", "title": "聚合物的立构规整性和共聚序列怎样影响结晶？", "section": "叶 pp.68–74；正文。", "def": "侧基排列可呈等规、间规或无规等形式，共聚单元可呈无规、交替、嵌段或接枝等分布。较规整、易重复堆积的链通常更利于结晶，不规则侧基或序列常阻碍排列；但最终结晶还受链柔性、支化、热历史和组成共同控制。", "keyPoints": "侧基排列可呈等规、间规或无规等形式，共聚单元可呈无规、交替、嵌段或接枝等分布；较规整、易重复堆积的链通常更利于结晶，不规则侧基或序列常阻碍排列；但最终结晶还受链柔性、支化、热历史和组成共同控制", "mnemonic": "【答题抓手】扣准聚合物的立构、规整性和共聚、序列怎样影响，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "核心考点"}, {"id": "qa_02_D01", "num": "02-32", "chapter": "ch2", "name": "02-32 为什么碳在γ-Fe（FCC）中的固溶度远大于在α-Fe（BCC）中的固溶度？", "title": "为什么碳在γ-Fe（FCC）中的固溶度远大于在α-Fe（BCC）中的固溶度？", "section": "叶 p.57 直接解释；pp.54–55、217–218 补充结构与相图。", "def": "① 教材结论：碳在两种铁晶格中均主要占据八面体间隙。γ-Fe的八面体间隙较大； α-Fe的八面体间隙较小，而且BCC间隙不对称。\n② 因果链：碳进入较小且不对称的BCC间隙，要使邻近铁原子产生更大的非均匀位移，造成更强晶格畸变和较高能量代价，因而较难大量固溶。进入FCC铁的较大八面体间隙时，畸变代价相对较小，所以奥氏体溶碳能力较强。\n③ 数据与边界：本书给出的最大质量固溶度约为γ中2.11%、α中0.022%，分别对应不同温度，不能当成同一温度下的简单实验比值。本结论针对碳与铁，不是对所有 FCC、BCC材料的普遍大小排序。\n④ 必写关键词：八面体间隙、大小与对称性、晶格畸变、固溶能量代价。", "keyPoints": "FCC八面体间隙半径为0.414R，为对称八面体；BCC八面体间隙半径仅0.154R，且为压扁非对称八面体，溶入小原子引起极严重非对称点阵畸变。", "mnemonic": "【记忆口诀】FCC八面体空位大，球径点四一四胜BCC；对称膨胀容碳易，奥氏体溶碳远超铁素体。", "pitfall": "致密度大(FCC 0.74 > BCC 0.68)不等于局部间隙小；间隙固溶度取决于局部间隙的最大内切球半径及畸变能。", "freq": "考纲深度细化"}, {"id": "qa_02_D02", "num": "02-33", "chapter": "ch2", "name": "02-33 FCC更致密，为什么反而能有比BCC更大的八面体间隙？", "title": "FCC更致密，为什么反而能有比BCC更大的八面体间隙？", "section": "叶 pp.50–55、57；正文反直觉问题。", "def": "① 区分两个量：致密度是整个晶胞中原子硬球占总体积的比例；间隙尺寸是某个局部空隙能放入的最大硬球半径。前者反映总体占据，后者反映空余空间怎样分布。\n② 原因：相同或更少的空余总体积，可以集中形成较大的局部空隙，也可以分成较小、扁长或不规则的空隙。FCC虽然总体致密度约0.74，高于BCC的约0.68，但FCC八面体位置周围距离对称，局部可容纳空间仍较大。", "keyPoints": "整体致密度是晶胞所有原子所占总体积分数；局部间隙是点阵硬球堆垛后留下的空隙几何尺寸。FCC堆垛留下的八面体间隙硬球半径远大于BCC。", "mnemonic": "【记忆口诀】空间点阵均致密，局部间隙各不同；FCC间隙大而少，BCC间隙小而多。", "pitfall": "切忌用宏观整体致密度机械推导微观局部间隙大小；“空隙总体积大”“某类间隙数量多”“某个间隙半径大”是三种不同判断。碳的固溶度不能只用1减去致密度来解释。", "freq": "考纲深度细化"}, {"id": "qa_02_D03", "num": "02-34", "chapter": "ch2", "name": "02-34 如何用几何关系比较FCC与BCC八面体间隙的硬球半径？", "title": "如何用几何关系比较FCC与BCC八面体间隙的硬球半径？", "section": "叶 pp.50–55、57；依据教材硬球模型自行推导。", "def": "① FCC 八面体间隙推导：\n   - 间隙位于晶胞体心 (1/2, 1/2, 1/2) 及各棱心，最近邻面心原子到间隙中心的距离为晶胞棱长之半 a/2；\n   - FCC 密排面相切条件为 √2·a = 4R（即 a = 2√2·R）；\n   - 八面体间隙容纳硬球半径为 r_oct = a/2 - R = (√2 - 1)·R ≈ 0.414R。\n② BCC 八面体间隙推导（非对称扁八面体）：\n   - 间隙位于面心与棱心，沿晶胞轴向与最近两体心原子中心的距离最近，距离同样为 a/2；\n   - BCC 体对角线相切条件为 √3·a = 4R（即 a = 4R / √3）；\n   - 沿受压扁轴方向容纳的最大硬球半径为 r_oct = a/2 - R = (2/√3 - 1)·R ≈ 0.155R。\n③ 物理意义与应用：\n   - FCC 八面体间隙半径 (0.414R) 远大于 BCC 八面体间隙半径 (0.155R)；\n   - 这从晶体几何本质上解释了为什么 FCC 奥氏体对间隙碳原子的最大固溶度 (2.11 wt%) 远高于 BCC 铁素体 (0.0218 wt%)。", "keyPoints": "FCC 八面体间隙 r_oct = (√2 - 1)R ≈ 0.414R；BCC 扁八面体间隙短轴 r_oct = (2/√3 - 1)R ≈ 0.155R；FCC 间隙显著大于 BCC 解释了奥氏体固溶度远高于铁素体", "mnemonic": "【记忆口诀】面心连线求间隙，棱心相切算内切；体心压扁非对称，几何推导演算清。", "pitfall": "BCC 八面体间隙是非对称扁八面体，间隙尺寸仅 0.155R，切勿误当成对称正八面体；BCC 的八面体间隙是非正对称的（四个近邻较远、两个近邻极近），碳原子溶入会引起非对称四方畸变（形成马氏体正方度 c/a），不能误套正八面体公式。", "freq": "考纲深度细化"}, {"id": "qa_02_D04", "num": "02-35", "chapter": "ch2", "name": "02-35 晶体为什么只允许1、2、3、4、6次旋转轴，而没有5次旋转轴？", "title": "晶体为什么只允许1、2、3、4、6次旋转轴，而没有5次旋转轴？", "section": "叶 p.36；正文推导题。", "def": "① 平移周期性约束前提：传统三维晶体结构必须具有空间平移周期性。晶体允许的宏观对称旋转轴不仅要使局部原子多边形重合，还必须保证旋转后的阵点平移矢量与无限周期点阵相容。\n② 几何旋转与余弦公式推导：\n   - 取两相邻格点 A 与 B，平移间距为 a；\n   - 绕通过 A、B 的平行轴分别同向与逆向旋转同一角度 θ，得到两个新格点 A' 与 B'；\n   - A' 与 B' 之间的距离为 A'B' = a + 2a·cosθ；\n   - 为保证空间点阵周期性，A'B' 必须是基本平移矢量 a 的整数倍（A'B' = M·a，M 为整数）；\n   - 整理得：cosθ = (M - 1) / 2 = N / 2（其中 N 为整数）。\n③ 对称轴阶数判定：\n   - 因余弦函数物理极限为 -1 ≤ cosθ ≤ 1，整数 N 只能取 0, ±1, ±2；\n   - 对应允许的旋转角度为 0°(360°)、60°、90°、120°、180°；\n   - 分别对应 1 次、6 次、4 次、3 次、2 次旋转对称轴。", "keyPoints": "晶体周期平移要求 cosθ = N/2，N 仅能取 0, ±1, ±2，对应旋转角 0°、60°、90°、120°、180°；严格证明仅允许 1、2、3、4、6 次旋转轴，禁止 5 次轴", "mnemonic": "【记忆口诀】平移周期限旋转，余弦整数二分整；只允一二三四六，五次周期铺不满。", "pitfall": "不是自然界不存在五角形，而是正五边形无法通过空间平移无缝铺满三维点阵，因此传统周期晶体不存在 5 次对称轴；晶体中严格禁止 5 次及大于 6 次对称轴，因为正五边形在二维平面与三维空间中存在几何重叠或间隙，无法无缝铺满空间（准晶具有非周期 5 次或 10 次对称，但准晶不属于传统周期点阵）。", "freq": "考纲深度细化"}, {"id": "qa_02_D05", "num": "02-36", "chapter": "ch2", "name": "02-36 三维空间中的反演、镜面反射和绕轴旋转180°有什么区别？", "title": "三维空间中的反演、镜面反射和绕轴旋转180°有什么区别？", "section": "叶 p.36；对正文概念作三维澄清。", "def": "① 定义：以原点为中心反演，位置 (x, y, z) 变成 (-x, -y, -z)；关于 xy 镜面反射，(x, y, z) 变成 (x, y, -z)；绕 z 轴旋转 180°，(x, y, z) 变成 (-x, -y, z)。\n② 判断方法：比较操作后每个位置是否有同类原子与之重合；中心反演要同时改变三个坐标的符号。只看某个二维投影可能误把不同操作当作相同。", "keyPoints": "二维图形的中心对称可以用平面内旋转180°表示，但三维反演不等于绕任意一条固定轴旋转180°", "mnemonic": "【答题抓手】扣准三维空间中的、反演、镜面反射和绕，紧扣物理机制与适用条件展开", "pitfall": "二维图形的中心对称可以用平面内旋转180°表示，但三维反演不等于绕任意一条固定轴旋转180°。教材p.36采用简化图形语言，答三维晶体对称性时应保留这个区别。", "freq": "考纲深度细化"}, {"id": "qa_02_D06", "num": "02-37", "chapter": "ch2", "name": "02-37 晶系与点阵类型究竟依据对称性，还是依据晶胞怎样选择？", "title": "晶系与点阵类型究竟依据对称性，还是依据晶胞怎样选择？", "section": "叶 pp.34–38；正文理解题。", "def": "① 结论：晶体固有的平移规律和对称性是依据，选胞是把这些性质表现出来的工具；不能通过随意换一个歪晶胞就改变材料所属点阵。\n② 选胞原则：教材先要求充分反映点阵对称性，再尽可能使晶轴夹角为直角，最后考虑较小体积。因此常规晶胞不一定是体积最小的原胞。\n③ 例子：面心四方可以重新选胞表示为体心四方，属于重复描述，不能再增加一种布拉菲点阵。识别结构时既要检查对称性，也要排除可经平移换胞得到的等价表示。", "keyPoints": "晶体固有的平移规律和对称性是依据，选胞是把这些性质表现出来的工具", "mnemonic": "【答题抓手】扣准晶系与点阵类、型究竟依据对、称性还是依据，紧扣物理机制与适用条件展开", "pitfall": "不能通过随意换一个歪晶胞就改变材料所属点阵。", "freq": "考纲深度细化"}, {"id": "qa_02_D07", "num": "02-38", "chapter": "ch2", "name": "02-38 为什么FCC晶胞有4个原子，却又可以说FCC原胞只有1个格点？", "title": "为什么FCC晶胞有4个原子，却又可以说FCC原胞只有1个格点？", "section": "叶 pp.34–38、50；正文计数衍生。", "def": "① 先分对象：体积较大的常规立方晶胞用于直观展示立方对称性；原胞按平移基本重复体积定义，只含一个格点的净贡献。\n② FCC常规胞计数： 8个顶点各贡献1/8，6个面心各贡献1/2，共4个格点。单原子FCC 金属每个格点附一个原子，因此常规胞有4个原子，而较小原胞为1个。", "keyPoints": "晶胞(结构胞)：选取时优先保证晶体的几何对称性，FCC晶胞含4个格点(原子)；原胞(布拉菲胞)：只反映平移对称性的最小体积单元，仅含1个格点。", "mnemonic": "【记忆口诀】晶胞反映对称性，原胞平移最小元；面心立胞四原子，基元一个格点同。", "pitfall": "原胞的基矢不是互相垂直的正交坐标系，晶胞才是正交立方系；若格点上附着多原子基元，原胞原子数不必是1。不能把NaCl、的原子总数直接等同于其布拉菲点阵格点数，也不能混用两种晶胞体积计算密度。", "freq": "考纲深度细化"}, {"id": "qa_02_D08", "num": "02-39", "chapter": "ch2", "name": "02-39 判断某晶向是否在某晶面内时，为什么不能只看它属于同一晶向族？", "title": "判断某晶向是否在某晶面内时，为什么不能只看它属于同一晶向族？", "section": "叶 pp.39–43、139；正文及第3章习题5衍生。", "def": "① 判定判据（点积正交法则）：在立方晶系中，晶向 [u v w] 位于晶面 (h k l) 内的严格充要条件是：晶向方向与晶面法向相互正交，即空间点积等于零：h·u + k·v + l·w = 0。\n② 具体实例反驳：\n   - 以面心立方 (111) 晶面为例，属于 ⟨110⟩ 晶向族的 12 个方向中，只有点积为零的 3 个方向（及其反向）位于该面内：[11̄0]、[101̄]、[011̄]；\n   - 同样属于 ⟨110⟩ 族的 [110] 晶向，代入点积得 1·1 + 1·1 + 1·0 = 2 ≠ 0，故 [110] 晶向倾斜穿过 (111) 面，绝不在其面内。\n③ 几何本质：同一晶向族 ⟨uvw⟩ 仅表示这些方向在晶体对称性下彼此等价，但它们指向空间不同方位；判定是否位于某一具体晶面 (hkl) 内，必须逐一检验该方向是否与该晶面法向垂直。", "keyPoints": "晶向 [uvw] 在晶面 (hkl) 内的充要条件为点积 h·u + k·v + l·w = 0；同一晶向族成员指向不同空间方位，只有垂直晶面法向的成员才在面内", "mnemonic": "【答题抓手】扣准判断某晶向是、否在某晶面内、时不能只看它，紧扣物理机制与适用条件展开", "pitfall": "不能把“属于同一晶向族”误认为“全都在同一给定晶面内”，必须逐一验证正交条件 h·u + k·v + l·w = 0 是否成立。", "freq": "考纲深度细化"}, {"id": "qa_02_D09", "num": "02-40", "chapter": "ch2", "name": "02-40 晶面指数整体加倍后，晶面方向和截距是否都保持不变？", "title": "晶面指数整体加倍后，晶面方向和截距是否都保持不变？", "section": "叶 pp.39–43；正文指数辨析。", "def": "① 方向：与的法向平行，因此取向相同。\n② 几何位置：若按同一晶轴、同一原点的截距作图，后者截距为前者一半，所画平面一般不是同一空间位置。\n③ 区别：晶面取向、某一个具体平面以及晶面间距不能混为一谈；晶向指数通常约成最简整数，而讨论衍射的不同级次或倒易矢量时，整数倍指数仍有意义。", "keyPoints": "方向：与的法向平行，因此取向相同；几何位置：若按同一晶轴、同一原点的截距作图，后者截距为前者一半，所画平面一般不是同一空间位置；区别：晶面取向、某一个具体平面以及晶面间距不能混为一谈；晶向指数通常约成最简整数，而讨论衍射的不同级次或倒易矢量时，整数倍指数仍有意义...", "mnemonic": "【答题抓手】扣准晶面指数整体、加倍后晶面方、向和截距是否，紧扣物理机制与适用条件展开", "pitfall": "几何位置：若按同一晶轴、同一原点的截距作图，后者截距为前者一半，所画平面一般不是同一空间位置；若题目只要求画出某取向的平行晶面，可选择便于绘图的位置；若给定截距或讨论间距，必须保留它要求的几何信息，不能随意约去后认定所有量都没变。", "freq": "考纲深度细化"}, {"id": "qa_02_D10", "num": "02-41", "chapter": "ch2", "name": "02-41 为什么异价离子掺杂常会改变陶瓷的空位浓度？", "title": "为什么异价离子掺杂常会改变陶瓷的空位浓度？", "section": "叶 pp.81–83；正文机制细分。", "def": "① 核心：替代离子的价态与原位置离子不同，会带来相对于理想晶格的有效电荷差，体系需要通过其他缺陷或电子、空穴补偿，以保持整体电中性。\n② 教材例子： FeO中部分Fe²⁺变为Fe³⁺时，每个这种变化多出一个正电荷；在以铁空位补偿的模型中，两个额外正电荷可由缺失一个Fe²⁺相应补偿，从而出现铁缺位和非化学计量。\n③ 影响与限制：空位浓度改变可能影响离子扩散和电导。", "keyPoints": "空位浓度改变可能影响离子扩散和电导", "mnemonic": "【答题抓手】扣准异价离子掺杂、常会改变陶瓷、的空位浓度，紧扣物理机制与适用条件展开", "pitfall": "但并非任何异价掺杂都只能生成同一种空位，补偿方式还依赖组成、气氛和温度；电中性不要求每个局部缺陷单独中性。", "freq": "考纲深度细化"}, {"id": "qa_02_42_yf", "num": "02-42", "title": "晶体的基本特征有哪些？各自的含义是什么？", "name": "02-42 晶体的基本特征有哪些？各自的含义是什么？", "chapter": "ch2", "section": "教材p.33｜正文原标号：①—④（正文分条）", "freq": "叶飞正文分条", "def": "① 自限性：晶体具有自发形成规则几何外形的性质；重复出现的规则外形是内部原子周期排列的外在表现。\n② 均匀性：理想均匀晶体的等价部分具有相同性质，反映原子在不同位置具有重复的三维周期排列。\n③ 对称性：经过某些几何操作后，晶体结构与原结构重合，如旋转对称操作。\n④ 各向异性：不同方向的原子排列不同，物理性能一般也随方向变化。", "keyPoints": "① 自限性：晶体具有自发形成规则几何外形的性质；重复出现的规则外形是内部原子周期排列的外在表现；② 均匀性：理想均匀晶体的等价部分具有相同性质，反映原子在不同位置具有重复的三维周期排列；③ 对称性：经过某些几何操作后，晶体结构与原结构重合，如旋转对称操作；④ 各向异性：不同方向的原子排列不同，物理性能一般也随方向变化。", "pitfall": "这道题必须完整写出四点。“长程有序、确定熔点”不能替代这四项。均匀性比较不同位置，各向异性比较不同方向，二者不矛盾。教材关于多晶体整体各向同性的表述应以晶粒随机取向为前提；存在织构时可表现各向异性。", "mnemonic": ""}, {"id": "qa_02_43_yf", "num": "02-43", "title": "晶胞有心化的三种方式及其阵点数是什么？", "name": "02-43 晶胞有心化的三种方式及其阵点数是什么？", "chapter": "ch2", "section": "教材p.38｜正文原标号：①—③（正文分条）", "freq": "叶飞正文分条", "def": "① 体心化：在体心增加阵点，常规晶胞合计2个阵点，符号I。\n② 面心化：在全部六个面心增加阵点，常规晶胞合计4个阵点，符号F。\n③ 底心化：在一对相对面的中心增加阵点，常规晶胞合计2个阵点，依面的位置记A、B或C。", "keyPoints": "① 体心化：在体心增加阵点，常规晶胞合计2个阵点，符号I；② 面心化：在全部六个面心增加阵点，常规晶胞合计4个阵点，符号F；③ 底心化：在一对相对面的中心增加阵点，常规晶胞合计2个阵点，依面的位置记A、B或C。", "pitfall": "这里统计的是阵点，不是任何材料都适用的原子总数；原子数还取决于结构基元。", "mnemonic": ""}, {"id": "qa_02_44_yf", "num": "02-44", "title": "教材列举的四种典型AX型晶体结构有何特点？", "name": "02-44 教材列举的四种典型AX型晶体结构有何特点？", "chapter": "ch2", "section": "教材p.62—63｜正文原标号：（1）—（4）（正文分条）", "freq": "叶飞正文分条", "def": "① NaCl型：可看作阴离子构成FCC排列，阳离子占满八面体间隙；两类离子配位数均为6。\n② CsCl型：简单立方点阵加一对异种离子基元，阳离子处于阴离子立方体中心；两类离子配位数均为8。\n③ 闪锌矿型：立方结构，一类原子构成FCC排列，另一类占据一半四面体间隙；两类配位数均为4。\n④ 纤锌矿型：六方结构，可看作一类原子作HCP堆积，另一类占据一半四面体间隙；两类配位数均为4。", "keyPoints": "① NaCl型：可看作阴离子构成FCC排列，阳离子占满八面体间隙；两类离子配位数均为6；② CsCl型：简单立方点阵加一对异种离子基元，阳离子处于阴离子立方体中心；两类离子配位数均为8；③ 闪锌矿型：立方结构，一类原子构成FCC排列，另一类占据一半四面体间隙；两类配位数均为4；④ 纤锌矿型：六方结构，可看作一类原子作HCP堆积，另一类占据一半四面体间隙；两类配位数均为4。", "pitfall": "核对提醒：教材p.63把CsCl的配位数印为6，但同页图4-12(b)明确显示体心离子有8个异号最近邻，应为8。CsCl不能因外形类似体心立方就判为BCC布拉菲点阵。HCP堆积也不等于一种额外的布拉菲点阵。", "mnemonic": ""}, {"id": "qa_03_01", "num": "03-01", "chapter": "ch3", "name": "03-01 晶体缺陷如何按空间尺度分类？各举例。", "title": "晶体缺陷如何按空间尺度分类？各举例。", "section": "叶 pp.79–108；正文。", "def": "① 点缺陷在三个方向尺度均接近原子尺度，如空位、间隙原子、置换原子。\n② 线缺陷沿一方向延伸，如位错。\n③ 面缺陷沿二维延伸，如表面、晶界、相界、孪晶界和堆垛层错。\n④ 体缺陷有明显三维尺寸，如孔洞、裂纹及夹杂。分类按几何尺度，不按“危害大小”。", "keyPoints": "点缺陷在三个方向尺度均接近原子尺度，如空位、间隙原子、置换原子；线缺陷沿一方向延伸，如位错；面缺陷沿二维延伸，如表面、晶界、相界、孪晶界和堆垛层错；体缺陷有明显三维尺寸，如孔洞、裂纹及夹杂；分类按几何尺度，不按“危害大小”", "mnemonic": "【记忆口诀】点线面体分四类，原子尺度看点缺；一维线位错滑移，二维界面体缺陷。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_02", "num": "03-02", "chapter": "ch3", "name": "03-02 空位、间隙原子和置换原子分别怎样引起晶格畸变？", "title": "空位、间隙原子和置换原子分别怎样引起晶格畸变？", "section": "叶 pp.79–81；第5章习题1、2。", "def": "① 空位是正常格点缺失原子，附近原子发生弛豫。\n② 间隙原子占据原本空隙，通常引起较强压缩型局部畸变。\n③ 置换原子占据溶剂格点，尺寸大于或小于溶剂时引起不同局部应变。\n【教材第5章第1题】空位和自间隙原子。", "keyPoints": "空位是正常格点缺失原子，附近原子发生弛豫；间隙原子占据原本空隙，通常引起较强压缩型局部畸变；置换原子占据溶剂格点，尺寸大于或小于溶剂时引起不同局部应变；点缺陷还可产生电荷等效应，不能只考虑几何体积", "mnemonic": "【记忆口诀】原子热振离开格，平衡空位热力生；温度升高指数增，晶体缺陷不可免。", "pitfall": "点缺陷还可产生电荷等效应，不能只考虑几何体积。", "freq": "高频必背"}, {"id": "qa_03_03", "num": "03-03", "chapter": "ch3", "name": "03-03 为什么热平衡晶体中存在一定数量的空位？", "title": "为什么热平衡晶体中存在一定数量的空位？", "section": "叶 pp.80–81；第5章习题3衍生。", "def": "① 能量与熵的矛盾竞争：产生空位需要破坏局部正常化学键并引起晶格弛豫，体系内能与焓 H 增加；另一方面，少量空位在大量格点中存在巨大的微观排布方式，使体系构型熵 S 显著增大。\n② 自由能极小化热力学机制：晶体的吉布斯自由能为 G = H - T·S。在有限温度 T > 0 下，引入少量空位带来的 -T·ΔS 熵收益足以超过产生空位的焓代价 ΔH，使体系总自由能 G 出现极小值，因此热平衡态晶体必然存在非零的平衡空位浓度。\n③ 平衡空位浓度公式：平衡空位浓度服从阿伦尼乌斯关系：c_v = N_v / N = exp(-Q_v / (k·T))（按每摩尔计时为 exp(-Q_v / (R·T))），平衡浓度随温度呈指数级剧增。\n【教材第5章第3题】2.2 × 10^25 / m³（原答案文件提取为 2.2×10^5/m，注意数量级与单位核对教材计算）。", "keyPoints": "产生空位内能增加，但构型熵增大；吉布斯自由能 G = H - TS 在有限温度下于非零空位浓度处取极小值；平衡浓度 c_v = exp(-Q_v/(kT)) 随温度指数增加", "mnemonic": "【记忆口诀】空位形成能量耗，构型熵增使能降；自由能谷定平衡，浓度指数随温升。", "pitfall": "热平衡空位是热力学自发产生的热缺陷，不可将淬火或冷变形引入的非平衡过饱和空位混同为平衡空位；该公式仅适用于热平衡空位。淬火、冷变形或辐照产生的超额空位属于非平衡缺陷，其浓度远高于室温热平衡值，不可直接代入平衡公式。", "freq": "高频必背"}, {"id": "qa_03_04", "num": "03-04", "chapter": "ch3", "name": "03-04 空位形成能和迁移能有何区别？淬火为何可保留过饱和空位？", "title": "空位形成能和迁移能有何区别？淬火为何可保留过饱和空位？", "section": "叶 pp.80–81、190–193；正文衍生。", "def": "形成能是产生空位所需能量，迁移能是原子跳入相邻空位需越过的能垒；二者物理过程不同。高温空位多，快速冷却使空位来不及扩散到表面、晶界等处消失，室温下可保留超过平衡值的空位，后续退火使其减少。", "keyPoints": "形成能是产生空位所需能量，迁移能是原子跳入相邻空位需越过的能垒；二者物理过程不同；高温空位多，快速冷却使空位来不及扩散到表面、晶界等处消失，室温下可保留超过平衡值的空位，后续退火使其减少", "mnemonic": "【记忆口诀】挤入间隙点阵鼓，置换大膨置换缩；弹性畸变应变场，阻碍位错滑移难。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_05", "num": "03-05", "chapter": "ch3", "name": "03-05 肖特基缺陷与弗伦克尔缺陷有何不同？", "title": "肖特基缺陷与弗伦克尔缺陷有何不同？", "section": "叶 pp.81–83；正文。", "def": "① 肖特基缺陷是按化学计量关系共同形成的正、负离子空位。\n② 弗伦克尔缺陷是某离子离开正常格点进入间隙，形成空位—间隙离子对。二者均需满足整体电中性。\n③ 异价掺杂还可通过空位、电子或空穴等方式实现电荷补偿。", "keyPoints": "肖特基缺陷是按化学计量关系共同形成的正、负离子空位；弗伦克尔缺陷是某离子离开正常格点进入间隙，形成空位—间隙离子对；二者均需满足整体电中性；异价掺杂还可通过空位、电子或空穴等方式实现电荷补偿", "mnemonic": "【记忆口诀】肖特基阴阳空位双，弗仑克尔移间隙；电中守恒不可破，晶体整体电荷平。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_06", "num": "03-06", "chapter": "ch3", "name": "03-06 什么是位错？为什么它能解释实际晶体的低屈服应力？", "title": "什么是位错？为什么它能解释实际晶体的低屈服应力？", "section": "叶 pp.85–86、138–139；正文。", "def": "位错是晶体中原子排列发生局部错排的线缺陷。完整晶体同时滑移需克服很高阻力；位错运动使原子键在局部逐步重排，类似推动褶皱，显著降低整体滑移所需应力。位错易动导致塑性，阻碍位错运动则形成强化。", "keyPoints": "位错是晶体中原子排列发生局部错排的线缺陷；完整晶体同时滑移需克服很高阻力；位错运动使原子键在局部逐步重排，类似推动褶皱，显著降低整体滑移所需应力；位错易动导致塑性，阻碍位错运动则形成强化", "mnemonic": "【记忆口诀】杂质取代正常格，变价离子补电荷；缺陷反应写平衡，质能电荷三守恒。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_07", "num": "03-07", "chapter": "ch3", "name": "03-07 刃型、螺型和混合位错怎样区分？", "title": "刃型、螺型和混合位错怎样区分？", "section": "叶 pp.85–89；第5章习题4。", "def": "① 刃型位错可用多余半原子面边缘表示，柏氏矢量与位错线垂直。\n② 螺型位错对应螺旋台阶，柏氏矢量与位错线平行。\n③ 混合位错介于二者。弯曲位错线上局部类型可变，而在没有反应或分叉的同一位错段上柏氏矢量保持不变。\n【教材第5章第4题】刃型位错：伯氏矢量方向与位错线方向垂直； 螺型位错：伯氏矢量方向与位错线方向平行； 混合型位错：伯氏矢量方向与位错线方向既不平行也不垂直。", "keyPoints": "刃型位错可用多余半原子面边缘表示，柏氏矢量与位错线垂直；螺型位错对应螺旋台阶，柏氏矢量与位错线平行；混合位错介于二者；弯曲位错线上局部类型可变，而在没有反应或分叉的同一位错段上柏氏矢量保持不变", "mnemonic": "【记忆口诀】滑移未滑分界线，晶格畸变集中处；能量升高应变场，宏观塑性位错载。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_08", "num": "03-08", "chapter": "ch3", "name": "03-08 如何用柏氏回路确定柏氏矢量？它说明什么？", "title": "如何用柏氏回路确定柏氏矢量？它说明什么？", "section": "叶 pp.87–89；第5章习题6、7衍生。", "def": "原图位错线为 t = [112̄]，与柏氏矢量 b = [111] 点积为 1*1+1*1+(-2)*1 = 0，判定为纯刃型位错，可具备攀移机制；文字提取易丢负号上划线，见附录 D。\n【教材第5章第6题】FCC 金属中位错的伯氏矢量通常为最密排方向 ⟨110⟩/2，长度为 0.256 nm。", "keyPoints": "原图位错线为 t = [112̄]，与柏氏矢量 b = [111] 点积为 1*1+1*1+(-2)*1 = 0，判定为纯刃型位错，可具备攀移机制；文字提取易丢负号上划线，见附录 D", "mnemonic": "【记忆口诀】刃型位错多半面，螺型位错螺台阶；刃型柏氏垂直线，螺型柏氏平行线。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_09", "num": "03-09", "chapter": "ch3", "name": "03-09 刃型位错的滑移面为什么唯一，螺型位错的滑移面为什么不唯一？", "title": "刃型位错的滑移面为什么唯一，螺型位错的滑移面为什么不唯一？", "section": "叶 pp.90–93；第5章习题5。", "def": "① 几何条件：滑移面必须同时包含位错线和柏氏矢量，因为位错线位于滑移界面上，而面两侧最终相对位移沿柏氏矢量。\n② 刃型位错：位错线与柏氏矢量相互垂直，两条不平行方向可以确定一个平面，因此理想纯刃型位错滑移面唯一。\n③ 螺型位错：二者平行，只提供同一条方向，存在多个包含该方向的晶面，故滑移面在几何上不唯一。\n④ 物理限制：几何上可能不意味着所有平面同样容易滑移，还需考虑晶体结构和运动阻力。\n【教材第5章第5题】由于位错线方向与伯氏矢量方向平行，无法确定唯一滑移面；由于螺型位错的轴对称结构，包含位错线的晶面都可以成为滑移面。", "keyPoints": "几何上可能不意味着所有平面同样容易滑移，还需考虑晶体结构和运动阻力", "mnemonic": "【记忆口诀】闭合回路求失配，理想复现引矢量；柏氏矢量守恒定，位错不绝晶体中。", "pitfall": "螺型位错可在适当条件下交滑移到另一面，两面交线平行于位错线及柏氏矢量；刃型位错若离开原面通常需考虑攀移，而不是照搬交滑移机制。", "freq": "高频必背"}, {"id": "qa_03_10", "num": "03-10", "chapter": "ch3", "name": "03-10 位错滑移与攀移有何区别？", "title": "位错滑移与攀移有何区别？", "section": "叶 pp.90–93；第5章习题7衍生。", "def": "滑移是位错在滑移面内的保守运动，通常无需原子长程扩散，由切应力驱动；攀移是刃型分量离开原滑移面，靠吸收或发射空位、原子扩散实现，属非保守运动，对温度敏感。纯螺型位错不按刃型位错的增减半原子面机制攀移。\n【教材第5章第7题】因为伯氏矢量与位错线方向垂直，所以该位错类型为刃型。刃型位错能够攀移。", "keyPoints": "滑移是位错在滑移面内的保守运动，通常无需原子长程扩散，由切应力驱动；攀移是刃型分量离开原滑移面，靠吸收或发射空位、原子扩散实现，属非保守运动，对温度敏感；纯螺型位错不按刃型位错的增减半原子面机制攀移", "mnemonic": "【记忆口诀】刃型垂直面唯一，螺型平行面无数；混合位错介两间，滑移只开包含面。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_11", "num": "03-11", "chapter": "ch3", "name": "03-11 什么是交滑移？为什么它与攀移不能混淆？", "title": "什么是交滑移？为什么它与攀移不能混淆？", "section": "叶 pp.92–93、157–158；正文。", "def": "① 交滑移是螺型位错由一个滑移面转到另一个同样包含其柏氏矢量的滑移面。\n② 攀移依赖点缺陷扩散，使刃型分量离开原面。交滑移可以帮助绕过障碍，攀移对高温恢复和蠕变尤其重要。\n③ 二者都可能改变位错运动路径，但微观机制不同。", "keyPoints": "交滑移是螺型位错由一个滑移面转到另一个同样包含其柏氏矢量的滑移面；攀移依赖点缺陷扩散，使刃型分量离开原面；交滑移可以帮助绕过障碍，攀移对高温恢复和蠕变尤其重要；二者都可能改变位错运动路径，但微观机制不同", "mnemonic": "【记忆口诀】位错弹性能储存，自能正比模量方；单位线长线张力，弯曲受阻抗力生。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_12", "num": "03-12", "chapter": "ch3", "name": "03-12 位错的应力场、弹性能和线张力有什么特点？", "title": "位错的应力场、弹性能和线张力有什么特点？", "section": "叶 pp.88–90；正文。", "def": "刃型位错具有压缩区、拉伸区及剪切应力分量；理想螺型位错主要产生剪切应力。位错造成弹性畸变并储存能量，单位长度能量通常与同量级。线张力使位错趋于缩短，在外加切应力和障碍作用下则可弯曲。", "keyPoints": "刃型位错具有压缩区、拉伸区及剪切应力分量；理想螺型位错主要产生剪切应力；位错造成弹性畸变并储存能量，单位长度能量通常与同量级；线张力使位错趋于缩短，在外加切应力和障碍作用下则可弯曲", "mnemonic": "【记忆口诀】滑移面上受切应，位错运动保守行；额外半面吸放空，攀移垂直非保守。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_13", "num": "03-13", "chapter": "ch3", "name": "03-13 位错之间如何相互作用？为什么会强化或发生湮灭？", "title": "位错之间如何相互作用？为什么会强化或发生湮灭？", "section": "叶 pp.88–93、152–154；正文。", "def": "位错应力场相互作用，可吸引或排斥；符号相反、满足几何条件的位错接近后可湮灭。不同滑移系位错相交可形成割阶、缠结或位错锁，提高进一步运动阻力。", "keyPoints": "位错应力场相互作用，可吸引或排斥；符号相反、满足几何条件的位错接近后可湮灭；不同滑移系位错相交可形成割阶、缠结或位错锁，提高进一步运动阻力；不能笼统写“所有位错相互排斥”", "mnemonic": "【记忆口诀】同号位错相互斥，异号位错相遇消；弹性应力交互强，位错缠结硬化生。", "pitfall": "不能笼统写“所有位错相互排斥”。", "freq": "高频必背"}, {"id": "qa_03_14", "num": "03-14", "chapter": "ch3", "name": "03-14 位错从哪里来？Frank–Read 源如何增殖位错？", "title": "位错从哪里来？Frank–Read 源如何增殖位错？", "section": "叶 pp.94–96；正文。", "def": "位错可在晶体生长、凝固、塑性加工等过程中形成。两端钉扎的位错段受切应力弯曲，达到临界形状后继续扩展并闭合形成位错环，同时保留原位错段，反复循环实现增殖。其临界应力与钉扎间距有关，间距越短通常越难开动。", "keyPoints": "位错可在晶体生长、凝固、塑性加工等过程中形成；两端钉扎的位错段受切应力弯曲，达到临界形状后继续扩展并闭合形成位错环，同时保留原位错段，反复循环实现增殖；其临界应力与钉扎间距有关，间距越短通常越难开动", "mnemonic": "【记忆口诀】两端钉扎切应弓，弯成圆弧脱环生；弗兰克源连环放，塑性变形位错增。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_15", "num": "03-15", "chapter": "ch3", "name": "03-15 位错密度如何定义？它与强度有何关系？", "title": "位错密度如何定义？它与强度有何关系？", "section": "叶 pp.94–96、152–154；正文。", "def": "位错密度是单位体积内位错线总长度，单位通常为 m/m³（即 m⁻² 或 cm⁻²），也可用单位截面穿过的位错线根数表征。", "keyPoints": "位错密度是单位体积内位错线总长度，单位通常为 m/m³（即 m⁻² 或 cm⁻²），也可用单位截面穿过的位错线根数表征；冷变形通常使其增加，位错相互阻碍增强，流变应力上升；但不能把“位错越少越软”推广到近乎无位错晶须，后者可能很强", "mnemonic": "【记忆口诀】表面原子配位欠，不饱和键内能高；密排晶面断键少，表面能量最低保。", "pitfall": "冷变形通常使其增加，位错相互阻碍增强，流变应力上升；但不能把“位错越少越软”推广到近乎无位错晶须，后者可能很强。", "freq": "高频必背"}, {"id": "qa_03_16", "num": "03-16", "chapter": "ch3", "name": "03-16 为什么密排面的表面能通常较低？", "title": "为什么密排面的表面能通常较低？", "section": "叶 pp.96–99；第5章习题9。", "def": "表面原子邻居减少，部分结合被截断，形成表面需要能量。密排面一般单位面积断键代价较小，因而表面能较低。\n【教材第5章第9题】表面内能是表面原子近邻原子键数量变化引起的。近邻原子键数减少，断键数增加，表面内能增加。因此，当晶体中密排面形成表面时，断键数较少，表面内能以及相应的表面能较低。", "keyPoints": "表面原子邻居减少，部分结合被截断，形成表面需要能量；密排面一般单位面积断键代价较小，因而表面能较低；比较时应讨论单位面积能量，不能仅凭某个表面“原子数量更多”直接推出表面能更高", "mnemonic": "【记忆口诀】小角晶界位错墙，大角晶界原子乱；小角能随取向增，大角稳定能最高。", "pitfall": "比较时应讨论单位面积能量，不能仅凭某个表面“原子数量更多”直接推出表面能更高。", "freq": "高频必背"}, {"id": "qa_03_17", "num": "03-17", "chapter": "ch3", "name": "03-17 小角度晶界如何由位错构成？倾侧晶界与扭转晶界有什么不同？", "title": "小角度晶界如何由位错构成？倾侧晶界与扭转晶界有什么不同？", "section": "叶 pp.99–101；第5章习题8、10。", "def": "① 倾侧晶界：两晶粒相对绕晶界面内的轴发生小角度转动，简单模型可用一列刃型位错表示；位错阵列逐步补偿两侧晶格的微小取向差。\n② 扭转晶界：两侧绕近乎垂直晶界面的轴相对转动，可用交叉的螺型位错网络表示。\n③ 间距与角度：在简单小角度模型中，其中θ须用弧度。因此位向差增大，需要更密的位错阵列；当位错核心相互靠近并重叠时，不再适合用彼此独立的稀疏位错描述。\n④ 能量解释：小角度晶界有大量区域仍接近完整晶体，畸变主要集中在位错附近，故界面能通常较低。并非“亚晶界不是真界面”，而是具有特殊结构的小角度晶界；进入大角度范围也不能继续无限按简单线性关系外推能量。\n【教材第5章第8题】一般的大角度晶界，原子排列混乱，没有周期性匹配位置，界面原子键合受到很大破坏，晶界能量较高。", "keyPoints": "倾侧晶界：两晶粒相对绕晶界面内的轴发生小角度转动，简单模型可用一列刃型位错表示；位错阵列逐步补偿两侧晶格的微小取向差；扭转晶界：两侧绕近乎垂直晶界面的轴相对转动，可用交叉的螺型位错网络表示；间距与角度：在简单小角度模型中，其中θ须用弧度...", "mnemonic": "【记忆口诀】倾转晶界刃位错，扭转晶界螺位错；微小角度位错排，间距公式角度算。", "pitfall": "并非“亚晶界不是真界面”，而是具有特殊结构的小角度晶界。", "freq": "高频必背"}, {"id": "qa_03_18", "num": "03-18", "chapter": "ch3", "name": "03-18 亚晶、亚晶界和晶界是什么关系？", "title": "亚晶、亚晶界和晶界是什么关系？", "section": "叶 pp.99–104、147、157–158；正文。", "def": "亚晶是原晶粒内相互取向略有差别的区域，边界通常为小角度晶界，可由位错规则排列形成。亚晶界是真实的界面与取向变化，不是“假的晶界”；它与通常所说的大角度晶界主要区别在位向差、结构和能量。", "keyPoints": "亚晶是原晶粒内相互取向略有差别的区域，边界通常为小角度晶界，可由位错规则排列形成；亚晶界是真实的界面与取向变化，不是“假的晶界”；它与通常所说的大角度晶界主要区别在位向差、结构和能量", "mnemonic": "【记忆口诀】重位点阵周期合，重合阵点反比西；对称低能好匹配，晶界性质大改变。", "pitfall": "亚晶界是真实的界面与取向变化，不是“假的晶界”。", "freq": "高频必背"}, {"id": "qa_03_19", "num": "03-19", "chapter": "ch3", "name": "03-19 大角度晶界有什么结构和性能特点？", "title": "大角度晶界有什么结构和性能特点？", "section": "叶 pp.101–104；正文。", "def": "两侧晶粒位向差较大，晶界区域原子排列偏离完整晶体，通常具有较高能量和较快扩散能力，是溶质偏聚及形核的有利位置，也可阻碍位错传播。其能量与位向差并非简单一直线性增加，特殊晶界可能具有较低能量。", "keyPoints": "两侧晶粒位向差较大，晶界区域原子排列偏离完整晶体，通常具有较高能量和较快扩散能力，是溶质偏聚及形核的有利位置，也可阻碍位错传播；其能量与位向差并非简单一直线性增加，特殊晶界可能具有较低能量", "mnemonic": "【记忆口诀】共格相界原子对，半共格现错配位；非共格相如大角，界面能按匹配排。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_20", "num": "03-20", "chapter": "ch3", "name": "03-20 什么是重合位置点阵和 Σ 值？", "title": "什么是重合位置点阵和 Σ 值？", "section": "叶 pp.102–104；第5章习题11。", "def": "将两晶粒点阵按一定取向叠加，部分格点重合所形成的点阵称 CSL；Σ 表示重合点阵原胞体积与原晶格原胞体积之比，亦与重合点密度的倒数对应。\n【教材第5章第11题】重位点密度以重位点的倒易密度表示，即 CSL 晶胞体积除以晶格晶胞体积。", "keyPoints": "将两晶粒点阵按一定取向叠加，部分格点重合所形成的点阵称 CSL；Σ 表示重合点阵原胞体积与原晶格原胞体积之比，亦与重合点密度的倒数对应；较小 Σ 常意味着较高重合程度，但不能仅凭 Σ 就精确确定所有晶界性质", "mnemonic": "【记忆口诀】堆垛顺序漏或多，层错形成能量增；层错能量高与低，扩展位错宽窄定。", "pitfall": "较小 Σ 常意味着较高重合程度，但不能仅凭 Σ 就精确确定所有晶界性质。", "freq": "高频必背"}, {"id": "qa_03_21", "num": "03-21", "chapter": "ch3", "name": "03-21 孪晶界与普通晶界有什么不同？", "title": "孪晶界与普通晶界有什么不同？", "section": "叶 pp.104–105；正文。", "def": "孪晶两侧晶体具有特定镜面对称等取向关系，晶界为孪晶界。共格孪晶界原子匹配较好，能量通常较低；非共格部分能量较高。", "keyPoints": "孪晶两侧晶体具有特定镜面对称等取向关系，晶界为孪晶界；共格孪晶界原子匹配较好，能量通常较低；非共格部分能量较高；孪晶是一种取向关系和组织特征，不应仅用“两个晶粒长得对称”作定义", "mnemonic": "【答题抓手】扣准孪晶界与普通、晶界有什么不，紧扣物理机制与适用条件展开", "pitfall": "孪晶是一种取向关系和组织特征，不应仅用“两个晶粒长得对称”作定义。", "freq": "高频必背"}, {"id": "qa_03_22", "num": "03-22", "chapter": "ch3", "name": "03-22 共格、半共格与非共格相界如何比较？", "title": "共格、半共格与非共格相界如何比较？", "section": "叶 pp.105–107；第5章习题12。", "def": "① 共格相界：两侧对应晶面在界面处保持较好连续匹配，原子结合错乱较少，界面结构能通常较低；但若自然晶格常数不完全一致，为保持匹配就需弹性拉伸或压缩，产生共格应变能。\n② 半共格相界：部分区域维持匹配，失配通过周期性失配位错等结构释放；因此界面结构能与应变能都需要考虑。\n③ 非共格相界：原子排列匹配较差，界面结构能通常较高，但无需像完全共格那样维持大范围弹性匹配。为何颗粒长大后可能失去共格：随颗粒尺寸增加，保持共格的应变能代价可能增长，形成失配位错或改变界面类型反而降低总能。\n【教材第5章第12题】相界类型包括共格相界、半共格相界和非共格相界。无畸变的共格相界界面能最低，半共格相界界面能居中，非共格相界界面能最高。有弹性畸变的共格相界的界面能与畸变程度密切相关。", "keyPoints": "共格相界：两侧对应晶面在界面处保持较好连续匹配，原子结合错乱较少，界面结构能通常较低；但若自然晶格常数不完全一致，为保持匹配就需弹性拉伸或压缩，产生共格应变能；半共格相界：部分区域维持匹配，失配通过周期性失配位错等结构释放；因此界面结构能与应变能都需要考虑；非共格相界：原子排列匹配较差，界面结构能通常较高，但无需像完全共格那样维持大范围弹性匹配...", "mnemonic": "【答题抓手】扣准共格、半共格与非共、格相界，紧扣物理机制与适用条件展开", "pitfall": "答题不能将“共格界面能低”偷换成“共格颗粒在任意尺寸下总自由能最低”。", "freq": "高频必背"}, {"id": "qa_03_23", "num": "03-23", "chapter": "ch3", "name": "03-23 什么是堆垛层错？它如何影响位错运动和性能？", "title": "什么是堆垛层错？它如何影响位错运动和性能？", "section": "叶 p.107、pp.152–154；正文。", "def": "密排层正常堆垛次序局部被破坏形成层错，例如 FCC 的 ABC 顺序出现异常。层错可与不全位错相联系；层错能影响位错分解宽度、交滑移及孪生倾向。它是面缺陷，不等于整块晶体改成另一种稳定晶体结构。", "keyPoints": "密排层正常堆垛次序局部被破坏形成层错，例如 FCC 的 ABC 顺序出现异常；层错可与不全位错相联系；层错能影响位错分解宽度、交滑移及孪生倾向；它是面缺陷，不等于整块晶体改成另一种稳定晶体结构", "mnemonic": "【答题抓手】扣准什么是堆垛层、错它影响位错、运动和性能，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "高频必背"}, {"id": "qa_03_24", "num": "03-24", "chapter": "ch3", "name": "03-24 体缺陷为什么常成为失效起点？", "title": "体缺陷为什么常成为失效起点？", "section": "叶 p.108、pp.168–174；正文。", "def": "孔洞、夹杂、裂纹及疏松破坏局部连续性，造成有效承载面积减少和应力集中；界面结合较弱或形状尖锐处易形核裂纹。", "keyPoints": "孔洞、夹杂、裂纹及疏松破坏局部连续性，造成有效承载面积减少和应力集中；界面结合较弱或形状尖锐处易形核裂纹；影响取决于尺寸、形状、分布、取向及载荷，不是所有体缺陷具有相同危害", "mnemonic": "【答题抓手】扣准体缺陷常成为、失效起点，紧扣物理机制与适用条件展开", "pitfall": "影响取决于尺寸、形状、分布、取向及载荷，不是所有体缺陷具有相同危害。", "freq": "高频必背"}, {"id": "qa_03_25", "num": "03-25", "chapter": "ch3", "name": "03-25 常见完整位错的柏氏矢量大小怎样由晶体结构确定？", "title": "常见完整位错的柏氏矢量大小怎样由晶体结构确定？", "section": "叶 pp.87–89；第5章习题6衍生。", "def": "① 通常取可实现晶格平移的最短点阵矢量。FCC 完整位错常为 a/2⟨110⟩，模长 b = (√2/2)a。\n② BCC 常为 a/2⟨111⟩，模长 b = (√3/2)a。题目只给指数时需核对是否省略晶格常数 a。\n【教材第5章第6题】FCC 金属中位错的伯氏矢量通常为最密排方向 ⟨110⟩/2，长度为 0.256 nm。", "keyPoints": "通常取可实现晶格平移的最短点阵矢量； FCC 完整位错常为 a/2⟨110⟩，模长 b = (√2/2)a；BCC 常为 a/2⟨111⟩，模长 b = (√3/2)a；题目只给指数时需核对是否省略晶格常数 a；不全位错不能直接用完整位错的最短平移规则代替", "mnemonic": "【答题抓手】扣准常见完整位错、的柏氏矢量大、小怎样由晶体，紧扣物理机制与适用条件展开", "pitfall": "不全位错不能直接用完整位错的最短平移规则代替。", "freq": "高频必背"}, {"id": "qa_03_D01", "num": "03-26", "chapter": "ch3", "name": "03-26 为什么自间隙原子的热平衡浓度通常远低于空位浓度？", "title": "为什么自间隙原子的热平衡浓度通常远低于空位浓度？", "section": "叶 pp.79–81；正文原因题。", "def": "① 结论：自间隙原子和空位都可能由热运动产生，但形成代价不同。\n② 机制：把一个与基体原子同样大的原子挤入通常远小于它的晶格间隙，需要强烈排开邻近原子，造成较大的局部畸变；形成空位虽也需能量，却通常没有如此大的挤入应变代价。平衡缺陷浓度随形成能以指数形式降低，因此较高形成能对应较低浓度。\n③ 边界：这里比较的是普通热平衡情况；辐照等非平衡过程可强制产生大量空位—间隙原子对，不能用平衡浓度直接描述其瞬时状态。", "keyPoints": "自间隙原子挤入正常格点间隙引起极剧烈的局部弹性畸变能(形成能高达数个eV)；而空位形成能远小于自间隙形成能(约1eV)，因此由玻尔兹曼分布，自间隙平衡浓度远低于空位。", "mnemonic": "【记忆口诀】间隙挤入畸变巨，能垒高悬不易生；空位形成耗能小，热平衡中空位丰。", "pitfall": "高能粒子辐照可产生非平衡自间隙原子，但热平衡状态下以空位缺陷占绝大多数。", "freq": "考纲深度细化"}, {"id": "qa_03_D02", "num": "03-27", "chapter": "ch3", "name": "03-27 位错线方向、位错移动方向和晶体滑移方向为什么不是同一个方向？", "title": "位错线方向、位错移动方向和晶体滑移方向为什么不是同一个方向？", "section": "叶 pp.90–92，表5-1；正文重点细分。", "def": "① 三个对象：位错线方向描述线本身朝哪里延伸；位错移动方向描述这条线在滑移面内扫过哪里；晶体滑移方向描述滑移面两侧最终的相对位移，后者平行柏氏矢量。\n② 刃型：柏氏矢量垂直位错线，理想纯刃型滑移时线的移动方向平行柏氏矢量，因此与晶体滑移方向平行。\n③ 螺型：柏氏矢量平行位错线，线在面内移动却垂直位错线，所以位错移动方向与晶体滑移方向垂直。", "keyPoints": "位错线方向t：切线几何方向；位错运动方向v：外力作用下位错线的迁移方向；晶体相对位移方向b：由柏氏矢量决定。刃型位错v⊥t，滑移方向b∥v；螺型位错v⊥t，滑移方向b⊥v。", "mnemonic": "【记忆口诀】位错线伸展为线向，外力驱动为动向；柏氏矢量定滑向，三向有别勿混同。", "pitfall": "位错线向、运动方向与晶格滑移方向三者绝对不可混为一谈；看图中的一个箭头，必须先辨认它标的是线方向、运动方向还是外力。螺型位错并不是沿柏氏矢量方向“像螺丝一样前进”。", "freq": "考纲深度细化"}, {"id": "qa_03_D03", "num": "03-28", "chapter": "ch3", "name": "03-28 同一条弯曲位错可以同时具有刃型、螺型和混合段吗？", "title": "同一条弯曲位错可以同时具有刃型、螺型和混合段吗？", "section": "叶 pp.88–89；正文原因题。", "def": "① 核心概述：可以。在不分叉、未发生位错反应的同一条位错上，柏氏矢量保持一致；但位错线局部切线方向会沿曲线改变。\n② 判断：局部线方向与柏氏矢量垂直处为刃型分量占主导的纯刃段，平行处为纯螺段，其他位置为混合段。因此类型变化不要求柏氏矢量随位置改变。\n③ 失分点： “每条位错有一个柏氏矢量”并不等于“每条位错到处都属于同一种几何类型”；也不能为满足某局部画法任意旋转柏氏矢量。柏氏回路只要包围同一位错且不跨过额外位错，闭合差不依赖回路的具体形状。", "keyPoints": "可以；在不分叉、未发生位错反应的同一条位错上，柏氏矢量保持一致；但位错线局部切线方向会沿曲线改变；判断：局部线方向与柏氏矢量垂直处为刃型分量占主导的纯刃段，平行处为纯螺段，其他位置为混合段...", "mnemonic": "【答题抓手】扣准同一条弯曲位、错可以同时具、有刃型，紧扣物理机制与适用条件展开", "pitfall": "因此类型变化不要求柏氏矢量随位置改变。", "freq": "考纲深度细化"}, {"id": "qa_03_D04", "num": "03-29", "chapter": "ch3", "name": "03-29 为什么Frank–Read源越短，启动它所需切应力通常越大？", "title": "为什么Frank–Read源越短，启动它所需切应力通常越大？", "section": "叶 pp.94–96；正文推导题。", "def": "① 力学平衡图像：两端被杂质或位错交割坚固钉扎的位错线段（长度为 L），在外界切应力 τ 作用下受驱动力向外弓出弯曲；同时位错线自身具有使能量最小化的线张力 T。\n② 临界启动切应力公式推导：\n   - 位错线张力近似为 T ≈ (1/2)·G·b²；\n   - 切应力施加在单位长度位错线上的驱动力为 f = τ·b；\n   - 弯曲位错线的局部几何平衡条件为：τ·b = T / R（R 为位错线弯曲曲率半径）；\n   - 随着切应力增大，曲率半径 R 不断减小；当位错线弯成严格的半圆形时，曲率半径达到极小临界几何状态：R_c = L / 2；\n   - 越过该临界状态后位错失去力学平衡而失稳连续扩展出位错环，故启动临界切应力为：τ_c = T / (b·R_c) = (Gb² / 2) / (b·L/2) ≈ G·b / L。\n③ 尺度规律：临界切应力 τ_c 与 Frank-Read 源长度 L 成严格反比（τ_c ∝ 1/L）。源长度越短，需要弯成的临界曲率半径越小，阻力越大，所需启动切应力越大。", "keyPoints": "切应力驱动力 τb 与线张力恢复力 T/R 竞争；临界状态为位错弯成半圆 R_c = L/2，临界启动应力 τ_c ≈ Gb/L，与源长度 L 成反比", "mnemonic": "【记忆口诀】弗兰克源弯曲弓，曲率极小切应峰；源长越短临界大，启动应力尺寸定。", "pitfall": "源长度越短需要克服的临界曲率半径越小，启动所需外加切应力反而越大（τ_c ∝ 1/L）；不要把“位错线越短自身总弹性能越低”错误混淆为“越短越容易在外力下弯曲增殖”，源越短弯曲几何阻抗越高。", "freq": "考纲深度细化"}, {"id": "qa_03_D05", "num": "03-30", "chapter": "ch3", "name": "03-30 正攀移与负攀移分别对应半原子面怎样变化？为什么升温有利于攀移？", "title": "正攀移与负攀移分别对应半原子面怎样变化？为什么升温有利于攀移？", "section": "叶 pp.93–94；正文细分。", "def": "① 按教材定义：使多余半原子面收缩的攀移为正攀移；使其增长为负攀移。正攀移可通过空位到达位错、半原子面端部原子进入空位而实现；相反过程可使半原子面增长。\n② 为何与温度有关：攀移需要点缺陷扩散与原子重新安置，升温提高扩散能力，故高温回复和蠕变中攀移的重要性增强。", "keyPoints": "正、负不能只按纸面向上或向下判断，须看半原子面及约定", "mnemonic": "【答题抓手】扣准正攀移与负攀、移分别对应半、原子面怎样变，紧扣物理机制与适用条件展开", "pitfall": "正、负不能只按纸面向上或向下判断，须看半原子面及约定。攀移也不是把整根位错同时凭空抬到另一层，实际可通过局部割阶的形成和移动逐步完成。", "freq": "考纲深度细化"}, {"id": "qa_03_31_yf", "num": "03-31", "title": "刃型位错滑移时，各方向之间有什么关系？", "name": "03-31 刃型位错滑移时，各方向之间有什么关系？", "chapter": "ch3", "section": "教材p.90—91｜正文原标号：①—④（正文分条）", "freq": "叶飞正文分条", "def": "① 位错运动方向平行于外加切应力方向，垂直于位错线，并平行于伯氏矢量。\n② 位错引起的晶体滑移方向与位错运动方向平行。\n③ 推动滑移的外加切应力方向与伯氏矢量平行。\n④ 位错通过后，滑移面两侧晶体的相对位移方向与伯氏矢量相同，位移量为其大小。", "keyPoints": "① 位错运动方向平行于外加切应力方向，垂直于位错线，并平行于伯氏矢量；② 位错引起的晶体滑移方向与位错运动方向平行；③ 推动滑移的外加切应力方向与伯氏矢量平行；④ 位错通过后，滑移面两侧晶体的相对位移方向与伯氏矢量相同，位移量为其大小。", "pitfall": "刃型位错线方向与伯氏矢量不平行，二者确定唯一滑移面。讨论的是滑移，不是攀移。", "mnemonic": ""}, {"id": "qa_03_32_yf", "num": "03-32", "title": "螺型位错滑移时，各方向之间有什么关系？", "name": "03-32 螺型位错滑移时，各方向之间有什么关系？", "chapter": "ch3", "section": "教材p.91—92｜正文原标号：①—④（正文分条）", "freq": "叶飞正文分条", "def": "① 位错运动方向垂直于位错线，也垂直于伯氏矢量，与外加切应力方向不同。\n② 晶体滑移方向与位错运动方向垂直。\n③ 推动滑移的外加切应力方向与伯氏矢量平行。\n④ 滑移面两侧晶体的相对位移仍沿伯氏矢量，位移量等于伯氏矢量大小。", "keyPoints": "① 位错运动方向垂直于位错线，也垂直于伯氏矢量，与外加切应力方向不同；② 晶体滑移方向与位错运动方向垂直；③ 推动滑移的外加切应力方向与伯氏矢量平行；④ 滑移面两侧晶体的相对位移仍沿伯氏矢量，位移量等于伯氏矢量大小。", "pitfall": "位错线与伯氏矢量平行，不能唯一确定滑移面；合适条件下可发生交滑移。不要把“位错运动方向”当作“晶体滑移方向”。", "mnemonic": ""}, {"id": "qa_03_33_yf", "num": "03-33", "title": "刃型、螺型和混合型位错的滑移有哪些共同点与区别？", "name": "03-33 刃型、螺型和混合型位错的滑移有哪些共同点与区别？", "chapter": "ch3", "section": "教材p.90—93｜正文原标号：（1）—（3）（正文分条）", "freq": "叶飞正文分条", "def": "① 刃型：伯氏矢量垂直位错线，位错运动平行伯氏矢量，滑移面唯一。\n② 螺型：伯氏矢量平行位错线，位错运动垂直伯氏矢量，可能有多个滑移面。\n③ 混合型：局部位错线与伯氏矢量一般既不平行也不垂直；滑移面由局部位错线与伯氏矢量决定。", "keyPoints": "① 刃型：伯氏矢量垂直位错线，位错运动平行伯氏矢量，滑移面唯一；② 螺型：伯氏矢量平行位错线，位错运动垂直伯氏矢量，可能有多个滑移面；③ 混合型：局部位错线与伯氏矢量一般既不平行也不垂直；滑移面由局部位错线与伯氏矢量决定。", "pitfall": "共同点：晶体相对滑移均沿伯氏矢量，滑移量为其大小。混合型要考察局部线方向；同一条不分叉位错线的伯氏矢量不因局部类型改变而改变。", "mnemonic": ""}, {"id": "qa_03_34_yf", "num": "03-34", "title": "小角度晶界的三种典型结构是什么？", "name": "03-34 小角度晶界的三种典型结构是什么？", "chapter": "ch3", "section": "教材p.99—101｜正文原标号：（1）—（3）（正文分条）", "freq": "叶飞正文分条", "def": "① 对称倾转晶界：旋转轴位于晶界内，可用一组平行刃型位错阵列描述，两侧晶体相对于晶界对称。\n② 非对称倾转晶界：界面对两侧晶体不对称，教材模型中由两组伯氏矢量互相垂直的刃型位错构成。\n③ 扭转晶界：两晶体绕晶界法线相对旋转，可用交叉螺型位错网络描述；网络形状与晶面、晶体结构有关。", "keyPoints": "① 对称倾转晶界：旋转轴位于晶界内，可用一组平行刃型位错阵列描述，两侧晶体相对于晶界对称；② 非对称倾转晶界：界面对两侧晶体不对称，教材模型中由两组伯氏矢量互相垂直的刃型位错构成；③ 扭转晶界：两晶体绕晶界法线相对旋转，可用交叉螺型位错网络描述；网络形状与晶面、晶体结构有关。", "pitfall": "倾转与扭转首先比较旋转轴和晶界的关系；不能把所有小角度晶界都写成一列刃型位错。", "mnemonic": ""}, {"id": "qa_04_01", "num": "04-01", "chapter": "ch4", "name": "04-01 自扩散与互扩散有何区别？没有浓度梯度是否仍有原子迁移？", "title": "自扩散与互扩散有何区别？没有浓度梯度是否仍有原子迁移？", "section": "叶 pp.186–187；第9章习题1。", "def": "自扩散是同种原子在纯物质中的热激活迁移，可用同位素示踪测量；互扩散是不同组元在扩散偶等体系中的相互迁移。没有宏观浓度梯度时仍存在随机跳跃，只是通常没有由浓度梯度产生的净通量。\n【教材第9章第1题】互扩散与自扩散的区别在于扩散前后有没有浓度变化，有浓度变化则为互扩散，没有浓度变化则为自扩散。", "keyPoints": "自扩散是同种原子在纯物质中的热激活迁移，可用同位素示踪测量；互扩散是不同组元在扩散偶等体系中的相互迁移；没有宏观浓度梯度时仍存在随机跳跃，只是通常没有由浓度梯度产生的净通量", "mnemonic": "【记忆口诀】热运驱使原子移，自发消除浓度梯；物质迁移微观进，相变反应基础基。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_04_02", "num": "04-02", "chapter": "ch4", "name": "04-02 扩散的本质驱动力是什么？原子是否总从高浓度流向低浓度？", "title": "扩散的本质驱动力是什么？原子是否总从高浓度流向低浓度？", "section": "叶 pp.186–189、250–251；正文与第10章习题6衍生。", "def": "本质驱动力是化学势梯度。在均匀单相、普通条件下可简化为浓度梯度，净通量沿浓度降低方向；存在不同相、相互作用或外场时，可发生浓度升高方向的扩散。\n【教材第10章第6题】碳原子从贫碳的 α 相（0.022%C）向富碳的 Fe3C（6.69%C）扩散（或沿碳化学势降低方向，视过饱和/脱碳条件而定）。", "keyPoints": "本质驱动力是化学势梯度；在均匀单相、普通条件下可简化为浓度梯度，净通量沿浓度降低方向；存在不同相、相互作用或外场时，可发生浓度升高方向的扩散；珠光体形成时碳从铁素体侧迁向渗碳体，是不能机械套用“永远高浓度到低浓度”的例子", "mnemonic": "【记忆口诀】同种元素自扩散，异种组元互扩散；自扩热运随机制，互扩浓度驱动流。", "pitfall": "珠光体形成时碳从铁素体侧迁向渗碳体，是不能机械套用“永远高浓度到低浓度”的例子。", "freq": "拔高扩展"}, {"id": "qa_04_03", "num": "04-03", "chapter": "ch4", "name": "04-03 空位扩散与间隙扩散的过程及速率为何不同？", "title": "空位扩散与间隙扩散的过程及速率为何不同？", "section": "叶 p.190；第9章习题2、6。", "def": "① 空位扩散需相邻空位并越过迁移能垒，常见于置换原子。\n② 间隙扩散是小原子在间隙位置间跳跃，通常不必先形成空位。间隙原子较小、可用位置多，常扩散较快。\n③ 比较仍需说明具体原子、基体和温度。\n【教材第9章第2题】空位机制，如置换固溶体中固溶原子的扩散； 间隙机制，如间隙固溶体中固溶原子的扩散。", "keyPoints": "空位扩散需相邻空位并越过迁移能垒，常见于置换原子；间隙扩散是小原子在间隙位置间跳跃，通常不必先形成空位；间隙原子较小、可用位置多，常扩散较快；比较仍需说明具体原子、基体和温度", "mnemonic": "【记忆口诀】间隙原子尺寸小，跳入空隙间隙迁；置换依靠邻空格，空位机制最常见。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_04_04", "num": "04-04", "chapter": "ch4", "name": "04-04 菲克第一定律说明什么？适用于什么情形？", "title": "菲克第一定律说明什么？适用于什么情形？", "section": "叶 p.188；第9章习题3衍生。", "def": "① 菲克第一定律公式为 J = -D·(dC/dx)。\n② 通量 J 是单位面积、单位时间通过的物质量；负号表示扩散沿浓度降低方向进行。\n③ 稳态扩散可用它结合不随时间变化的浓度分布求解。\n④ 第一定律本身描述的是扩散通量与局部浓度梯度的瞬时对应关系，不仅适用于稳态，在非稳态扩散的任意局部微分面上该关系同样成立。\n【教材第9章第3题】2.4 × 10^-3 kg/(m²·s)（原答案文件数值）。", "keyPoints": "菲克第一定律公式 J = -D·(dC/dx)；通量 J 为单位面积、单位时间通过物质量；负号表示逆浓度梯度扩散；稳态与非稳态局部微分面均成立。", "mnemonic": "【记忆口诀】稳态通量不随变，菲克第一定律显；负号逆着梯度去，正比系数扩散率。", "pitfall": "第一定律本身是通量与局部梯度的关系，不能误说它在任何非稳态条件下都不成立。", "freq": "拔高扩展"}, {"id": "qa_04_05", "num": "04-05", "chapter": "ch4", "name": "04-05 菲克第二定律说明什么？与第一定律有何关系？", "title": "菲克第二定律说明什么？与第一定律有何关系？", "section": "叶 p.189；第9章习题4、5衍生。", "def": "由质量守恒与第一定律可得 ∂C/∂t = ∂/∂x(D·∂C/∂x)；当 D 为常数时化为 ∂C/∂t = D(∂²C/∂x²)。它描述浓度随位置和时间的演化，求解必须给定初始条件及边界条件。\n【教材第9章第4题】0.418%。", "keyPoints": "由质量守恒与第一定律可得 ∂C/∂t = ∂/∂x(D·∂C/∂x)；当 D 为常数时化为 ∂C/∂t = D(∂²C/∂x²) ；它描述浓度随位置和时间的演化，求解必须给定初始条件及边界条件", "mnemonic": "【记忆口诀】非稳浓度随时变，菲克第二偏导算；误差函数解边界，渗碳渗氮公式求。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_04_06", "num": "04-06", "chapter": "ch4", "name": "04-06 扩散系数如何随温度变化？激活能的物理意义是什么？", "title": "扩散系数如何随温度变化？激活能的物理意义是什么？", "section": "叶 pp.192–193；第9章习题5、7。", "def": "① 扩散系数随温度变化规律：固态扩散系数 D 遵循阿伦尼乌斯公式 D = D_0·exp(-Q / (R·T))（按单个粒子计量时分母为 k·T，即 D = D_0·exp(-Q / (k·T))），D 随温度升高呈指数增加。\n② 扩散激活能 Q 的物理意义：表示原子从当前格点跃迁到相邻空位或间隙所需克服的能量势垒（活化能）。温度升高使原子具有足够热振动能越过势垒的概率呈指数上升。\n③ 预指数因子 D_0 的本质：包含了原子的振动跳跃频率、点阵跳跃距离、构型几何因子以及扩散过程引起的熵变。\n【教材第9章第5题】110.4 h。", "keyPoints": "扩散系数服从 D = D_0·exp(-Q/(RT))，随温度指数增加；激活能 Q 为跳跃势垒尺度；前因子 D_0 包含跃迁频率与结构几何；比较扩散快慢须兼顾 Q 与 D_0", "mnemonic": "【记忆口诀】阿伦尼乌斯指数升，活化能垒越阻抗；温度升高扩散剧，对数倒数斜率直。", "pitfall": "不能只依据单一 Q 值断定所有温度下的扩散速率，前因子 D_0 不同可能使 Arrhenius 直线相交；比较不同体系扩散快慢不能只看单个 Q 值，因为各材料前因子 D_0 往往不同，两条 lnD ~ 1/T 直线可能发生交叉，高温与低温下的相对快慢次序可能发生逆转。", "freq": "拔高扩展"}, {"id": "qa_04_07", "num": "04-07", "chapter": "ch4", "name": "04-07 为什么渗碳深度近似与时间平方根成正比？", "title": "为什么渗碳深度近似与时间平方根成正比？", "section": "叶 pp.189、192–193；第9章习题4、5衍生。", "def": "① 渗碳扩散物理模型：在半无限长物体、恒定表面碳浓度与恒定扩散系数的边界条件下，菲克第二定律的解为误差函数形式：(C(x,t) - C_0) / (C_s - C_0) = 1 - erf(x / (2√(D·t)))。\n② 扩散尺度关系：碳浓度分布完全由无量纲变量 x / (2√(D·t)) 控制，达到相同指定浓度所对应的渗层深度 x 与时间平方根 √(t) 成严格正比，即 x ∝ √(D·t)。\n③ 工程规律：同一温度下若要使渗碳层深度加倍（2倍），所需保温时间必须增加至原先的 4 倍；不同温度下达到相同渗层深度的等效时间比较前提是 D_1·t_1 = D_2·t_2。\n【教材第9章第4题】0.418%。", "keyPoints": "半无限恒定表面浓度解由 x/(2√(Dt)) 控制；渗透深度与时间平方根成正比 x ∝ √(Dt)；深度加倍需时间增至 4 倍；换温比较基准为 Dt 守恒", "mnemonic": "【记忆口诀】表面扩散晶界快，位错管道次之来；晶内体扩阻抗大，短路通道最通达。", "pitfall": "渗层深度与时间的平方根成正比（增加一倍深度需要四倍时间），切勿误记为线性正比；该平方根比例关系仅适用于表面浓度恒定的半无限扩散体系，薄板穿透扩散或变温渗碳不能简单套用。", "freq": "拔高扩展"}, {"id": "qa_04_08", "num": "04-08", "chapter": "ch4", "name": "04-08 晶内、晶界和表面扩散为何速率不同？", "title": "晶内、晶界和表面扩散为何速率不同？", "section": "叶 p.191；正文。", "def": "① 各扩散路径速率对比：在同一材料中，原子扩散速率的普遍次序为：表面扩散速率 > 晶界扩散速率 > 位错管道扩散 > 晶内体扩散速率（即 D_表面 > D_晶界 > D_位错 > D_体）。\n② 扩散活化能差异微观机制：表面原子配位数最低、约束最弱，迁移势垒最低；晶界原子排列混乱且存在较多自由体积，势垒次之；晶内点阵紧密有序，迁移能垒最高，故活化能 Q_表面 < Q_晶界 < Q_体。\n③ 传质总通量综合权衡：尽管晶界和表面扩散系数远大于晶内，但晶体中晶内体积占比压倒性高于表面和晶界截面积。在高温下体扩散往往主导总传质量，在低温下晶界和表面短路扩散贡献显著。", "keyPoints": "扩散速率普遍规律 D_表面 > D_晶界 > D_位错 > D_体；本质是表面晶界配位欠缺活化能低；宏观通量取决于扩散系数与通道截面积的乘积", "mnemonic": "【记忆口诀】互扩散速不等同，快扩侧空位净流动；标记界面漂移走，空位机制铁证成。", "pitfall": "表面和晶界扩散系数虽然极大，但截面积占比极小，高温下宏观传质依然常以晶内体扩散为主；不能仅凭单通道扩散系数大小就判定宏观通量，还必须结合各通道的有效横截面积与温度区间综合分析。", "freq": "拔高扩展"}, {"id": "qa_04_09", "num": "04-09", "chapter": "ch4", "name": "04-09 影响固态扩散的因素有哪些？", "title": "影响固态扩散的因素有哪些？", "section": "叶 pp.190–193；正文。", "def": "① 包括温度、原子尺寸及结合状态、晶体结构、缺陷浓度、扩散路径、组元浓度和应力等。升温通常促进扩散。\n② 间隙机制常快于置换机制。\n③ 空位、晶界等可提供通道。答案应把“因素—影响—原因”相连，而非仅罗列名词。", "keyPoints": "包括温度、原子尺寸及结合状态、晶体结构、缺陷浓度、扩散路径、组元浓度和应力等；升温通常促进扩散；间隙机制常快于置换机制；空位、晶界等可提供通道；答案应把“因素—影响—原因”相连，而非仅罗列名词", "mnemonic": "【记忆口诀】化学位梯真驱动，原子由稀向浓聚；调幅分解新相生，上坡扩散自由能。", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_04_10", "num": "04-10", "chapter": "ch4", "name": "04-10 为什么碳在铁中的扩散一般快于铬在铁中的扩散？", "title": "为什么碳在铁中的扩散一般快于铬在铁中的扩散？", "section": "叶 pp.190–193；第9章习题6。", "def": "碳是小间隙原子，主要通过间隙跳跃迁移；铬通常置换铁原子，需要空位机制，其跳跃还受空位可用性限制。\n【教材第9章第6题】所有元素都会发生扩散。C 为间隙扩散；Fe/Cr 为空位扩散。", "keyPoints": "碳是小间隙原子，主要通过间隙跳跃迁移；铬通常置换铁原子，需要空位机制，其跳跃还受空位可用性限制；比较碳在 α-Fe 与 γ-Fe 中扩散时，还要考虑不同结构和能垒，不能由 γ 中碳溶解度更大就推断其扩散必更快", "mnemonic": "【答题抓手】扣准碳在铁中的扩、散一般快于铬、在铁中的扩散，紧扣物理机制与适用条件展开", "pitfall": "比较碳在 α-Fe 与 γ-Fe 中扩散时，还要考虑不同结构和能垒，不能由 γ 中碳溶解度更大就推断其扩散必更快。", "freq": "拔高扩展"}, {"id": "qa_04_11", "num": "04-11", "chapter": "ch4", "name": "04-11 陶瓷中离子扩散为何受电中性约束？", "title": "陶瓷中离子扩散为何受电中性约束？", "section": "叶 pp.81–83、194；第9章习题8。", "def": "离子迁移会造成电荷转移，宏观持续传质通常需要其他离子、电子或空穴的配合，使整体保持电中性。空位及间隙缺陷是重要通道；异价掺杂可通过改变缺陷浓度调节离子电导。\n【教材第9章第8题】① D(Al) = 6.85 × 10^-20 m²/s，D(O) = 1.35 × 10^-23 m²/s（按原答案文件数值）； ② 铝离子半径小于氧离子半径。", "keyPoints": "离子迁移会造成电荷转移，宏观持续传质通常需要其他离子、电子或空穴的配合，使整体保持电中性；空位及间隙缺陷是重要通道；异价掺杂可通过改变缺陷浓度调节离子电导；不能把每一种离子看成完全独立、毫无限制地单向扩散", "mnemonic": "【答题抓手】扣准陶瓷中离子扩、散为何受电中、性约束，紧扣物理机制与适用条件展开", "pitfall": "不能把每一种离子看成完全独立、毫无限制地单向扩散。", "freq": "拔高扩展"}, {"id": "qa_04_12", "num": "04-12", "chapter": "ch4", "name": "04-12 为什么氧与铝在氧化铝中的扩散速率可能不同？", "title": "为什么氧与铝在氧化铝中的扩散速率可能不同？", "section": "叶 p.194；第9章习题8。", "def": "阴、阳离子尺寸、价态、占位和有效缺陷类型不同，造成迁移能垒与缺陷浓度不同；不同温度下还可能由不同扩散路径控制。\n【教材第9章第8题】① D(Al) = 6.85 × 10^-20 m²/s，D(O) = 1.35 × 10^-23 m²/s（按原答案文件数值）； ② 铝离子半径小于氧离子半径。", "keyPoints": "阴、阳离子尺寸、价态、占位和有效缺陷类型不同，造成迁移能垒与缺陷浓度不同；不同温度下还可能由不同扩散路径控制；具体大小应按题目给定扩散系数或教材图判断，不能仅用“原子小就一定快”代替分析", "mnemonic": "【答题抓手】扣准氧与铝在氧化、铝中的扩散速、率可能不同，紧扣物理机制与适用条件展开", "pitfall": "具体大小应按题目给定扩散系数或教材图判断，不能仅用“原子小就一定快”代替分析。", "freq": "拔高扩展"}, {"id": "qa_04_13", "num": "04-13", "chapter": "ch4", "name": "04-13 扩散在半导体制造中有什么用途？", "title": "扩散在半导体制造中有什么用途？", "section": "叶 p.193；正文。", "def": "通过控制掺杂元素扩散，使特定区域形成一定杂质浓度和深度，从而改变载流子类型与浓度，制备结结构。温度、时间及表面源浓度决定掺杂分布；高温也可能使已有结扩展，所以热处理需兼顾后续工艺。", "keyPoints": "通过控制掺杂元素扩散，使特定区域形成一定杂质浓度和深度，从而改变载流子类型与浓度，制备结结构；温度、时间及表面源浓度决定掺杂分布；高温也可能使已有结扩展，所以热处理需兼顾后续工艺", "mnemonic": "【答题抓手】扣准扩散在半导体、制造中有什么、用途，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_04_14", "num": "04-14", "chapter": "ch4", "name": "04-14 气体为何较易在聚合物中扩散？哪些因素影响渗透？", "title": "气体为何较易在聚合物中扩散？哪些因素影响渗透？", "section": "叶 pp.194–195；第9章习题9。", "def": "聚合物非晶区存在自由体积，链段热运动形成暂时通道，小分子可溶入并跳跃迁移。温度、气体尺寸、溶解度、结晶度、交联程度及链结构影响渗透；晶区通常更难通过。渗透包含溶解和扩散两个环节，不等于单独扩散系数。\n【教材第9章第9题】聚合物致密度低，并且气体在非晶区域扩散较快。", "keyPoints": "聚合物非晶区存在自由体积，链段热运动形成暂时通道，小分子可溶入并跳跃迁移；温度、气体尺寸、溶解度、结晶度、交联程度及链结构影响渗透；晶区通常更难通过；渗透包含溶解和扩散两个环节，不等于单独扩散系数", "mnemonic": "【答题抓手】扣准气体为何较易、在聚合物中扩、散哪些因素影，紧扣物理机制与适用条件展开", "pitfall": "答题注意因果逻辑链完整，切忌仅写单一结论句，需展开机制与适用条件。", "freq": "拔高扩展"}, {"id": "qa_04_D01", "num": "04-15", "chapter": "ch4", "name": "04-15 为什么碳在奥氏体中溶得更多，却不等于扩散得更快？", "title": "为什么碳在奥氏体中溶得更多，却不等于扩散得更快？", "section": "叶 p.57、pp.190–193；跨章节比较。", "def": "① 区分问题：固溶度回答平衡下能容纳多少碳；扩散系数回答碳迁移的快慢，二者对应不同的自由能信息。\n② 机制：固溶度与碳进入稳定间隙后的能量、混合自由能等有关；迁移速率还取决于从一个位置跳到另一个位置时必须越过的迁移势垒。位置住得较稳定，不代表离开它所需势垒较低。\n③ 答题条件：比较α-Fe与γ-Fe中的扩散应同时说明温度，并依据扩散系数或激活能；不能用FCC溶碳多直接推断FCC中扩散快。若两相处于不同稳定温区，尤其不能把不同温度的数据变化完全归因于结构。", "keyPoints": "γ-Fe为密堆积FCC结构(致密度0.74)，原子迁移跳跃阻力大，扩散激活能高；α-Fe为非密堆积BCC结构(致密度0.68)，点阵较疏松，扩散激活能低。因此同温度下碳在α-Fe中的扩散系数大于γ-Fe。", "mnemonic": "【记忆口诀】奥氏体间隙大容碳，但原子密排跃迁难；铁素体点阵疏松快，碳在铁素扩散更敏。", "pitfall": "切勿将“平衡固溶度大”机械推论为“扩散速率更快”，溶解度取决于自由能与间隙畸变，扩散取决于迁移能垒。", "freq": "考纲深度细化"}, {"id": "qa_04_D02", "num": "04-16", "chapter": "ch4", "name": "04-16 为什么稳态扩散不等于没有原子移动？浓度不变为何仍有通量？", "title": "为什么稳态扩散不等于没有原子移动？浓度不变为何仍有通量？", "section": "叶 pp.188–189；正文概念细分。", "def": "① 稳态定义：每个固定位置的浓度不再随时间改变，即，并不要求空间浓度处处相同。\n② 质量守恒解释：对一个微小体积，流入和流出通量相等，内部不积累物质，因此浓度不变；原子仍可持续从一侧通过到另一侧。恒定扩散系数的一维稳态问题中，浓度分布可为直线，通量为非零常量。\n③ 区别：扩散平衡通常没有净通量；稳态可能依赖外部不断维持两端浓度。把“稳定”当作“停止”，会错误地把渗透或稳态传质全部判为零。", "keyPoints": "稳态定义：每个固定位置的浓度不再随时间改变，即，并不要求空间浓度处处相同；质量守恒解释：对一个微小体积，流入和流出通量相等，内部不积累物质，因此浓度不变；原子仍可持续从一侧通过到另一侧；恒定扩散系数的一维稳态问题中，浓度分布可为直线，通量为非零常量...", "mnemonic": "【答题抓手】扣准稳态扩散不等、于没有原子移、动浓度不变为，紧扣物理机制与适用条件展开", "pitfall": "稳态定义：每个固定位置的浓度不再随时间改变，即，并不要求空间浓度处处相同。", "freq": "考纲深度细化"}, {"id": "qa_04_D03", "num": "04-17", "chapter": "ch4", "name": "04-17 为什么置换自扩散的激活能常包含空位形成和迁移两部分？", "title": "为什么置换自扩散的激活能常包含空位形成和迁移两部分？", "section": "叶 pp.80–81、190–193；正文机制推演。", "def": "① 两个必要步骤：置换原子通常先要有可用的邻近空位，再要具有足够能量越过跳跃能垒。热平衡空位浓度与形成能有关，跳跃概率与迁移能有关。\n② 简化推导：若其他因子并入前因子，则两种概率相乘，使扩散系数中的指数能量近似出现。因此测得的总激活能不应一概解释成单次跳跃迁移能。\n③ 限制：这适用于以平衡空位机制为主的简化情况。存在大量非平衡空位、其他缺陷通道或机制切换时，不可无条件照搬；间隙扩散也不需按同样方式先形成空位。", "keyPoints": "这适用于以平衡空位机制为主的简化情况", "mnemonic": "【答题抓手】扣准置换自扩散的、激活能常包含、空位形成和迁，紧扣物理机制与适用条件展开", "pitfall": "因此测得的总激活能不应一概解释成单次跳跃迁移能。", "freq": "考纲深度细化"}, {"id": "qa_04_D04", "num": "04-18", "chapter": "ch4", "name": "04-18 扩散曲线坐标为lnD与1/T时，斜率与升温方向怎样判断？", "title": "扩散曲线坐标为lnD与1/T时，斜率与升温方向怎样判断？", "section": "叶 pp.192–193；第9章习题7衍生。", "def": "① 阿伦尼乌斯公式线性化表达：\n   - 扩散系数公式 D = D_0·exp(-Q / (R·T))，两边取自然对数得：lnD = lnD_0 - (Q / R)·(1 / T)；\n   - 当纵坐标为 lnD、横坐标为 1/T 时，曲线为标准直线方程 y = A·x + B；\n   - 直线斜率 k = -Q / R（绝对值为 Q/R），纵截距为 lnD_0。\n② 坐标读图与升温方向判断：\n   - 横坐标为倒温度 1/T，向右移动数值增大，对应绝对温度 T 降低（向右为降温）；\n   - 向左移动 1/T 数值减小，对应绝对温度 T 升高（向左才是升温方向）。\n③ 斜率陡缓与激活能判定：\n   - 直线斜率绝对值越大（直线越陡峭），表示扩散激活能 Q 越大，扩散速率对温度变化的敏感度越高；\n   - 两条扩散直线相交时，高温区（左侧）由前因子 D_0 较大的体系占优，低温区（右侧）由 Q 较小的体系占优。\n【教材第9章第7题】D_0 = 1.21 × 10^-5 m²/s，Q = 1.31 × 10^5 J/mol（按教材第9章习题7数据校核）。", "keyPoints": "lnD 对 1/T 直线方程为 lnD = lnD_0 - (Q/R)(1/T)；斜率为 -Q/R，截距为 lnD_0；横坐标 1/T 向左代表升温；斜率越陡代表激活能 Q 越大", "mnemonic": "【答题抓手】扣准扩散曲线坐标、时斜率与升温、方向怎样判断，紧扣物理机制与适用条件展开", "pitfall": "横轴为 1/T 时数值向右变大对应温度降低，升温必须从右向左读，切忌看反温度坐标；切勿将图纸从左向右惯性当作升温，横轴为 1/T 时向左才是升温；代入公式计算时温度必须使用热力学绝对温度 K（开尔文），绝不能直接代入摄氏度 ℃。", "freq": "考纲深度细化"}, {"id": "qa_04_19_yf", "num": "04-19", "title": "扩散按三种依据如何分类？", "name": "04-19 扩散按三种依据如何分类？", "chapter": "ch4", "section": "教材p.186—187｜正文原标号：（1）—（3）（正文分条）", "freq": "叶飞正文分条", "def": "① 按浓度分布及是否产生宏观成分变化：分互扩散和自扩散；互扩散伴随新相形成、长大时称反应扩散。\n② 按浓度方向：从高浓度到低浓度为顺扩散或下坡扩散，反向为逆扩散或上坡扩散。\n③ 按扩散位置：体扩散、表面扩散、晶界扩散；沿位错等缺陷也可扩散，后几类属于短路扩散。", "keyPoints": "① 按浓度分布及是否产生宏观成分变化：分互扩散和自扩散；互扩散伴随新相形成、长大时称反应扩散；② 按浓度方向：从高浓度到低浓度为顺扩散或下坡扩散，反向为逆扩散或上坡扩散；③ 按扩散位置：体扩散、表面扩散、晶界扩散；沿位错等缺陷也可扩散，后几类属于短路扩散。", "pitfall": "扩散的根本方向由降低自由能、化学势梯度决定；存在上坡扩散，所以浓度梯度不能作为所有情况的唯一驱动力。", "mnemonic": ""}, {"id": "qa_04_20_yf", "num": "04-20", "title": "半无限固体、恒表面浓度扩散解采用哪些初始和边界条件？", "name": "04-20 半无限固体、恒表面浓度扩散解采用哪些初始和边界条件？", "chapter": "ch4", "section": "教材p.189｜正文原标号：①—③（正文分条）", "freq": "叶飞正文分条", "def": "① 初始条件：扩散开始前，固体内部溶质浓度处处相同，为初始浓度。\n② 表面边界：扩散进行时，表面浓度保持恒定。\n③ 远处边界：离表面足够远处的浓度保持初始值，视为半无限体。", "keyPoints": "① 初始条件：扩散开始前，固体内部溶质浓度处处相同，为初始浓度；② 表面边界：扩散进行时，表面浓度保持恒定；③ 远处边界：离表面足够远处的浓度保持初始值，视为半无限体。", "pitfall": "还须满足所采用解的其他假设，如扩散系数取常数、一维扩散。不能把恒表面浓度解套到有限总量薄层源扩散。", "mnemonic": ""}, {"id": "qa_04_21_yf", "num": "04-21", "title": "硅中有限源扩散采用哪些条件？与恒源有何区别？", "name": "04-21 硅中有限源扩散采用哪些条件？与恒源有何区别？", "chapter": "ch4", "section": "教材p.194｜正文原标号：①②（正文分条）", "freq": "叶飞正文分条", "def": "① 初始分布：沉积后开始向内部扩散，除表层有限杂质量外，硅内部初始杂质浓度为零。\n② 远处边界：离表面很远处，杂质浓度始终近似为零。", "keyPoints": "① 初始分布：沉积后开始向内部扩散，除表层有限杂质量外，硅内部初始杂质浓度为零；② 远处边界：离表面很远处，杂质浓度始终近似为零。", "pitfall": "本页后文还明确引入杂质总量守恒；有限源表面浓度随时间下降，不能额外施加“表面浓度恒定”。两条编号不是完整求解条件的全部。", "mnemonic": ""}, {"id": "qa_05_01", "num
